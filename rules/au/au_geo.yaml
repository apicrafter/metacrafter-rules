name: au-geo
description: Australian geographic identifiers
context: geo
lang: en
country_code: au
rules:
  aupostcodeknown:
    key: postcode
    name: Australian postcode by known name
    rule: postcode,postal_code,zip_code,australian_postcode
    type: field
    match: text
    priority: 1
  aucityknown:
    key: city
    name: Australian city by known name
    rule: city,city_name,town
    type: field
    match: text
    priority: 1
  austateknown:
    key: state
    name: Australian state/territory by known name
    rule: state,state_name,territory,territory_name
    type: field
    match: text
    # A state field of 0 and 1 is a flag (state or non-state actor in AUSSDA INFO-POW); FIPS
    # state codes (01, 06) and names stay.
    validator: metacrafterext.rules.common.survey.validate_not_flag
    priority: 1
  augbrreefidbyname:
    key: au_gbr_reef_id
    name: Great Barrier Reef feature identifier by field name (GBR_ID, LABEL_ID, GBRMPA_REEF_ID)
    rule: (?i)(?:gbr|gbrmpa)(?:[ _]?reef)?[ _]?id|label[ _]?id|reef[ _]?(?:id|label)
    type: field
    match: regex
    validator: metacrafterext.rules.au.codes.validate_au_gbr_reef_id
    needs_values: true
    priority: 1
  augbrreefidvalue:
    key: au_gbr_reef_id
    name: Great Barrier Reef feature identifier in a reef field (11-049, 19-051a)
    # Two digits, a hyphen and three digits is also a file or case number: the field must name
    # a reef or the GBR.
    rule: (?:09|1\d|2[0-4])-\d{3}[a-z]?
    type: data
    match: regex
    minlen: 6
    maxlen: 7
    fieldregex: '(?i)reef|gbr'
    priority: 1
  auaimsltmpsectorbyname:
    key: au_aims_ltmp_sector
    name: AIMS Long-Term Monitoring Program sector by field name (sector, A_SECTOR) and codes (CA, SW, CB)
    # CA, CG, CL, CU, IN and TO are also country codes: no value rule.
    rule: (?i)(?:(?:a|ltmp|aims|gbr|reef)[ _]?)?sector(?:[ _]?code)?
    type: field
    match: regex
    validator: metacrafterext.rules.au.codes.validate_au_aims_ltmp_sector
    needs_values: true
    priority: 1

  # ------------------------------------------------------------ data.gov.au (the national portal)
  austatecodebyname:
    key: au_state_code
    name: Australian state or territory abbreviation by field name (State/Territory, Jurisdiction, AFS_LIC_ADD_STATE, StateOrTerritory, state_abb)
    # Registers and statistics name the state of an address or of a row State, State/Territory,
    # Jurisdiction or <prefix>_STATE; the values must be the abbreviations (NSW, Vic, QLD), which
    # other countries' state codes (CA, NY) and full names fail.
    rule: (?i)(?:[a-z]+[ _/])*(?:state|territory|jurisdiction)(?:[ _/]?(?:or[ _]?)?(?:territory|state))?(?:[ _]?(?:code|abb|abbr|abbreviation|id))?(?:[ _](?:of[ _][a-z ]+))?
    type: field
    match: regex
    validator: metacrafterext.rules.au.codes.validate_au_state_code
    needs_values: true
    priority: 1
  aupostcodebyname:
    key: au_postcode
    name: Australian postcode by field name (Post Code, AFS_LIC_ADD_PCODE, CRED_REP_PCODE, Postal_Code) with four-digit codes
    # ASIC registers abbreviate postcode to PCODE; ORIC writes NT postcodes as numbers (871).
    rule: (?i)(?:[a-z]+[ _])*(?:p[ _]?code|post[ _]?code|postal[ _]?code)
    type: field
    match: regex
    validator: metacrafterext.rules.au.codes.validate_au_postcode
    needs_values: true
    priority: 1
  auaddressvalue:
    key: address
    name: Full Australian address by value (16 Cypress Avenue WENDOUREE VIC 3355, 7 Eastwood Street, Ballarat Central, Victoria 3350, Australia)
    # The street, the suburb, the state and a postcode of that state: property_address of the
    # neighbourhood character study and location of the reserves of the City of Ballarat had no label.
    rule: metacrafterext.rules.au.codes.validate_au_address
    type: data
    match: func
    minlen: 12
    maxlen: 200
    priority: 1
  ausuburbbyname:
    key: au_suburb
    name: Australian suburb or locality by field name (Suburb, Suburb/Town, B_Suburb, supplier_suburb, AFS_LIC_ADD_LOCAL)
    # The place before the state and postcode of an Australian address; council and register
    # files call it suburb, suburb/town, town/city or locality (ASIC: _ADD_LOCAL, _LOCALITY).
    rule: (?i)(?:[a-z]+[ _])*(?:suburb(?:[ _/]?(?:town|name|locality|location))?|suburbs?[ _]name|town[ _/]?(?:city|suburb)|[a-z]+_add_local)
    type: field
    match: regex
    validator: metacrafterext.rules.common.generic.validate_place_name
    needs_values: true
    priority: 1
  ausa2codebyname:
    key: au_sa2_code
    name: ABS Statistical Area Level 2 code by field name (sa2_code, sa2_main11, SA2_5digitcode_2011)
    rule: (?i)(?:[a-z]+[ _])*sa2(?:[ _]?(?:main|code|5digitcode|maincode|main_code|id))+(?:[ _]?(?:20)?\d{2})?
    type: field
    match: regex
    validator: metacrafterext.rules.au.codes.validate_au_sa2_code
    needs_values: true
    priority: 1
  aulgacodebyname:
    key: au_lga_code
    name: ABS local government area code by field name (lga_code, LGA_Code_2020, PR_LGAC) with five-digit codes
    # Victorian council numbers in an lga_code field (301 to 381) fail the five-digit check.
    rule: (?i)(?:[a-z]+[ _])*(?:lga[ _]?code|lgac|lga[ _]?id)(?:[ _]?(?:20)?\d{2})?
    type: field
    match: regex
    validator: metacrafterext.rules.au.codes.validate_au_lga_code
    needs_values: true
    priority: 1
  aulganamebyname:
    key: au_lga_name
    name: ABS local government area name by field name (lga_name, LGA_NAME_2020, lga11_name, National LGA Name 2021, LGA)
    rule: (?i)(?:[a-z]+[ _])*lga(?:\d{2})?(?:[ _]?name)?(?:[ _]?(?:20)?\d{2})?
    type: field
    match: regex
    validator: metacrafterext.rules.au.codes.validate_au_lga_name_plain
    needs_values: true
    priority: 1
  aulganamevalue:
    key: au_lga_name
    name: ABS local government area name with the council status by value (Albury (C), Towong (S), Kangaroo Island (DC))
    rule: metacrafterext.rules.au.codes.validate_au_lga_name
    type: data
    match: func
    minlen: 5
    maxlen: 60
    priority: 1
  augccsacodebyname:
    key: au_gccsa_code
    name: ABS Greater Capital City Statistical Area code by field name (gcc_code11, GCCSA Code of Debtor)
    rule: (?i)(?:[a-z]+[ _])*gcc(?:sa)?[ _]?code(?:[ _]?(?:20)?\d{2})?(?:[ _]of[ _][a-z]+)?
    type: field
    match: regex
    validator: metacrafterext.rules.au.codes.validate_au_gccsa_code
    needs_values: true
    priority: 1
  augccsacodevalue:
    key: au_gccsa_code
    name: ABS Greater Capital City Statistical Area code by value (1GSYD, 2RVIC, 8ACTE)
    rule: metacrafterext.rules.au.codes.validate_au_gccsa_code
    type: data
    match: func
    minlen: 5
    maxlen: 5
    priority: 1
  auremotenessbyname:
    key: au_remoteness_area
    name: ABS Remoteness Area by field name (Remoteness area, National Remoteness Areas, regional_area)
    rule: (?i)(?:[a-z]+[ _])*(?:remoteness(?:[ _](?:area|areas|class|category))?|regional[ _]area|ra[ _]name)
    type: field
    match: regex
    validator: metacrafterext.rules.au.codes.validate_au_remoteness_area
    needs_values: true
    priority: 1
  auremotenessvalue:
    key: au_remoteness_area
    name: ABS Remoteness Area by value (Major Cities of Australia, Inner Regional Australia, Very Remote)
    rule: metacrafterext.rules.au.codes.validate_au_remoteness_area
    type: data
    match: func
    minlen: 6
    maxlen: 30
    priority: 1
  aufederalelectoraldivisionbyname:
    key: au_federal_electoral_division
    name: Australian federal electoral division by field name (elect_div, ced_name_2013, Commonwealth electoral division)
    # Queensland councils number their divisions (Division 1): the names must be divisions of the
    # House of Representatives.
    rule: (?i)(?:[a-z]+[ _])*(?:elect(?:oral)?[ _]?div(?:ision)?s?|ced(?:[ _]?name)?|commonwealth[ _]electoral[ _]divisio[a-z0-9_]*|federal[ _]electorate|electorate)(?:[ _]?(?:name|20\d{2}))*
    type: field
    match: regex
    validator: metacrafterext.rules.au.codes.validate_au_federal_electoral_division
    needs_values: true
    priority: 1

  # ------------------------------------------------------------ Camden Council (data.camden.nsw.gov.au)
  aucouncilwardbyname:
    key: au_council_ward
    name: Australian council ward by field name (ward, ward_name, wardname, tag) with ward names (North Ward, Ward 2)
    # Camden Council names its three wards North Ward, Central Ward and South Ward; the ward boundary
    # files of Opendatasoft keep them in ward, ward_name and the map label tag (which holds suburbs in
    # the suburb layer, so the values decide).
    rule: (?i)(?:[a-z]+[ _])?(?:ward(?:[ _]?(?:name|nm|label))?|wardname|tag)
    type: field
    match: regex
    validator: metacrafterext.rules.au.planning.validate_au_council_ward
    needs_values: true
    priority: 1

  # ------------------------------------------------------------ ABS geography of the ACT files
  ausa1codebyname:
    key: au_sa1_code
    name: ABS Statistical Area Level 1 code by field name (SA1, sa1_main16, SA1_7DIGITCODE_2011, SA1 code)
    rule: (?i)(?:[a-z]+[ _])*sa1(?:[ _]?(?:main|code|7digit(?:code)?|maincode|main_code|id|7dig))*(?:[ _]?(?:20)?\d{2})?
    type: field
    match: regex
    validator: metacrafterext.rules.au.act.validate_au_sa1_code
    needs_values: true
    priority: 1
  ausa3codebyname:
    key: au_sa3_code
    name: ABS Statistical Area Level 3 code by field name (SA3 Code, sa3_code16, SA3_CODE_2021)
    rule: (?i)(?:[a-z]+[ _])*sa3(?:[ _]?(?:code|id|main(?:code)?))+(?:[ _]?(?:20)?\d{2})?
    type: field
    match: regex
    validator: metacrafterext.rules.au.act.validate_au_sa3_code
    needs_values: true
    priority: 1
  ausscccodebyname:
    key: au_ssc_code
    name: ABS State Suburb or Suburb and Locality code by field name (State Suburb Code, SSC_CODE16, SAL_CODE_2021)
    rule: (?i)state[ _]suburb[ _]code|(?:ssc|sal)[ _]?code(?:[ _]?(?:20)?\d{2})?|ssc(?:[ _]?(?:20)?\d{2})?
    type: field
    match: regex
    validator: metacrafterext.rules.au.act.validate_au_ssc_code
    needs_values: true
    priority: 1
  aucensuscdcodebyname:
    key: au_census_cd_code
    name: ABS Census Collection District code by field name (CD, CD_CODE, CD_2006, Collection District)
    # The 2006 SEIFA and census tables; seven digits with the state digit first.
    rule: (?i)(?:census[ _])?(?:cd|collection[ _]district)(?:[ _]?(?:code|id|no|number))?(?:[ _]?(?:19|20)?\d{2})?
    type: field
    match: regex
    validator: metacrafterext.rules.au.act.validate_au_census_cd_code
    needs_values: true
    priority: 1
  aulganamecouncilbyname:
    key: au_lga_name
    name: Local government area name by council field names (lga_label, Council Name, councilnam, NSW_LGA__3, official_name_local_government_area, abb_name)
    # NSW Spatial Services and the ABS write the LGA in fields named after the council or the full
    # words; LGA_NAME of the NSW boundaries keeps the council (Bogan Shire Council).
    rule: (?i)(?:[a-z]+[ _])*lga[ _]?(?:label|title)|council[ _]?name|councilnam|council[ _]pre[ _]amalgamation|nsw[ _]lga(?:[ _]+\d)?|(?:long[ _])?official[ _]name[ _]local[ _]government[ _]area|local[ _]government[ _]area(?:[ _]name)?|abb[ _]name
    type: field
    match: regex
    validator: metacrafterext.rules.au.codes.validate_au_lga_name_plain
    needs_values: true
    priority: 1
  aupostalareabyname:
    key: au_postcode
    name: ABS Postal Area code by field name (POA_CODE21, POA_NAME21, poa_code_2016) with four-digit codes
    rule: (?i)poa(?:[ _]?(?:code|name))?(?:[ _]?(?:20)?\d{2})?
    type: field
    match: regex
    validator: metacrafterext.rules.au.codes.validate_au_postcode
    needs_values: true
    priority: 1
  aulocalitybyname:
    key: au_suburb
    name: Australian suburb or locality by field name (loc_name, locality_name, SAL_NAME21, suburb_2) with place names
    rule: (?i)loc[ _]name|locality[ _]name|sal[ _]name(?:[ _]?(?:20)?\d{2})?|suburbs?[ _]\d
    type: field
    match: regex
    validator: metacrafterext.rules.common.generic.validate_place_name
    needs_values: true
    priority: 1
  aulgacodebarebyname:
    key: au_lga_code
    name: ABS LGA code in a bare LGA field (lga of the ABS counts of businesses by LGA) with five-digit codes
    # A field named LGA holds names in most files and the code in some (59310): the values decide.
    rule: (?i)lga(?:[ _]?(?:20)?\d{2})?
    type: field
    match: regex
    validator: metacrafterext.rules.au.codes.validate_au_lga_code
    needs_values: true
    priority: 1
