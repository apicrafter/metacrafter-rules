name: tr-finances
description: Turkish financial identifiers
context: finances
lang: tr
country_code: tr
rules:
  trtaxnumberfield:
    key: trtaxnumber
    name: Turkish tax number by field name
    rule: vergi_numarası,vergi_no,tax_id,turkish_tax_number
    type: field
    priority: 3
    match: text
  trtaxnumbervalue:
    key: trtaxnumber
    name: Turkish tax number by pattern
    match: ppr
    type: data
    rule: Word(nums, exact=10)
    validator: metacrafterext.rules.common.identifiers.validate_tr_vkn
    # Ten digits pass the check by chance: a Latvian encumbrance code column of six values
    # did (7314010204, #61). The field name must name a tax number.
    fieldrule: vkn,vergi_no,vergino,vergi no,vergi numarası,vergi_numarasi,vergi kimlik no,vergi kimlik numarası,vergi_kimlik_no,tax_number,tax_no,taxno
    fieldrulematch: text
    maxlen: 10
    minlen: 10
  trbankaccountfield:
    key: trbankaccount
    name: Turkish bank account by field name
    rule: banka_hesabı,hesap_numarası,account_number,iban
    type: field
    priority: 3
    match: text
  trbankaccountvalue:
    key: trbankaccount
    name: Turkish bank account by pattern
    match: ppr
    type: data
    rule: Literal('TR') + Word(nums, exact=2) + Word(alphanums, min=4, max=4) + Word(nums, min=16, max=24)
    maxlen: 28
    minlen: 26
    imprecise: 1
  tribanfield:
    key: triban
    name: Turkish IBAN by field name
    rule: turkish_iban
    type: field
    priority: 1
    match: text
  tribanvalue:
    key: triban
    name: Turkish IBAN by pattern
    match: ppr
    type: data
    rule: Literal('TR') + Word(nums, exact=2) + Word(alphanums, exact=4) + Word(nums, min=16, max=24)
    maxlen: 28
    minlen: 26

