name: es-geo
description: Spanish geographic identifiers
context: geo
lang: es
country_code: es
rules:
  eslatitudebyname:
    key: latitude
    name: Spanish latitude by name
    rule: latitud
    type: field
    priority: 1
    match: text
  eslongitudebyname:
    key: longitude
    name: Spanish longitude by name
    rule: longitud
    type: field
    priority: 1
    match: text
  espostindexknown:
    key: postindex
    is_pii: True
    name: Post index code (ZIP code and e.t.c) by known name in Spanish
    rule: codigo_postal,codigopostal,cod_postal,codigo_postal_argentino
    match: text
    type: field
    priority: 3
  esgeopointbyname:
    key: geopoint
    name: Spanish geopoint by knownname
    rule: coordenadas
    type: field
    priority: 1
    match: text
  espostcodefield:
    key: espostcode
    name: Spanish postal code by field name
    rule: postcode,postal_code,codigo_postal,codigopostal
    type: field
    priority: 3
    match: text
# Disabled: matches any 5-digit number, colliding with US ZIP codes and generic
# numeric ids/counts. Cannot be distinguished from an arbitrary 5-digit value;
# rely on espostcodefield instead.
#  espostcodevalue:
#    key: espostcode
#    name: Spanish postal code by pattern
#    match: ppr
#    type: data
#    rule: Word(nums, exact=5)
#    maxlen: 5
#    minlen: 5




  esstreetknown:
    key: street
    is_pii: true
    name: Street name (calle) by known name
    rule: calle,nombre_calle,nombre de la calle
    type: field
    match: text
    priority: 1
  espostcodespelledknown:
    key: espostcode
    is_pii: true
    name: Spanish postal code by spelled-out field name
    rule: cod. postal,cod_postal,cod postal,código postal,codigo postal,c.p.
    type: field
    match: text
    priority: 1
