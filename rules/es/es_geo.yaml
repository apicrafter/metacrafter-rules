name: es-geo
description: Spanish geographic identifiers
context: geo
lang: es
country_code: es
rules:
  eslatitudebyname:
    key: latitude
    name: Spanish latitude by name
    rule: latitud
    type: field
    priority: 1
    match: text
  eslongitudebyname:
    key: longitude
    name: Spanish longitude by name
    rule: longitud
    type: field
    priority: 1
    match: text
  espostindexknown:
    key: postindex
    is_pii: True
    name: Post index code (ZIP code and e.t.c) by known name in Spanish
    rule: codigo_postal,codigopostal,cod_postal,codigo_postal_argentino
    match: text
    type: field
    priority: 3
  esgeopointbyname:
    key: geopoint
    name: Spanish geopoint by knownname
    rule: coordenadas
    type: field
    priority: 1
    match: text
  espostcodefield:
    key: espostcode
    name: Spanish postal code by field name
    rule: postcode,postal_code,codigo_postal,codigopostal
    type: field
    priority: 3
    match: text
# Disabled: matches any 5-digit number, colliding with US ZIP codes and generic
# numeric ids/counts. Cannot be distinguished from an arbitrary 5-digit value;
# rely on espostcodefield instead.
#  espostcodevalue:
#    key: espostcode
#    name: Spanish postal code by pattern
#    match: ppr
#    type: data
#    rule: Word(nums, exact=5)
#    maxlen: 5
#    minlen: 5




  esstreetknown:
    key: street
    is_pii: true
    name: Street name (calle) by known name
    rule: calle,nombre_calle,nombre de la calle
    type: field
    match: text
    priority: 1
  espostcodespelledknown:
    # Mexico and the rest of Latin America use the same names (Código postal): generic postindex.
    key: postindex
    is_pii: true
    name: Postal code by a spelled-out Spanish field name
    rule: cod. postal,cod_postal,cod postal,código postal,codigo postal,c.p.
    type: field
    match: text
    priority: 1
  esreferenciacatastralvalue:
    key: es_referenciacatastral
    name: Spanish cadastral reference by value with its check letters (05002A004010550000IA)
    rule: '[0-9A-ZÑ]{7} ?[0-9A-ZÑ]{7} ?[0-9A-ZÑ]{4} ?[A-Z]{2}'
    type: data
    match: regex
    minlen: 20
    maxlen: 23
    validator: metacrafterext.rules.es.validators.validate_es_referencia_catastral
    priority: 1
  # Found in the cultural directories of the Argentine culture ministry (datos.cultura.gob.ar,
  # metacrafter-testdata).
  esstreetaddressbyname:
    key: street_address
    is_pii: True
    name: Spanish street address by field name (direccion, Dirección, domicilio, direccion_descripcion, direccion_normalizada, dom_norma)
    # Sarmiento 450, Av. Corrientes 1543, Rivadavia S/N. A wind direction (NE) and the name of a
    # directorate (Dirección Nacional de Vialidad), the other meanings of dirección, fail.
    rule: '(?i)direcci[oó]n(?:[ _](?:descripci[oó]n|completa|postal|f[ií]sica|calle|sede|legal|de[ _]la[ _]sede))?|domicilio(?:[ _](?:legal|real|fiscal|postal|de[ _]planta|sede|calle|completo))?|direcci[oó]n[ _]y[ _]n[uú]mero|direcci[oó]n[ _]?norm(?:alizada)?|dom[ _](?:norma|geo|edific|establ|orig)[a-z]*'
    type: field
    match: regex
    validator: metacrafterext.rules.common.directories.validate_street_address
    needs_values: true
    priority: 1
  esfloorbyname:
    key: address_line2
    is_pii: True
    name: Floor or unit of an address by Spanish field name (piso, piso_dpto)
    # 1°, 2º B, P.B., Planta Alta, Subsuelo, Loc. 1. Departamento, and DEPTO / DPTO alone, are an
    # administrative division in Argentina (the department codes of the Córdoba census tables,
    # 098) and are left out.
    rule: '(?i)piso(?:[ _](?:y[ _])?(?:dpto|depto|oficina|local))?'
    type: field
    match: regex
    validator: metacrafterext.rules.common.directories.validate_floor
    needs_values: true
    priority: 1
  # Found in the open data of the City of Buenos Aires (data.buenosaires.gob.ar, a 2024 snapshot;
  # metacrafter-testdata): the address normaliser of the city splits an address into calle and
  # altura (the house number), and a corner into calle and calle2 or calle_cruce.
  esstreetnamebyname:
    key: street
    is_pii: true
    name: Street name by Spanish field name (calle2, calle_cruce, cruce, calle_1, calles, nomoficial, entre_calle, direccion_calle)
    # A cruce of two streets (DEHEZA@PINTO) is a street_intersection.
    rule: '(?i)calle[ _]?[12ab]|calle[ _](?:cruce|nombre|normalizada|ofic(?:ial)?|desde|hasta|esquina)|calles|cruce|nom[ _]?oficial|nom[ _]calle|[1-4][ _]calle|(?:entre|y)[ _]calle[ _]?\d?|callenormalizada|direcci[oó]n_calle'
    type: field
    match: regex
    validator: metacrafterext.rules.common.urban.validate_street_name
    needs_values: true
    priority: 1
  esbuildingnumberbyname:
    key: buildingnumber
    is_pii: true
    name: House number by Spanish field name (calle_altura, domicilio_altura, calle_nro, numero_puerta)
    rule: '(?i)(?:calle|domicilio|direcci[oó]n)[ _](?:altura|nro|n[uú]mero)|altura[ _](?:calle|domicilio)|(?:nro|n[uú]mero)[ _]puerta'
    type: field
    match: regex
    validator: metacrafterext.rules.common.urban.validate_building_number
    needs_values: true
    priority: 1
  esalturabuildingnumber:
    key: buildingnumber
    is_pii: true
    name: House number in a Spanish altura field (2202, 380) with numbers of three digits or more
    # altura is also a height: heights in metres seldom reach 100, house numbers mostly do.
    rule: '(?i)altura'
    type: field
    match: regex
    validator: metacrafterext.rules.common.urban.validate_street_number_large
    needs_values: true
    priority: 1
  # Found in the registers and directories of Mendoza (datosabiertos.mendoza.gov.ar; metacrafter-testdata):
  # an address split into street, number, floor and office, the field names made of the column and
  # the record (numero_domicilio_agencia, oficina_domicilio_calle, piso_domicilio_local_gastronomico).
  esstreetbycompoundname:
    key: street
    is_pii: true
    name: Street name by a compound Spanish field name (domicilio_calle_escuela, oficina_domicilio_calle, delegacion_calle, direccion_calle)
    rule: '(?i)(?:[a-z]+_)*(?:domicilio|direccion)_calle(?:_[a-z]+)*|(?:[a-z]+_)+calle'
    type: field
    match: regex
    validator: metacrafterext.rules.common.urban.validate_street_name
    needs_values: true
    priority: 1
  esbuildingnumberbycompoundname:
    key: buildingnumber
    is_pii: true
    name: House number by a compound Spanish field name (numero_domicilio_agencia, oficina_domicilio_numero, numeracion_domicilio_local, direccion_numero)
    rule: '(?i)(?:[a-z]+_)*(?:numero|numeracion|nro|num)_(?:de_)?(?:domicilio|direccion)(?:_[a-z]+)*|(?:[a-z]+_)*(?:domicilio|direccion|delegacion|oficina_domicilio)_(?:numero|numer|numeracion|nro)(?:_[a-z]+)*|numero_contacto'
    type: field
    match: regex
    validator: metacrafterext.rules.common.urban.validate_building_number
    needs_values: true
    priority: 1
  esfloorbycompoundname:
    key: address_line2
    is_pii: true
    name: Floor or office of an address by a compound Spanish field name (domicilio_piso, piso_domicilio_agencia, oficina_domicilio_piso)
    rule: '(?i)(?:[a-z]+_)*(?:domicilio|direccion|delegacion)_(?:piso|dpto|depto)(?:_[a-z]+)*|piso_(?:de_)?(?:domicilio|direccion)(?:_[a-z]+)*'
    type: field
    match: regex
    validator: metacrafterext.rules.common.directories.validate_floor
    needs_values: true
    priority: 1
