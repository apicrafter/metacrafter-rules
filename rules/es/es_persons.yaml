name: es-persons
description: Spanish person identifiers
context: persons
lang: es
country_code: es
rules:
  espassportfield:
    key: espassport
    is_pii: True
    name: Spanish passport by field name
    rule: passport,pasaporte,numero_pasaporte
    type: field
    priority: 3
    match: text
# This rule generates a lot of False positives because the pattern Word(alphanums, min=2, max=3) matches many common 2-3 character codes
# It is marked as imprecise and could be filtered if it's set
  espassportvalue:
    key: espassport
    is_pii: True
    name: Spanish passport by pattern
    match: ppr
    type: data
    rule: Word(alphanums, min=2, max=3) + Word(nums, exact=6)
    maxlen: 9
    minlen: 8
    validator: metacrafterext.rules.es.validators.validate_es_passport
    imprecise: 1
  
  esniefield:
    key: esnie
    is_pii: True
    name: Spanish NIE by field name
    rule: nie,numero_identidad_extranjero,foreigner_id
    type: field
    priority: 1
    match: text
  esnievalue:
    key: esnie
    is_pii: True
    name: Spanish NIE by pattern
    match: ppr
    type: data
    rule: (Literal('X') + Optional(Literal('-') | Literal('.')) + Optional(Literal('0')) + Word(nums, exact=7) + Optional(Literal('-') | Literal('.')) + Word(alphas, exact=1)) | (Word(alphas, exact=1) + Optional(Literal('-') | Literal('.')) + Word(nums, exact=7) + Optional(Literal('-') | Literal('.')) + Word(alphanums, exact=1)) | (Word(nums, exact=8) + Optional(Literal('-') | Literal('.')) + Word(alphas, exact=1))
    maxlen: 12
    minlen: 9
    validator: metacrafterext.rules.es.validators.validate_es_nie
    priority: 1
  
  esniffield:
    key: esnif
    is_pii: True
    name: Spanish NIF by field name
    rule: nif,dni,numero_identificacion_fiscal
    type: field
    priority: 3
    match: text
  esnifvalue:
    key: esnif
    is_pii: True
    name: Spanish NIF by pattern
    match: ppr
    type: data
    rule: Optional(Word(nums, exact=1)) + Word(nums, exact=7) + Optional(Literal('-')) + Word(alphas, exact=1)
    maxlen: 9
    minlen: 8


  # Found in the open data of the City of Buenos Aires (data.buenosaires.gob.ar, a 2024 snapshot;
  # metacrafter-testdata).
  essurnamebyname:
    key: person_surname
    is_pii: True
    name: Surname by Spanish field name (apellido, APELLIDOS, primer_apellido, funcionario_apellido)
    rule: '(?i)(?!.*nombre)(?:[a-z]+[ _])*apellidos?(?:[ _](?:paterno|materno|1|2))?|(?:primer|segundo)[ _]apellido'
    type: field
    match: regex
    validator: metacrafterext.rules.common.generic.validate_person_name_part
    needs_values: true
    priority: 1
  esfullnamebyname:
    key: person_fullname
    is_pii: True
    name: Person full name by Spanish field name (apellido_y_nombre, nombre_y_apellido, Nombre y Apellido, ayn)
    rule: '(?i)(?:[a-z]+[ _])*apellidos?[ _]?(?:y|e)?[ _]?nombres?|(?:[a-z]+[ _])*nombres?[ _](?:y[ _])?apellidos?|ayn|apeynom'
    type: field
    match: regex
    validator: metacrafterext.rules.common.generic.validate_person_fullname_not_place
    needs_values: true
    priority: 1
  # Found in the lists of schools, health centres and halls of Mercedes, Buenos Aires
  # (datosabiertos.mercedes.gob.ar, metacrafter-testdata): the heads and staff in office.
  esofficialfullnamebyname:
    key: person_fullname
    name: Full name of a person in office by Spanish field name (directivo, director, profesional, presidente, responsable, coordinador)
    # PONCE, ESTEBAN; DRA. PITARO, ANA; Javier Laresca. A titular is often an organization (Grupo
    # TELEFE) and is left out; the names of provinces and institutions fail the validator.
    rule: (?i)directiv[oa]s?|director(?:a|es|as)?|profesional(?:es)?|presidente|responsables?|referentes?|coordinador(?:a|es)?
    type: field
    match: regex
    validator: metacrafterext.rules.common.generic.validate_person_fullname_not_place
    needs_values: true
    priority: 1
  # Found in the SICOP procurement reports of the INEC of Costa Rica (datosabiertos.inec.cr,
  # metacrafter-testdata): the officials in charge of each step of a procedure.
  esinchargefullnamebyname:
    key: person_fullname
    name: Full name of the person in charge by Spanish field name (ENCARGADO_PROVEDURIA, ENCARGADO_ESTUDIOS_TECNICOS, ADMINISTRADOR_CONTRATACION)
    # KRISTEL ESTIBALIZ RAMOS BRENES, Guillermo Reyes Gutiérrez; an encargado of unit names fails.
    rule: (?i)encargad[oa]s?(?:[ _](?:del?[ _]|de[ _]la[ _])?[a-zñáéíóú]+){0,4}|administrador(?:a|es)?(?:[ _](?:del?[ _]|de[ _]la[ _])?(?:contrataci[oó]n|contrato|proyecto))
    type: field
    match: regex
    validator: metacrafterext.rules.common.generic.validate_person_fullname_not_place
    needs_values: true
    priority: 1
  esjobtitlebyname:
    key: jobtitle
    name: Job title by Spanish field name (puesto, puesto_de_trabajo, cargo, ocupación) with text
    # Operario, Chofer Camión Jaula, Tornero CNC in the job requests of an employment office; a
    # cargo of amounts fails.
    rule: (?i)puestos?(?:[ _](?:de[ _]trabajo|solicitados?|ofrecidos?|laboral|vacante))?|cargos?(?:[ _](?:que[ _]ocupa|actual|funcionario))?|ocupaci[oó]n
    type: field
    match: regex
    validator: metacrafterext.rules.common.generic.validate_name_text
    needs_values: true
    priority: 1
