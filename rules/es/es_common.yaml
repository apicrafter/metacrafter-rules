name: es-common
description: Spanish common identifiers
context: common
lang: es
country_code: es
rules:
  esphoneknown:
    key: phone
    is_pii: True
    name: Spanish phone number by known name
    rule: telefono,telefono_de_contacto
    type: field
    priority: 1
    match: text
  esaplicacionpresupuestariabyfield:
    key: es_aplicacion_presupuestaria
    name: Spanish budget line (aplicación presupuestaria) by field name
    # Madrid contract registers: one line per budget year, 2026 001130 - 33210 - 62999 (#66)
    rule: (?i)aplicaci[oó]n(?:es)?[ _]presupuestarias?
    type: field
    match: regex
    validator: metacrafterext.rules.common.identifiers.validate_es_aplicacion_presupuestaria
    priority: 1
  esphonebyname:
    key: phone
    is_pii: True
    name: Spanish phone number by field name with accents or a suffix (Teléfono, Telefóno, tel, telefono_2, celular)
    # Teléfono and the typo Telefóno of the Argentine cultural directories, tel of the book fair
    # list (3874212884), TEL FIJO of the school lists of Mercedes (423384, 426044/430410). The values
    # are numbers of 5 to 15 digits with separators.
    rule: '(?i)tel[eé]f[oó]nos?(?:[ _.-](?:de[ _])?(?:contacto|fijo|celular|m[oó]vil|particular|laboral|oficina|sede|\d))?|tel(?:[ _.-]?\d|\.?[ _](?:fijo|celular|m[oó]vil))?|celular(?:[ _.-]?\d)?|tel[eé]fono[ _]celular|tel[eé]fonos?(?:_(?:de_)?[a-z]+){1,6}|(?:[a-z]+_){1,4}tel[eé]fonos?(?:_[a-z]+){0,4}'
    type: field
    match: regex
    validator: metacrafterext.rules.common.directories.validate_phone_digits
    needs_values: true
    priority: 1
  # Found in the street tree inventory of Mercedes, Buenos Aires (arbolado urbano, no header row).
  estreespeciesvalue:
    key: species
    name: Common name of a street tree by value (Fresno Americano, Plátano, Ligustro Variegado, Acacia Bola)
    rule: metacrafterext.rules.es.vocab.validate_es_tree_name_value
    type: data
    match: func
    minlen: 3
    maxlen: 40
    priority: 1
  estreespeciesbyname:
    key: species
    name: Species of a tree by Spanish field name (especie, nombre_comun, nombre_vulgar, especie_arborea) with common names
    rule: (?i)especies?(?:[ _](?:arb[oó]rea|vegetal|de[ _]a[rr]bol))?|nombre[ _](?:com[uú]n|vulgar)|arbol|[aá]rbol(?:es)?
    type: field
    match: regex
    validator: metacrafterext.rules.es.vocab.validate_es_tree_name
    needs_values: true
    priority: 1
  # Found in the fleet lists of Mercedes, Buenos Aires (datosabiertos.mercedes.gob.ar, metacrafter-testdata).
  esbrandbyname:
    key: brand
    name: Brand or make by Spanish field name (marca, marca_vehiculo, marca comercial) with names
    # TOYOTA, FORD, Peugeot 306. A marca of numbers or codes fails.
    rule: (?i)marcas?(?:[ _](?:comercial|del?[ _]veh[ií]culo|veh[ií]culo|fabricante))?
    type: field
    match: regex
    validator: metacrafterext.rules.common.generic.validate_name_text
    needs_values: true
    priority: 1
  esmodelyearbyname:
    key: year
    name: Model year of a vehicle by Spanish field name (modelo, año_modelo) with years
    # In Argentina the modelo of a car is its model year (2000, 2011); a modelo of names (HILUX)
    # fails the validator.
    rule: (?i)modelos?|a(?:[nñ]|ni)o[ _]modelo|modelo[ _]a(?:[nñ]|ni)o
    type: field
    match: regex
    validator: metacrafterext.rules.common.urban.validate_calendar_year
    needs_values: true
    priority: 1
