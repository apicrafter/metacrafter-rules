name: es-common
description: Spanish common identifiers
context: common
lang: es
country_code: es
rules:
  esphoneknown:
    key: phone
    is_pii: True
    name: Spanish phone number by known name
    rule: telefono,telefono_de_contacto
    type: field
    priority: 1
    match: text
  esaplicacionpresupuestariabyfield:
    key: es_aplicacion_presupuestaria
    name: Spanish budget line (aplicación presupuestaria) by field name
    # Madrid contract registers: one line per budget year, 2026 001130 - 33210 - 62999 (#66)
    rule: (?i)aplicaci[oó]n(?:es)?[ _]presupuestarias?
    type: field
    match: regex
    validator: metacrafterext.rules.common.identifiers.validate_es_aplicacion_presupuestaria
    priority: 1
