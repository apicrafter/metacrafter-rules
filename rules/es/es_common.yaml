name: es-common
description: Spanish common identifiers
context: common
lang: es
country_code: es
rules:
  esphoneknown:
    key: phone
    is_pii: True
    name: Spanish phone number by known name
    rule: telefono,telefono_de_contacto
    type: field
    priority: 1
    match: text
  esaplicacionpresupuestariabyfield:
    key: es_aplicacion_presupuestaria
    name: Spanish budget line (aplicación presupuestaria) by field name
    # Madrid contract registers: one line per budget year, 2026 001130 - 33210 - 62999 (#66)
    rule: (?i)aplicaci[oó]n(?:es)?[ _]presupuestarias?
    type: field
    match: regex
    validator: metacrafterext.rules.common.identifiers.validate_es_aplicacion_presupuestaria
    priority: 1
  esphonebyname:
    key: phone
    is_pii: True
    name: Spanish phone number by field name with accents or a suffix (Teléfono, Telefóno, tel, telefono_2, celular)
    # Teléfono and the typo Telefóno of the Argentine cultural directories, tel of the book fair
    # list (3874212884). The values are numbers of 5 to 15 digits with separators.
    rule: '(?i)tel[eé]f[oó]nos?(?:[ _.-](?:de[ _])?(?:contacto|fijo|celular|m[oó]vil|particular|laboral|oficina|sede|\d))?|tel(?:[ _.-]?\d)?|celular(?:[ _.-]?\d)?|tel[eé]fono[ _]celular'
    type: field
    match: regex
    validator: metacrafterext.rules.common.directories.validate_phone_digits
    needs_values: true
    priority: 1
