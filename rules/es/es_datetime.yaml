name: es-datetime
description: Spanish date and time common patterns
context: datetime
lang: es
country_code: es
rules:
  esyearbydatafiltered:
    key: year
    name: Spanish Modern years in range 1001-2199 by data and fieldname
    maxlen: 4
    minlen: 4
    rule: (Literal('1') + Word(nums, exact=3)) ^ (Literal('2') + Word('01', exact=1) + Word(nums, exact=2))
    match: ppr
    type: data
    fieldrule: ano,anio
    fieldrulematch: text
    # Or a field name with the word año, anio or ano among other words (año_inauguracion, Año de
    # inicio, último año de actividad, declaracion_año, anio_actualizacion) and the start of an
    # activity (inicio_actividad, inicio_act) in the Argentine cultural directories; años is a count.
    fieldregex: '(?i)^(?:[^\W\d_]+[ _.-]){0,3}(?:a[ñn]o|anio)(?:[ _.-][^\W_]+){0,4}$|^inicio[ _](?:de[ _])?act(?:ividad(?:es)?)?$'
  esmonthbydatafiltered:
    key: month
    name: Spanish month by fieldname and value
    maxlen: 2
    minlen: 1
    rule: (Optional(Literal('0')) + Word('123456789', exact=1)) ^ (Literal('1') + Word('012', exact=1))
    match: ppr
    type: data
    fieldrule: mes
    fieldrulematch: text
  esmonthnamevalue:
    key: es_month
    name: Spanish month name by value (Octubre, febrero, FEBRERO, setiembre)
    rule: metacrafterext.rules.common.directories.validate_es_month
    type: data
    match: func
    minlen: 4
    maxlen: 12
    priority: 1
  esdatetimename:
    key: date
    name: Spanish date by field name (fecha)
    # fecha is a date, like Portuguese data and English date: a column of dates without a time
    # (5/1/2018 in the transfers of ARSAT) is no datetime.
    match: text
    type: field
    priority: 1
    rule: fecha_data,fecha
  # Found in the open data of the City of Buenos Aires (data.buenosaires.gob.ar, a 2024 snapshot;
  # metacrafter-testdata).
  esdayofweekvalue:
    key: es_dayofweek
    name: Spanish day of the week by value (lunes, Miércoles, SABADO)
    rule: metacrafterext.rules.es.periods.validate_es_dayofweek
    type: data
    match: func
    minlen: 5
    maxlen: 9
    priority: 1
  esquarterbyname:
    key: quarter
    name: Quarter of a year by Spanish field name (trimestre, TRIMESTRE, trim) with 1 to 4, 1er trimestre, SEGUNDO
    rule: (?i)(?:(?:nro|n[uú]mero)[ _])?trim(?:estre)?s?_?
    type: field
    match: regex
    validator: metacrafterext.rules.es.periods.validate_es_quarter
    needs_values: true
    priority: 1
  esyearquartervalue:
    key: year_quarter
    name: Quarter with its year in Spanish by value (primer_trimestre_2019, 3 TRIMESTRE 2019, 2006 - 4to. trim.)
    rule: metacrafterext.rules.es.periods.validate_es_year_quarter
    type: data
    match: func
    minlen: 7
    maxlen: 32
    priority: 1
  estimeampmvalue:
    key: time
    name: Time of day with a.m. / p.m. by value (10:19:59 a.m., 03:46:02 p.m.)
    rule: metacrafterext.rules.es.periods.validate_time_ampm_dotted
    type: data
    match: func
    minlen: 6
    maxlen: 14
    priority: 1
  esopeninghoursbyname:
    key: opening_hours
    name: Opening hours by Spanish field name (horario, horarios, horario_de_atencion, dias y horario) with days or hour ranges
    # lunes a viernes de 8 a 20, 9:00 - 16:00, 24 Horas. A horario of single times (10:42:00) is time.
    rule: (?i)(?:d[ií]as?[ _]y[ _])?horarios?(?:[ _](?:de[ _])?(?:atenci[oó]n|at|funcionamiento|apertura|visitas?|cursada|trabajo|estaci[oó]n|de))?|d[ií]as?[ _]hora(?:rio)?s?
    type: field
    match: regex
    validator: metacrafterext.rules.es.periods.validate_opening_hours
    needs_values: true
    priority: 1
  eshorariotimebyname:
    key: time
    name: Time of day in a Spanish horario field (10:42:00, 8:30, 20:00 hs)
    rule: (?i)horario
    type: field
    match: regex
    validator: metacrafterext.rules.es.periods.validate_time_of_day
    needs_values: true
    priority: 1
  # Found in the tickets of the citizen service of Mendoza (148, datosabiertos.mendoza.gov.ar;
  # metacrafter-testdata): how long a ticket waited, "1 días, 13 horas, 20 minutos".
  esdurationwordsbyname:
    key: duration
    name: Duration in Spanish words by field name (demora, demora_desde_solicitud_tickets, horas_demora_desde_solicitud, duracion)
    rule: '(?i)(?:[a-záéíóúñü]+[ _]+)*(?:demora|duraci[oó]n|tiempo)(?:[ _]+[a-záéíóúñü]+)*'
    type: field
    match: regex
    validator: metacrafterext.rules.es.periods.validate_es_duration_words
    needs_values: true
    priority: 1
  esdurationwordsvalue:
    key: duration
    name: Duration in Spanish words by value (1 días, 13 horas, 20 minutos; 0 horas, 3 minutos)
    rule: metacrafterext.rules.es.periods.validate_es_duration_words
    type: data
    match: func
    minlen: 7
    maxlen: 60
    priority: 1
