name: es-datetime
description: Spanish date and time common patterns
context: datetime
lang: es
country_code: es
rules:
  esyearbydatafiltered:
    key: year
    name: Spanish Modern years in range 1001-2199 by data and fieldname
    maxlen: 4
    minlen: 4
    rule: (Literal('1') + Word(nums, exact=3)) ^ (Literal('2') + Word('01', exact=1) + Word(nums, exact=2))
    match: ppr
    type: data
    fieldrule: ano,anio
    fieldrulematch: text
    # Or a field name with the word año, anio or ano among other words (año_inauguracion, Año de
    # inicio, último año de actividad, declaracion_año, anio_actualizacion) and the start of an
    # activity (inicio_actividad, inicio_act) in the Argentine cultural directories; años is a count.
    fieldregex: '(?i)^(?:[^\W\d_]+[ _.-]){0,3}(?:a[ñn]o|anio)(?:[ _.-][^\W_]+){0,4}$|^inicio[ _](?:de[ _])?act(?:ividad(?:es)?)?$'
  esmonthbydatafiltered:
    key: month
    name: Spanish month by fieldname and value
    maxlen: 2
    minlen: 1
    rule: (Optional(Literal('0')) + Word('123456789', exact=1)) ^ (Literal('1') + Word('012', exact=1))
    match: ppr
    type: data
    fieldrule: mes
    fieldrulematch: text
  esmonthnamevalue:
    key: es_month
    name: Spanish month name by value (Octubre, febrero, FEBRERO, setiembre)
    rule: metacrafterext.rules.common.directories.validate_es_month
    type: data
    match: func
    minlen: 4
    maxlen: 12
    priority: 1
  esdatetimename:
    key: date
    name: Spanish date by field name (fecha)
    # fecha is a date, like Portuguese data and English date: a column of dates without a time
    # (5/1/2018 in the transfers of ARSAT) is no datetime.
    match: text
    type: field
    priority: 1
    rule: fecha_data,fecha
