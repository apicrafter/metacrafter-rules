name: es-medical
description: Códigos médicos (CIE-10, ATC, CUP)
context: medical
lang: es
country_code: es
rules:
  esicd10field:
    key: icd10code
    name: Código CIE-10 según el nombre del campo
    rule: cie10,codigo_cie10,diagnostico_cie10,cod_diag
    type: field
    priority: 1
    match: text
  esicd10value:
    key: icd10code
    name: Código CIE-10 según el valor
    match: ppr
    type: data
    rule: Word('ABCDEFGHIJKLMNOPQRSTUVWXYZ', exact=1) + Word(nums, exact=2) + Optional(Literal('.').suppress() + Word(nums, min=1, max=2))
    maxlen: 7
    minlen: 3
    # A letter and two digits is also a DAC aid type (C01), a notice type (E12) or a camera
    # id (W2): the field must name a diagnosis or a disease classification.
    fieldregex: '(?i)(?:^|[ _.-])(?:icd|cim|cie|mkb)(?:$|[ _.-]|\d)|мкб|diag|disease|krankheit|maladie|enfermedad|cause|morbid|patholog'
  esatcfield:
    key: atccode
    name: Código ATC según el nombre del campo
    rule: codigo_atc,atc,atc_medicamento
    type: field
    priority: 1
    match: text
  escupfield:
    key: cupscode
    name: Código CUP/CUPS según el nombre del campo
    rule: cup,cups,codigo_cups
    type: field
    priority: 1
    match: text
  escupvalue:
    key: cupscode
    name: Código CUP/CUPS según el valor
    match: ppr
    type: data
    rule: Word(nums, exact=3) + Word(nums, exact=2) + Optional(Literal('.').suppress() + Word(nums, min=2, max=3))
    maxlen: 8
    minlen: 5
    # A bare 5-8 digit number has no check digit, so a value-only match is
    # highly ambiguous. Marked imprecise so it is ignored unless
    # --include-imprecise.
    imprecise: 1
