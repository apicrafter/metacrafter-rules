name: cr-codes
description: Costa Rican procurement numbers and catalogue codes of SICOP, budget classification codes
context: common
lang: es
country_code: cr
# Found in an April 2024 snapshot of Datos Abiertos INEC (datosabiertos.inec.cr, Dateno source
# cdi00000393): the procurement reports the INEC exports from SICOP, its budgets and budget
# execution reports; metacrafter-testdata.
rules:
  # ------------------------------------------------------------ procurement (SICOP)
  # Year, two letters of the procedure type, a sequence and the code of the institution: no other
  # identifier has this shape, so the value alone is enough.
  crsicopprocedurenumbervalue:
    key: cr_sicop_procedure_number
    name: SICOP procedure number by value (2022CD-000001-0014400001, 2023LD-000013-0014400001)
    rule: metacrafterext.rules.cr.codes.validate_cr_sicop_procedure_number
    type: data
    match: func
    minlen: 24
    maxlen: 24
    priority: 1
  crsicopcontractnumberbyname:
    key: cr_sicop_contract_number
    name: SICOP contract number by field name (NUMERO_CONTRATO, Número de contrato, nro_contrato) with 0432023010900006
    # Sixteen digits with the year after the first three; contract numbers of other systems
    # (45-2023, CT-001) fail.
    rule: (?i)(?:n[uú]mero|n[uú]m|nro|no)\\?\.?[ _]?(?:del?[ _])?contrato(?:[ _]sicop)?|contrato[ _](?:n[uú]mero|n[uú]m|nro|no|sicop)
    type: field
    match: regex
    validator: metacrafterext.rules.cr.codes.validate_cr_sicop_contract_number
    needs_values: true
    priority: 1
  # Sixteen digits also pass for an Indonesian NIK, fifteen for an IMSI: in a field named for
  # the contract this rule is the better evidence.
  crsicopcontractnumbervalue:
    key: cr_sicop_contract_number
    name: SICOP contract number by value in a field named for the contract
    rule: metacrafterext.rules.cr.codes.validate_cr_sicop_contract_number
    type: data
    match: func
    minlen: 15
    maxlen: 22
    fieldregex: (?i)^(?:(?:n[uú]mero|n[uú]m|nro|no)\\?\.?[ _]?(?:del?[ _])?contrato(?:[ _]sicop)?|contrato[ _](?:n[uú]mero|n[uú]m|nro|no|sicop))$
    priority: 1
  crsicopgoodscodebyname:
    key: cr_sicop_goods_code
    name: SICOP catalogue code by field name (COD_BIEN_SERVICIO, Código del bien o servicio, codigo_sicop) with 4010160492001000
    rule: (?i)c[oó]d(?:igo)?\\?\.?[ _](?:del?[ _])?bien(?:es)?(?:[ _/]?(?:[yo/][ _]?)?servicios?)?|c[oó]d(?:igo)?[ _](?:de[ _])?(?:cat[aá]logo[ _])?sicop
    type: field
    match: regex
    validator: metacrafterext.rules.cr.codes.validate_cr_sicop_goods_code
    needs_values: true
    priority: 1
  # ------------------------------------------------------------ budget
  # Budgets, execution reports and procurement reports give the object of expenditure at any of
  # its three levels: 1, 1.04, 1.04.04. The codes of the last level pass for dates (1.04.04).
  crbudgetobjectcodebyname:
    key: cr_budget_object_code
    name: Costa Rican object of expenditure code by field name (SUBPARTIDA, SUBP., PART./ SUBP., Partida, Código por OBG) with 1.04.04
    # PARTIDA of an income budget holds income codes (1.3.1.2.09.09.0.0.000), of other countries
    # other codes: they fail.
    rule: (?i)sub[ _]?partidas?(?:[ _]presupuestarias?)?|subp\\?\.?|part\\?\.?[ _]?/[ _]?subp\\?\.?|partidas?(?:[ _]presupuestarias?)?|c[oó]digo[ _]por[ _]obg|(?:c[oó]d(?:igo)?[ _])?objeto[ _](?:del?[ _])?gasto
    type: field
    match: regex
    validator: metacrafterext.rules.cr.codes.validate_cr_budget_object_code
    needs_values: true
    priority: 1
  crbudgetobjectcodevalue:
    key: cr_budget_object_code
    name: Costa Rican object of expenditure code by value in a field named for the subpartida
    rule: metacrafterext.rules.cr.codes.validate_cr_budget_object_code
    type: data
    match: func
    minlen: 1
    maxlen: 7
    fieldregex: (?i)^(?:sub[ _]?partidas?(?:[ _]presupuestarias?)?|subp\\?\.?|part\\?\.?[ _]?/[ _]?subp\\?\.?|c[oó]digo[ _]por[ _]obg)$
    priority: 1
  # Nine levels separated by dots, the class 1 to 3: the value alone is enough.
  crbudgetincomecodevalue:
    key: cr_budget_income_code
    name: Costa Rican income classification code by value (1.3.1.2.09.09.0.0.000, 1.3.1.2.9.9.0.0.0)
    rule: metacrafterext.rules.cr.codes.validate_cr_budget_income_code
    type: data
    match: func
    # Budget spreadsheets indent the lower levels with spaces.
    minlen: 17
    maxlen: 40
    priority: 1
