name: ar-common
description: Argentine common identifiers
context: common
lang: es
country_code: ar
rules:
  arphoneknown:
    key: phone
    is_pii: True
    name: Argentine phone number by known name
    rule: telefono,telefono_celular,numero_telefone
    type: field
    match: text
    priority: 1
  ar_common_arpersonnameknown:
    key: person_fullname
    is_pii: True
    name: Argentine person name by known name
    rule: nombre_completo,nombre_persona
    type: field
    match: text
    # The georef service of datos.gob.ar names the full names of provinces, departments and
    # local governments nombre_completo (Provincia del Neuquén, Partido de Adolfo Gonzales Chaves).
    validator: metacrafterext.rules.common.generic.validate_person_fullname_not_place
    needs_values: true
    priority: 1
  # Found in the cultural directories of the Argentine culture ministry (datos.cultura.gob.ar,
  # metacrafter-testdata).
  arheritagecategoryvalue:
    key: ar_heritage_category
    name: Argentine national heritage category by value (Monumento Histórico Nacional, Lugar Histórico, Bien de Interés Histórico)
    rule: metacrafterext.rules.ar_country.codes.validate_ar_heritage_category
    type: data
    match: func
    minlen: 6
    maxlen: 120
    priority: 1
  arconabipnumberbyname:
    key: ar_conabip_number
    name: CONABIP popular library number by field name (nro_conabip, numero_conabip, conabip)
    rule: '(?i)(?:n(?:[uú]me)?ro|nro|num|n[º°]|registro|id)[ _.]?(?:de[ _])?conabip|conabip(?:[ _](?:nro|n[uú]mero|id|registro))?'
    type: field
    match: regex
    validator: metacrafterext.rules.ar_country.codes.validate_ar_conabip_number
    needs_values: true
    priority: 1
