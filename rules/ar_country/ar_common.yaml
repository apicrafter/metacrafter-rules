name: ar-common
description: Argentine common identifiers
context: common
lang: es
country_code: ar
rules:
  arphoneknown:
    key: phone
    is_pii: True
    name: Argentine phone number by known name
    rule: telefono,telefono_celular,numero_telefone
    type: field
    match: text
    priority: 1
  ar_common_arpersonnameknown:
    key: person_fullname
    is_pii: True
    name: Argentine person name by known name
    rule: nombre_completo,nombre_persona
    type: field
    match: text
    # The georef service of datos.gob.ar names the full names of provinces, departments and
    # local governments nombre_completo (Provincia del Neuquén, Partido de Adolfo Gonzales Chaves).
    validator: metacrafterext.rules.common.generic.validate_person_fullname_not_place
    needs_values: true
    priority: 1

