name: mx-geo
description: Mexican geographic identifiers
context: geo
lang: es
country_code: mx
rules:
  mxpostcodeknown:
    key: postcode
    name: Mexican postal code (Código Postal) by known name
    rule: codigo_postal,cp,postal_code,zip_code
    type: field
    match: text
    # cp is also a C:P ratio of soil chemistry (0.0024): five digits only.
    validator: metacrafterext.rules.mx.validators.validate_mx_postcode
    priority: 1
  mxcityknown:
    key: city
    name: Mexican city by known name
    rule: ciudad,municipio
    type: field
    match: text
    priority: 1
  mxstateknown:
    key: state
    name: Mexican state by known name
    rule: estado,estado_mexicano
    type: field
    match: text
    priority: 1
  mxinegimunicipalityvalue:
    key: mx_inegi_municipality_code
    name: Mexican INEGI municipality key by field name and value
    rule: '(?:\d{2})?\d{3}'
    type: data
    match: regex
    minlen: 3
    maxlen: 5
    fieldrule: cve_mun,cve_municipio,clave_mun,clave_municipio,cve_ent_mun,clave del municipio,cvegeo_mun
    fieldrulematch: text
    priority: 1
