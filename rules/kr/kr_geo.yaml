name: kr-geo
description: Korean geographic identifiers
context: geo
lang: ko
country_code: kr
rules:
  krpostcodefield:
    key: krpostcode
    name: Korean postal code by field name
    rule: postcode,우편번호,postal_code,zip_code,zipcode
    type: field
    priority: 3
    match: text
# Disabled: matches any 5-digit number (and #####-### form), colliding with US
# ZIP codes and generic numeric ids/counts. Cannot be distinguished from an
# arbitrary 5-digit value; rely on krpostcodefield instead.
#  krpostcodevalue:
#    key: krpostcode
#    name: Korean postal code by pattern
#    match: ppr
#    type: data
#    rule: Word(nums, exact=5) | (Word(nums, exact=5) + Literal('-') + Word(nums, exact=3))
#    maxlen: 9
#    minlen: 5
  krprovincefield:
    key: krprovince
    name: Korean province by field name
    rule: province,도,province_name,도명
    type: field
    priority: 3
    match: text
  krprovincevalue:
    key: krprovince
    name: Korean province name by value
    rule: Seoul,Busan,Daegu,Incheon,Gwangju,Daejeon,Ulsan,Sejong,Gyeonggi,Gangwon,North Chungcheong,South Chungcheong,North Jeolla,South Jeolla,North Gyeongsang,South Gyeongsang,Jeju
    maxlen: 20
    minlen: 4
    type: data
    match: text
  krcityfield:
    key: krcity
    name: Korean city name by field name
    rule: city,시,city_name,시명
    type: field
    priority: 3
    match: text
  krbusstoparsvalue:
    key: kr_bus_stop_ars
    name: Korean bus stop ARS number by field name and value
    rule: '\d{5}'
    type: data
    match: regex
    minlen: 5
    maxlen: 5
    fieldrule: arsno,ars_no,ars_id,ars,ars번호,정류소번호,정류장번호,정류소 번호
    fieldrulematch: text
    priority: 1
  kradmindongcodevalue:
    key: kr_admin_dong_code
    name: Korean administrative dong code (행정기관코드) by field name and value
    rule: '\d{10}'
    type: data
    match: regex
    minlen: 10
    maxlen: 10
    fieldrule: 행정기관코드,행정동코드,행정구역코드,adm_cd,adm_code,admcd,h_code,adm_dr_cd
    fieldrulematch: text
    priority: 1
