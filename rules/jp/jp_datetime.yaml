name: jp-datetime
description: Japanese date and time common patterns
context: datetime
lang: ja
country_code: jp
rules:
  jpdateknown:
    key: date
    name: Japanese date name
    rule: 日付,日時,作成日,更新日,登録日
    type: field
    match: text
    priority: 1
  jpyearknown:
    key: year
    name: Japanese year name
    rule: 年,年度
    type: field
    match: text
    priority: 1
  jpmonthknown:
    key: month
    name: Japanese month name
    rule: 月,月間
    type: field
    match: text
    priority: 1
  jpdayknown:
    key: day
    name: Japanese day name
    rule: 日,日付
    type: field
    match: text
    priority: 1
  jptimeknown:
    key: time
    name: Japanese time name
    rule: 時間,時刻,時分
    type: field
    match: text
    priority: 1
  jpdateeravalue:
    key: date_jp_era
    name: Date in a Japanese era (平成 9. 4.27, 令和7年7月20日)
    rule: '(?:明治|大正|昭和|平成|令和)\s*(?:元|[0-9０-９]{1,2})[年.．]\s*[0-9０-９]{1,2}[月.．]\s*[0-9０-９]{1,2}日?'
    type: data
    match: regex
    minlen: 6
    maxlen: 20
    priority: 1
  jpyeareravalue:
    key: year_jp_era
    name: Year in a Japanese era (平成4年, 昭58, 令元)
    rule: '(?:明治|大正|昭和|平成|令和|明|大|昭|平|令)\s*(?:元|[0-9０-９]{1,2})(?:年度?)?'
    type: data
    match: regex
    minlen: 2
    maxlen: 8
    priority: 1
  jpestattimecodevalue:
    key: jp_estat_time_code
    name: e-Stat time axis code (10 digits) by field name
    rule: '\d{10}'
    type: data
    match: regex
    minlen: 10
    maxlen: 10
    fieldrule: 時間軸コード,時間軸（年次）コード,時間軸（月次）コード,時間軸（年度次）コード,time_code,cat_time
    fieldrulematch: text
    priority: 1
