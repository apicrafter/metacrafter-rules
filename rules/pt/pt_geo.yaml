name: pt-geo
description: Portuguese geographic identifiers
context: geo
lang: pt
country_code: xx
rules:
  ptcityknown:
    key: city
    name: Portuguese city by known name
    rule: cidade,municipio
    type: field
    match: text
    priority: 1
  ptstateknown:
    key: state
    name: Portuguese state by known name
    rule: estado,uf,estado_uf
    type: field
    match: text
    # Spanish estado is usually a status (Finalizada, En proceso, Producción).
    validator: metacrafterext.rules.common.generic.validate_state_not_status
    needs_values: true
    priority: 1
  ptaddressknown:
    key: address
    name: Portuguese address by known name
    rule: endereco,endereco_completo,logradouro
    type: field
    match: text
    priority: 1
  ptpostcodeknown:
    key: postcode
    name: Portuguese postal code by known name
    rule: codigo_postal,cep,cep_number
    type: field
    match: text
    priority: 1
  ptinegeocodevalue:
    key: pt_ine_geocode
    name: Portuguese INE geographic code (NUTS III + DICO) by field name and value
    rule: '[1-3][A-D0-9]{2}\d{4}'
    type: data
    match: regex
    minlen: 7
    maxlen: 7
    fieldrule: geocod,geocodigo,geo_cod,codigo_geografico,código geográfico,geocode
    fieldrulematch: text
    priority: 1
  # Country names in Portuguese: the destination of BNDES export credits (pais_destino_das_exportacoes:
  # EQUADOR, REPUBLICA DOMINICANA) and the countries of CAPES events and authors (NM_PAIS: BRASIL, ESTADOS
  # UNIDOS). Spanish tables name the field pais too, and most Latin American countries are written alike in
  # both languages, so only Portuguese field names are read.
  ptcountrynamebyname:
    key: ptcountryname
    name: Country name in Portuguese by field name (pais, nm_pais, pais_origem, pais_destino_das_exportacoes)
    rule: (?i)(?:(?:nm|nome)[ _](?:do[ _])?)?pa[ií]s(?:es)?(?:[ _](?:origem|de[ _]origem|destino|de[ _]destino|destino[ _]das[ _]exporta[cç][oõ]es|sede|nascimento|resid[eê]ncia))?
    type: field
    match: regex
    validator: metacrafterext.rules.pt.countries.validate_pt_country_name
    needs_values: true
    priority: 1
