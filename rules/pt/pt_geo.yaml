name: pt-geo
description: Portuguese geographic identifiers
context: geo
lang: pt
country_code: xx
rules:
  ptcityknown:
    key: city
    name: Portuguese city by known name
    rule: cidade,municipio
    type: field
    match: text
    priority: 1
  ptstateknown:
    key: state
    name: Portuguese state by known name
    rule: estado,uf,estado_uf
    type: field
    match: text
    priority: 1
  ptaddressknown:
    key: address
    name: Portuguese address by known name
    rule: endereco,endereco_completo,logradouro
    type: field
    match: text
    priority: 1
  ptpostcodeknown:
    key: postcode
    name: Portuguese postal code by known name
    rule: codigo_postal,cep,cep_number
    type: field
    match: text
    priority: 1
  ptinegeocodevalue:
    key: pt_ine_geocode
    name: Portuguese INE geographic code (NUTS III + DICO) by field name and value
    rule: '[1-3][A-D0-9]{2}\d{4}'
    type: data
    match: regex
    minlen: 7
    maxlen: 7
    fieldrule: geocod,geocodigo,geo_cod,codigo_geografico,código geográfico,geocode
    fieldrulematch: text
    priority: 1
