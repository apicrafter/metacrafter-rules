name: environmentcommon
description: Environmental monitoring identifiers
context: environment
lang: common
country_code: xx
rules:
  eeaeoistationcodevalue:
    key: eea_eoi_station_code
    name: EEA air quality station code (EoI) by field name and value
    rule: '[A-Z]{2}[A-Z0-9]{5}'
    type: data
    match: regex
    minlen: 7
    maxlen: 7
    validator: metacrafterext.rules.common.generic.validate_eea_station_code
    fieldrule: station code,station_code,stationcode,eoi_code,ab_eoi_code,eoi code,airbase_code,eu_code,station_eoi_code,international_code,code_eoi
    fieldrulematch: text
    priority: 1
  soilhorizonbyname:
    key: soil_horizon
    name: Soil horizon designation by field name (soilHorizon, horizon)
    # A1, B21 and Bt are short codes of any table: by field name only.
    rule: (?i)(?:soil_?)?horizon(?:_?(?:name|designation|code|id|label))?|horizon_?designation
    type: field
    match: regex
    validator: metacrafterext.rules.common.fieldwork.validate_soil_horizon
    needs_values: true
    priority: 1
  polymertypevalue:
    key: polymer_type
    name: Plastic polymer by name (polypropylene, polyethylene terephthalate, nylon, rayon:polyester)
    match: func
    type: data
    rule: metacrafterext.rules.common.chemistry.validate_polymer_name
    minlen: 5
    maxlen: 80
    priority: 1
  polymertypebyfield:
    key: polymer_type
    name: Plastic polymer by field name (Polymer, polymer_type, plastic_type) with names or codes (PET, PP)
    rule: (?i)(?:ftir[ _]?)?polymers?(?:[ _]?(?:type|id|identification|name|class|match))?|plastic[ _]?(?:type|polymer)|resin[ _]?type
    type: field
    match: regex
    validator: metacrafterext.rules.common.chemistry.validate_polymer_name_or_code
    needs_values: true
    priority: 1
  # EM-DAT disaster numbers: year and a four-digit sequence (2020-0218), with the ISO alpha-3 code
  # of the affected country in the public table (1993-0500-CMR). Other year-number ids
  # (case numbers 2021-0034) have the same shape, so the field name must speak of a disaster.
  emdatdisasternumbervalue:
    key: emdat_disaster_number
    name: EM-DAT disaster number (Dis No, DisNo.) by value and field name
    rule: (?:19|20)\d{2}-\d{4}(?:-[A-Z]{3})?
    type: data
    match: regex
    minlen: 9
    maxlen: 13
    fieldregex: dis[ _.-]?no|em[ _-]?dat|disaster
    priority: 1
  # DisNo. of the EM-DAT public table ends with a dot, so its short name is empty: by the full name.
  emdatdisasternumberbyname:
    key: emdat_disaster_number
    name: EM-DAT disaster number by field name (Dis No, DisNo.)
    rule: dis no,disno,disno.,dis no.,dis_no,dis-no,emdat_id,emdat id,em-dat id,emdat_disno
    type: field
    match: text
    validator: metacrafterext.rules.common.statcodes.validate_emdat_disaster_number
    needs_values: true
    priority: 1
  glidenumbervalue:
    key: glide_number
    name: GLIDE disaster number (EQ-2010-000009-HTI) by value
    rule: (?:AC|AV|CE|CW|DR|EC|EP|EQ|ET|FA|FF|FL|FR|HT|IN|LS|MS|OT|SL|SS|ST|TC|TO|TS|VO|VW|WF|WV)-(?:19|20)\d{2}-\d{6}-(?:[A-Z]{3}|---)
    type: data
    match: regex
    minlen: 18
    maxlen: 18
    priority: 1
