name: environmentcommon
description: Environmental monitoring identifiers
context: environment
lang: common
country_code: xx
rules:
  eeaeoistationcodevalue:
    key: eea_eoi_station_code
    name: EEA air quality station code (EoI) by field name and value
    rule: '[A-Z]{2}[A-Z0-9]{5}'
    type: data
    match: regex
    minlen: 7
    maxlen: 7
    validator: metacrafterext.rules.common.generic.validate_eea_station_code
    fieldrule: station code,station_code,stationcode,eoi_code,ab_eoi_code,eoi code,airbase_code,eu_code,station_eoi_code,international_code,code_eoi
    fieldrulematch: text
    priority: 1
  soilhorizonbyname:
    key: soil_horizon
    name: Soil horizon designation by field name (soilHorizon, horizon)
    # A1, B21 and Bt are short codes of any table: by field name only.
    # Horizon_in is a dBase-truncated Horizon_index: Russian soil science calls the designation
    # the index of the horizon (индекс горизонта; soil profile database of ArmSIS).
    rule: (?i)(?:soil_?)?horizon(?:_?(?:name|designation|code|id|label|in|ind|index))?|horizon_?designation|индекс[ _]горизонта|горизонт
    type: field
    match: regex
    validator: metacrafterext.rules.common.fieldwork.validate_soil_horizon
    needs_values: true
    priority: 1
  polymertypevalue:
    key: polymer_type
    name: Plastic polymer by name (polypropylene, polyethylene terephthalate, nylon, rayon:polyester)
    match: func
    type: data
    rule: metacrafterext.rules.common.chemistry.validate_polymer_name
    minlen: 5
    maxlen: 80
    priority: 1
  polymertypebyfield:
    key: polymer_type
    name: Plastic polymer by field name (Polymer, polymer_type, plastic_type) with names or codes (PET, PP)
    rule: (?i)(?:ftir[ _]?)?polymers?(?:[ _]?(?:type|id|identification|name|class|match))?|plastic[ _]?(?:type|polymer)|resin[ _]?type
    type: field
    match: regex
    validator: metacrafterext.rules.common.chemistry.validate_polymer_name_or_code
    needs_values: true
    priority: 1
  phbyname:
    key: ph_value
    name: pH by field name (pH, pH_H2O, pH KCl, pHwater, pHcacl2, phLevel_water) with values from 0 to 14
    rule: (?i)ph(?:[ _-]?(?:h2o|kcl|cacl2|bacl2|nacl|water|w|value|level|field|lab|in[ _]water|1[:_]?[25](?:\.5)?))?|ph[ _]?level[ _]?(?:water|calcium[ _]?chloride|cacl2|kcl|h2o)|ph[ _-]?(?:водн\w*|солев\w*)|рн(?:[ _-]?(?:водн\w*|солев\w*|kcl|h2o))?
    type: field
    match: regex
    validator: metacrafterext.rules.common.fieldwork.validate_ph_value
    needs_values: true
    priority: 1
  iucnprotectedareacategorybyname:
    key: iucn_protected_area_category
    name: IUCN protected area category by field name (IUCN_CAT, IUCNCATEGO, iucn_category) with Ia to VI
    # IUCNCATEGO is a dBase-truncated IUCNCATEGORY (protected areas of ArmSIS); WDPA calls it IUCN_CAT.
    rule: (?i)iucn[ _-]?(?:cat\w*|management[ _]category|class)?|iucn[ _]?protected[ _]?area[ _]?category
    type: field
    match: regex
    validator: metacrafterext.rules.common.fieldwork.validate_iucn_protected_area_category
    needs_values: true
    priority: 1
  # Sensor.Community (luftdaten) and sensors.AFRICA archives, one row per reading:
  # sensor_id;sensor_type;location;lat;lon;timestamp;value_type;value (247 files of the openAFRICA
  # snapshot of metacrafter-testdata).
  airsensormodelbyname:
    key: air_sensor_model
    name: Air quality sensor model by field name (sensor_type, sensor_model) with sensor models (SDS011, DHT22)
    rule: (?i)sensor[ _]?(?:type|model|name)|sensortype
    type: field
    match: regex
    validator: metacrafterext.rules.common.sensors.validate_air_sensor_model
    needs_values: true
    priority: 1
  airsensormodelvalue:
    key: air_sensor_model
    name: Air quality sensor model by value (SDS011, pms5003, DHT22, BME280, BAM 1020)
    rule: metacrafterext.rules.common.sensors.validate_air_sensor_model
    type: data
    match: func
    minlen: 3
    maxlen: 12
    priority: 1
  sensorcommunityvaluetypebyname:
    key: sensor_community_value_type
    name: Sensor.Community value type by field name (value_type) with value types (P1, P2, temperature)
    # P1 and P2 alone are also priorities and parts of a code: only by field name.
    rule: (?i)value[ _]?type|valuetype|measurement[ _]?type
    type: field
    match: regex
    validator: metacrafterext.rules.common.sensors.validate_sensor_community_value_type
    needs_values: true
    priority: 1
