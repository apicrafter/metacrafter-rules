name: internet
description: Internet infrastructure identifiers
context: internet
lang: common
country_code: xx
rules: 
  subnetbyknown:
    key: ipsubnet
    name: IP v4/v6 subnet by known name
    rule: cidr
    match: text
    type: field
    priority: 1
  ipv4subnetvalue:
    key: ipv4subnet
    name: IPv4 network in CIDR notation (100.64.0.0/10) by value
    # An address, a slash and a prefix length of 0 to 32: IANA Address Block, firewall and
    # routing tables (#70).
    rule: '\d{1,3}(?:\.\d{1,3}){3}/\d{1,2}'
    match: regex
    type: data
    minlen: 9
    maxlen: 18
    validator: metacrafterext.rules.common.internet.validate_ipv4_subnet
    priority: 1
  ipv6subnetvalue:
    key: ipv6subnet
    name: IPv6 network in CIDR notation (2001:200::/23) by value
    rule: '[0-9A-Fa-f]{0,4}(?::[0-9A-Fa-f]{0,4}){2,7}/\d{1,3}'
    match: regex
    type: data
    minlen: 5
    maxlen: 43
    validator: metacrafterext.rules.common.internet.validate_ipv6_subnet
    priority: 1
  ietfrfcvalue:
    key: ietf_rfc
    name: IETF RFC reference ([RFC 1918], [RFC 791, Section 3.2]) by value
    # The word RFC and a number, with a section, in brackets, or several of them: protocol
    # registries of IANA cite their sources this way (#70).
    rule: '(?:\[?RFC ?\d{1,5}(?:, [Ss]ection [\d.]*\d)?\]?(?:[;,] ?)?)+'
    match: regex
    type: data
    minlen: 4
    maxlen: 120
    validator: metacrafterext.rules.common.internet.validate_ietf_rfc
    priority: 1
  ietfrfcbyfield:
    key: ietf_rfc
    name: IETF RFC reference by field name
    rule: rfc_reference,rfc_ref,ietf_rfc,rfc_number,rfc,reference,references
    match: text
    type: field
    # The name is shared with the Mexican RFC (taxpayer number) and any reference: the values
    # must be RFC references.
    validator: metacrafterext.rules.common.internet.validate_ietf_rfc
    priority: 1
  asnbyprefixname:
    key: asn
    name: Autonomous system network (ASN) by value and name
    maxlen: 12
    minlen: 3
    rule: Literal('AS') + Word('123456789', nums, max=10)
    type: data
    match: ppr
    priority: 2
    validator: metacrafterext.rules.common.identifiers.validate_asn
# This rule generates a lot of False positives because it matches any 1-5 digit number in fields containing "asn"
# Many numeric values in ASN-related fields are not actual ASN numbers
# It is marked as imprecise and could be filtered if it's set
  asnbyfield:
    key: asn
    name: Autonomous System Number (ASN) by field name
    rule: asn,as_number,autonomous_system_number,asn_id,as_id,autonomous_system_id
    type: field
    match: text
    priority: 1
  asnbyvalue:
    key: asn
    name: Autonomous system network (ASN) by value and name
    maxlen: 10
    minlen: 1
    rule: Word(nums, min=1, max=10)
    type: data
    match: ppr
    fieldrule: asn
    fieldrulematch: text
    validator: metacrafterext.rules.common.identifiers.validate_asn
    imprecise: 1
    priority: 3
  asnbyvalueandpostfix:
    key: asn
    name: Autonomous system network (ASN) by value and postfix
    maxlen: 7
    minlen: 1
    rule: Word(nums, max=6)
    type: data
    match: ppr
    # The field name ends with the word asn after 1 to 3 other words (peer_asn,
    # origin asn, Src-ASN).
    fieldrule: >-
      ((Word(alphanums) + Optional(oneOf('_ -'))) * 1 + CaselessLiteral('asn'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 2 + CaselessLiteral('asn'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 3 + CaselessLiteral('asn'))
    fieldrulematch: ppr
    priority: 2
    validator: metacrafterext.rules.common.identifiers.validate_asn
  httpstatuscodefield:
    key: http_status_code
    name: HTTP status code by field name
    rule: '(?i)(?:http[ _.-]?)?(?:status|response)[ _.-]?code|http[ _.-]?(?:status|code)'
    match: regex
    type: field
    priority: 1
  httpstatuscodevalue:
    key: http_status_code
    name: HTTP status code (100-599) in a status code field
    rule: '[1-5]\d{2}'
    minlen: 3
    maxlen: 3
    match: regex
    type: data
    priority: 1
    fieldrule: statuscode,status_code,status code,http_status,http_status_code,httpstatus,httpstatuscode,http_code,httpcode,response_code,responsecode,http status,http code
    fieldrulematch: text
  fqdnbyknown:
    key: fqdn
    name: Domain or host name (FQDN) by known names
    rule: domainname,domain_name,host_name,hostname
    match: text
    type: field
    priority: 1
  ipvaddr:
    key: ipaddr
    name: IP address (IPv4 or IPv6)
    rule: ipaddr,ipaddress,ip_addr,ip_address
    type: field
    match: text
    is_pii: True
    priority: 1
  emailknown:
    key: email
    is_pii: True
    name: Email
    rule: email,e_mail,e-mail,contact e-mail,email address,contactemail,email_address,contact_email,email_comercial,emailaddress,wstemail,contact email,reportemail,recipientemail,electronicmailaddress,email_addr,emailcontact 
    type: field
    match: text
    priority: 1
  emailknownpat:
    key: email
    is_pii: True
    name: Email by pattern
    # The field name ends with the word email after 1 to 3 other words (user_email,
    # work email, Contact-Email).
    # pyparsing does not backtrack, so each number of words is an alternative.
    rule: >-
      ((Word(alphanums) + Optional(oneOf('_ -'))) * 1 + CaselessLiteral('email'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 2 + CaselessLiteral('email'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 3 + CaselessLiteral('email'))
    type: field
    match: ppr
    priority: 2
  emailknownprefix:
    key: email
    is_pii: True
    name: Email by prefix pat
    # email, then digits or a word that names the address (email2, email_work,
    # email-personal, email_primary_2). Other words do not match: email_verified,
    # email_status.
    rule: >-
      CaselessLiteral('email') + Optional(oneOf('_ -'))
      + (Word(nums) ^ (oneOf('address addr home work office personal business primary secondary main contact other alt', caseless=True)
      + Optional(Optional(oneOf('_ -')) + Word(nums))))
    type: field
    match: ppr
    priority: 2
  websiteknown:
    key: url
    name: URL/website by known name
    rule: url,website,uri,web_site,website address,website_address,website_url,image_url,download_url,site_url,site_internet
    type: field
    match: text
    priority: 1
  urlknownpat:
    key: url
    name: URL/website by known name pattern
    # The field name ends with the word url after 1 to 3 other words (image_url,
    # profile url, Source-URL).
    # pyparsing does not backtrack, so each number of words is an alternative.
    rule: >-
      ((Word(alphanums) + Optional(oneOf('_ -'))) * 1 + CaselessLiteral('url'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 2 + CaselessLiteral('url'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 3 + CaselessLiteral('url'))
    type: field
    match: ppr
    priority: 2
  macaddressfield:
    key: mac_address
    name: MAC address (Media Access Control) by field name
    rule: mac_address,mac,mac_addr,hardware_address,ethernet_address,physical_address,network_address,nic_address,adapter_address
    type: field
    match: text
    priority: 1
  macaddressvalue:
    key: mac_address
    name: MAC address (Media Access Control) by value pattern
    match: ppr
    type: data
    rule: Word(hexnums, exact=2) + (Literal(':') | Literal('-')).suppress() + Word(hexnums, exact=2) + (Literal(':') | Literal('-')).suppress() + Word(hexnums, exact=2) + (Literal(':') | Literal('-')).suppress() + Word(hexnums, exact=2) + (Literal(':') | Literal('-')).suppress() + Word(hexnums, exact=2) + (Literal(':') | Literal('-')).suppress() + Word(hexnums, exact=2)
    maxlen: 17
    minlen: 17
    priority: 1
    validator: metacrafterext.rules.common.internet.validate_macaddr
  macaddressdigitsvalue:
    key: mac_address
    name: MAC address of 12 hexadecimal digits without separators by field name and value
    # Twelve hexadecimal digits are also hashes and ids: the field name must name a MAC address
    # or a Wi-Fi BSSID (#70).
    match: regex
    type: data
    rule: '[0-9A-Fa-f]{12}'
    maxlen: 12
    minlen: 12
    validator: metacrafterext.rules.common.internet.validate_mac_digits
    fieldrule: mac,mac_address,macaddress,mac_addr,macaddr,mac address,bssid,ap_mac,apmac,ap_mac_address,wifi_mac,wlan_mac,hardware_address,mac주소,맥주소,mac地址,mac-adresse,adresse_mac,adresse mac,direccion_mac,dirección mac,mac-адрес
    fieldrulematch: text
    priority: 1
  messageidfield:
    key: message_id
    name: Message-ID (Email Message Identifier) by field name
    rule: message_id,message-id,messageid,message_id_header,email_message_id,mail_message_id,msg_id,msgid
    type: field
    match: text
    priority: 1
  messageidvalue:
    key: message_id
    name: Message-ID (Email Message Identifier) by value pattern
    match: ppr
    type: data
    rule: Literal('<') + Word(printables, excludeChars='<>@', min=1) + Literal('@') + Word(printables, excludeChars='<>@', min=1) + Literal('>')
    maxlen: 256
    minlen: 5
    priority: 1
    fieldrule: message_id,message-id,messageid,message_id_header,email_message_id,mail_message_id,msg_id,msgid
    fieldrulematch: text
  inreplytofield:
    key: in_reply_to
    name: In-Reply-To (Email Header) by field name
    rule: in_reply_to,in-reply-to,inreplyto,in_reply_to_header,reply_to_message_id,reply_message_id
    type: field
    match: text
    priority: 1
  inreplytovalue:
    key: in_reply_to
    name: In-Reply-To (Email Header) by value pattern
    match: ppr
    type: data
    rule: Literal('<') + Word(printables, excludeChars='<>@', min=1) + Literal('@') + Word(printables, excludeChars='<>@', min=1) + Literal('>')
    maxlen: 256
    minlen: 5
    priority: 2
    fieldrule: in_reply_to,in-reply-to,inreplyto,in_reply_to_header,reply_to_message_id,reply_message_id
    fieldrulematch: text
  referencesfield:
    key: references
    name: References (Email Header) by field name
    rule: references,references_header,email_references,mail_references,thread_references
    type: field
    match: text
    priority: 1
  magnetlinkfield:
    key: magnet_link
    name: Magnet URI (BitTorrent) by field name
    rule: magnet_link,magnet,magnet_uri,magnet_url,torrent_magnet,bt_magnet
    type: field
    match: text
    priority: 1
  magnetlinkvalue:
    key: magnet_link
    name: Magnet URI (BitTorrent) by value pattern
    match: ppr
    type: data
    rule: Literal('magnet:?') + Word(printables, min=10, max=490)
    minlen: 60
    maxlen: 500
    priority: 1
    validator: metacrafterext.rules.common.internet.validate_magnet_link
  torrentinfohashfield:
    key: torrent_info_hash
    name: BitTorrent Info Hash (BTIH) by field name
    rule: torrent_hash,info_hash,btih,bt_hash,torrent_info_hash,bittorrent_hash,torrent_id
    type: field
    match: text
    priority: 1
  torrentinfohashvalue:
    key: torrent_info_hash
    name: BitTorrent Info Hash (BTIH) by value pattern
    match: ppr
    type: data
    rule: Word(hexnums, exact=40)
    minlen: 40
    maxlen: 40
    priority: 2
    validator: metacrafterext.rules.common.internet.validate_torrent_info_hash
    fieldrule: torrent_hash,info_hash,btih,bt_hash,torrent_info_hash,bittorrent_hash,torrent_id
    fieldrulematch: text
  wifissidbyfield:
    key: wifi_ssid
    name: Wi-Fi network name (SSID) by field name
    rule: ssid,wifi_ssid,wlan_ssid,ssid_name,network_ssid,wifi ssid
    type: field
    match: text
    validator: metacrafterext.rules.common.generic.validate_wifi_ssid
    priority: 1
