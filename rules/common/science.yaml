name: sciencecommon
description: Scientific identifiers
context: science
lang: common
country_code: xx
rules:
  orcidbyknown:
    key: orcid
    name: ORCID unique identifier of researcher
    rule: orcid
    type: field
    match: text
    priority: 1
  orcidbyvalue:
    key: orcid
    name: ORCID unique identifier by value pattern
    match: ppr
    type: data
    rule: Literal("000") + Word('09', exact=1) + Literal("-") + Word(nums, exact=4) + Literal("-") + Word(nums, exact=4) + Literal("-") + Word(nums, exact=3) + Word('0123456789X', exact=1)
    minlen: 19
    maxlen: 19
    priority: 1
    validator: metacrafterext.rules.common.identifiers.validate_orcid
  science_doifield:
    key: doi
    name: DOI (Digital Object Identifier) by field name
    rule: doi,digital_object_identifier,doi_number,doi_code,doi_id
    type: field
    match: text
    priority: 1
  doibydata:
    key: doi
    name: DOI unique ID of publication
    rule: Literal("10.") + Word(nums,exact=4) + Literal("/") + Word(alphanums + "-._;()/", min=1, max=200)
    type: data
    match: ppr
    priority: 1
  science_isnifield:
    key: isni
    name: International Standard Name Identifier (ISNI) by field name
    rule: isni,isni_number,isni_code,isni_id,standard_name_identifier,international_standard_name_identifier
    type: field
    match: text
    priority: 1
  science_isnivalue:
    key: isni
    name: International Standard Name Identifier (ISNI) by value pattern
    match: ppr
    type: data
    rule: Word(nums, exact=15) + Word('0123456789X', exact=1)
    maxlen: 16
    minlen: 16
    priority: 1
    validator: metacrafterext.rules.common.identifiers.validate_isni
  isnivaluewithspaces:
    key: isni
    name: International Standard Name Identifier (ISNI) with spaces
    match: ppr
    type: data
    rule: Word(nums, exact=4) + Optional(Literal(' ').suppress()) + Word(nums, exact=4) + Optional(Literal(' ').suppress()) + Word(nums, exact=4) + Optional(Literal(' ').suppress()) + Word(nums, exact=3) + Word('0123456789X', exact=1)
    maxlen: 19
    minlen: 16
    priority: 2
    validator: metacrafterext.rules.common.identifiers.validate_isni
  gridbyfieldname:
    key: grid
    name: Global Research Identifier Database (GRID) by field name
    rule: grid,grid_id,grid_identifier,global_research_identifier
    type: field
    match: text
    priority: 1
  gridbyvalue:
    key: grid
    name: Global Research Identifier Database (GRID) by value pattern
    match: ppr
    type: data
    rule: Literal("grid.") + Word(nums, min=4, max=6) + Literal(".") + Word(hexnums, min=1, max=2)
    minlen: 8
    maxlen: 12
    priority: 1
    validator: metacrafterext.rules.common.identifiers.validate_grid
  openalexidbyfieldname:
    key: openalexid
    name: OpenAlex ID by field name
    rule: openalex_id,openalexid,openalex_identifier
    type: field
    match: text
    priority: 1
  openalexidbyvalue:
    key: openalexid
    name: OpenAlex ID by value pattern
    match: ppr
    type: data
    rule: Word('ACIVW', exact=1) + Word('123456789', exact=1) + Word(nums, min=3, max=9)
    minlen: 5
    maxlen: 11
    priority: 1
    validator: metacrafterext.rules.common.identifiers.validate_openalex_id
  roridbyfieldname:
    key: rorid
    name: Research Organization Registry ID (ROR ID) by field name
    rule: ror_id,rorid,research_organization_registry_id,ror_identifier
    type: field
    match: text
    priority: 1
  roridbyvalue:
    key: rorid
    name: Research Organization Registry ID (ROR ID) by value pattern
    match: ppr
    type: data
    rule: Word(alphanums, exact=9)
    validator: metacrafterext.rules.common.identifiers.validate_ror_id
    minlen: 9
    maxlen: 9
    priority: 1
  researcheridbyfieldname:
    key: researcherid
    name: ResearcherID by field name
    rule: researcher_id,researcherid,web_of_science_researcherid,researcher_identifier
    type: field
    match: text
    priority: 1
  scopusauthoiridbyfieldname:
    key: scopusauthoirid
    name: Scopus Author ID by field name
    rule: scopus_author_id,scopusauthoirid,scopus_author_identifier,scopus_id
    type: field
    match: text
    priority: 1
  dwcbasisofrecordvalue:
    key: dwc_basis_of_record
    name: Darwin Core basisOfRecord vocabulary
    rule: PreservedSpecimen,FossilSpecimen,LivingSpecimen,MaterialSample,MaterialEntity,MaterialCitation,HumanObservation,MachineObservation,Occurrence,PRESERVED_SPECIMEN,FOSSIL_SPECIMEN,LIVING_SPECIMEN,MATERIAL_SAMPLE,MATERIAL_CITATION,HUMAN_OBSERVATION,MACHINE_OBSERVATION,OBSERVATION,OCCURRENCE,LITERATURE
    type: data
    match: text
    minlen: 8
    maxlen: 20
    priority: 1
  dwcbasisofrecordknown:
    key: dwc_basis_of_record
    name: Darwin Core basisOfRecord by field name
    rule: basisofrecord,basis_of_record,dwc:basisofrecord
    type: field
    match: text
    priority: 1
  dwctaxonomicstatusvalue:
    key: dwc_taxonomic_status
    name: Darwin Core taxonomic status (ACCEPTED, SYNONYM) by field name and value
    # ACCEPTED is a taxonomic status here, not a BIC (#61, #62).
    rule: accepted,synonym,doubtful,heterotypic_synonym,homotypic_synonym,proparte_synonym,misapplied,heterotypicsynonym,homotypicsynonym,propartesynonym
    type: data
    match: text
    fieldrule: taxonomicstatus,taxonomic_status,taxonomic status,taxon_status,taxonstatus,dwc:taxonomicstatus
    fieldrulematch: text
    priority: 1
  dwctaxonomicstatusknown:
    key: dwc_taxonomic_status
    name: Darwin Core taxonomic status by field name
    rule: taxonomicstatus,taxonomic_status,dwc:taxonomicstatus
    type: field
    match: text
    priority: 1
  dwctaxonrankvalue:
    key: dwc_taxon_rank
    name: Darwin Core taxon rank (SPECIES, GENUS) by field name and value
    rule: domain,superkingdom,kingdom,subkingdom,superphylum,phylum,subphylum,superclass,class,subclass,infraclass,superorder,order,suborder,infraorder,superfamily,family,subfamily,tribe,subtribe,genus,subgenus,section,series,species,subspecies,variety,subvariety,form,subform,cultivar,strain,unranked,infraspecific_name,species_aggregate
    type: data
    match: text
    fieldrule: taxonrank,taxon_rank,taxonomic_rank,taxonomic rank,verbatimtaxonrank,dwc:taxonrank,rank
    fieldrulematch: text
    priority: 1
  dwctaxonrankknown:
    key: dwc_taxon_rank
    name: Darwin Core taxon rank by field name
    rule: taxonrank,taxon_rank,dwc:taxonrank,taxonomic_rank
    type: field
    match: text
    priority: 1
  oastatusbyfield:
    key: oa_status
    name: Open access status (Unpaywall, OpenAlex) by field name
    rule: (?i)(?:.*\.)?(?:oa|open[ _]?access)[ _]?status
    type: field
    match: regex
    validator: metacrafterext.rules.common.generic.validate_oa_status
    priority: 1
  speciesnamewithauthorshipvalue:
    key: species
    name: Scientific name of a species with its authorship (Paratrechina longicornis (Latreille, 1802))
    # Genus, epithet, optional infraspecific epithet and the authorship: an author and a year,
    # or an abbreviated author (Quercus robur L.). GBIF usage.name and Darwin Core
    # scientificName write species this way (#69).
    match: func
    type: data
    rule: metacrafterext.rules.common.generic.validate_species_name
    minlen: 10
    maxlen: 120
    priority: 1
  taxonnamebyfield:
    key: taxon_name
    name: Higher taxon name by Darwin Core rank term (kingdom, family, genus)
    rule: kingdom,phylum,subphylum,superclass,subclass,infraclass,superorder,suborder,infraorder,superfamily,family,subfamily,tribe,subtribe,genus,subgenus,dwc:kingdom,dwc:phylum,dwc:family,dwc:genus,regnum,familia
    type: field
    match: text
    validator: metacrafterext.rules.common.generic.validate_taxon_name
    priority: 1
  highertaxonnamevalue:
    key: taxon_name
    name: Higher taxon name by value (Animalia, Arthropoda, Insecta, Formicidae, Hymenoptera)
    # Domains, kingdoms, phyla and classes by name, the other ranks by the endings the codes of
    # nomenclature fix (-idae, -aceae, -inae, -oidea, -ales, -ptera, -formes, -opsida). The
    # name of a GBIF classification step (classifications.*.classification.name) holds them (#69).
    match: func
    type: data
    rule: metacrafterext.rules.common.taxa.validate_higher_taxon_name
    minlen: 4
    maxlen: 40
    priority: 1
  taxonclassorderbyfield:
    key: taxon_name
    name: Class or order of a taxon by Darwin Core term
    # class and order are other things too: the values need a Latin ending of these ranks
    rule: class,order,dwc:class,dwc:order
    type: field
    match: text
    validator: metacrafterext.rules.common.generic.validate_class_or_order_name
    priority: 1
  dwcoccurrenceidbyfield:
    key: dwc_occurrence_id
    name: Darwin Core occurrenceID by field name
    rule: occurrenceid,dwc:occurrenceid
    type: field
    match: text
    priority: 1
  dwccatalognumberbyfield:
    key: dwc_catalog_number
    name: Darwin Core catalogNumber by field name
    rule: catalognumber,dwc:catalognumber
    type: field
    match: text
    priority: 1
  dwcinstitutioncodebyfield:
    key: dwc_institution_code
    name: Darwin Core institutionCode by field name
    rule: institutioncode,dwc:institutioncode,ownerinstitutioncode,dwc:ownerinstitutioncode
    type: field
    match: text
    validator: metacrafterext.rules.common.generic.validate_institution_code
    priority: 1
