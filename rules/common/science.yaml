name: sciencecommon
description: Scientific identifiers
context: science
lang: common
country_code: xx
rules:
  orcidbyknown:
    key: orcid
    name: ORCID unique identifier of researcher
    rule: orcid
    type: field
    match: text
    priority: 1
  orcidbyvalue:
    key: orcid
    name: ORCID unique identifier by value pattern
    match: ppr
    type: data
    rule: Literal("000") + Word('09', exact=1) + Literal("-") + Word(nums, exact=4) + Literal("-") + Word(nums, exact=4) + Literal("-") + Word(nums, exact=3) + Word('0123456789X', exact=1)
    minlen: 19
    maxlen: 19
    priority: 1
    validator: metacrafterext.rules.common.identifiers.validate_orcid
  science_doifield:
    key: doi
    name: DOI (Digital Object Identifier) by field name
    rule: doi,digital_object_identifier,doi_number,doi_code,doi_id
    type: field
    match: text
    priority: 1
  doibydata:
    key: doi
    name: DOI unique ID of publication
    rule: Literal("10.") + Word(nums,exact=4) + Literal("/") + Word(alphanums + "-._;()/", min=1, max=200)
    type: data
    match: ppr
    priority: 1
  science_isnifield:
    key: isni
    name: International Standard Name Identifier (ISNI) by field name
    rule: isni,isni_number,isni_code,isni_id,standard_name_identifier,international_standard_name_identifier
    type: field
    match: text
    priority: 1
  science_isnivalue:
    key: isni
    name: International Standard Name Identifier (ISNI) by value pattern
    match: ppr
    type: data
    rule: Word(nums, exact=15) + Word('0123456789X', exact=1)
    maxlen: 16
    minlen: 16
    priority: 1
    validator: metacrafterext.rules.common.identifiers.validate_isni
  isnivaluewithspaces:
    key: isni
    name: International Standard Name Identifier (ISNI) with spaces
    match: ppr
    type: data
    rule: Word(nums, exact=4) + Optional(Literal(' ').suppress()) + Word(nums, exact=4) + Optional(Literal(' ').suppress()) + Word(nums, exact=4) + Optional(Literal(' ').suppress()) + Word(nums, exact=3) + Word('0123456789X', exact=1)
    maxlen: 19
    minlen: 16
    priority: 2
    validator: metacrafterext.rules.common.identifiers.validate_isni
  gridbyfieldname:
    key: grid
    name: Global Research Identifier Database (GRID) by field name
    rule: grid,grid_id,grid_identifier,global_research_identifier
    type: field
    match: text
    priority: 1
  gridbyvalue:
    key: grid
    name: Global Research Identifier Database (GRID) by value pattern
    match: ppr
    type: data
    rule: Literal("grid.") + Word(nums, min=4, max=6) + Literal(".") + Word(hexnums, min=1, max=2)
    minlen: 8
    maxlen: 12
    priority: 1
    validator: metacrafterext.rules.common.identifiers.validate_grid
  openalexidbyfieldname:
    key: openalexid
    name: OpenAlex ID by field name
    rule: openalex_id,openalexid,openalex_identifier
    type: field
    match: text
    priority: 1
  openalexidbyvalue:
    key: openalexid
    name: OpenAlex ID by value pattern
    match: ppr
    type: data
    # OpenAlex ids have at least six digits (W2741809807, I136199984); a letter and five
    # digits is a GP practice code (A81001).
    rule: Word('ACIVW', exact=1) + Word('123456789', exact=1) + Word(nums, min=5, max=10)
    minlen: 7
    maxlen: 11
    priority: 1
    validator: metacrafterext.rules.common.identifiers.validate_openalex_id
    # W and nine digits is also the RNA number of a French association (W443005153 in the
    # Sirene field identifiantAssociationUniteLegale), I and nine digits a sports facility
    # number (I050960036): bare ids need an id or OpenAlex field (the guard sees the last part
    # of a nested name).
    fieldregex: (?i)^(?:.*openalex.*|id|ids|.*_ids?|referenced_works|related_works|lineage|work|works|author|authors|institution|institutions|source|sources|concept|concepts|host_organization)$
  roridbyfieldname:
    key: rorid
    name: Research Organization Registry ID (ROR ID) by field name
    rule: ror_id,rorid,research_organization_registry_id,ror_identifier
    type: field
    match: text
    priority: 1
  roridbyvalue:
    key: rorid
    name: Research Organization Registry ID (ROR ID) by value pattern
    match: ppr
    type: data
    rule: Word(alphanums, exact=9)
    validator: metacrafterext.rules.common.identifiers.validate_ror_id
    minlen: 9
    maxlen: 9
    priority: 1
  researcheridbyfieldname:
    key: researcherid
    name: ResearcherID by field name
    rule: researcher_id,researcherid,web_of_science_researcherid,researcher_identifier
    type: field
    match: text
    priority: 1
  scopusauthoiridbyfieldname:
    key: scopusauthoirid
    name: Scopus Author ID by field name
    rule: scopus_author_id,scopusauthoirid,scopus_author_identifier,scopus_id
    type: field
    match: text
    priority: 1
  dwcbasisofrecordvalue:
    key: dwc_basis_of_record
    name: Darwin Core basisOfRecord vocabulary
    rule: PreservedSpecimen,FossilSpecimen,LivingSpecimen,MaterialSample,MaterialEntity,MaterialCitation,HumanObservation,MachineObservation,Occurrence,PRESERVED_SPECIMEN,FOSSIL_SPECIMEN,LIVING_SPECIMEN,MATERIAL_SAMPLE,MATERIAL_CITATION,HUMAN_OBSERVATION,MACHINE_OBSERVATION,OBSERVATION,OCCURRENCE,LITERATURE
    type: data
    match: text
    minlen: 8
    maxlen: 20
    priority: 1
  dwcbasisofrecordknown:
    key: dwc_basis_of_record
    name: Darwin Core basisOfRecord by field name
    rule: basisofrecord,basis_of_record,dwc:basisofrecord
    type: field
    match: text
    priority: 1
  dwctaxonomicstatusvalue:
    key: dwc_taxonomic_status
    name: Darwin Core taxonomic status (ACCEPTED, SYNONYM) by field name and value
    # ACCEPTED is a taxonomic status here, not a BIC (#61, #62).
    rule: accepted,synonym,doubtful,heterotypic_synonym,homotypic_synonym,proparte_synonym,misapplied,heterotypicsynonym,homotypicsynonym,propartesynonym
    type: data
    match: text
    fieldrule: taxonomicstatus,taxonomic_status,taxonomic status,taxon_status,taxonstatus,dwc:taxonomicstatus
    fieldrulematch: text
    priority: 1
  dwctaxonomicstatusknown:
    key: dwc_taxonomic_status
    name: Darwin Core taxonomic status by field name
    rule: taxonomicstatus,taxonomic_status,dwc:taxonomicstatus
    type: field
    match: text
    priority: 1
  dwctaxonrankvalue:
    key: dwc_taxon_rank
    name: Darwin Core taxon rank (SPECIES, GENUS) by field name and value
    rule: domain,superkingdom,kingdom,subkingdom,superphylum,phylum,subphylum,superclass,class,subclass,infraclass,superorder,order,suborder,infraorder,superfamily,family,subfamily,tribe,subtribe,genus,subgenus,section,series,species,subspecies,variety,subvariety,form,subform,cultivar,strain,unranked,infraspecific_name,species_aggregate
    type: data
    match: text
    fieldrule: taxonrank,taxon_rank,taxonomic_rank,taxonomic rank,verbatimtaxonrank,dwc:taxonrank,rank,match_rank,matchrank
    fieldrulematch: text
    priority: 1
  dwctaxonrankknown:
    key: dwc_taxon_rank
    name: Darwin Core taxon rank by field name
    rule: taxonrank,taxon_rank,dwc:taxonrank,taxonomic_rank
    type: field
    match: text
    priority: 1
  oastatusbyfield:
    key: oa_status
    name: Open access status (Unpaywall, OpenAlex) by field name
    rule: (?i)(?:.*\.)?(?:oa|open[ _]?access)[ _]?status
    type: field
    match: regex
    validator: metacrafterext.rules.common.generic.validate_oa_status
    priority: 1
  speciesnamewithauthorshipvalue:
    key: species
    name: Scientific name of a species with its authorship (Paratrechina longicornis (Latreille, 1802))
    # Genus, epithet, optional infraspecific epithet and the authorship: an author and a year,
    # or an abbreviated author (Quercus robur L.). GBIF usage.name and Darwin Core
    # scientificName write species this way (#69).
    match: func
    type: data
    rule: metacrafterext.rules.common.generic.validate_species_name
    minlen: 10
    maxlen: 120
    priority: 1
  taxonnamebyfield:
    key: taxon_name
    name: Higher taxon name by Darwin Core rank term (kingdom, family, genus)
    rule: kingdom,phylum,subphylum,superclass,subclass,infraclass,superorder,suborder,infraorder,superfamily,family,subfamily,tribe,subtribe,genus,subgenus,dwc:kingdom,dwc:phylum,dwc:family,dwc:genus,regnum,familia
    type: field
    match: text
    validator: metacrafterext.rules.common.generic.validate_taxon_name
    priority: 1
  highertaxonnamevalue:
    key: taxon_name
    name: Higher taxon name by value (Animalia, Arthropoda, Insecta, Formicidae, Hymenoptera)
    # Domains, kingdoms, phyla and classes by name, the other ranks by the endings the codes of
    # nomenclature fix (-idae, -aceae, -inae, -oidea, -ales, -ptera, -formes, -opsida). The
    # name of a GBIF classification step (classifications.*.classification.name) holds them (#69).
    match: func
    type: data
    rule: metacrafterext.rules.common.taxa.validate_higher_taxon_name
    minlen: 4
    maxlen: 40
    priority: 1
  taxonclassorderbyfield:
    key: taxon_name
    name: Class or order of a taxon by Darwin Core term
    # class and order are other things too: the values need a Latin ending of these ranks
    rule: class,order,dwc:class,dwc:order
    type: field
    match: text
    validator: metacrafterext.rules.common.generic.validate_class_or_order_name
    priority: 1
  dwcoccurrenceidbyfield:
    key: dwc_occurrence_id
    name: Darwin Core occurrenceID by field name
    rule: occurrenceid,dwc:occurrenceid
    type: field
    match: text
    priority: 1
  dwccatalognumberbyfield:
    key: dwc_catalog_number
    name: Darwin Core catalogNumber by field name
    rule: catalognumber,dwc:catalognumber
    type: field
    match: text
    priority: 1
  dwcinstitutioncodebyfield:
    key: dwc_institution_code
    name: Darwin Core institutionCode by field name
    rule: institutioncode,dwc:institutioncode,ownerinstitutioncode,dwc:ownerinstitutioncode
    type: field
    match: text
    validator: metacrafterext.rules.common.generic.validate_institution_code
    priority: 1
  # Scientific names without authorship (Pardalotus striatus, Solenopsis sp. B) are two words of
  # any text: by the Darwin Core and survey field names, with the values checked (TERN plot data).
  speciesbyfieldname:
    key: species
    name: Scientific name of a species by field name (scientificName, verbatimIdentification, mostDominantSpecies)
    rule: (?i)(?:dwc:)?scientific_?name|verbatim_?identification|original_?scientific_?name|species_?original|(?:target_?|main_?)?species(?:_?name)?|herbarium_?determination|field_?species_?names?|taxon_?name|latin_?name|binomial(?:_?name)?|(?:(?:second|third|fourth|fifth)_?)?most_?dom[a-z]*[ _]?species
    type: field
    match: regex
    validator: metacrafterext.rules.common.fieldwork.validate_scientific_name
    needs_values: true
    priority: 1
  # Species_Latin_name Squatina squatina, SpeciesSciName Agonus cataphractus, Latin species name, ScientificSpeciesName of the
  # fishery tables of Marine Scotland Data (data.marine.gov.scot, Dateno source cdi00000828): words in another order
  # or joined by spaces.
  speciesbylatinfieldname:
    key: species
    name: Scientific name of a species by field name (Species_Latin_name, SpeciesSciName, Latin species name, Scientific Species Name)
    rule: (?i)species[ _]?(?:latin|sci(?:entific)?)[ _]?names?|latin[ _](?:species[ _])?names?|scientific[ _]?species[ _]?names?|species[ _]names?[ _]\(?(?:latin|scientific)\)?|scientific[ _]names?
    type: field
    match: regex
    validator: metacrafterext.rules.common.fieldwork.validate_scientific_name
    needs_values: true
    priority: 1
  dwcscientificnameauthorshipbyfield:
    key: dwc_scientific_name_authorship
    name: Authorship of a scientific name by field name (authorship, scientificNameAuthorship, Author/Date)
    rule: (?i)(?:dwc:)?(?:scientific_?name_?)?authorship|author_?/?_?date|author_?year|taxon_?author(?:ity)?|species_?author|naming_?authority
    type: field
    match: regex
    validator: metacrafterext.rules.common.fieldwork.validate_scientific_name_authorship
    needs_values: true
    priority: 1
  # Rules for the AIMS files of metacrafter-testdata (AIMS GeoNetwork, Australian Institute of
  # Marine Science).
  dwclifestagebyfield:
    key: dwc_life_stage
    name: Life stage by field name (lifeStage, stage) and values (adult, juvenile, AD, JUV)
    # stage is also a tournament, a project or a tumour stage: the values must be life stages.
    rule: (?i)(?:dwc:)?life[ _]?stage|stage|life[ _]?history[ _]?stage|dev(?:elopment(?:al)?)?[ _]?stage|age[ _]?class
    type: field
    match: regex
    validator: metacrafterext.rules.common.taxa.validate_life_stage
    needs_values: true
    priority: 1
  # Rules for the RDA-UNR files of metacrafter-testdata (Repositorio de Datos Académicos of the
  # Universidad Nacional de Rosario, Argentina).
  lipidnumbervalue:
    key: lipid_number
    name: Fatty acid in C:D shorthand by value (C16:0, C18:1n-9, iC15:0, aC15:0)
    # The C before the carbon count is required: a bare 18:1 is also a ratio or a match score.
    rule: metacrafterext.rules.common.chemistry.validate_lipid_number
    type: data
    match: func
    minlen: 4
    maxlen: 24
    priority: 1
  lipidnumberbyname:
    key: lipid_number
    name: Fatty acid shorthand by field name (fatty_acid, FAME, ácido graso) and values (18:2 n-6)
    rule: '(?i)(?:[a-z0-9]+[ _.-]){0,2}(?:fatty[ _]?acids?|fames?|lipid[ _]?(?:numbers?|names?|species)|fa[ _]?(?:names?|ids?|codes?)|[aá]cidos?[ _]grasos?|fetts(?:ä|ae)uren?|acides?[ _]gras)'
    type: field
    match: regex
    validator: metacrafterext.rules.common.chemistry.validate_lipid_number_any
    needs_values: true
    priority: 1
  postagbyname:
    key: pos_tag
    name: Part-of-speech tag by field name (pos, upos, xpos, pos_tag, ETIQUETA_1, etiqueta_correcta)
    # etiqueta is also any label (of a product, a map, a chart): the values must be tags of a
    # known tag set (Universal Dependencies, Penn Treebank, EAGLES, short tagger tags).
    rule: '(?i)(?:[a-z0-9]+[ _.-]){0,2}(?:u?pos|xpos|ppos|pos[ _]?tags?|postags?|part[ _]of[ _]speech|word[ _]?class|tags?[ _]?pos|etiquetas?|categor[ií]a[ _]gramatical|wortart|cat[ée]gorie[ _]grammaticale)(?:[ _.-][a-z0-9]+){0,2}'
    type: field
    match: regex
    validator: metacrafterext.rules.common.linguistics.validate_pos_tag
    needs_values: true
    priority: 1
  academicdisciplinebyname:
    key: academic_discipline
    name: Academic discipline by field name (disciplina, discipline, field_of_research, área de conocimiento)
    # A bare area or field is a surface or a form field: the name must say discipline or
    # research. disciplinary_action and disciplina_deportiva (a sport) are left out.
    rule: '(?i)(?:[a-z0-9]+[ _.-]){0,2}(?:disciplin[ae]s?(?:[ _.-]?(?:otr[ao]s?|other|principal|secundaria|main|primary|secondary|desc|descripcion|acad[ée]mica|cient[ií]fica|scientifique|name|nombre))?|academic[ _]discipline|fields?[ _]of[ _](?:research|science|study)|research[ _](?:fields?|areas?|disciplines?)|[aá]reas?[ _]de[ _](?:conocimiento|investigaci[oó]n)|campo[ _]disciplinar|(?:gran_)?area_desc(?:ripcion)?|fachgebiet|fachrichtung|wissenschaftsgebiet|domaines?[ _]de[ _]recherche|ford|fos)'
    type: field
    match: regex
    validator: metacrafterext.rules.common.survey.validate_discipline_name
    needs_values: true
    priority: 1
  upovcodebyname:
    key: upov_code
    name: UPOV code of a plant taxon by field name (upov_code, upov) with UPOV-shaped values
    rule: (?i)(?:[a-z]+_)*upov(?:[ _]?code)?
    type: field
    match: regex
    validator: metacrafterext.rules.common.periods.validate_upov_code
    needs_values: true
    priority: 1
  vernacularnamebyname:
    key: vernacular_name
    name: Common name of a taxon by field name (vernacularName, species_common_name, fish_species, bird_name, tree_common_name) with names
    # A bare common_name is also the common name of a drug, a chemical or a company: only with the
    # kind of organism or the Darwin Core term.
    rule: (?i)(?:dwc:)?vernacular[ _]?name|(?:species|taxon)[ _]?common[ _]?name|common[ _]?(?:species|taxon)[ _]?name|(?:fish|bird|animal|tree|plant|mammal|reptile|frog|insect|other[ _]fish|other[ _]bird)[ _](?:species|common[ _]?name|name)
    type: field
    match: regex
    validator: metacrafterext.rules.common.taxa.validate_vernacular_name
    needs_values: true
    priority: 1
  vernacularnamewithscientificbyspecies:
    key: vernacular_name
    name: Common name with the scientific name in brackets in a species field (australian magpie (cracticus tibicen))
    rule: (?i)(?:[a-z]+[ _])?species(?:[ _]?name)?
    type: field
    match: regex
    validator: metacrafterext.rules.common.taxa.validate_vernacular_with_scientific
    needs_values: true
    priority: 1
  conservationstatusbyname:
    key: conservation_status
    name: Conservation status in words by field name (status, sourceStatus, conservation_status, EPBC status, IUCN category)
    # Threatened species lists name the field status or after the act; the values must be the
    # categories in words (Critically Endangered, Vulnerable): the IUCN abbreviations are
    # iucn_red_list_category, other statuses (Current, Expired) fail.
    rule: (?i)(?:(?:[a-z]+[ _])?(?:conservation|threat(?:ened)?|epbc|iucn|nca|nc[ _]act|source|listing|red[ _]?list|national|state|act)[ _]?)?(?:status|category|listing)(?:[ _]?(?:epbc|iucn|nca|act))?
    type: field
    match: regex
    validator: metacrafterext.rules.common.taxa.validate_conservation_status
    needs_values: true
    priority: 1

  # ------------------------------------------------------------ genomics (ARA-PEPs of KU Leuven, UCLouvain)
  # The ARA-PEPs repository of small peptides of Arabidopsis gives the nucleotide and amino-acid
  # sequence of each ORF (nucleotide, Nucleotide, Peptide, Peptide sequence, preproprotein,
  # signalpeptide, proprotein), its chromosome (Chr, BC_Chr) and region (pos 1:78181-78321), and
  # the AGI codes of the matching proteins (AT1G13480.1); featureCounts tables of UCLouvain the
  # Ensembl gene of each count (Geneid ENSG00000000003).
  dnasequencebyname:
    key: dna_sequence
    name: Nucleotide sequence by field name (nucleotide, sequence, dna_sequence, nt_seq, salk tiling probe)
    rule: (?i)(?:[a-z]+[ _])?(?:nucleotides?|nucl|nt|dna|rna|cdna|seq(?:uence)?|probe[ _]?seq(?:uence)?)(?:[ _]?seq(?:uence)?)?
    type: field
    match: regex
    validator: metacrafterext.rules.common.genomics.validate_dna_sequence
    needs_values: true
    priority: 1
  dnasequencevalue:
    key: dna_sequence
    name: Nucleotide sequence by value (40 or more IUPAC nucleotide letters)
    rule: metacrafterext.rules.common.genomics.validate_dna_sequence
    type: data
    match: func
    minlen: 40
    maxlen: 10000000
    priority: 2
  proteinsequencebyname:
    key: protein_sequence
    name: Amino-acid sequence by field name (Peptide, Peptide sequence, protein_sequence, preproprotein, signalpeptide, proprotein, aa_seq)
    rule: (?i)(?:[a-z]+[ _])?(?:peptides?|(?:pre)?(?:pro)?protein|signal[ _]?peptide|aa|amino[ _]?acid|prot)(?:[ _]?seq(?:uence)?)?|(?:peptide|protein)[ _]?seq(?:uence)?
    type: field
    match: regex
    validator: metacrafterext.rules.common.genomics.validate_protein_sequence
    needs_values: true
    priority: 1
  proteinsequencevalue:
    key: protein_sequence
    name: Amino-acid sequence by value (30 or more residues in capitals, a stop * at the end)
    rule: metacrafterext.rules.common.genomics.validate_protein_sequence
    type: data
    match: func
    minlen: 30
    maxlen: 100000
    priority: 2
  chromosomebyname:
    key: chromosome
    name: Chromosome by field name (Chr, chrom, chromosome, seqname, BC_Chr, chr_name)
    rule: (?i)(?:[a-z]{1,4}[ _])?(?:chr|chrom|chromosome|seqname|seqid)(?:[ _]?(?:name|id|nr|no))?
    type: field
    match: regex
    validator: metacrafterext.rules.common.genomics.validate_chromosome
    needs_values: true
    priority: 1
  genomicregionbyname:
    key: genomic_region
    name: Genomic region by field name (pos, position, region, locus, coordinates, genomic_location)
    rule: (?i)(?:genomic[ _]?)?(?:pos|position|region|locus|loc|coords?|coordinates|location|interval)(?:[ _]?(?:hg19|hg38|grch3[78]|tair1?0?))?
    type: field
    match: regex
    validator: metacrafterext.rules.common.genomics.validate_genomic_region
    needs_values: true
    priority: 1
  genomicregionvalue:
    key: genomic_region
    name: Genomic region by value (1:78181-78321, chrX:155000000-155100000)
    rule: metacrafterext.rules.common.genomics.validate_genomic_region
    type: data
    match: func
    minlen: 7
    maxlen: 40
    priority: 2
  tairlocusidvalue:
    key: tair_locus_id
    name: Arabidopsis AGI locus code by value (AT1G01115.1, ATCG00490, lists of them)
    rule: metacrafterext.rules.common.genomics.validate_tair_locus_id
    type: data
    match: func
    minlen: 9
    maxlen: 2000
    priority: 1
  tairlocusidbyname:
    key: tair_locus_id
    name: Arabidopsis AGI locus code by field name (agi, agi_code, tair_id, locus_id, Matching Proteins)
    rule: (?i)agi(?:[ _]?(?:code|id|locus))?|tair(?:[ _]?(?:id|locus|accession))?|locus[ _]?(?:id|tag)|matching[ _]proteins?
    type: field
    match: regex
    validator: metacrafterext.rules.common.genomics.validate_tair_locus_id
    needs_values: true
    priority: 1
  ensemblgeneidvalue:
    key: ensemblgeneid
    name: Ensembl gene identifier by value (ENSG00000000003, ENSMUSG00000064370.1)
    rule: metacrafterext.rules.common.genomics.validate_ensembl_gene_id
    type: data
    match: func
    minlen: 15
    maxlen: 24
    priority: 1
  vernacularnamecommonnamebyname:
    key: vernacular_name
    name: Common name of a taxon by field names of biodiversity tables (common_nam, Common name(s), common names) with names of animals and plants
    # The shapefile name common_nam of the Geelong bird atlas and the Common name(s) of the Melbourne
    # pre-colonial plant list. A bare common_name is also a vaccine (COVID-19 vaccine lists) or a bus
    # stop (CommonName of TfGM), whose names pass as common names: not here.
    rule: (?i)common[ _]?nam|common[ _]?name[ _]?\(?s\)?|common[ _]?names
    type: field
    match: regex
    validator: metacrafterext.rules.common.taxa.validate_vernacular_name
    needs_values: true
    priority: 1
  speciesscientificbyname:
    key: species
    name: Scientific name of a species by short field names (scientific, sci_name, vegspecies, tree_scientific_name)
    rule: (?i)(?:[a-z]+[ _])?scientific(?:[ _]?name)?|sci[ _]?name|veg[ _]?species
    type: field
    match: regex
    validator: metacrafterext.rules.common.fieldwork.validate_scientific_name
    needs_values: true
    priority: 1
  # ------------------------------------------------------------ codon usage and differential expression
  # Found in the transcriptomes of eight Antarctic yeasts of the Universidad de Chile (datos.uchile.cl, a 2024
  # snapshot, Dateno source cdi00000365; metacrafter-testdata): codon usage by gene (Seq, AmAcid, Codon,
  # Fraction), KEGG annotation (K0s: K00128) and differential expression (Differential Expression Log2 Ratio,
  # Differential Expression p-value).
  aminoacidbyname:
    key: amino_acid
    name: Amino acid by field name (AmAcid, amino_acid, aminoacid, residue, aa_code) with three-letter codes (Arg, Leu, Ser)
    rule: (?i)am(?:ino)?[ _.]?acids?(?:[ _](?:code|name|3))?|aminoacid(?:o|os)?|amino[aá]cidos?|residue(?:[ _]?name)?|aa(?:[ _]?(?:name|code|3))?
    type: field
    match: regex
    validator: metacrafterext.rules.common.omics.validate_amino_acid_or_stop
    needs_values: true
    priority: 1
  aminoacidvalue:
    key: amino_acid
    name: Amino acid by value, the twenty of the standard genetic code (Ala, Arg, Asn, Asp, Cys)
    # Sec is also a secondary school (LEVEL of a school directory): the rare codes are read by field name only.
    rule: metacrafterext.rules.common.omics.validate_standard_amino_acid
    type: data
    match: func
    minlen: 3
    maxlen: 3
    priority: 2
  codonbyname:
    key: codon
    name: Codon by field name (Codon, codons, ref_codon, start_codon, triplet) with nucleotide triplets (GCG, ATG, UAA)
    rule: (?i)(?:(?:ref|alt|wt|mut|start|stop|anti|new|old)[ _]?)?codons?(?:[ _]?(?:seq|ref|alt|wt|mut))?|triplets?
    type: field
    match: regex
    validator: metacrafterext.rules.common.omics.validate_codon
    needs_values: true
    priority: 1
  codonvalue:
    key: codon
    name: Codon by value in a field named for codons (GCG, GCA, AGG)
    # Three letters of A, C, G and T are also initials and codes (CAT, TAG, GGT): the field must name codons.
    rule: '(?:[ACGT]{3}|[ACGU]{3})'
    type: data
    match: regex
    minlen: 3
    maxlen: 3
    fieldregex: (?i)codon|triplet
    priority: 1
  keggorthologyidbyname:
    key: kegg_orthology_id
    name: KEGG Orthology identifier by field name (K0s, KO, ko_id, KEGG_ko, kegg_orthology) with K numbers (K00128)
    rule: (?i)k0s?|kos?|ko[ _]?(?:ids?|numbers?|terms?)|kegg[ _]?(?:kos?|orthology|orthologs?)(?:[ _]?ids?)?|orthology(?:[ _]?ids?)?
    type: field
    match: regex
    validator: metacrafterext.rules.common.omics.validate_kegg_orthology_id
    needs_values: true
    priority: 1
  keggorthologyidvalue:
    key: kegg_orthology_id
    name: KEGG Orthology identifier by value in a field named for it (K00128, K01689)
    # K and five digits is also a catalogue or a part number: the field must name KEGG or KO.
    rule: '(?:ko:)?K\d{5}'
    type: data
    match: regex
    minlen: 6
    maxlen: 9
    fieldregex: (?i)^k0s?$|^kos?$|^ko[ _]|kegg|orthol
    priority: 1
  pvaluebyname:
    key: p_value
    name: p-value by field name (p-value, pvalue, p.value, pval, padj, FDR, q-value, Differential Expression p-value) with numbers from 0 to 1
    rule: (?i)(?:[a-z0-9]+[ _.-]){0,4}(?:p[ _.-]?val(?:ue|or)?s?|valor[ _]?p|p[ _.]?adj(?:usted)?|adj(?:usted)?[ _.]?p(?:[ _.-]?val(?:ue)?)?|fdr|q[ _.-]?val(?:ue)?s?)(?:[ _.-][a-z0-9]+){0,2}
    type: field
    match: regex
    validator: metacrafterext.rules.common.omics.validate_p_value
    needs_values: true
    priority: 1
  log2foldchangebyname:
    key: log2_fold_change
    name: Log2 fold change by field name (log2FoldChange, logFC, log2FC, Log2 Ratio, Differential Expression Log2 Ratio) with signed decimals
    rule: (?i)(?:[a-z0-9]+[ _.-]){0,4}(?:log[ _]?2[ _.-]?(?:fold[ _.-]?change|fc|ratio)|log[ _.-]?fc|l2fc|lfc)(?:[ _.-][a-z0-9]+){0,2}
    type: field
    match: regex
    validator: metacrafterext.rules.common.omics.validate_log2_fold_change
    needs_values: true
    priority: 1
  # ------------------------------------------------------------ microRNAs, soybean genes, barcodes
  # Found in a 2024 snapshot of Borealis, the Canadian Dataverse Repository (borealisdata.ca, Dateno
  # source cdi00000328): tables of microRNA target predictions (miRNA: hsa-miR-34a-5p; mRNA:
  # Glyma.10G039300.1) and of environmental DNA surveys (bin_uri: BOLD:AAM2154).
  mirnanamevalue:
    key: mirna_name
    name: microRNA name of miRBase by value (hsa-miR-34a-5p, hsa-let-7b-5p, gma-miR10418 MIMAT0041661)
    rule: metacrafterext.rules.common.genomics.validate_mirna_name
    type: data
    match: func
    minlen: 8
    maxlen: 36
    priority: 1
  mirbasematureidvalue:
    key: mirbase_mature_id
    name: miRBase mature microRNA accession by value (MIMAT0046872)
    rule: metacrafterext.rules.common.genomics.validate_mirbase_mature_id
    type: data
    match: func
    minlen: 12
    maxlen: 12
    priority: 1
  glymageneidvalue:
    key: glyma_gene_id
    name: Soybean gene model identifier by value (Glyma.10G039300, Glyma.18G243100.2, Glyma10g34560)
    rule: metacrafterext.rules.common.genomics.validate_glyma_gene_id
    type: data
    match: func
    minlen: 13
    maxlen: 20
    priority: 1
  boldbinvalue:
    key: bold_bin
    name: BOLD Barcode Index Number by value (BOLD:AAY6600)
    rule: metacrafterext.rules.common.genomics.validate_bold_bin
    type: data
    match: func
    minlen: 12
    maxlen: 12
    priority: 1
  # ROUNDEDGRANK and ROUNDEDNRANK of an inventory of wild plants (G5, T4, NNR, N3).
  natureserverankbyname:
    key: natureserve_rank
    name: NatureServe conservation status rank by field name (G_RANK, ROUNDEDNRANK, S_RANK, global_rank, NatureServe rank) with G5, N4, S1S2
    rule: (?i)(?:rounded[ _]?)?[gnst][ _]?rank|(?:rounded[ _]?)?(?:global|national|subnational|state|provincial)[ _]?(?:conservation[ _]?)?(?:status[ _]?)?rank|nature[ _]?serve[ _]?(?:global[ _]|national[ _])?(?:rank|status)
    type: field
    match: regex
    validator: metacrafterext.rules.common.taxa.validate_natureserve_rank
    needs_values: true
    priority: 1
  # HyLak_ID of lake surface temperature series joins them with HydroLAKES.
  hydrolakesidbyname:
    key: hydrolakes_id
    name: HydroLAKES lake identifier by field name (Hylak_id, HYLAK_ID, hydrolakes_id) with 552548
    rule: (?i)hylak[ _]?id|hydro[ _]?lakes?[ _]?id
    type: field
    match: regex
    validator: metacrafterext.rules.common.hydrology.validate_hydrolakes_id
    needs_values: true
    priority: 1
