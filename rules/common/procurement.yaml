name: common-procurement
description: Procurement methods (procedure types) of public procurement registers in many languages
context: government
lang: common
country_code: xx
rules:
  procurementmethodbyname:
    key: procurement_method
    name: Procurement method by field name (tipo_procedimiento, Tipocompra, procedure, procurementMethod, ProcedureCode)
    # The values must be procedure names or codes of the OCDS method and eForms procedure type
    # code lists: a procedure column of a court or a lab holds other things.
    rule: (?i)(?:tender[._])?procurement_?method(?:_?details)?|procurementmethod(?:details)?|(?:[a-z]+[ _.])?procedure(?:[ _]?(?:type|code|kind))?|(?:[a-z]+\.)*procedurecode(?:\.#text)?|tipo[ _]?(?:de[ _])?(?:procedimiento|compra|contrataci[oó]n|licitaci[oó]n|adjudicaci[oó]n)(?:[ _]\(cat[aá]logo\))?|procedimiento(?:[ _](?:de[ _])?(?:adjudicaci[oó]n|contrataci[oó]n|selecci[oó]n|compra|tipo))?|tipocompra|modalidad(?:[ _]de)?(?:[ _](?:contrataci[oó]n|compra|selecci[oó]n|adjudicaci[oó]n))?|modalidade(?:[ _]de[ _]licita[cç][aã]o)?|procedura(?:[ _]di[ _]scelta(?:[ _]del[ _]contraente)?)?|tipo[ _]procedura|scelta[ _]contraente|vergabeart|verfahrensart|vergabeverfahren|hankemenetlus(?:e[ _]liik)?|入札方法|入札方式|契約方法|契約方式|способ[ _](?:закупки|определения[ _]поставщика)
    type: field
    match: regex
    validator: metacrafterext.rules.common.procurement.validate_procurement_method_or_code
    needs_values: true
    priority: 1
  procurementmethodvalue:
    key: procurement_method
    name: Procurement method by value (Licitación Pública, Contratación directa, Procédure adaptée, 指名競争入札)
    # The Japanese bid results of Tochigi keep the method in a column named 契約名称.
    rule: metacrafterext.rules.common.procurement.validate_procurement_method
    type: data
    match: func
    minlen: 4
    maxlen: 120
    priority: 1
  # Found in the SICOP procurement reports of the INEC of Costa Rica (datosabiertos.inec.cr,
  # metacrafter-testdata): Contrato, Adjudicación en firme, Desierto/Infructuoso, Sin efecto.
  procurementstatusbyname:
    key: procurement_status
    name: Procurement status by field name (ESTADO, estado_procedimiento, Estado del concurso, situación) with Adjudicación en firme, Desierto, En recepción de ofertas
    # An estado of anything else (Vigente, Finalizado, a state of Mexico) fails the validator.
    rule: (?i)estado(?:[ _](?:del?[ _]|de[ _]la[ _])?(?:procedimiento|proceso|concurso|contrataci[oó]n|licitaci[oó]n|tr[aá]mite|compra|adjudicaci[oó]n))?|situaci[oó]n(?:[ _](?:del?[ _]|de[ _]la[ _])?(?:procedimiento|proceso|concurso|contrataci[oó]n|licitaci[oó]n))?|(?:tender|procurement|procedure)[ _]?status
    type: field
    match: regex
    validator: metacrafterext.rules.common.procurement.validate_procurement_status
    needs_values: true
    priority: 1
  procurementstatusocds:
    key: procurement_status
    name: Procurement status in an OCDS record (tender.status, awards.status, contracts.status) with active, unsuccessful, terminated
    rule: (?i)(?:.*\.)?(?:tender|awards?|contracts?)\.status
    type: field
    match: regex
    validator: metacrafterext.rules.common.procurement.validate_procurement_status_code
    needs_values: true
    priority: 1
  # The supplier that won a line of a procedure: a company (INTERHAND SOCIEDAD ANONIMA), a
  # public body or a person in business (SICOP reports of the INEC of Costa Rica).
  suppliernamebyname:
    key: orgname
    name: Supplier name by Spanish field name (PROVEEDOR_ADJUDICADO, PROVEEDOR_ADJU, proveedor, contratista)
    # A column of supplier codes or tax numbers fails the validator; nit_proveedor, rut_proveedor
    # and proveedor_id are not matched.
    rule: (?i)(?:nombre[ _](?:del?[ _])?)?(?:proveedor(?:es)?|contratistas?)(?:[ _](?:adju(?:d(?:ic(?:ado|atario)?)?)?|ganador|contratado|seleccionado|nombre))?
    type: field
    match: regex
    validator: metacrafterext.rules.common.generic.validate_name_text
    needs_values: true
    priority: 1
  # Found in the Buenos Aires Compras OCDS exports (data.buenosaires.gob.ar, metacrafter-testdata).
  ocdsocidvalue:
    key: ocds_ocid
    name: Open Contracting ID by value (ocds-bulbcf-101-0014-CDI19, ocds-213czf-000-00001)
    # The prefix a publisher registers with the Open Contracting Partnership: ocds- and six
    # characters, then the publisher's own process id.
    rule: ocds-[a-z0-9]{6}-[A-Za-z0-9][A-Za-z0-9._/:-]{0,80}
    type: data
    match: regex
    minlen: 13
    maxlen: 96
    priority: 1
