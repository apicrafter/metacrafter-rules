name: commondateandtime
description: Common date and time related rules
context: datetime
lang: common
country_code: xx
rules:
  datetimeknown:
    key: datetime
    name: DateTime known names
    rule: created_at,updated_at,created,updated,createdAt,updatedAt,creat_dt,deleted_at,datetime
    type: field
    match: text
    # Timestamps are not numbers of up to four digits: an OpenAlex abstract_inverted_index.created
    # holds the word positions of "created" (8) (#69).
    validator: metacrafterext.rules.common.generic.validate_date_value
    priority: 1
  dateknown:
    key: date
    name: Date by known name
    rule: date,created_date,creation_date,end_date,responsedate,createddate,completiondatem,start_date,end_date,report_date,actiondate,issue_date,closed_date,due_date,date_of_last_change,claimdate
    # A date field of years (LIBRIS date: 2024, [2024]) holds years (#60), one of small numbers
    # counts or word positions (#69).
    validator: metacrafterext.rules.common.generic.validate_date_value
    type: field
    match: text
    priority: 1
  isodatevalue:
    key: date
    name: ISO 8601 calendar date (YYYY-MM-DD) by value
    # The regexp of the registry record date: YYYY-MM-DD, month 01-12, day 01-31. The
    # validator rejects days that the month does not have (2025-02-30). Dates with a time
    # (2025-05-15T10:00:00) are datetime and do not match.
    rule: date
    match: registry
    type: data
    validator: metacrafterext.rules.common.dateandtime.is_iso_date
    minlen: 10
    maxlen: 10
  yearbydatafiltered:
    key: year
    name: Modern years in range 1001-2199 by data and fieldname
    maxlen: 4
    minlen: 4
    rule: (Literal('1') + Word(nums, exact=3)) ^ (Literal('2') + Word('01', exact=1)
      + Word(nums, exact=2))
    match: ppr
    type: data
    # The field name has a word that starts with year: year, year_built, yearofbirth, birth_year,
    # Year of birth. pyparsing does not backtrack, so each alternative fixes the number of words
    # before it (0 to 3); words are separated by _, - or spaces.
    fieldrule: >-
      (CaselessLiteral('year') + ZeroOrMore(Word(printables)))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 1 + CaselessLiteral('year') + ZeroOrMore(Word(printables)))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 2 + CaselessLiteral('year') + ZeroOrMore(Word(printables)))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 3 + CaselessLiteral('year') + ZeroOrMore(Word(printables)))
    fieldrulematch: ppr
    priority: 2
  yearknown:
    key: year
    name: Year by known name
    rule: year,yearnum
    type: field
    match: text
    # Years from 1000 to 2999 (2024, 2019/20) or of another calendar (平成4年); not the word
    # positions of an OpenAlex abstract_inverted_index.year (58, 21) (#69).
    validator: metacrafterext.rules.common.generic.validate_year_value
    priority: 1
  yearbylocalname:
    key: year
    name: Year by field name in other languages (tahun, shnat_yitzur, rok, vuosi, yıl)
    # Malay and Indonesian tahun, Hebrew shnat / shana (in Latin letters and in Hebrew), Polish
    # and Czech rok, Finnish vuosi, Swedish år, Estonian aasta, Lithuanian metai, Hungarian év,
    # Turkish yıl, Vietnamese năm, Korean 연도. The values must be years: the same files hold
    # engine capacities and weights in the year range under other names (#70).
    rule: tahun,tahun_terbit,tahun_anggaran,tahun_pembuatan,tahun_produksi,shnat,shnat_yitzur,shnat_ytzur,shana,שנה,שנת ייצור,שנת_ייצור,rok,rok_produkcji,rok produkcji,vuosi,vuosiluku,år,årtal,aasta,metai,év,yıl,yil,năm,연도,년도
    type: field
    match: text
    validator: metacrafterext.rules.common.generic.validate_year_value
    priority: 1
  yearknownpat:
    key: year
    name: Year by known name pattern
    # The field name ends with the word year after 1 to 3 other words (birth_year,
    # fiscal year, Model-Year).
    # pyparsing does not backtrack, so each number of words is an alternative.
    rule: >-
      ((Word(alphanums) + Optional(oneOf('_ -'))) * 1 + CaselessLiteral('year'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 2 + CaselessLiteral('year'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 3 + CaselessLiteral('year'))
    type: field
    match: ppr
    priority: 2
  timestampknown:
    key: unixtime
    name: Timestamp by known name
    rule: timestamp
    type: field
    match: text
    # A timestamp of milliseconds (1793960864568) is unixtime_ms (unixtimemsvalue, #70).
    validator: metacrafterext.rules.common.dateandtime.validate_not_unixtime_ms
    priority: 1
  timestampknownpat:
    key: unixtime
    name: Timestamp by known name pattern
    # The field name ends with the word timestamp after 1 to 3 other words
    # (created_timestamp, event timestamp).
    # pyparsing does not backtrack, so each number of words is an alternative.
    rule: >-
      ((Word(alphanums) + Optional(oneOf('_ -'))) * 1 + CaselessLiteral('timestamp'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 2 + CaselessLiteral('timestamp'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 3 + CaselessLiteral('timestamp'))
    type: field
    match: ppr
    # Name evidence only: AKT_TIMESTAMP holds dates (2026-09-01Z). Integer values make it
    # unixtime through unixtimevalue.
    priority: 2
  unixtimevalue:
    key: unixtime
    name: Unix time in seconds in a timestamp field
    priority: 1
    minlen: 9
    maxlen: 17
    match: regex
    type: data
    # Seconds from 630000000 to 2209999999 (about 1990 to 2040), with an optional fraction.
    # Bare 10-digit numbers are also INNs and phone numbers, so the field name must name a
    # timestamp: timestamp, created_timestamp, created_ts, epoch. Milliseconds are
    # unixtime_ms (unixtimemsvalue, #70).
    rule: '(?:6[3-9]\d{7}|[7-9]\d{8}|1\d{9}|2[01]\d{8}|220\d{7})(?:\.\d{1,6})?'
    fieldrule: >-
      CaselessLiteral('timestamp')
      ^ oneOf('unixtime unix_time unix_timestamp epoch epoch_time ts', caseless=True)
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 1 + (CaselessLiteral('timestamp') | CaselessLiteral('ts')))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 2 + CaselessLiteral('timestamp'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 3 + CaselessLiteral('timestamp'))
    fieldrulematch: ppr
  unixtimemsvalue:
    key: unixtime_ms
    name: Unix time in milliseconds in a timestamp field
    priority: 1
    minlen: 11
    maxlen: 16
    match: regex
    type: data
    # 11 to 13 digits from 1900 to 2100 in milliseconds (1793960864568), the same field names
    # as unixtimevalue (#70).
    rule: '-?\d{11,13}(?:\.0+)?'
    validator: metacrafterext.rules.common.dateandtime.validate_unixtime_ms
    fieldrule: >-
      CaselessLiteral('timestamp')
      ^ oneOf('unixtime unix_time unix_timestamp epoch epoch_time ts epoch_ms timestamp_ms', caseless=True)
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 1 + (CaselessLiteral('timestamp') | CaselessLiteral('ts')))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 2 + CaselessLiteral('timestamp'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 3 + CaselessLiteral('timestamp'))
    fieldrulematch: ppr
  timezoneknown:
    key: timezone
    name: Timezone by known name
    rule: timezone
    type: field
    match: text
    priority: 1
  timezoneknownpat:
    key: timezone
    name: Timezone by known name pattern
    # The field name ends with the word timezone after 1 to 3 other words
    # (user_timezone, local timezone).
    # pyparsing does not backtrack, so each number of words is an alternative.
    rule: >-
      ((Word(alphanums) + Optional(oneOf('_ -'))) * 1 + CaselessLiteral('timezone'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 2 + CaselessLiteral('timezone'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 3 + CaselessLiteral('timezone'))
    type: field
    match: ppr
    priority: 2
  monthknownpat:
    key: month
    name: Month by known name pattern
    # The field name ends with the word month after 1 to 3 other words (birth_month,
    # start month, Report-Month).
    # pyparsing does not backtrack, so each number of words is an alternative.
    rule: >-
      ((Word(alphanums) + Optional(oneOf('_ -'))) * 1 + CaselessLiteral('month'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 2 + CaselessLiteral('month'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 3 + CaselessLiteral('month'))
    type: field
    match: ppr
    priority: 2
  monthknown:
    key: month
    name: Month by known name
    rule: month,monthnum
    type: field
    match: text
    priority: 1
  yearbydataimprecise:
    key: year
    name: Modern years in range 1900-2100 by data
    maxlen: 4
    minlen: 4
    rule: (Literal('19') + Word(nums, exact=2)) ^ (Literal('20') + Word(nums, exact=2))
    match: ppr
    type: data
    # The field name has a word that starts with year, date or time: created_date, start_time,
    # birth_year. pyparsing does not backtrack, so each alternative fixes the number of words
    # before it (0 to 3); words are separated by _, - or spaces.
    fieldrule: >-
      (oneOf('year date time', caseless=True) + ZeroOrMore(Word(printables)))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 1 + oneOf('year date time', caseless=True) + ZeroOrMore(Word(printables)))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 2 + oneOf('year date time', caseless=True) + ZeroOrMore(Word(printables)))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 3 + oneOf('year date time', caseless=True) + ZeroOrMore(Word(printables)))
    fieldrulematch: ppr
    imprecise: 1
    priority: 3
  timestampdatebyknown:
    key: datetime
    name: Timestamp by field name
    match: text
    type: field
    rule: registration_timestamp,modification_timestamp,valid_until_timestamp,valid_from_timestamp,confirmed_at
    priority: 1
  createddatebyknown:
    key: datetime
    name: Creation timestamp by field name
    match: text
    type: field
    rule: created_on,date_created,create_time,create_time_
    priority: 1
  modifieddatebyknown:
    key: datetime
    name: Modification timestamp by field name
    match: text
    type: field
    rule: modified,lastmodifieddate
    validator: metacrafterext.rules.common.generic.validate_date_value
    priority: 1
  updateddatebyknown:
    key: datetime
    name: Update timestamp by field name
    match: text
    type: field
    rule: updated_on,last_updated,date_updated,update_time
    priority: 1
  datedatebyknown:
    key: date
    name: Date by field name
    match: text
    type: field
    rule: expiry_date,settlement_date,maturity_date
    priority: 1
  timedatebyknown:
    key: time
    name: Time by field name
    match: text
    type: field
    rule: start_time,end_time
    priority: 1
  datedmonyyvalue:
    key: date_dmony
    name: Date as DDMONYY (06NOV26, SAS DATE7.)
    rule: '(?:0[1-9]|[12]\d|3[01])(?:JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)\d{2}'
    type: data
    match: regex
    minlen: 7
    maxlen: 7
    priority: 1
  excelserialdatevalue:
    key: excel_serial_date
    name: Date as an Excel serial day number (36872) by field name and value
    rule: '[1-5]\d{4}'
    type: data
    match: regex
    minlen: 5
    maxlen: 5
    fieldrule: date,дата,data,fecha,datum,contract_date,date_contract,дата договора,дата_договора,дата контракта,күні
    fieldrulematch: text
    priority: 1
  schoolyearbyfield:
    key: school_year
    name: School or academic year (2025/26, 202526) by multilingual field name
    rule: (?i)(?:.*\.)?(?:anno[ _]?scolas(?:tico)?|school[ _]?year|academic[ _]?year|schooljaar|schuljahr|ann[ée]e[ _]scolaire|a[ñn]o[ _]escolar|curso[ _](?:escolar|acad[ée]mico)|ano[ _]letivo|rok[ _]szkolny|[šs]koln[ií][ _]rok|учебный[ _]год|навчальний[ _]рік|tan[ée]v|l[äa]s[åa]r|lukuvuosi)
    type: field
    match: regex
    validator: metacrafterext.rules.common.generic.validate_school_year
    priority: 1
