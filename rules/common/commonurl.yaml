name: commonurl
description: Common URL data types
context: common
lang: common
country_code: xx
rules:
  fqdnbyvalidators:
    key: fqdn
    name: Full qualified domain name using validators
    maxlen: 1024
    minlen: 5
    priority: 1
    match: func
    type: data
    rule: metacrafterext.rules.common.internet.is_fqdn
  slugfield:
    key: slug
    name: URL slug by field name
    rule: slug,slugs,url_slug,urlslug,page_slug,post_slug,slug_url
    type: field
    match: text
    priority: 1
  slugvalue:
    key: slug
    name: URL slug by value in a slug field
    rule: '[a-z0-9]+(?:-[a-z0-9]+)*'
    match: regex
    type: data
    minlen: 1
    maxlen: 200
    priority: 1
    fieldrule: slug,slugs,url_slug,urlslug,page_slug,post_slug,slug_url
    fieldrulematch: text
  urlbyvalidators:
    key: url
    name: Web URL
    maxlen: 1024
    minlen: 5
    priority: 1
    match: func
    type: data
    rule: validators.url
  urlbyknownpat:
    key: url
    name: URL/website by known name pattern
    # The field name ends with the word url after 1 to 3 other words (image_url,
    # profile url, Source-URL).
    # pyparsing does not backtrack, so each number of words is an alternative.
    rule: >-
      ((Word(alphanums) + Optional(oneOf('_ -'))) * 1 + CaselessLiteral('url'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 2 + CaselessLiteral('url'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 3 + CaselessLiteral('url'))
    type: field
    match: ppr
    priority: 2
