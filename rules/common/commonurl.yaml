name: commonurl
description: Common URL data types
context: common
lang: common
country_code: xx
rules:
  fqdnbyvalidators:
    key: fqdn
    name: Full qualified domain name using validators
    maxlen: 1024
    minlen: 5
    priority: 1
    match: func
    type: data
    rule: metacrafterext.rules.common.internet.is_fqdn
  slugfield:
    key: slug
    name: URL slug by field name
    rule: slug,slugs,url_slug,urlslug,page_slug,post_slug,slug_url
    type: field
    match: text
    priority: 1
  slugvalue:
    key: slug
    name: URL slug by value in a slug field
    rule: '[a-z0-9]+(?:-[a-z0-9]+)*'
    match: regex
    type: data
    minlen: 1
    maxlen: 200
    priority: 1
    fieldrule: slug,slugs,url_slug,urlslug,page_slug,post_slug,slug_url
    fieldrulematch: text
  urlbyvalidators:
    key: url
    name: Web URL
    maxlen: 1024
    minlen: 5
    priority: 1
    match: func
    type: data
    rule: validators.url
  urlbyknownpat:
    key: url
    name: URL/website by known name pattern
    rule: Word(printables) + "url" +  lineEnd
    type: field
    match: ppr
    priority: 2
