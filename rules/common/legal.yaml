name: legal
description: Legal and compliance identifiers
context: legal
lang: common
country_code: xx
rules:
  contractidknown:
    key: contract_id
    name: Contract identifier by known name
    rule: contract_id,contract_number,contract_no,agreement_id,agreement_number
    type: field
    match: text
    priority: 1
  casenumberknown:
    key: case_number
    name: Case number by known name
    rule: case_number,case_no,case_id,legal_case_number,court_case_number
    type: field
    match: text
    priority: 1
  legaldocumentknown:
    key: legal_document
    name: Legal document type by known name
    rule: legal_document,document_type,legal_doc_type,contract_type,agreement_type
    type: field
    match: text
    priority: 1
  compliancestatusknown:
    key: compliance_status
    name: Compliance status by known name
    rule: compliance_status,compliance_flag,gdpr_compliant,ccpa_compliant,regulatory_compliance
    type: field
    match: text
    priority: 1
  licensenumberknown:
    key: license_number
    name: License number by known name
    rule: license_number,license_no,licence_number,permit_number
    type: field
    match: text
    priority: 1

  contentlicensevalue:
    key: content_license
    name: Creative Commons license by short id or deed URL (cc-by, CC0-1.0, creativecommons.org/licenses/...)
    # Licenses of works and records (OpenAlex, GBIF); software licenses are software_license (#60, #62).
    rule: metacrafterext.rules.common.generic.validate_content_license
    type: data
    match: func
    minlen: 3
    maxlen: 120
    priority: 1
  ipccodebyname:
    key: ipc_code
    name: International Patent Classification symbol by field name (ipc_mark_value, edited_ipc_mark_value, primary_ipc_mark, ipc)
    rule: (?i)(?:[a-z]+_)*ipc(?:_mark)?(?:_(?:value|code|symbol|class|classification))?|(?:ipc|cpc|patent)[ _]class(?:ification)?(?:[ _](?:code|symbol))?
    type: field
    match: regex
    validator: metacrafterext.rules.common.periods.validate_ipc_code
    needs_values: true
    priority: 1
  ipccodevalue:
    key: ipc_code
    name: International Patent Classification symbol down to the group by value (A47G  23/02, A47G23/02, G06Q 90/00)
    rule: metacrafterext.rules.common.periods.validate_ipc_group
    type: data
    match: func
    minlen: 7
    maxlen: 20
    priority: 1
  pctapplicationnumbervalue:
    key: pct_application_number
    name: PCT international application number by value (PCT/AU1980/000001, PCT/AU80/00001)
    rule: metacrafterext.rules.common.periods.validate_pct_application_number
    type: data
    match: func
    minlen: 13
    maxlen: 17
    priority: 1
  wopublicationnumbervalue:
    key: wo_publication_number
    name: PCT international publication number by value (WO1980/002164, WO80/02164)
    rule: metacrafterext.rules.common.periods.validate_wo_publication_number
    type: data
    match: func
    minlen: 9
    maxlen: 17
    priority: 1
