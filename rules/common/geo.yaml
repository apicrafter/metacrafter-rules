name: commongeo
description: Common geodata
context: geo
lang: common
country_code: xx
rules:
  postindexzipvalue:
    key: postindex
    name: Five-digit postal code in a zip code field
    rule: '\d{5}'
    type: data
    match: regex
    minlen: 5
    maxlen: 5
    fieldrule: >-
      (CaselessLiteral('zip') + Optional(Optional(oneOf('_ -')) + CaselessLiteral('code')) + Optional(Word(nums)))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 1 + CaselessLiteral('zip') + Optional(Optional(oneOf('_ -')) + CaselessLiteral('code')) + Optional(Word(nums)))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 2 + CaselessLiteral('zip') + Optional(Optional(oneOf('_ -')) + CaselessLiteral('code')) + Optional(Word(nums)))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 3 + CaselessLiteral('zip') + Optional(Optional(oneOf('_ -')) + CaselessLiteral('code')) + Optional(Word(nums)))
    fieldrulematch: ppr
    priority: 2
  geopointbyname:
    key: geopoint
    name: Geopoint by knownname
    rule: geo_point_2d,point_geo,geopoint,geo_point,geo_coordinates
    type: field
    match: text
    priority: 1
  addressknown:
    key: address
    is_pii: true
    name: Address
    rule: address,postaladdress,actualaddress,fulladdress,address_legal,legaladdress,postal
      address,post address,location_address,location_1_address,address_1
    type: field
    match: text
    # Addresses have letters, word positions of an inverted index (168, 120) do not (#69).
    validator: metacrafterext.rules.common.generic.has_letters
    priority: 1
  latitude:
    key: latitude
    name: Latitude by known name
    rule: latitude,latitude_wgs84,geodata_latitude,poi_latitude,coordinates_latitude
    type: field
    match: text
    priority: 1
  longitude:
    key: longitude
    name: Longitude by known name
    rule: longitude,longitude_wgs84,geodata_longtitude,poi_longitude,coordinates_longitude
    type: field
    match: text
    priority: 1
  latitudepat:
    key: latitude
    name: Latitude by known name pattern
    maxlen: 100
    minlen: 10
    # The field name ends with the word latitude after 1 to 3 other words
    # (geo_latitude, start latitude).
    # pyparsing does not backtrack, so each number of words is an alternative.
    rule: >-
      ((Word(alphanums) + Optional(oneOf('_ -'))) * 1 + CaselessLiteral('latitude'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 2 + CaselessLiteral('latitude'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 3 + CaselessLiteral('latitude'))
    type: field
    match: ppr
    priority: 2
  longitudepat:
    key: longitude
    name: Longitude by known name pattern
    maxlen: 100
    minlen: 11
    # The field name ends with the word longitude after 1 to 3 other words
    # (geo_longitude, start longitude).
    # pyparsing does not backtrack, so each number of words is an alternative.
    rule: >-
      ((Word(alphanums) + Optional(oneOf('_ -'))) * 1 + CaselessLiteral('longitude'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 2 + CaselessLiteral('longitude'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 3 + CaselessLiteral('longitude'))
    type: field
    match: ppr
    priority: 2
  latitudevalue:
    key: latitude
    name: Latitude by data pattern and name
    maxlen: 13
    minlen: 4
    rule: ((Word('012345678', exact=1) + Word(nums, exact=1)) ^ (Literal("9") + Word(nums,
      exact=1))) + Literal('.') + Word(nums, min=1, max=10)
    type: data
    match: ppr
    # The field name has the word lat, possibly with digits: lat, geo_lat, lat_wgs84, lat2,
    # gps lat (not latest or plate). pyparsing does not backtrack, so each alternative fixes
    # the number of words before it (0 to 3); words are separated by _, - or spaces.
    fieldrule: >-
      (CaselessLiteral('lat') + Optional(Word(nums)) + Optional(oneOf('_ -') + ZeroOrMore(Word(printables))))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 1 + CaselessLiteral('lat') + Optional(Word(nums)) + Optional(oneOf('_ -') + ZeroOrMore(Word(printables))))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 2 + CaselessLiteral('lat') + Optional(Word(nums)) + Optional(oneOf('_ -') + ZeroOrMore(Word(printables))))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 3 + CaselessLiteral('lat') + Optional(Word(nums)) + Optional(oneOf('_ -') + ZeroOrMore(Word(printables))))
    fieldrulematch: ppr
    priority: 2
  longitudevalue:
    key: longitude
    name: Longitude by data pattern and name
    maxlen: 13
    minlen: 4
    rule: ((Literal("1") + Word("012345678") + Word(nums, exact=1)) ^ (Word(nums,
      exact=2))) + Literal(".") + Word(nums, min=1, max=10)
    type: data
    match: ppr
    # The field name has the word lon or lng, possibly with digits: lon, geo_lng, lon_wgs84
    # (not long or salon). pyparsing does not backtrack, so each alternative fixes the number
    # of words before it (0 to 3); words are separated by _, - or spaces.
    fieldrule: >-
      (oneOf('lon lng', caseless=True) + Optional(Word(nums)) + Optional(oneOf('_ -') + ZeroOrMore(Word(printables))))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 1 + oneOf('lon lng', caseless=True) + Optional(Word(nums)) + Optional(oneOf('_ -') + ZeroOrMore(Word(printables))))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 2 + oneOf('lon lng', caseless=True) + Optional(Word(nums)) + Optional(oneOf('_ -') + ZeroOrMore(Word(printables))))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 3 + oneOf('lon lng', caseless=True) + Optional(Word(nums)) + Optional(oneOf('_ -') + ZeroOrMore(Word(printables))))
    fieldrulematch: ppr
    priority: 2
  postindexknown:
    key: postindex
    is_pii: true
    name: Post index code (ZIP code and e.t.c) by known name
    rule: postindex,postIndex,post_index,postcode,zip_code,zipcode,postalcode,post
      index,zip_code,postal_code,location_zip,address_zip
    match: text
    type: field
    priority: 1
  streetknown:
    key: street
    is_pii: true
    name: Street name by field name
    rule: street,street name,streetname,street_name
    match: text
    type: field
    priority: 1
  cityknown:
    key: city
    is_pii: true
    name: City/town name by field name
    rule: town,city,cityname,location (city),location_city,location_1_city,address_city,city_name
    # Numeric city ids (Kirkanta, HayPost) are not city names (#60).
    validator: metacrafterext.rules.common.generic.validate_place_name
    match: text
    type: field
    priority: 1
  countryknown:
    key: country
    name: Country name by field name
    rule: country,countryname,country_name
    match: text
    type: field
    # Names and codes have letters; an OpenAlex abstract_inverted_index.country holds the word
    # positions of "country" (226) (#69).
    validator: metacrafterext.rules.common.generic.has_letters
    priority: 1
  wbregionbyvalue:
    key: wbregion
    name: World Bank region
    rule: South Asia,Europe & Central Asia,Sub-Saharan Africa,Latin America & Caribbean,East
      Asia & Pacific,North America,Middle East & North Africa
    match: text
    type: data
    priority: 2
  glnfield:
    key: gln
    name: Global Location Number (GLN) by field name
    rule: gln,global_location_number,location_id,location_number,gln_code
    type: field
    match: text
    priority: 1
  glnvalue:
    key: gln
    name: Global Location Number (GLN) by value pattern
    match: ppr
    type: data
    rule: Word(nums, exact=13)
    maxlen: 13
    minlen: 13
    priority: 1
    validator: metacrafterext.rules.common.identifiers.validate_gln
    imprecise: 1
  unlocodefield:
    key: unlocode
    name: UN/LOCODE by field name
    rule: unlocode,un_locode,locode,un_location_code
    type: field
    match: text
    priority: 1
  unlocodevalue:
    key: unlocode
    name: UN/LOCODE by value pattern
    match: ppr
    type: data
    rule: Word('ABCDEFGHIJKLMNOPQRSTUVWXYZ', exact=2) + Word('0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ',
      exact=3)
    maxlen: 5
    minlen: 5
    priority: 1
    imprecise: 1
  addressaddressbyknown:
    key: address
    name: Address line 1 by field name
    match: text
    type: field
    rule: address1,address_line_1
    priority: 1
  addressline2byknown:
    key: address_line2
    name: Address line 2 by field name
    match: text
    type: field
    rule: address2,address_line_2
    priority: 1
  countrybylocalnamevalue:
    key: country
    name: Country name in a field named country in another language (pays, país, страна)
    # The values are in the language of the field name: French Belgique and Espagne, and France,
    # which the English country name list also has. The guarded rule outweighs that list (#69).
    match: func
    type: data
    rule: metacrafterext.rules.common.generic.validate_place_name
    minlen: 2
    maxlen: 60
    fieldrule: pays,pays_de_deces,pays_deces,pays de décès,pays_de_naissance,pays_naissance,pays de naissance,pays_residence,pays de résidence,nom_pays,nom du pays,país,pais,pais_origen,país de origen,pais_nacimiento,país de nacimiento,paese,paese_nascita,nazione,kraj_urodzenia,państwo,страна,страна рождения,наименование страны,країна,ülke,valsts,šalis,ország,χώρα,國家,国家,국가,država,země
    fieldrulematch: text
    priority: 1
  countrygeobyknown:
    key: country
    name: Country by field name
    match: text
    type: field
    rule: country_code,countryId,countryid,address_country
    priority: 1
  streetaddressbyknown:
    key: street_address
    name: Street Address
    match: text
    type: field
    rule: street_address,street2,street1,addressstreet
    priority: 1
  latgeobyknown:
    key: latitude
    name: Latitude by field name
    match: text
    type: field
    rule: stop_lat,geo_lat
    priority: 1
  longeobyknown:
    key: longitude
    name: Longitude by field name
    match: text
    type: field
    rule: stop_lon
    priority: 1
  coordinategeobyknown:
    key: geopoint
    name: Coordinates by field name
    match: text
    type: field
    rule: coordinates
    # The numbers of a geometry in longitude and latitude (-180 to 180). Projected coordinates in
    # metres (570181.18, 6592327.82) are eastings and northings (#69).
    validator: metacrafterext.rules.common.generic.validate_lonlat_number
    priority: 1
  continentgeobyknown:
    key: continent
    name: Continent by field name
    match: text
    type: field
    rule: continent_name
    priority: 1
  eastingbyfield:
    key: easting
    name: Easting (projected x coordinate) by field name
    # UTM and national grids: Easting, UTM_Easting, UTMRechtswert, Rechtswert, X-UTM32N,
    # UTM32_X, coordx_origine, Souradnice Y (S-JTSK Y grows westwards, like an easting),
    # BNG_E of ONS boundary attributes.
    rule: (?i)(?:utm[ _.-]?\d{0,2}[ns]?[ _.-]?)?(?:easting|rechtswert)|x[ _.-]?utm[ _.-]?\d{0,2}[ns]?|utm[ _.-]?\d{0,2}[ns]?[ _.-]?x|coordx(?:[ _.-]\w+)?|sou[rř]adnice[ _.-]?y|bng[ _.-]?e(?:asting)?
    type: field
    match: regex
    priority: 1
  northingbyfield:
    key: northing
    name: Northing (projected y coordinate) by field name
    rule: (?i)(?:utm[ _.-]?\d{0,2}[ns]?[ _.-]?)?(?:northing|hochwert)|y[ _.-]?utm[ _.-]?\d{0,2}[ns]?|utm[ _.-]?\d{0,2}[ns]?[ _.-]?y|coordy(?:[ _.-]\w+)?|sou[rř]adnice[ _.-]?x|bng[ _.-]?n(?:orthing)?
    type: field
    match: regex
    priority: 1
  postindexbyfield:
    key: postindex
    is_pii: true
    name: Postal code by field name (post code, postal-code, zip code with qualifiers)
    # Supplier Post Code, postal-code (JSON-LD), station zip code, mailing_postcode.
    rule: (?i)(?:[a-z]+[ _.-]){0,3}(?:post(?:al)?[ _.-]?code|zip[ _.-]?code|postcode)
    type: field
    match: regex
    priority: 1
  streetaddressbyfield:
    key: street_address
    is_pii: true
    name: Street address line by field name
    # 5. STREET ADDRESS, company_address_1, address_line_2, registered_address.
    # Lines 3 and 4 hold the town, county and country (company_address_4: DUBLIN 13).
    rule: (?i)(?:\d+\.\s*)?street[ _.-]?address(?:[ _.-]?[12])?|address[ _.-]?(?:line[ _.-]?)?[12]|(?:company|business|mailing|registered|postal)[ _.-]?address(?:[ _.-]?[12])?
    type: field
    match: regex
    priority: 1
  gadmgidvalue:
    key: gadm_gid
    name: GADM area id (VNM.25.13_1)
    rule: '[A-Z]{3}(?:\.\d+)+_\d+'
    type: data
    match: regex
    minlen: 7
    maxlen: 40
    priority: 1
  hdxpcodevalue:
    key: hdx_pcode
    name: OCHA place code (GE11) by field name and value
    rule: '[A-Z]{2}\d{1,12}'
    type: data
    match: regex
    minlen: 3
    maxlen: 14
    fieldrule: adm1_pcode,adm2_pcode,adm3_pcode,adm4_pcode,admin1pcode,admin2pcode,admin3pcode,admin4pcode,admin1_pcode,admin2_pcode,admin3_pcode,admin4_pcode,pcode,p_code,p-code
    fieldrulematch: text
    priority: 1
  adminarea3byfield:
    key: admin_area_3
    name: Third-level administrative division (kecamatan, tambon) by field name
    rule: kecamatan,nama_kecamatan,nm_kecamatan,kecamatan_nama,nama kecamatan,tambon,tambon_name,ตำบล,ตำบล/แขวง,แขวง/ตำบล,thathmblnm
    type: field
    match: text
    validator: metacrafterext.rules.common.generic.validate_place_name
    priority: 1
  wkbbyvalue:
    key: wkb
    name: Well-known binary (WKB, EWKB) geometry as bytes or hexadecimal
    rule: metacrafterext.rules.common.formats.validate_wkb
    type: data
    match: func
    minlen: 18
    maxlen: 100000
    priority: 1
  gmlposlistbyfield:
    key: gml_poslist
    name: GML coordinates (gml:pos, gml:posList) by element name
    rule: (?i)(?:.*[.:])?pos(?:list)?
    type: field
    match: regex
    validator: metacrafterext.rules.common.formats.validate_gml_poslist
    priority: 1
  # Coordinates read as numbers (JSON floats, CSV decimals): value rules do not run on float
  # columns, so short names (lat, lon, lng; geo_point_2d.lat, coordonnees.lon of Opendatasoft
  # JSON exports) are field-name rules whose values must be decimal degrees in range.
  latitudebyshortname:
    key: latitude
    name: Latitude by short field name (lat, geo_point_2d.lat, lat_wgs84)
    rule: (?i)(?:(?:gps|geo|y|wgs84|point|stop|start|end|centroid|center|centre)[ _-]?)?lat(?:itude)?(?:[ _-]?(?:wgs84|wgs|dd|deg|gps|y|dec|4326))?
    type: field
    match: regex
    validator: metacrafterext.rules.common.generic.validate_latitude_value
    priority: 1
  longitudebyshortname:
    key: longitude
    name: Longitude by short field name (lon, lng, geo_point_2d.lon, lon_wgs84)
    # long is also a length (longueur): it is left out.
    rule: (?i)(?:(?:gps|geo|x|wgs84|point|stop|start|end|centroid|center|centre)[ _-]?)?(?:lon|lng|longitude)(?:[ _-]?(?:wgs84|wgs|dd|deg|gps|x|dec|4326))?
    type: field
    match: regex
    validator: metacrafterext.rules.common.generic.validate_longitude_value
    priority: 1
  geojsongeometrytypebyname:
    key: geojson_geometry_type
    name: GeoJSON geometry type by field name and values (geometry.type, geo_shape.geometry.type)
    # Any field named type whose values are geometry types: Feature, the type of a feature, is not.
    rule: (?i)type|geometry[ _-]?type|geom[ _-]?type|shape[ _-]?type|geotype|type[ _-]?geom(?:etry)?|shape
    type: field
    match: regex
    validator: metacrafterext.rules.common.generic.validate_geojson_geometry_type
    priority: 1
  geopoint2dbyname:
    key: geo_point_2d
    name: Opendatasoft geo_point_2d by field name, as latitude and longitude text
    # Other point fields of Opendatasoft (coordonnees, geolocalisation) share the name of
    # geopoint fields of other sources: only the platform's own name.
    rule: geo_point_2d
    type: field
    match: text
    validator: metacrafterext.rules.common.generic.validate_latlon_pair
    priority: 1
