name: commongeo
description: Common geodata
context: geo
lang: common
country_code: xx
rules:
  postindexzipvalue:
    key: postindex
    name: Five-digit postal code in a zip code field
    rule: '\d{5}'
    type: data
    match: regex
    minlen: 5
    maxlen: 5
    fieldrule: >-
      (CaselessLiteral('zip') + Optional(Optional(oneOf('_ -')) + CaselessLiteral('code')) + Optional(Word(nums)))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 1 + CaselessLiteral('zip') + Optional(Optional(oneOf('_ -')) + CaselessLiteral('code')) + Optional(Word(nums)))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 2 + CaselessLiteral('zip') + Optional(Optional(oneOf('_ -')) + CaselessLiteral('code')) + Optional(Word(nums)))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 3 + CaselessLiteral('zip') + Optional(Optional(oneOf('_ -')) + CaselessLiteral('code')) + Optional(Word(nums)))
    fieldrulematch: ppr
    priority: 2
  geopointbyname:
    key: geopoint
    name: Geopoint by knownname
    rule: geo_point_2d,point_geo,geopoint,geo_point,geo_coordinates
    type: field
    match: text
    priority: 1
  addressknown:
    key: address
    is_pii: true
    name: Address
    rule: address,postaladdress,actualaddress,fulladdress,address_legal,legaladdress,postal
      address,post address,location_address,location_1_address,address_1
    type: field
    match: text
    # Addresses have letters, word positions of an inverted index (168, 120) do not (#69).
    validator: metacrafterext.rules.common.generic.has_letters
    priority: 1
  latitude:
    key: latitude
    name: Latitude by known name
    rule: latitude,latitude_wgs84,geodata_latitude,poi_latitude,coordinates_latitude
    type: field
    match: text
    priority: 1
  longitude:
    key: longitude
    name: Longitude by known name
    rule: longitude,longitude_wgs84,geodata_longtitude,poi_longitude,coordinates_longitude
    type: field
    match: text
    priority: 1
  latitudepat:
    key: latitude
    name: Latitude by known name pattern
    maxlen: 100
    minlen: 10
    # The field name ends with the word latitude after 1 to 3 other words
    # (geo_latitude, start latitude).
    # pyparsing does not backtrack, so each number of words is an alternative.
    rule: >-
      ((Word(alphanums) + Optional(oneOf('_ -'))) * 1 + CaselessLiteral('latitude'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 2 + CaselessLiteral('latitude'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 3 + CaselessLiteral('latitude'))
    type: field
    match: ppr
    priority: 2
  longitudepat:
    key: longitude
    name: Longitude by known name pattern
    maxlen: 100
    minlen: 11
    # The field name ends with the word longitude after 1 to 3 other words
    # (geo_longitude, start longitude).
    # pyparsing does not backtrack, so each number of words is an alternative.
    rule: >-
      ((Word(alphanums) + Optional(oneOf('_ -'))) * 1 + CaselessLiteral('longitude'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 2 + CaselessLiteral('longitude'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 3 + CaselessLiteral('longitude'))
    type: field
    match: ppr
    priority: 2
  latitudevalue:
    key: latitude
    name: Latitude by data pattern and name
    maxlen: 13
    minlen: 4
    rule: ((Word('012345678', exact=1) + Word(nums, exact=1)) ^ (Literal("9") + Word(nums,
      exact=1))) + Literal('.') + Word(nums, min=1, max=10)
    type: data
    match: ppr
    # The field name has the word lat, possibly with digits: lat, geo_lat, lat_wgs84, lat2,
    # gps lat (not latest or plate). pyparsing does not backtrack, so each alternative fixes
    # the number of words before it (0 to 3); words are separated by _, - or spaces.
    fieldrule: >-
      (CaselessLiteral('lat') + Optional(Word(nums)) + Optional(oneOf('_ -') + ZeroOrMore(Word(printables))))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 1 + CaselessLiteral('lat') + Optional(Word(nums)) + Optional(oneOf('_ -') + ZeroOrMore(Word(printables))))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 2 + CaselessLiteral('lat') + Optional(Word(nums)) + Optional(oneOf('_ -') + ZeroOrMore(Word(printables))))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 3 + CaselessLiteral('lat') + Optional(Word(nums)) + Optional(oneOf('_ -') + ZeroOrMore(Word(printables))))
    fieldrulematch: ppr
    priority: 2
  longitudevalue:
    key: longitude
    name: Longitude by data pattern and name
    maxlen: 13
    minlen: 4
    rule: ((Literal("1") + Word("012345678") + Word(nums, exact=1)) ^ (Word(nums,
      exact=2))) + Literal(".") + Word(nums, min=1, max=10)
    type: data
    match: ppr
    # The field name has the word lon or lng, possibly with digits: lon, geo_lng, lon_wgs84
    # (not long or salon). pyparsing does not backtrack, so each alternative fixes the number
    # of words before it (0 to 3); words are separated by _, - or spaces.
    fieldrule: >-
      (oneOf('lon lng', caseless=True) + Optional(Word(nums)) + Optional(oneOf('_ -') + ZeroOrMore(Word(printables))))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 1 + oneOf('lon lng', caseless=True) + Optional(Word(nums)) + Optional(oneOf('_ -') + ZeroOrMore(Word(printables))))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 2 + oneOf('lon lng', caseless=True) + Optional(Word(nums)) + Optional(oneOf('_ -') + ZeroOrMore(Word(printables))))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 3 + oneOf('lon lng', caseless=True) + Optional(Word(nums)) + Optional(oneOf('_ -') + ZeroOrMore(Word(printables))))
    fieldrulematch: ppr
    priority: 2
  postindexknown:
    key: postindex
    is_pii: true
    name: Post index code (ZIP code and e.t.c) by known name
    rule: postindex,postIndex,post_index,postcode,zip_code,zipcode,postalcode,post
      index,zip_code,postal_code,location_zip,address_zip
    match: text
    type: field
    priority: 1
  streetknown:
    key: street
    is_pii: true
    name: Street name by field name
    rule: street,street name,streetname,street_name
    match: text
    type: field
    priority: 1
  cityknown:
    key: city
    is_pii: true
    name: City/town name by field name
    rule: town,city,cityname,location (city),location_city,location_1_city,address_city,city_name
    # Numeric city ids (Kirkanta, HayPost) are not city names (#60).
    validator: metacrafterext.rules.common.generic.validate_place_name
    match: text
    type: field
    priority: 1
  countryknown:
    key: country
    name: Country name by field name
    rule: country,countryname,country_name
    match: text
    type: field
    # Names and codes have letters; an OpenAlex abstract_inverted_index.country holds the word
    # positions of "country" (226) (#69).
    validator: metacrafterext.rules.common.generic.has_letters
    priority: 1
  wbregionbyvalue:
    key: wbregion
    name: World Bank region
    rule: South Asia,Europe & Central Asia,Sub-Saharan Africa,Latin America & Caribbean,East
      Asia & Pacific,North America,Middle East & North Africa
    match: text
    type: data
    priority: 2
  glnfield:
    key: gln
    name: Global Location Number (GLN) by field name
    rule: gln,global_location_number,location_id,location_number,gln_code
    type: field
    match: text
    # location_id and location_number are ids of any list as often (1, 2, 3 in the IoT devices of
    # Ballarat): the values must be GLNs.
    validator: metacrafterext.rules.common.identifiers.validate_gln
    needs_values: true
    priority: 1
  glnvalue:
    key: gln
    name: Global Location Number (GLN) by value pattern
    match: ppr
    type: data
    rule: Word(nums, exact=13)
    maxlen: 13
    minlen: 13
    priority: 1
    validator: metacrafterext.rules.common.identifiers.validate_gln
    imprecise: 1
  unlocodefield:
    key: unlocode
    name: UN/LOCODE by field name
    rule: unlocode,un_locode,locode,un_location_code
    type: field
    match: text
    priority: 1
  unlocodevalue:
    key: unlocode
    name: UN/LOCODE by value pattern
    match: ppr
    type: data
    rule: Word('ABCDEFGHIJKLMNOPQRSTUVWXYZ', exact=2) + Word('0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ',
      exact=3)
    maxlen: 5
    minlen: 5
    priority: 1
    imprecise: 1
  addressaddressbyknown:
    key: address
    name: Address line 1 by field name
    match: text
    type: field
    rule: address1,address_line_1
    priority: 1
  addressline2byknown:
    key: address_line2
    name: Address line 2 by field name
    match: text
    type: field
    rule: address2,address_line_2
    priority: 1
  countrybylocalnamevalue:
    key: country
    name: Country name in a field named country in another language (pays, país, страна)
    # The values are in the language of the field name: French Belgique and Espagne, and France,
    # which the English country name list also has. The guarded rule outweighs that list (#69).
    match: func
    type: data
    rule: metacrafterext.rules.common.generic.validate_place_name
    minlen: 2
    maxlen: 60
    fieldrule: pays,pays_de_deces,pays_deces,pays de décès,pays_de_naissance,pays_naissance,pays de naissance,pays_residence,pays de résidence,nom_pays,nom du pays,país,pais,pais_desc,pais_descripcion,descripcion_pais,pais_nombre,pais_origen,país de origen,pais_nacimiento,país de nacimiento,paese,paese_nascita,nazione,kraj_urodzenia,państwo,страна,страна рождения,наименование страны,країна,ülke,valsts,šalis,ország,χώρα,國家,国家,국가,država,země
    fieldrulematch: text
    priority: 1
  countrygeobyknown:
    key: country
    name: Country by field name
    match: text
    type: field
    rule: country_code,countryId,countryid,address_country
    priority: 1
  streetaddressbyknown:
    key: street_address
    name: Street Address
    match: text
    type: field
    rule: street_address,street2,street1,addressstreet
    priority: 1
  latgeobyknown:
    key: latitude
    name: Latitude by field name
    match: text
    type: field
    rule: stop_lat,geo_lat
    priority: 1
  longeobyknown:
    key: longitude
    name: Longitude by field name
    match: text
    type: field
    rule: stop_lon
    priority: 1
  coordinategeobyknown:
    key: geopoint
    name: Coordinates by field name
    match: text
    type: field
    rule: coordinates
    # The numbers of a geometry in longitude and latitude (-180 to 180). Projected coordinates in
    # metres (570181.18, 6592327.82) are eastings and northings (#69).
    validator: metacrafterext.rules.common.generic.validate_lonlat_number
    priority: 1
  continentgeobyknown:
    key: continent
    name: Continent by field name
    match: text
    type: field
    rule: continent_name
    priority: 1
  eastingbyfield:
    key: easting
    name: Easting (projected x coordinate) by field name
    # UTM and national grids: Easting, UTM_Easting, UTMRechtswert, Rechtswert, X-UTM32N,
    # UTM32_X, coordx_origine, Souradnice Y (S-JTSK Y grows westwards, like an easting),
    # BNG_E of ONS boundary attributes.
    rule: (?i)(?:utm[ _.-]?\d{0,2}[ns]?[ _.-]?)?(?:easting|rechtswert)|x[ _.-]?utm[ _.-]?\d{0,2}[ns]?|utm[ _.-]?\d{0,2}[ns]?[ _.-]?x|coordx(?:[ _.-]\w+)?|sou[rř]adnice[ _.-]?y|bng[ _.-]?e(?:asting)?
    type: field
    match: regex
    priority: 1
  northingbyfield:
    key: northing
    name: Northing (projected y coordinate) by field name
    rule: (?i)(?:utm[ _.-]?\d{0,2}[ns]?[ _.-]?)?(?:northing|hochwert)|y[ _.-]?utm[ _.-]?\d{0,2}[ns]?|utm[ _.-]?\d{0,2}[ns]?[ _.-]?y|coordy(?:[ _.-]\w+)?|sou[rř]adnice[ _.-]?x|bng[ _.-]?n(?:orthing)?
    type: field
    match: regex
    priority: 1
  postindexbyfield:
    key: postindex
    is_pii: true
    name: Postal code by field name (post code, postal-code, zip code with qualifiers)
    # Supplier Post Code, postal-code (JSON-LD), station zip code, mailing_postcode.
    rule: (?i)(?:[a-z]+[ _.-]){0,3}(?:post(?:al)?[ _.-]?code|zip[ _.-]?code|postcode)
    type: field
    match: regex
    priority: 1
  streetaddressbyfield:
    key: street_address
    is_pii: true
    name: Street address line by field name
    # 5. STREET ADDRESS, company_address_1, address_line_2, registered_address.
    # Lines 3 and 4 hold the town, county and country (company_address_4: DUBLIN 13).
    rule: (?i)(?:\d+\.\s*)?street[ _.-]?address(?:[ _.-]?[12])?|address[ _.-]?(?:line[ _.-]?)?[12]|(?:company|business|mailing|registered|postal)[ _.-]?address(?:[ _.-]?[12])?
    type: field
    match: regex
    priority: 1
  gadmgidvalue:
    key: gadm_gid
    name: GADM area id (VNM.25.13_1)
    rule: '[A-Z]{3}(?:\.\d+)+_\d+'
    type: data
    match: regex
    minlen: 7
    maxlen: 40
    priority: 1
  hdxpcodevalue:
    key: hdx_pcode
    name: OCHA place code (GE11, SLE03040102) by field name and value
    # Older common operational datasets prefix the alpha-3 code of the country (SLE03040102 in
    # Adm4_Code of the Sierra Leone schools on openAFRICA), newer ones the alpha-2 code (SL0101).
    rule: '[A-Z]{2,3}\d{1,12}'
    type: data
    match: regex
    minlen: 3
    maxlen: 14
    fieldrule: adm1_pcode,adm2_pcode,adm3_pcode,adm4_pcode,adm5_pcode,admin1pcode,admin2pcode,admin3pcode,admin4pcode,admin1_pcode,admin2_pcode,admin3_pcode,admin4_pcode,adm1_code,adm2_code,adm3_code,adm4_code,adm5_code,adm1code,adm2code,adm3code,adm4code,pcode,p_code,p-code
    fieldrulematch: text
    priority: 1
  adminarea3byfield:
    key: admin_area_3
    name: Third-level administrative division (kecamatan, tambon) by field name
    rule: kecamatan,nama_kecamatan,nm_kecamatan,kecamatan_nama,nama kecamatan,tambon,tambon_name,ตำบล,ตำบล/แขวง,แขวง/ตำบล,thathmblnm
    type: field
    match: text
    validator: metacrafterext.rules.common.generic.validate_place_name
    priority: 1
  wkbbyvalue:
    key: wkb
    name: Well-known binary (WKB, EWKB) geometry as bytes or hexadecimal
    rule: metacrafterext.rules.common.formats.validate_wkb
    type: data
    match: func
    minlen: 18
    maxlen: 100000
    priority: 1
  gmlposlistbyfield:
    key: gml_poslist
    name: GML coordinates (gml:pos, gml:posList) by element name
    rule: (?i)(?:.*[.:])?pos(?:list)?
    type: field
    match: regex
    validator: metacrafterext.rules.common.formats.validate_gml_poslist
    priority: 1
  # Coordinates read as numbers (JSON floats, CSV decimals): value rules do not run on float
  # columns, so short names (lat, lon, lng; geo_point_2d.lat, coordonnees.lon of Opendatasoft
  # JSON exports) are field-name rules whose values must be decimal degrees in range.
  latitudebyshortname:
    key: latitude
    name: Latitude by short field name (lat, geo_point_2d.lat, lat_wgs84)
    # featureLatitude, transectLatitude, decimalLatitude of survey data; latdecimal (TERN).
    # point_y of ArcGIS exports, y latitude, stop_location_latitiude (sic) of the RTA stop lists.
    rule: (?i)(?:(?:gps|geo|y|wgs84|point|stop|start|end|centroid|center|centre|feature|transect|decimal|sample|station)[ _-]?)?lat(?:itude)?(?:[ _-]?(?:wgs84|wgs|dd|deg|gps|y|dec|decimal|4326))?|point[ _-]?y|(?:[a-z]+[ _-]){0,3}latitiude
    type: field
    match: regex
    validator: metacrafterext.rules.common.generic.validate_latitude_value
    needs_values: true
    priority: 1
  longitudebyshortname:
    key: longitude
    name: Longitude by short field name (lon, lng, geo_point_2d.lon, lon_wgs84)
    # long is also a length (longueur): it is left out.
    # point_x of ArcGIS exports, x longitude, stop_location_longitiude (sic) of the RTA stop lists.
    rule: (?i)(?:(?:gps|geo|x|wgs84|point|stop|start|end|centroid|center|centre|feature|transect|decimal|sample|station)[ _-]?)?(?:lon|lng|longitude)(?:[ _-]?(?:wgs84|wgs|dd|deg|gps|x|dec|decimal|4326))?|long[ _-]?decimal|point[ _-]?x|(?:[a-z]+[ _-]){0,3}longitiude
    type: field
    match: regex
    validator: metacrafterext.rules.common.generic.validate_longitude_value
    needs_values: true
    priority: 1
  geojsongeometrytypebyname:
    key: geojson_geometry_type
    name: GeoJSON geometry type by field name and values (geometry.type, geo_shape.geometry.type)
    # Any field named type whose values are geometry types: Feature, the type of a feature, is not.
    rule: (?i)type|geometry[ _-]?type|geom[ _-]?type|shape[ _-]?type|geotype|type[ _-]?geom(?:etry)?|shape
    type: field
    match: regex
    validator: metacrafterext.rules.common.generic.validate_geojson_geometry_type
    needs_values: true
    priority: 1
  geopoint2dbyname:
    key: geo_point_2d
    name: Opendatasoft geo_point_2d by field name, as latitude and longitude text
    # Other point fields of Opendatasoft (coordonnees, geolocalisation) share the name of
    # geopoint fields of other sources: only the platform's own name.
    rule: geo_point_2d
    type: field
    match: text
    validator: metacrafterext.rules.common.generic.validate_latlon_pair
    needs_values: true
    priority: 1
  geopointtextbyname:
    key: geopoint
    name: Point as latitude and longitude text by field name (Coordinates, coords, latlng, الإحداثيات)
    # The UAE statistics give each emirate its position as text (24.4539° N, 54.3773° E;
    # 25°17'29.7"N 55°30'01.6"E; 25.276987,55.296249).
    rule: (?i)coordinates?|coords?|geo[ _-]?coordinates|location[ _-]?coordinates|lat[ _-]?(?:lon|long|lng)|latlng|latlong|الإحداثيات|الاحداثيات|إحداثيات|احداثيات
    type: field
    match: regex
    validator: metacrafterext.rules.common.generic.validate_geopoint_text
    needs_values: true
    priority: 1
  geopointpointbyname:
    key: geopoint
    name: Point as latitude and longitude text by field name (point, location_point) as Opendatasoft exports a geo_point field
    # The City of Ballarat Data Exchange names the geo_point field of 29 of its 95 tables point
    # (-37.557678, 143.821693); the values must be pairs of degrees.
    rule: (?i)point|location[ _-]?point|point[ _-]?location
    type: field
    match: regex
    validator: metacrafterext.rules.common.generic.validate_latlon_pair
    needs_values: true
    priority: 1
  geopointsocratalocationbyname:
    key: geopoint
    name: Socrata location column as latitude and longitude text by field name (Location, Location 1, Location_1, GPS, Long/Lat)
    # Socrata exports a location column to CSV as (-35.318906, 149.132104), named Location,
    # Location 1 or after the source column; POINT (149.13 -35.31) in the same columns is WKT.
    rule: (?i)(?:[a-z]+[ _])?location(?:[ _]?\d)?|gps(?:[ _]?(?:location|coordinates|point))?|long?[ _/]?lat|lat[ _/]?long?
    type: field
    match: regex
    validator: metacrafterext.rules.common.generic.validate_latlon_pair
    needs_values: true
    priority: 1
  compasspointbyname:
    key: compass_point
    name: Compass point (16-wind) by field name (aspect, slopeAspect_direction, wind_direction, wind_direction_cardinal)
    rule: (?i)(?:slope_?|site_?)?aspect(?:_?(?:direction|orientation|text|compass))?|(?:hi_?|lo_?|max_?|min_?|gust_?)?wind_?dir(?:ection)?(?:_?(?:text|compass|cardinal|point|name))?|(?:hi|lo|max|gust)_?dir|direction|orientation|s[ _]?direction|sign[ _]?direction|(?:city[ _]?)?quadrant
    type: field
    match: regex
    validator: metacrafterext.rules.common.fieldwork.validate_compass_point
    needs_values: true
    priority: 1
  utmzonebyname:
    key: utm_zone
    name: UTM zone by field name (utm_zone, mga_zone)
    rule: (?i)(?:utm|mga|grid)_?zone(?:_?(?:number|no|num|id))?|zone_?(?:utm|mga)
    type: field
    match: regex
    validator: metacrafterext.rules.common.fieldwork.validate_utm_zone
    needs_values: true
    priority: 1
  utmzonewithbandbyname:
    key: utm_zone
    name: UTM zone with its latitude band (50 J) in a field named zone
    # Zones of fares, planning and time are numbers too: only with the band letter.
    rule: zone
    type: field
    match: text
    validator: metacrafterext.rules.common.fieldwork.validate_utm_zone_with_band
    needs_values: true
    priority: 1
  geodeticdatumbyname:
    key: geodetic_datum
    name: Geodetic datum by field name (datum, geodeticDatum)
    # GEODATUM of the Austrian BEV control point files (MGI, ETRS89/AUSTRIA 2002).
    rule: (?i)(?:dwc:)?(?:geodetic_?|geo_?|horizontal_?|map_?|gps_?|coordinate_?)?datum(?:_?name)?
    type: field
    match: regex
    validator: metacrafterext.rules.common.fieldwork.validate_geodetic_datum
    needs_values: true
    priority: 1
  geodeticdatumvalue:
    key: geodetic_datum
    name: Geodetic datum (WGS 84, GDA94, GDA2020, NAD83) by value
    rule: metacrafterext.rules.common.fieldwork.validate_geodetic_datum
    type: data
    match: func
    minlen: 4
    maxlen: 24
    priority: 1
  elevationbyname:
    key: elevation
    name: Elevation above sea level in metres by field name (elevation, elevation_metres, altitude)
    # elev_start and elev_end give the source and mouth of a river (river network of ArmSIS).
    rule: (?i)(?:site_?|ground_?|surface_?|plot_?|station_?)?(?:elevation|altitude|elev)(?:[ _](?:start|end|min|max|mean))?(?:[ _]?(?:m|metres?|meters?|masl|amsl|asl|\[metre\]|\(m\)))?|height_?above_?sea_?level
    type: field
    match: regex
    validator: metacrafterext.rules.common.fieldwork.validate_elevation_value
    needs_values: true
    priority: 1
  elevationspanishbyname:
    key: elevation
    name: Elevation above sea level in metres by Spanish field name (altitud, ALTITUD, altitud_msnm, cota, COTA_COR, msnm)
    # The dam inventory of the Bolivian Ministry of Environment and Water gives the altitude of the
    # site and the elevation of the crest (cota de corona); cota alone is any elevation of a survey.
    rule: (?i)(?:altitud|cota)(?:[ _-]?(?:cor(?:ona)?|terreno|media|min|max|msnm|m|snm))?(?:[ _-]?(?:msnm|m|snm))?|msnm|alt[ _-]?msnm
    type: field
    match: regex
    validator: metacrafterext.rules.common.fieldwork.validate_elevation_value
    needs_values: true
    priority: 1
  elevationbygermanname:
    key: elevation
    name: Elevation by German field name (Seehöhe, HOEHE_BODEN, Höhe über Adria)
    # HOEHE_BODEN of the BEV geographic names; Höhe alone has its own rule below.
    rule: (?i)(?:see|meeres|gel(?:ae|ä)nde|boden)h(?:oe|ö)he(?:[ _]?m)?|h(?:oe|ö)he[ _-]?(?:boden|gel(?:ae|ä)nde|(?:(?:ue|ü)ber[ _-]?)?(?:adria|nn|nhn|meer)|m[ _-]?(?:ue|ü)[ _-]?(?:a|nn|m)|(?:ue|ü)[ _-]?(?:a|nn))
    type: field
    match: regex
    validator: metacrafterext.rules.common.fieldwork.validate_elevation_value
    needs_values: true
    priority: 1
  elevationbyhoehe:
    key: elevation
    name: Surveyed height in a field named Höhe (HOEHE of the BEV control points)
    # Höhe is also the height of a tree or a building: only heights given to the centimetre
    # (508.26, 211.153). The ETRS89 files of BEV give ellipsoidal heights in HOEHE.
    rule: (?i)h(?:oe|ö)he
    type: field
    match: regex
    validator: metacrafterext.rules.common.fieldwork.validate_survey_height
    needs_values: true
    priority: 1
  latitudebygermanname:
    key: latitude
    name: Latitude by German field name (Breite, geogr. Breite, Breitengrad)
    # Breite is also a width: only decimal degrees with at least four decimals.
    rule: (?i)(?:geo(?:gr(?:aphische)?)?[ _.-]*)?breite(?:[ _-]?(?:wgs84|etrs89|grad|dez|dd|deg))?|breitengrad
    type: field
    match: regex
    validator: metacrafterext.rules.common.fieldwork.validate_latitude_degrees
    needs_values: true
    priority: 1
  longitudebygermanname:
    key: longitude
    name: Longitude by German field name (Länge, LAENGE, geogr. Länge, Längengrad)
    # Länge is also a length: only decimal degrees with at least four decimals.
    rule: (?i)(?:geo(?:gr(?:aphische)?)?[ _.-]*)?l(?:ae|ä)nge(?:[ _-]?(?:wgs84|etrs89|grad|dez|dd|deg))?|l(?:ae|ä)ngengrad
    type: field
    match: regex
    validator: metacrafterext.rules.common.fieldwork.validate_longitude_degrees
    needs_values: true
    priority: 1
  eastingbyshortname:
    key: easting
    name: Easting by the short German name RW (Rechtswert)
    # RW and HW of the BEV ETRS89 files are UTM coordinates (590583.09, 5345596.28).
    rule: rw,rw_utm,rw_gk,y_rw
    type: field
    match: text
    validator: metacrafterext.rules.common.fieldwork.validate_projected_coordinate
    needs_values: true
    priority: 1
  northingbyshortname:
    key: northing
    name: Northing by the short German name HW (Hochwert)
    rule: hw,hw_utm,hw_gk,x_hw
    type: field
    match: text
    validator: metacrafterext.rules.common.fieldwork.validate_projected_coordinate
    needs_values: true
    priority: 1
  # The GeoNode layers of SIARH and UMSA (Bolivia; metacrafter-testdata) give UTM positions in fields
  # named in Spanish: ESTE, NORTE, UTM_ESTE, UTM_NORTE, UTM_NOR, Coord_X, Coord_Y.
  eastingspanishbyname:
    key: easting
    name: Easting by Spanish field name (este, ESTE, utm_este, coord_este, coordenada_este, x_este) with projected coordinates in metres
    # Este is also the east of a boundary description: only numbers of a projected coordinate.
    rule: (?i)(?:(?:utm|coord(?:enada)?s?|x|coord[ _-]?x)[ _-]?)?este(?:[ _-]?(?:utm|m|x))?|coord[ _-]?x
    type: field
    match: regex
    validator: metacrafterext.rules.common.fieldwork.validate_projected_coordinate
    needs_values: true
    priority: 1
  northingspanishbyname:
    key: northing
    name: Northing by Spanish field name (norte, NORTE, utm_norte, UTM_NOR, coord_norte, coordenada_norte, y_norte) with projected coordinates in metres
    rule: (?i)(?:(?:utm|coord(?:enada)?s?|y|coord[ _-]?y)[ _-]?)?norte(?:[ _-]?(?:utm|m|y))?|utm[ _-]?nor|coord[ _-]?y
    type: field
    match: regex
    validator: metacrafterext.rules.common.fieldwork.validate_projected_coordinate
    needs_values: true
    priority: 1
  utmzonespanishbyname:
    key: utm_zone
    name: UTM zone by Spanish field name (zona_utm, Zona_UTM, utm_zona, huso, huso_utm) with 19, 20K
    rule: (?i)zona[ _-]?utm|utm[ _-]?zona|huso(?:[ _-]?utm)?
    type: field
    match: regex
    validator: metacrafterext.rules.common.fieldwork.validate_utm_zone
    needs_values: true
    priority: 1
  longitudedmsbyname:
    key: longitude
    name: Longitude in degrees, minutes and seconds by field name (LONG, long, long_dms, longitud_gms) with E or W
    # long is also a length: only positions with the degree sign and the hemisphere. The decimal rules
    # take lon, longitud and longitude, whose validators read degrees, minutes and seconds too; a
    # universal rule on those names would hide the Spanish longitud rule of rules/es.
    rule: (?i)long(?:[ _-]?(?:dms|gms|sexagesimal))?|(?:lon|longitud|longitude)[ _-]?(?:dms|gms|sexagesimal)
    type: field
    match: regex
    validator: metacrafterext.rules.common.generic.validate_longitude_dms
    needs_values: true
    priority: 1
  pfafstettercodebyname:
    key: pfafstetter_code
    name: Pfafstetter basin code by field name (pfafstetter, pfaf_id, cod_pfaf, COD_UH, codigo_uh, COD_SBC_N5, cod_cuenca_pfaf)
    # Unidades hidrográficas of the Bolivian Ministry of Environment and Water (8589929), HydroBASINS
    # PFAF_ID (6110), ANA ottobacias (cobacia).
    rule: (?i)(?:cod(?:igo)?[ _-]?)?(?:pfaf(?:stetter)?|otto(?:bacia|codigo)?)(?:[ _-]?(?:id|cod(?:igo)?|code|\d{1,2}))?|cod(?:igo)?[ _-]?(?:uh|uhg|sbc|cuenca[ _-]?pfaf(?:stetter)?)(?:[ _-]?n(?:ivel)?[ _-]?\d{1,2})?|cobacia
    type: field
    match: regex
    validator: metacrafterext.rules.common.hydrology.validate_pfafstetter_code
    needs_values: true
    priority: 1
  pfafstetterlevelbyname:
    key: pfafstetter_code
    name: Pfafstetter basin code by the field name of its level (NIVEL_5, NIVEL3, nivel5_pfafstetter, uh_nivel_4) with codes of three or more digits
    # NIVEL_5 of the SIARH dams writes the code with the name (85899 - Rio Guadalquivir).
    rule: (?i)(?:uh[ _-]?)?nivel[ _-]?\d{1,2}(?:[ _-]?pfaf(?:stetter)?)?
    type: field
    match: regex
    validator: metacrafterext.rules.common.hydrology.validate_pfafstetter_code_long
    needs_values: true
    priority: 1
  geocentriccoordinatebyname:
    key: geocentric_coordinate
    name: Geocentric Cartesian coordinate (ECEF X, Y, Z) by field name
    # X, Y and Z alone are also projected or local coordinates: only names that say geocentric.
    rule: (?i)(?:ecef|geocentric|geoz(?:entrisch)?|xyz)[ _-]?[xyz]|[xyz][ _-]?(?:ecef|geocentric|geoz)
    type: field
    match: regex
    validator: metacrafterext.rules.common.fieldwork.validate_geocentric_coordinate
    needs_values: true
    priority: 1
  epsgcodevalue:
    key: epsg_code
    name: EPSG code with its authority (EPSG:25832, urn:ogc:def:crs:EPSG::4326) by value
    rule: (?:EPSG:|urn:ogc:def:crs:EPSG::|https?://www\.opengis\.net/def/crs/EPSG/0/)[1-9]\d{3,4}
    type: data
    match: regex
    minlen: 9
    maxlen: 50
    priority: 1
  epsgcodebyname:
    key: epsg_code
    name: EPSG code by field name (EPSG, EPSG_XYZ, epsg_origine, srid), bare number or with its authority
    rule: (?i)(?:[a-z]+[ _-])?epsg(?:[ _-]?[a-z0-9]+)?|srid|crs[ _-]?(?:code|epsg)
    type: field
    match: regex
    validator: metacrafterext.rules.common.fieldwork.validate_epsg_code
    needs_values: true
    priority: 1
  epsgcodebycrs:
    key: epsg_code
    name: 'EPSG code with its authority in a field named crs (WGS 84 EPSG: 4326, EPSG:25832)'
    # A bare crs may hold a system name (WGS 84) or another number, so only codes that name the
    # authority count, alone or after the name of the system (soil profile database of ArmSIS).
    rule: (?i)crs|coordinate[ _]reference[ _]system|srs|srs[ _]?name
    type: field
    match: regex
    validator: metacrafterext.rules.common.fieldwork.validate_epsg_code_with_authority
    needs_values: true
    priority: 1
  gmlidvalue:
    key: gml_id
    name: GML feature id of a WFS export (Soil_map0.1, states.12) by field name (FID, gml_id)
    # GeoServer names features after the feature type and a number; WFS CSV exports keep the id in
    # a FID column, ogr2ogr in gml_id. Integer FIDs of shapefiles are objectid.
    rule: '[A-Za-z_][A-Za-z0-9_-]*\.[1-9]\d{0,9}'
    type: data
    match: regex
    minlen: 3
    maxlen: 120
    fieldrule: fid,gml_id,gml:id,feature_id,featureid,@gml:id
    fieldrulematch: text
    priority: 1
  wktvalue:
    key: wkt
    name: Geometry in well-known text (POINT (15.41 47.93), MULTIPOLYGON (((...)))) by value
    rule: metacrafterext.rules.common.formats.validate_wkt
    type: data
    match: func
    minlen: 10
    maxlen: 100000
    priority: 1
  # Google Maps place ids of establishments, cities and regions: ChIJ and 23 URL-safe base64
  # characters (the place_id of the COVID-19 Community Mobility Reports).
  googleplaceidvalue:
    key: google_place_id
    name: Google Maps place ID (ChIJ...) by value
    rule: ChIJ[A-Za-z0-9_-]{23}
    type: data
    match: regex
    minlen: 27
    maxlen: 27
    priority: 1
  # Lat and Long of the COVID-19 time series of Johns Hopkins University (Long_ in the daily
  # reports). Long is a length too: only decimal degrees with three or more decimals are taken.
  longitudebylongname:
    key: longitude
    name: Longitude in a field named Long, Long_ or x_long (JHU CSSE COVID-19 data, Buenos Aires open data)
    rule: long,long_,x_long,long_x
    type: field
    match: text
    validator: metacrafterext.rules.common.statcodes.validate_longitude_long_name
    needs_values: true
    priority: 1
  suburbbyname:
    key: location
    name: Suburb by field name (Suburb, SUBURB, suburb_name, Street Suburb) with place names
    # Suburbs are the localities of addresses in Australia, New Zealand and South Africa. Without a
    # scan country a suburb is a location, and this universal match covers the Australian
    # au_suburb rule (a South African SUBURB is no au_suburb).
    rule: (?i)(?:[a-z]+[ _/])*suburbs?(?:[ _/]?(?:name|locality|location))?
    type: field
    match: regex
    validator: metacrafterext.rules.common.generic.validate_place_name
    needs_values: true
    priority: 1
  towncitybyname:
    key: city
    name: Town or city by field name (TOWN/CITY, Town/City, Suburb/Town, City/Town) with place names
    rule: (?i)(?:[a-z]+[ _/])*(?:town[ _/]?city|city[ _/]?town|suburb[ _/]?town)
    type: field
    match: regex
    validator: metacrafterext.rules.common.generic.validate_place_name
    needs_values: true
    priority: 1
  # Found in the open data of the City of Buenos Aires (data.buenosaires.gob.ar, a 2024 snapshot;
  # metacrafter-testdata).
  pluscodevalue:
    key: plus_code
    name: Plus Code (Open Location Code) by value (8FVC9G8F+6W, 48Q3CJ00+)
    rule: metacrafterext.rules.common.urban.validate_plus_code
    type: data
    match: func
    minlen: 9
    maxlen: 16
    priority: 1
  streetintersectionbyname:
    key: street_intersection
    name: Street intersection by field name (cruce, interseccion, esquina, ubicacion, intersection, cross_streets) with two street names
    # DEHEZA@PINTO, CORDOBA AV. & JUNIN, Av. San Juan y Chacabuco, Main St & 2nd Ave. A ubicacion of
    # traffic lights or cameras is a list of corners (GRIVEO Y SAN MARTIN AV.).
    rule: (?i)(?:[a-z]+[ _])?(?:cruces?|intersecci(?:[oó]n)?(?:es)?|esquinas?|intersections?|cross[ _]?streets?|crossings?)(?:[ _](?:calles|normalizada|nombre|name))?|ubicaci[oó]n
    type: field
    match: regex
    validator: metacrafterext.rules.common.urban.validate_street_intersection
    needs_values: true
    priority: 1

  # ------------------------------------------------------------ Camden Council (data.camden.nsw.gov.au)
  geopointgeolocationbyname:
    key: geopoint
    name: Point as latitude and longitude text by the Opendatasoft field names geolocation, geo_location, geoloc
    # Opendatasoft geo_point fields other than geo_point_2d keep the name of the source column:
    # geolocation (-34.0140068793519, 150.756087881438) of the Camden solar, water quality, nest box
    # and algae alert files.
    rule: (?i)geo[ _-]?location|geo[ _-]?loc|geolocali[sz]ation|geo[ _-]?position
    type: field
    match: regex
    validator: metacrafterext.rules.common.generic.validate_latlon_pair
    needs_values: true
    priority: 1
  # ------------------------------------------------------------ Belgian round (ARES, BEP, Liège, Digital Wallonia)
  geopointfrenchbyname:
    key: geopoint
    name: Point as latitude and longitude text by French and Opendatasoft field names (point_geographique, geo_impl, position, station_geoposition)
    # The ARES lists of establishments and sites name the geo_point point_geographique and geo_impl,
    # the BEP directories position, the Liège birdhouses gelocalisation, the Cambio stations
    # station_geoposition (50.62443525, 5.56565707); position of an address base is bâtiment or entrée.
    rule: (?i)point[ _]g[ée]ographique|geo[ _]?impl(?:antation)?|ge?o?localisation|(?:[a-z]+[ _])?geo[ _-]?position|position|jsondatas[ _]location[ _]value[ _]coordinates
    type: field
    match: regex
    validator: metacrafterext.rules.common.generic.validate_latlon_pair
    needs_values: true
    priority: 1
  cardinaldirectionbyname:
    key: cardinal_direction
    name: Direction in words by field name (aspect, aspect_of_installation, direction, orientation, facing) with North, Northeast, Northbound
    # The 16-wind abbreviations (N, NNE, SW) of the same fields are compass_point.
    rule: (?i)(?:[a-z]+[ _]){0,2}(?:aspect|direction|orientation|facing|heading)(?:[ _](?:of[ _][a-z]+|text|name))?
    type: field
    match: regex
    validator: metacrafterext.rules.common.fieldwork.validate_cardinal_direction
    needs_values: true
    priority: 1
  eastingbyxcoordname:
    key: easting
    name: Easting by field name (xcord, x_coord, xcoordinate) with projected coordinates in metres
    # xcord and ycord of the Camden heritage items are MGA zone 56 coordinates (287536, 6229307); an x
    # field of longitudes (150.69) fails the check of a projected coordinate.
    rule: (?i)x[ _-]?(?:cord|coord|coordinate)s?(?:[ _-]?(?:mga|utm|mga56|mga55|gda94|gda2020|m))?
    type: field
    match: regex
    validator: metacrafterext.rules.common.fieldwork.validate_projected_coordinate
    needs_values: true
    priority: 1
  northingbyycoordname:
    key: northing
    name: Northing by field name (ycord, y_coord, ycoordinate) with projected coordinates in metres
    rule: (?i)y[ _-]?(?:cord|coord|coordinate)s?(?:[ _-]?(?:mga|utm|mga56|mga55|gda94|gda2020|m))?
    type: field
    match: regex
    validator: metacrafterext.rules.common.fieldwork.validate_projected_coordinate
    needs_values: true
    priority: 1
  # Found in the school directories of Mendoza (ámbito: Urbano, Urbano marginal, Rural;
  # datosabiertos.mendoza.gov.ar; metacrafter-testdata).
  urbanruralbyname:
    key: urban_rural_class
    name: Urban or rural class by field name (ambito, ámbito, urban_rural, UrbanRural (name), station setting name)
    rule: '(?i)[aá]mbito(?:[ _](?:urbano[ _]rural|geogr[aá]fico|escuela|establecimiento))?|urban[ _/-]?rural(?:[ _]\(?(?:name|desc(?:ription)?|class(?:ification)?)\)?)?|rural[ _/-]?urban(?:[ _]class(?:ification)?)?|(?:station[ _])?setting[ _]name|gebietstyp|zone[ _](?:urbaine|rurale)'
    type: field
    match: regex
    validator: metacrafterext.rules.common.urban.validate_urban_rural_class
    needs_values: true
    priority: 1
  urbanruralvalue:
    key: urban_rural_class
    name: Urban or rural class by value (Urbano, Rural, Urbano marginal, städtisches Gebiet, Rural town and fringe)
    rule: metacrafterext.rules.common.urban.validate_urban_rural_class
    type: data
    match: func
    minlen: 5
    maxlen: 80
    priority: 1
  geopointcoordinatesbyname:
    key: geopoint
    name: Point as latitude and longitude text by field name (co_ordinates, coordinatelocation, latlong_text, geo, centroid) as Opendatasoft exports a geo_point field
    # The City of Melbourne, Liverpool City Council and Peclet name the geo_point fields of their
    # tables after the content (Co-ordinates, CoordinateLocation, Geo); the values must be pairs of degrees.
    rule: (?i)co[ _-]?ordinates?|coordinate[ _]?location|lat[ _]?long?[ _]?text|geo|centroid|geometry|geo[ _]?point
    type: field
    match: regex
    validator: metacrafterext.rules.common.generic.validate_latlon_pair
    needs_values: true
    priority: 1
  streetbyname:
    key: street
    is_pii: true
    name: Street name by field name (str_name, street_nam, StreetFrom, between_street_1, onstreet, road_name, fromstreet)
    rule: (?i)(?:on|from|to|between)[ _]?street(?:[ _]?\d)?|street[ _]?(?:from|to|fro|nam)|str[ _]name|(?:road|rd)[ _]?name|(?:from|to)[ _]?road[ _]?name
    type: field
    match: regex
    validator: metacrafterext.rules.common.generic.validate_name_text
    needs_values: true
    priority: 1
  addressbyplacename:
    key: address
    is_pii: true
    name: Address by field name of the place it locates (building_address, venue_address, development_address, address_point, address_pnt)
    rule: (?i)(?:building|venue|development|site|property|premises|facility|station|business|street)[ _]?address|address[ _]?p(?:oi)?n?t
    type: field
    match: regex
    validator: metacrafterext.rules.common.generic.has_letters
    needs_values: true
    priority: 1
