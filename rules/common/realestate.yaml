name: realestate
description: Real estate and property identifiers
context: realestate
lang: common
country_code: xx
rules:
  propertyidfield:
    key: propertyid
    name: Property ID by field name
    rule: property_id,propertyid,property_number,parcel_id,parcel_number,lot_number,lot_id
    type: field
    priority: 3
    match: text
  propertynumberbyname:
    key: propertyid
    name: Property number by field name (propnum, property_number, prop_no, property_ref) with ids
    # Councils number the rateable properties of their register (City of Ballarat: propnum 2006864 in the
    # waste collection days, property_number 2030025 in the neighbourhood character study). The text
    # rule above has priority 3, too weak to report.
    rule: (?i)prop(?:erty)?[ _-]?(?:num(?:ber)?|no|nbr|ref(?:erence)?)|propnum
    type: field
    match: regex
    validator: metacrafterext.rules.common.urban.validate_property_number
    needs_values: true
    priority: 1
  propertyidvalue:
    key: propertyid
    name: Property ID by pattern
    match: ppr
    type: data
    rule: Word(alphanums, min=4, max=20)
    maxlen: 20
    minlen: 4
    fieldrule: property_id,propertyid,property_number,parcel_id,parcel_number,lot_number,lot_id
    fieldrulematch: text
    imprecise: 1
    priority: 3
  cadastralnumberfield:
    key: cadastralnumber
    name: Cadastral number by field name
    rule: cadastral_number,cadastral_no,cadastral_id,cadastre_number,parcel_cadastral
    type: field
    priority: 3
    match: text
  cadastralnumbervalue:
    key: cadastralnumber
    name: Cadastral number by pattern
    match: ppr
    type: data
    rule: Word(alphanums, min=6, max=25)
    maxlen: 25
    minlen: 6
    fieldrule: cadastral_number,cadastral_no,cadastral_id,cadastre_number,parcel_cadastral
    fieldrulematch: text
    imprecise: 1
    priority: 3
  parcelnumberfield:
    key: parcelnumber
    name: Parcel number by field name
    rule: parcel_number,parcel_no,parcel_id,lot_parcel,apn,assessor_parcel_number
    type: field
    priority: 3
    match: text
  parcelnumbervalue:
    key: parcelnumber
    name: Parcel number by pattern
    match: ppr
    type: data
    rule: Word(alphanums, min=5, max=20)
    maxlen: 20
    minlen: 5
    fieldrule: parcel_number,parcel_no,parcel_id,lot_parcel,apn,assessor_parcel_number
    fieldrulematch: text
    imprecise: 1
    priority: 3
  buildingnumberfield:
    key: buildingnumber
    name: Building number by field name
    rule: building_number,building_no,building_id,structure_number
    type: field
    priority: 1
    match: text
  buildingnumbervalue:
    key: buildingnumber
    name: Building number by pattern
    match: ppr
    type: data
    rule: Word(alphanums, min=3, max=15)
    maxlen: 15
    minlen: 3
    fieldrule: building_number,building_no,building_id,structure_number
    fieldrulematch: text
    imprecise: 1
    priority: 3
  # Found in seven more segments of the WDC Web Tables Corpus 2015 (tables of HTML pages of the Common Crawl of July
  # 2015; 5 778 000 relational tables of 2 963 718 pages on 109 005 hosts): property types of house price tables,
  # estate agents and rental listings; metacrafter-testdata.
  dwellingtypebyname:
    key: dwelling_type
    name: 'Type of dwelling by field name (Property Type, Dwelling Type, Home Type, Type of Property, Boligtype) with Detached, Condo, Townhouse'
    rule: '(?i)(?:property|dwelling|home|house|housing|residence|residential|building|unit|structure)[ _]?(?:types?|styles?|kinds?|categor(?:y|ies)|class(?:es)?)|type[ _]of[ _](?:property|dwelling|home|house|housing|residence|building)|property|dwelling|boligtype|bostadstyp|wohnungstyp|haustyp|geb[aä]udeart|objektart|woningtype|type[ _]de[ _](?:bien|logement)|tipo[ _]de[ _](?:vivienda|inmueble|propiedad|im[oó]vel)'
    type: field
    match: regex
    validator: metacrafterext.rules.common.webtables.validate_dwelling_type
    needs_values: true
    priority: 1
  dwellingtypevalue:
    key: dwelling_type
    name: 'Type of dwelling by value (Semi-detached, Terraced, Flat/Maisonette, Townhouse, Single Family, Mobile Home)'
    rule: metacrafterext.rules.common.webtables.validate_dwelling_type_value
    type: data
    match: func
    minlen: 4
    maxlen: 40
    priority: 1
