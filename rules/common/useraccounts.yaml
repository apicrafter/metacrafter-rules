name: useraccounts
description: User accounts in products and services
context: useraccounts
lang: common
country_code: xx
rules:
  useridfield:
    key: userid
    name: User ID by field name
    rule: user_id,userid,user_identifier,account_id,account_identifier
    type: field
    priority: 3
    match: text
  useridvalue:
    key: userid
    name: User ID by pattern
    match: ppr
    type: data
    rule: Word(alphanums, min=4, max=64)
    maxlen: 64
    minlen: 4
    imprecise: 1
  usernamefield:
    key: username
    name: Username by field name
    rule: username,user_name,login_name,user_login
    type: field
    priority: 1
    match: text
  usernamevalue:
    key: username
    name: Username by pattern
    match: ppr
    type: data
    rule: Word(alphanums + '._-', min=3, max=32)
    maxlen: 32
    minlen: 3
    fieldrule: username,user_name,login_name,user_login,account_name
    fieldrulematch: text
    imprecise: 1
    priority: 3
  userhandlefield:
    key: userhandle
    name: User handle by field name
    rule: user_handle,handle,social_handle,twitter_handle,instagram_handle
    type: field
    priority: 1
    match: text
  userhandlevalue:
    key: userhandle
    name: User handle by pattern
    match: ppr
    type: data
    rule: Literal('@') + Word(alphanums + '_', min=1, max=15)
    maxlen: 16
    minlen: 2
    # A twitter or instagram field holds @handles (City of Melbourne support services) or profile URLs
    # (Liverpool business directory): by these names only the values with @ count.
    fieldrule: user_handle,handle,social_handle,twitter_handle,instagram_handle,twitter,twitter_account,instagram
    fieldrulematch: text
    imprecise: 1
    priority: 3
  useruuidfield:
    key: useruuid
    name: User UUID by field name
    rule: user_uuid,account_uuid,user_guid,account_guid
    type: field
    priority: 1
    match: text
  useruuidvalue:
    key: useruuid
    name: User UUID by pattern
    match: ppr
    type: data
    rule: Word('0123456789abcdefABCDEF', exact=8) + Literal('-') + Word('0123456789abcdefABCDEF', exact=4) + Literal('-') + Word('0123456789abcdefABCDEF', exact=4) + Literal('-') + Word('0123456789abcdefABCDEF', exact=4) + Literal('-') + Word('0123456789abcdefABCDEF', exact=12)
    maxlen: 36
    minlen: 36
    fieldrule: user_uuid,account_uuid,user_guid,account_guid
    fieldrulematch: text
    priority: 2

  twitterusernamebyname:
    key: twitter_username
    name: Twitter (X) handle by field name (Twitter, twitter_handle, X handle) with @handles
    # The support services of the City of Melbourne list @LifelineAust, @TheRMH; a twitter field of
    # profile URLs (Liverpool business directory) is url.
    rule: (?i)(?:[a-z]+[ _])?twitter(?:[ _]?(?:handle|account|username|name|id))?|x[ _](?:handle|account|username)
    type: field
    match: regex
    validator: metacrafterext.rules.common.identifiers.validate_twitter_at_handle
    needs_values: true
    priority: 1
  # Twitter exports of the Many Eyes archive (IBM Many Eyes, 2007 to 2012): hashtags in their own column
  # and the numbers of posts (id_str, in_reply_to_status_id_str, tweetid).
  hashtagbyname:
    key: hashtag
    name: Hashtag by field name (hashtag, hashtags, hash tag, entities.hashtags.text) with #wikileaks or cablegate
    rule: (?i)(?:[a-z]+[ _.])?hash[ _]?tags?(?:[ _.]text)?|entities[ _.]hashtags(?:[ _.]text)?
    type: field
    match: regex
    validator: metacrafterext.rules.common.manyeyes.validate_hashtag
    needs_values: true
    priority: 1
  hashtagvalue:
    key: hashtag
    name: Hashtag by value (#wikileaks, #opassange, #COVID19), not a hex colour (#0047B2)
    rule: '#(?![0-9A-Fa-f]{3}$|[0-9A-Fa-f]{6}$|[0-9A-Fa-f]{8}$)(?=\w*[^\W\d_])\w{1,139}'
    type: data
    match: regex
    minlen: 3
    maxlen: 140
    priority: 2
  xpostidbyname:
    key: x_post_id
    name: X (Twitter) post ID by field name (tweet id, tweetid, status_id, in_reply_to_status_id_str) with 440322224407314432
    rule: (?i)(?:tweet|status|x[ _]post)[ _]?ids?(?:[ _]str)?|in[ _]reply[ _]to[ _]status[ _]id(?:[ _]str)?|(?:quoted|retweeted)[ _]status[ _]id(?:[ _]str)?
    type: field
    match: regex
    validator: metacrafterext.rules.common.manyeyes.validate_x_post_id
    needs_values: true
    priority: 1
