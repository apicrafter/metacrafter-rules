name: survey
description: Survey and research data - survey weights, variable names of codebooks, Correlates of War country codes
context: science
lang: common
country_code: xx
rules:
  # Survey data hold codes and weights, so the field name says what a column is. Found in the
  # Dataverse exports of AUSSDA, the Austrian Social Science Data Archive (metacrafter-testdata).
  surveyweightbyname:
    key: survey_weight
    name: Survey weight by field name (dweight, pspwght, anweight, design_weight, W1_WEIGHTD, Gewicht_DES, gew, ponderador, expansor)
    # European Social Survey (dweight, pspwght, pweight, anweight), IPUMS and ACS (perwt, hhwt,
    # pwgtp), qualified weights (design_weight, weight_final, w1_weightd of a panel wave) and the
    # German names of Austrian surveys (gew, gew_roh, gewichtung, Gewicht_DES). A bare weight or
    # Spanish surveys: ponderador, pondera_dem, expansor and factor de expansión (the national surveys
    # of cultural consumption of Argentina, ENCC). Gewicht is the mass of a thing; Gewicht_kg too, and a sample weight (grams of tissue in the
    # AIMS microplastics file) or a weight with a unit (final_weight_kg): sampling weight stays.
    rule: '(?i)dweight|pspwght|pspweight|pweight|anweight|perwt|hhwt|wtfinl|finalwt|pwgtp|wgtp|weighting(?:[ _]?factor)?|weight[ _]?factor|wfactor|(?:[a-z0-9]+[_.-])?w(?:gt|ght)(?:[_.-]?(?!kg$|lbs?$)[a-z0-9]+)?|(?:[a-z0-9]+[ _.-])?(?:design|post(?:strat(?:ification)?)?|ps|pop(?:ulation)?|analysis|cal(?:ib(?:ration)?)?|final|base|samp(?:ling)?|survey|resp(?:ondent)?|cross(?:sectional)?|long(?:itudinal)?|panel|trim(?:med)?|rak(?:e|ing))[ _.-]?weights?(?:[ _.-](?!(?:kg|g|mg|lbs?|oz|t|grams?|tonnes?)$)[a-z0-9]+)?|weights?[ _.-](?:design|post(?:strat[a-z]*)?|ps|pop|analysis|cal[a-z]*|final|base|samp[a-z]*|survey|resp[a-z]*|cross[a-z]*|long[a-z]*|panel|trim[a-z]*|rak[a-z]*|[dpc]|w?\d{1,2})|w\d{1,2}(?:w\d{1,2})?[_.]?weight[a-z]{0,2}|gew(?:[_.-][a-z0-9]+)?|[a-z0-9]+[_.-]gew|gewichtung(?:s?faktor)?(?:[_.-][a-z0-9]+)?|gewicht[_.-](?!(?:kg|g|t|gramm|tonnen|brutto|netto|leer)$)[a-z0-9]+|designgewicht|hochrechnungsfaktor|pondera(?:dor(?:es)?|ci[oó]n)?(?:[_.-][a-z0-9]+)?|expansor(?:es)?|factor[ _]?(?:de[ _])?expansi[oó]n|f[_.]?exp'
    type: field
    match: regex
    validator: metacrafterext.rules.common.survey.validate_survey_weight
    needs_values: true
    priority: 1
  variablenamebyname:
    key: variable_name
    name: Variable name by the field name of a codebook or data dictionary (variable, varname, VARIABLENAME, field_name)
    rule: '(?i)variable|(?:variable|var)[ _]?(?:name|nm)|varname|variablen?name|variablename[ _]?in[ _]?dataset|field[ _]?name|column[ _]?name|feldname|spaltenname|nom[ _](?:de[ _](?:la[ _])?)?variable|nombre[ _](?:de[ _](?:la[ _])?)?variable|nome[ _](?:della[ _])?variabile|naam[ _]variabele'
    type: field
    match: regex
    validator: metacrafterext.rules.common.survey.validate_variable_name
    needs_values: true
    priority: 1
  variablenamevalue:
    key: variable_name
    name: Variable names in the variable column of a codebook (Q1, M11, SEX_2016)
    # A guarded value rule, so that variable names of the shape of other identifiers (Q10 and
    # Q11 are Wikidata ids, AB12CDE a UK plate) keep their own type only.
    rule: '[^\W\d][\w.@#$]{0,127}'
    type: data
    match: regex
    minlen: 1
    maxlen: 128
    fieldregex: '(?i)^(?:variable|(?:variable|var)[ _]?(?:name|nm)|varname|variablen?name|variablename[ _]?in[ _]?dataset|field[ _]?name|column[ _]?name|feldname|spaltenname)$'
    priority: 1
  cowcountrycodebyname:
    key: cow_country_code
    name: Correlates of War country code by field name (COWcode, ccode, ccode1)
    # ccode is the COW name; a ccode of ISO alpha-2 codes (AT, DK) fails the check and is a
    # country code (intcodes.yaml). A bare cow is a number of cows.
    rule: '(?i)cow_?codes?|cowc|cow_?(?:ccode|num(?:ber)?|id|country_?code|state_?(?:num|no))|ccode[12ab]?|stateno|statenum'
    type: field
    match: regex
    validator: metacrafterext.rules.common.survey.validate_cow_country_code
    needs_values: true
    priority: 1
  # Found in the survey of researchers of the Universidad Nacional de Rosario on sharing
  # research data (RDA-UNR, 2023; metacrafter-testdata).
  likertresponsevalue:
    key: likert_response
    name: Answer of a rating-scale item in words (Totalmente de acuerdo, Algo probable, A veces, Strongly disagree)
    # Survey exports name the item columns after their questions (preocupaperder,
    # beneficioscienciacalidad), so the values are the evidence. Yes / no and coded answers
    # (1 to 5) are not answers in words.
    rule: metacrafterext.rules.common.survey.validate_likert_response
    type: data
    match: func
    minlen: 2
    maxlen: 60
    priority: 1

  # ------------------------------------------------------------ respondents and their sessions
  # Found in the Edmonton Insight Community surveys and the census tables of data.edmonton.ca and
  # data.calgary.ca (metacrafter-testdata, 2024 snapshots, Dateno sources cdi00000289 and
  # cdi00000286): the survey platform exports DeviceType, BrowserType and OSType of every response,
  # and the profiling questionnaire asks Q3_Own_Rent.
  devicetypebyname:
    key: device_type
    name: Device type by field name (DeviceType, device_category, device_class) with Desktop, Phone, Tablet
    rule: (?i)(?:[a-z]+[ _])?device[ _]?(?:type|category|class|kind|form[ _]?factor)|device
    type: field
    match: regex
    validator: metacrafterext.rules.common.respondents.validate_device_type
    needs_values: true
    priority: 1
  webbrowserbyname:
    key: web_browser
    name: Web browser by field name (BrowserType, browser, browser_name, user_browser) with Google Chrome, Safari, Firefox
    rule: (?i)(?:[a-z]+[ _])?browser(?:[ _]?(?:type|name|family))?
    type: field
    match: regex
    validator: metacrafterext.rules.common.respondents.validate_web_browser
    needs_values: true
    priority: 1
  operatingsystembyname:
    key: operating_system
    name: Operating system by field name (OSType, os, os_name, operating_system) with Windows, iOS, Android
    rule: (?i)(?:[a-z]+[ _])?(?:os|operating[ _]?system)(?:[ _]?(?:type|name|family))?
    type: field
    match: regex
    validator: metacrafterext.rules.common.respondents.validate_operating_system
    needs_values: true
    priority: 1
  housingtenurebyname:
    key: housing_tenure
    name: Housing tenure by field name (Q3_Own_Rent, own_rent, tenure, housing_tenure, tenure_type) with Own, Rent
    rule: (?i)(?:q\d{1,3}[a-z]?[ _])?(?:own[ _]?(?:or[ _])?rent|(?:housing|dwelling|home)[ _]?tenure(?:[ _]?type)?|tenure(?:[ _]?(?:type|status))?)
    type: field
    match: regex
    validator: metacrafterext.rules.common.respondents.validate_housing_tenure
    needs_values: true
    priority: 1

