name: orgs
description: Companies identifiers
context: companies
lang: common
country_code: xx
rules:
  companynameknown:
    key: orgname
    name: Company name known names
    rule: legalname,companyname,orgname,org_name,company_name,organization_name,legal_name,organizationname,company
      name
    type: field
    priority: 1
    match: text
  dunsfield:
    key: duns
    name: Data Universal Numbering System (DUNS) by field name
    rule: duns,duns_number,duns_num,d_u_n_s,dun_number,d-u-n-s number,d-u-n-s,duns number,d-u-n-s no,dun & bradstreet number
    type: field
    match: text
    priority: 1
  dunsvalue:
    key: duns
    name: Data Universal Numbering System (DUNS) by value pattern
    match: ppr
    type: data
    rule: Word(nums, exact=9)
    maxlen: 9
    minlen: 9
    priority: 1
    validator: metacrafterext.rules.common.identifiers.validate_duns
    imprecise: 1
  companycompanybyknown:
    key: orgname
    name: Company by field name
    match: text
    type: field
    rule: company
    priority: 1
  companyidbyknown:
    key: id
    name: Company record ID by field name
    match: text
    type: field
    rule: companyId,companyid,company_companyid,company_recid
    priority: 1
  gleifracodevalue:
    key: gleif_ra_code
    name: GLEIF registration authority code (RA000554)
    # GLEIF LEI records: registeredAt.id and validatedAt.id. Not a UK NINO (#61, #62).
    rule: RA\d{6}
    type: data
    match: regex
    minlen: 8
    maxlen: 8
    priority: 1
  legalformbyfield:
    key: legal_form
    name: Legal form name or abbreviation by multilingual field name
    # Rechtsform, forma jurídica, forme juridique, νομική μορφή, teisinė forma, правовая форма; the
    # Chilean company register keeps it in Codigo de sociedad (SpA, EIRL) and GLEIF in
    # legalForm.other (#66). legalForm.id holds the ISO 20275 code (elf_code), which the
    # validator rejects, like the digits of a legal form code column.
    rule: (?i)(?:.*\.)?(?:legal[ _-]?form(?:[ _.-]?(?:name|other|description|desc|text))?|form_pavadinimas|teisin[eė][ _]forma(?:[ _]pavadinimas)?|teisin[eė]s[ _]formos[ _]pavadinimas|ν[οό]μικ[ηή][ _]μορφ[ηή]|rechtsform|rechtsvorm|forma[ _]jur[ií]dica|forme[ _]juridique|forma[ _]giuridica|natureza[ _]jur[ií]dica|forma[ _]prawna|pr[aá]vn[ií][ _]forma|juridisk[ _]form|yhti[öo]muoto|(?:организационно-)?правовая[ _]форма|опф|(?:c[oó]digo|tipo)[ _]de[ _]sociedad)
    type: field
    match: regex
    validator: metacrafterext.rules.common.generic.validate_legal_form_text
    priority: 1
  gleifentitycategoryvalue:
    key: gleif_entity_category
    name: GLEIF legal entity category (GENERAL, FUND, BRANCH) in a category field
    rule: GENERAL,FUND,BRANCH,SOLE_PROPRIETOR,RESIDENT_GOVERNMENT_ENTITY,INTERNATIONAL_ORGANIZATION
    type: data
    match: text
    fieldrule: category,entitycategory,entity_category,entity category,legal_entity_category
    fieldrulematch: text
    priority: 1
