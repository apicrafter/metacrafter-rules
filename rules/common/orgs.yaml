name: orgs
description: Companies identifiers
context: companies
lang: common
country_code: xx
rules:
  companynameknown:
    key: orgname
    name: Company name known names
    rule: legalname,companyname,orgname,org_name,company_name,organization_name,legal_name,organizationname,company
      name
    type: field
    priority: 1
    match: text
  dunsfield:
    key: duns
    name: Data Universal Numbering System (DUNS) by field name
    rule: duns,duns_number,duns_num,d_u_n_s,dun_number
    type: field
    match: text
    priority: 1
  dunsvalue:
    key: duns
    name: Data Universal Numbering System (DUNS) by value pattern
    match: ppr
    type: data
    rule: Word(nums, exact=9)
    maxlen: 9
    minlen: 9
    priority: 1
    validator: metacrafterext.rules.common.identifiers.validate_duns
    imprecise: 1
  companycompanybyknown:
    key: orgname
    name: Company by field name
    match: text
    type: field
    rule: company
    priority: 1
  companyidbyknown:
    key: id
    name: Company record ID by field name
    match: text
    type: field
    rule: companyId,companyid,company_companyid,company_recid
    priority: 1
  gleifracodevalue:
    key: gleif_ra_code
    name: GLEIF registration authority code (RA000554)
    # GLEIF LEI records: registeredAt.id and validatedAt.id. Not a UK NINO (#61, #62).
    rule: RA\d{6}
    type: data
    match: regex
    minlen: 8
    maxlen: 8
    priority: 1
