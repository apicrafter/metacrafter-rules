name: vehicles
description: Vehicles related classification codes
context: transport
lang: common
country_code: xx
rules:
  vehiclenumberbyfieldname:
    key: vehiclenumber
    name: Vehicle number by known fieldnames
    rule: vehiclenumber,vehicle number,vehicle_number,license_plate,plate_number,registration_plate,reg_plate,vehicle_id,car_number,auto_number,vehicle_registration,plate,license,registration,vehicle_plate_number
    # A license field of cc-by or license URLs holds no number plates (#60).
    validator: metacrafterext.rules.common.generic.validate_vehicle_number_text
    match: text
    type: field
    priority: 1
  vehiclenumberbyvalue:
    key: vehiclenumber
    name: Vehicle number by value pattern (generic alphanumeric)
    match: ppr
    type: data
    rule: Word(alphanums, min=4, max=12)
    minlen: 4
    maxlen: 12
    priority: 2
    imprecise: 1
  vinbyfieldname:
    key: vin
    name: Vehicle Identification Number by field name
    # A bare serial_number is the serial number of anything (smart meters: 1000247T, 12H0500467).
    rule: vin,vehicle_identification_number,vehicle_id,chassis_number,frame_number,vin_number,vin_code
    match: text
    type: field
    priority: 1
  vinbyvalue:
    key: vin
    name: Vehicle Identification Number by value pattern
    match: ppr
    type: data
    rule: Word(alphanums, exact=17)
    minlen: 17
    maxlen: 17
    priority: 1
    validator: metacrafterext.rules.common.vehicles.validate_vin
  chassisnumberbyfieldname:
    key: chassis_number
    name: Chassis number by field name
    rule: chassis_number,chassis,chassis_id,frame_number,frame_id
    match: text
    type: field
    priority: 1
  chassisnumberbyvalue:
    key: chassis_number
    name: Chassis number by value pattern
    match: ppr
    type: data
    rule: Word(alphanums, min=6, max=20)
    minlen: 6
    maxlen: 20
    priority: 2
    imprecise: 1
  enginenumberbyfieldname:
    key: engine_number
    name: Engine number by field name
    rule: engine_number,engine,engine_id,engine_serial,engine_serial_number,motor_number
    match: text
    type: field
    priority: 1
  enginenumberbyvalue:
    key: engine_number
    name: Engine number by value pattern
    match: ppr
    type: data
    rule: Word(alphanums, min=4, max=20)
    minlen: 4
    maxlen: 20
    priority: 2
    imprecise: 1
  # Found in the fleet lists of the municipality of Mercedes, Buenos Aires (datosabiertos.mercedes.gob.ar,
  # metacrafter-testdata): Vehículo, Motor Nro., Chasis Nro.
  vehicletypebyname:
    key: vehicle_type
    name: Vehicle type by field name (Vehículo, tipo_vehiculo, tipo de vehículo, vehicle_type, body type) with kinds of vehicles
    # Automóvil, Pick Up, Camioneta, Camión, Motoniveladora; Sedan, Truck. A vehiculo field of plates
    # or makes fails. No rule by value: Bus and Tram are modes of transport (vm of the St. Gallen
    # timetables) and Rural (a station wagon in Argentina) is also rural against urban.
    rule: (?i)(?:tipo[ _](?:de[ _])?)?veh[ií]culos?(?:[ _](?:tipo|clase))?|(?:tipo|clase)[ _](?:de[ _])?(?:unidad|rodado|automotor|m[oó]vil)|clase[ _](?:de[ _])?veh[ií]culo|vehicle[ _]?(?:type|class|category|kind|body[ _]?type)(?:[ _]?code)?(?:[ _]?\d)?|body[ _]?type
    type: field
    match: regex
    validator: metacrafterext.rules.common.vehicles.validate_vehicle_type
    needs_values: true
    priority: 1
  esenginenumberbyname:
    key: engine_number
    name: Engine number by Spanish field name (Motor Nro., nro_motor, numero_de_motor, N° motor)
    rule: (?i)(?:n(?:[uú]me)?ro|nro|num|n[º°])[ _.]?(?:de[ _])?motor|motor[ _.]?(?:n(?:[uú]me)?ro|nro|num|n[º°])[ _.\\]*
    type: field
    match: regex
    validator: metacrafterext.rules.common.vehicles.validate_engine_or_chassis_number
    needs_values: true
    priority: 1
  eschassisnumberbyname:
    key: chassis_number
    name: Chassis number by Spanish field name (Chasis Nro., nro_chasis, numero_de_chasis, bastidor)
    rule: (?i)(?:n(?:[uú]me)?ro|nro|num|n[º°])[ _.]?(?:de[ _])?(?:chasis|bastidor)|(?:chasis|bastidor)(?:[ _.]?(?:n(?:[uú]me)?ro|nro|num|n[º°])[ _.\\]*)?
    type: field
    match: regex
    validator: metacrafterext.rules.common.vehicles.validate_engine_or_chassis_number
    needs_values: true
    priority: 1
