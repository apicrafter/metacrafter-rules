name: persons
description: Persons identifiers
context: persons
lang: common
country_code: xx
rules:
  fullname:
    key: person_fullname
    is_pii: true
    name: Person full name by known
    rule: applicant_fullname,owner_fullname,person_fullname,full_name,person_name,person_full_name,full_person_name
    type: field
    match: text
    priority: 1
  surname:
    key: person_surname
    is_pii: true
    name: Person surname by known
    rule: surname,lastname,sur_name,last_name,name_last,owner_last_name,familyname,family_name,Last
      Name
    type: field
    match: text
    priority: 1
  firstname:
    key: person_firstname
    is_pii: true
    name: Person firstname by known
    rule: firstname,forename,first_name,candidate_first_name,owner_first_name,client_first_name,givenname,given_name,First
      Name
    type: field
    match: text
    priority: 1
  midname:
    key: person_midname
    is_pii: true
    name: Person midname by known
    rule: midname,secondname,middlename,mid_name,middle_name,second_name,patronymicname,Middle
      Name
    type: field
    match: text
    priority: 1
  firstnamepat:
    key: person_firstname
    is_pii: true
    name: Person firstname by known
    # The field name ends with the word firstname after 1 to 3 other words
    # (user_firstname, contact firstname).
    # pyparsing does not backtrack, so each number of words is an alternative.
    rule: >-
      ((Word(alphanums) + Optional(oneOf('_ -'))) * 1 + CaselessLiteral('firstname'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 2 + CaselessLiteral('firstname'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 3 + CaselessLiteral('firstname'))
    type: field
    match: ppr
    priority: 2
  surnamepat:
    key: person_surname
    is_pii: true
    name: Person surname by known
    # The field name ends with the word surname after 1 to 3 other words
    # (user_surname, maiden surname).
    # pyparsing does not backtrack, so each number of words is an alternative.
    rule: >-
      ((Word(alphanums) + Optional(oneOf('_ -'))) * 1 + CaselessLiteral('surname'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 2 + CaselessLiteral('surname'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 3 + CaselessLiteral('surname'))
    type: field
    match: ppr
    priority: 2
  lastnamepat:
    key: person_surname
    is_pii: true
    name: Person lastname by known
    # The field name ends with the word lastname after 1 to 3 other words
    # (user_lastname, contact lastname).
    # pyparsing does not backtrack, so each number of words is an alternative.
    rule: >-
      ((Word(alphanums) + Optional(oneOf('_ -'))) * 1 + CaselessLiteral('lastname'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 2 + CaselessLiteral('lastname'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 3 + CaselessLiteral('lastname'))
    type: field
    match: ppr
    priority: 2
  midnamepat:
    key: person_midname
    is_pii: true
    name: Person midname by known
    # The field name ends with the word midname after 1 to 3 other words
    # (user_midname, father midname).
    # pyparsing does not backtrack, so each number of words is an alternative.
    rule: >-
      ((Word(alphanums) + Optional(oneOf('_ -'))) * 1 + CaselessLiteral('midname'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 2 + CaselessLiteral('midname'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 3 + CaselessLiteral('midname'))
    type: field
    match: ppr
    priority: 2
  emailpersonbyknown:
    key: email_person
    name: Email Person
    match: text
    type: field
    rule: email_adres,mber_email_adres,applcnt_email_adres,mngr_email_adres,emailfromaddress
    priority: 1
    is_pii: true
  avatarpersonbyknown:
    key: url
    name: Avatar URL by field name
    match: text
    type: field
    rule: avatar_url
    priority: 1
  # Found in six more segments of the WDC Web Tables Corpus 2015 (tables of HTML pages of the Common Crawl of
  # July 2015; 4 978 140 relational tables of 2 555 031 pages on 98 133 hosts): census transcriptions and family trees with the relationship
  # of each person to the head of the household; metacrafter-testdata.
  householdrelationshipbyname:
    key: household_relationship
    name: 'Relationship to the head of the household by field name (Relationship, Relation, Rel., Relation to Head) with Head, Wife, Son, Servant'
    rule: '(?i)rel(?:ation(?:ship)?)?\.?(?:[ _]to[ _](?:the[ _])?head(?:[ _]of[ _](?:the[ _])?(?:house(?:hold)?|family))?)?|relationship|kinship|relation[ _]to[ _](?:head|householder)|verwandtschaft(?:sverh[aä]ltnis)?|parentesco|lien[ _]de[ _]parent[eé]'
    type: field
    match: regex
    validator: metacrafterext.rules.common.webtables.validate_household_relationship
    needs_values: true
    priority: 1
  householdrelationshipvalue:
    key: household_relationship
    name: 'Relationship to the head of the household by value (Wife, Son, Daughter, Servant, Boarder, Lodger)'
    rule: metacrafterext.rules.common.webtables.validate_household_relationship_value
    type: data
    match: func
    minlen: 3
    maxlen: 25
    priority: 1
  # Found in seven more segments of the WDC Web Tables Corpus 2015 (tables of HTML pages of the Common Crawl of July
  # 2015; 5 778 000 relational tables of 2 963 718 pages on 109 005 hosts): veterans, casualties and service records
  # of genealogy, memorial and recruiting sites; metacrafter-testdata.
  militarybranchbyname:
    key: military_branch
    name: 'Branch of the armed forces by field name (Branch, Service, Branch of Service, Military Branch, Component) with Army, Navy, Air Force'
    rule: '(?i)(?:military[ _]|armed[ _]forces[ _])?(?:branch(?:es)?|service)(?:[ _]of[ _](?:the[ _])?(?:service|military|armed[ _]forces))?|military[ _](?:affiliation|component)|service[ _]branch|armed[ _](?:forces|services?)|component|teilstreitkraft'
    type: field
    match: regex
    validator: metacrafterext.rules.common.webtables.validate_military_branch
    needs_values: true
    priority: 1
  militarybranchvalue:
    key: military_branch
    name: 'Branch of the armed forces by value (Marine Corps, Coast Guard, USMC, USAF, U.S. Navy, Army National Guard, Royal Navy)'
    rule: metacrafterext.rules.common.webtables.validate_military_branch_value
    type: data
    match: func
    minlen: 3
    maxlen: 40
    priority: 1
