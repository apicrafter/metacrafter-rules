name: persons
description: Persons identifiers
context: persons
lang: common
country_code: xx
rules:
  fullname:
    key: person_fullname
    is_pii: true
    name: Person full name by known
    rule: applicant_fullname,owner_fullname,person_fullname,full_name,person_name,person_full_name,full_person_name
    type: field
    match: text
    priority: 1
  surname:
    key: person_surname
    is_pii: true
    name: Person surname by known
    rule: surname,lastname,sur_name,last_name,name_last,owner_last_name,familyname,family_name,Last
      Name
    type: field
    match: text
    priority: 1
  firstname:
    key: person_firstname
    is_pii: true
    name: Person firstname by known
    rule: firstname,forename,first_name,candidate_first_name,owner_first_name,client_first_name,givenname,given_name,First
      Name
    type: field
    match: text
    priority: 1
  midname:
    key: person_midname
    is_pii: true
    name: Person midname by known
    rule: midname,secondname,middlename,mid_name,middle_name,second_name,patronymicname,Middle
      Name
    type: field
    match: text
    priority: 1
  firstnamepat:
    key: person_firstname
    is_pii: true
    name: Person firstname by known
    # The field name ends with the word firstname after 1 to 3 other words
    # (user_firstname, contact firstname).
    # pyparsing does not backtrack, so each number of words is an alternative.
    rule: >-
      ((Word(alphanums) + Optional(oneOf('_ -'))) * 1 + CaselessLiteral('firstname'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 2 + CaselessLiteral('firstname'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 3 + CaselessLiteral('firstname'))
    type: field
    match: ppr
    priority: 2
  surnamepat:
    key: person_surname
    is_pii: true
    name: Person surname by known
    # The field name ends with the word surname after 1 to 3 other words
    # (user_surname, maiden surname).
    # pyparsing does not backtrack, so each number of words is an alternative.
    rule: >-
      ((Word(alphanums) + Optional(oneOf('_ -'))) * 1 + CaselessLiteral('surname'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 2 + CaselessLiteral('surname'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 3 + CaselessLiteral('surname'))
    type: field
    match: ppr
    priority: 2
  lastnamepat:
    key: person_surname
    is_pii: true
    name: Person lastname by known
    # The field name ends with the word lastname after 1 to 3 other words
    # (user_lastname, contact lastname).
    # pyparsing does not backtrack, so each number of words is an alternative.
    rule: >-
      ((Word(alphanums) + Optional(oneOf('_ -'))) * 1 + CaselessLiteral('lastname'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 2 + CaselessLiteral('lastname'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 3 + CaselessLiteral('lastname'))
    type: field
    match: ppr
    priority: 2
  midnamepat:
    key: person_midname
    is_pii: true
    name: Person midname by known
    # The field name ends with the word midname after 1 to 3 other words
    # (user_midname, father midname).
    # pyparsing does not backtrack, so each number of words is an alternative.
    rule: >-
      ((Word(alphanums) + Optional(oneOf('_ -'))) * 1 + CaselessLiteral('midname'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 2 + CaselessLiteral('midname'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 3 + CaselessLiteral('midname'))
    type: field
    match: ppr
    priority: 2
  emailpersonbyknown:
    key: email_person
    name: Email Person
    match: text
    type: field
    rule: email_adres,mber_email_adres,applcnt_email_adres,mngr_email_adres,emailfromaddress
    priority: 1
    is_pii: true
  avatarpersonbyknown:
    key: url
    name: Avatar URL by field name
    match: text
    type: field
    rule: avatar_url
    priority: 1
