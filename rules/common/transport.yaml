name: transport
description: Transport identifiers (airline, airport, maritime)
context: transport
lang: common
country_code: xx
rules:
  iataairlinecodefield:
    key: iataairlinecode
    name: IATA airline code by field name
    rule: iata_airline_code,iata_code,airline_code,airline_iata,airline_code_iata
    type: field
    match: text
    priority: 1
  iataairlinecodebyname:
    key: iataairlinecode
    name: IATA airline code by the field name IATA and a two-character value
    # IATA codes of airlines have two characters (EB, 6V), those of airports three: a column
    # IATA or código IATA of a register of airlines (#70).
    rule: iata,codigo iata,código iata,codigo_iata,iata_designator,iata designator
    type: field
    match: text
    validator: metacrafterext.rules.common.generic.validate_iata_airline_code
    priority: 1
# Disabled: matches any 2-character alphanumeric value (country/state/currency
# codes, abbreviations, any 2-char code), causing too many false positives. An
# IATA airline code cannot be distinguished from a generic 2-char code by value
# alone; rely on iataairlinecodefield instead.
#  iataairlinecodevalue:
#    key: iataairlinecode
#    name: IATA airline code by value pattern
#    match: ppr
#    type: data
#    rule: Word('0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ', exact=2)
#    maxlen: 2
#    minlen: 2
#    priority: 1
  icaoairlinecodefield:
    key: icaoairlinecode
    name: ICAO airline code by field name
    rule: icao_airline_code,icao_code,airline_icao,airline_code_icao
    type: field
    match: text
    priority: 1
  icaoairlinecodebyname:
    key: icaoairlinecode
    name: ICAO airline code by the field name ICAO and a three-letter value
    # ICAO designators of airlines have three letters (PLM, AXY), those of airports four (#70).
    rule: icao,codigo icao,código icao,codigo_icao,icao_designator,icao designator
    type: field
    match: text
    validator: metacrafterext.rules.common.generic.validate_icao_airline_code
    priority: 1
# Disabled: matches any 3-character alphanumeric value (currency codes, country
# codes, generic 3-char codes/abbreviations), causing too many false positives.
# An ICAO airline code cannot be distinguished from a generic 3-char code by
# value alone; rely on icaoairlinecodefield instead.
#  icaoairlinecodevalue:
#    key: icaoairlinecode
#    name: ICAO airline code by value pattern
#    match: ppr
#    type: data
#    rule: Word('0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ', exact=3)
#    maxlen: 3
#    minlen: 3
#    priority: 1
  iataairportcodefield:
    key: iataairportcode
    name: IATA airport code by field name
    rule: iata_airport_code,airport_code,airport_iata,airport_code_iata
    type: field
    match: text
    priority: 1
# Disabled: matches any 3-character alphanumeric value (currency codes, country
# codes, generic 3-char codes/abbreviations), causing too many false positives.
# An IATA airport code cannot be distinguished from a generic 3-char code by
# value alone; rely on iataairportcodefield instead.
#  iataairportcodevalue:
#    key: iataairportcode
#    name: IATA airport code by value pattern
#    match: ppr
#    type: data
#    rule: Word('0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ', exact=3)
#    maxlen: 3
#    minlen: 3
#    priority: 1
  icaoairportcodefield:
    key: icaoairportcode
    name: ICAO airport code by field name
    rule: icao_airport_code,airport_icao,airport_code_icao
    type: field
    match: text
    priority: 1
  icaoairportcodevalue:
    key: icaoairportcode
    name: ICAO airport code by value pattern
    match: ppr
    type: data
    rule: Word('ABCDEFGHIJKLMNOPQRSTUVWXYZ', exact=4)
    maxlen: 4
    minlen: 4
    priority: 1
    # Any 4 uppercase letters match (status codes such as ACTI or DELD), so the rule runs
    # only on fields with a word that starts with icao or airport: icao, icao_code,
    # airport, airport_code, departure_airport, Airport ICAO. pyparsing does not backtrack,
    # so each alternative fixes the number of words before it (0 to 3); words are
    # separated by _, - or spaces.
    fieldrule: >-
      ((CaselessLiteral('icao') | CaselessLiteral('airport')) + ZeroOrMore(Word(printables)))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 1 + (CaselessLiteral('icao') | CaselessLiteral('airport')) + ZeroOrMore(Word(printables)))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 2 + (CaselessLiteral('icao') | CaselessLiteral('airport')) + ZeroOrMore(Word(printables)))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 3 + (CaselessLiteral('icao') | CaselessLiteral('airport')) + ZeroOrMore(Word(printables)))
    fieldrulematch: ppr
  imonumberfield:
    key: imonumber
    name: IMO ship number by field name
    rule: imo,imo_number,imo_num,ship_imo,imo_ship_number
    type: field
    match: text
    priority: 1
  imonumbervalue:
    key: imonumber
    name: IMO ship number by value pattern
    match: ppr
    type: data
    rule: Word('123456789', exact=1) + Word(nums, exact=6)
    validator: metacrafterext.rules.common.identifiers.validate_imo_number
    imprecise: 1
    maxlen: 7
    minlen: 7
    priority: 1
  mmsifield:
    key: mmsi
    name: Maritime Mobile Service Identity (MMSI) by field name
    rule: mmsi,mmsi_number,mmsi_num,maritime_mobile_service_identity
    type: field
    match: text
    priority: 1
  mmsivalue:
    key: mmsi
    name: Maritime Mobile Service Identity (MMSI) by value pattern
    match: ppr
    type: data
    rule: Word(nums, exact=9)
    imprecise: 1
    maxlen: 9
    minlen: 9
    priority: 1
  gtfslocationtypevalue:
    key: gtfs_location_type
    name: GTFS stop location type (0-4) in a location_type field
    rule: '\s*[0-4]\s*'
    type: data
    match: regex
    minlen: 1
    maxlen: 300
    fieldrule: location_type,stop_location_type
    fieldrulematch: text
    priority: 1
  gtfswheelchairboardingvalue:
    key: gtfs_wheelchair_boarding
    name: GTFS wheelchair boarding (0-2) in a wheelchair_boarding field
    # Fixed-width GTFS exports pad the values with spaces.
    rule: '\s*[0-2]\s*'
    type: data
    match: regex
    minlen: 1
    maxlen: 300
    fieldrule: wheelchair_boarding,wheelchair_accessible
    fieldrulematch: text
    priority: 1
  ifoptstopidvalue:
    key: ifopt_stop_id
    name: IFOPT / DHID stop place, area or quay id (de:05966:24128:1:1)
    rule: '[a-z]{2}:\d+:\d+(?::[0-9A-Za-z_]+){0,2}'
    type: data
    match: regex
    minlen: 6
    maxlen: 60
    priority: 1
  ifoptstopidknown:
    key: ifopt_stop_id
    name: IFOPT / DHID stop id by field name
    rule: dhid,ifopt,ifopt_id,stop_ifopt,globale id,steig globale id,haltestellen-id,global_stop_id
    type: field
    match: text
    priority: 1
  evconnectortypevalue:
    key: ev_connector_type
    name: EV charging connector type (Typ 2;CCS2;CHAdeMO) by field name and value
    rule: metacrafterext.rules.common.generic.validate_ev_connectors
    type: data
    match: func
    minlen: 3
    maxlen: 120
    fieldrule: standard_konektoru,konektor,konektory,typ_konektoru,connector,connectors,connector_type,connectortype,connector_types,plug_type,plugtype,socket_type,sockettype,steckertyp,stecker,type_prise,conector,tipo_conector
    fieldrulematch: text
    priority: 1
  erarinfopidvalue:
    key: era_rinf_op_id
    name: RINF operational point id (HR71402) by field name and value
    # The id has the country prefix: the national code alone (Croatian Oznaka mjesta 71402) is
    # not one (registry negative example).
    rule: '[A-Z]{2}[0-9A-Z]{1,10}'
    type: data
    match: regex
    minlen: 3
    maxlen: 12
    fieldrule: uopid,op_id,opid,rinf_op_id,unique_op_id,unique op id
    fieldrulematch: text
    priority: 1
  gtfsstopidbyfield:
    key: gtfs_stop_id
    name: GTFS stop id by stops.txt / stop_times.txt field name
    rule: stop_id,parent_station,from_stop_id,to_stop_id
    type: field
    match: text
    priority: 1
  gtfszoneidbyfield:
    key: gtfs_zone_id
    name: GTFS fare zone id by field name
    rule: zone_id,origin_id,destination_id,contains_id
    type: field
    match: text
    priority: 1
