name: commonboolean
description: Common known boolean
context: common
lang: common
country_code: xx
rules:
  booleancommon:
    key: boolean
    name: Boolean value by known
    rule: true,false
    match: text
    type: data
    priority: 2
  booleanyesno:
    key: boolean
    name: Boolean value yes/no
    rule: yes,no
    match: text
    type: data
    priority: 2
  booleanjanein:
    key: boolean
    name: Boolean value ja/nein (German)
    rule: ja,nein
    match: text
    type: data
    priority: 2
  booleansino:
    key: boolean
    name: Boolean value sí/no (Spanish)
    # Sí, Si, SI and No of the Argentine cultural directories and surveys (espacio_incaa,
    # hay_libros_en_tu_casa, noti1). Without it a yes/no column passed only when No was the
    # commoner answer, through the English no.
    rule: si,sí,no
    match: text
    type: data
    priority: 2
  booleansimnao:
    key: boolean
    name: Boolean value sim/não (Portuguese)
    # Sim and Não (SIM, NAO, Nao) of the Brazilian tables: the publication bases of the Fiocruz articles
    # (Base Scielo), the violence notifications of Minas Gerais (VIOL_FISIC) and the innovation flag of
    # the BNDES operations.
    rule: sim,não,nao
    match: text
    type: data
    priority: 2
  participleprefixrule:
    key: boolean
    name: Boolean with number of common prefixes and integer
    rule: '0,1'
    maxlen: 1
    minlen: 1
    priority: 1
    match: text
    type: data
    fieldrule: valid,enabled,active,included,enabled,confirmed,deleted,changed,added,updated,modified
    fieldrulematch: text
  isprefixrule:
    key: boolean
    name: Boolean with "is_" prefix
    rule: '0,1'
    maxlen: 1
    minlen: 1
    priority: 1
    match: text
    type: data
    # is_active, IS-ACTIVE, isActive, IsActive; not iso, isbn, issue or ISO (the "is" must end
    # at "_", "-" or a capital letter of a camelCase name).
    fieldrule: (CaselessLiteral('is_') | CaselessLiteral('is-')) + Word(printables) | oneOf('is Is') + Word('ABCDEFGHIJKLMNOPQRSTUVWXYZ', exact=1) + Optional(Word(printables))
    fieldrulematch: ppr
  showprefixrule:
    key: boolean
    name: Boolean with "show_" prefix
    rule: '0,1'
    maxlen: 1
    minlen: 1
    priority: 1
    match: text
    type: data
    fieldrule: (CaselessLiteral('show_') | CaselessLiteral('show-')) + Word(printables) | oneOf('show Show') + Word('ABCDEFGHIJKLMNOPQRSTUVWXYZ', exact=1) + Optional(Word(printables))
    fieldrulematch: ppr
  hasprefixrule:
    key: boolean
    name: Boolean with "has_" prefix
    rule: '0,1'
    maxlen: 1
    minlen: 1
    priority: 1
    match: text
    type: data
    fieldrule: (CaselessLiteral('has_') | CaselessLiteral('has-')) + Word(printables) | oneOf('has Has') + Word('ABCDEFGHIJKLMNOPQRSTUVWXYZ', exact=1) + Optional(Word(printables))
    fieldrulematch: ppr
  flagpostfixrule:
    key: boolean
    name: Boolean with "_flag" postfix
    rule: '0,1'
    maxlen: 10
    minlen: 1
    priority: 1
    match: text
    type: data
    fieldrule: Word(alphanums) + Optional("_") + CaselessLiteral("flag")
    fieldrulematch: ppr
