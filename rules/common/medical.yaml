name: commonmedical
description: Medical codes that do not depend on a language or country
context: medical
lang: common
country_code: xx
rules:
  # WHO ATC code of a chemical substance (7 characters, M04AA03); group codes such as A13A
  # are not matched. ATC field names are in the language files (enatcfield, deatcfield,
  # fratcfield, esatcfield, rumedicineatcbyknown).
  atcvalue:
    key: atccode
    name: ATC drug code by value
    match: ppr
    type: data
    rule: Word('ABCDEFGHIJKLMNOPQRSTUV', exact=1) + Word(nums, exact=2) + Word('ABCDEFGHIJKLMNOPQRSTUVWXYZ', exact=2) + Word(nums, exact=2)
    maxlen: 7
    minlen: 7
    priority: 2
