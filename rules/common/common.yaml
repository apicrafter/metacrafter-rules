name: common
description: Common data types (email, urls and etc)
context: common
lang: common
country_code: xx
rules:
  filenamebyknown:
    key: filename
    name: Name of the file by known name
    maxlen: 512
    minlen: 5
    priority: 1
    match: text
    type: field
    rule: filename,file_name
  fileextensionbyknown:
    key: file_extension
    name: File name extension by known name
    priority: 1
    match: text
    type: field
    rule: file_extension,fileextension,file_ext,fileext
  fileextensionbyvalue:
    key: file_extension
    name: File name extension by value in an extension field
    minlen: 1
    maxlen: 11
    priority: 1
    match: ppr
    type: data
    rule: Optional(Literal('.')) + Word(alphas, alphanums, max=10)
    fieldrule: extension,extensions,ext
    fieldrulematch: text
  mimetypebyknown:
    key: mimetype
    name: Mimetype / content type by known names
    priority: 1
    match: text
    type: field
    rule: mimetype,mime_type,content_type
  mimetypebyvalue:
    key: mimetype
    name: Mimetype / content type by value
    priority: 1
    maxlen: 255
    minlen: 7
    match: regex
    type: data
    # The registry regexp of the mimetype datatype: a registered top-level type, a subtype and
    # optional parameters (text/html; charset=utf-8). Case-insensitive, as media types are.
    rule: >-
      (?i)(?:application|audio|example|font|haptics|image|message|model|multipart|text|video)/[a-z0-9][a-z0-9!#$&^_.+-]{0,126}(?:[ \t]*;[ \t]*[a-z0-9!#$%&'*+.^_`|~-]+=(?:[a-z0-9!#$%&'*+.^_`|~-]+|"[^"]*"))*
  phoneknown:
    key: phone
    is_pii: true
    name: Phone number by known name
    rule: phone,fax,contact_phone,telephone,phone number,phone_number,business_phone,phonenumber,phone_no,contactphone,phone_1,phone1,phone2,fax_number,contact_fax,cellphon,mobile_phone_number,other_mobile,telephone_number,telephonenumber
    type: field
    match: text
    priority: 1
  phoneknownpat:
    key: phone
    is_pii: true
    name: Phone number by known pattern
    # The field name ends with the word phone after 1 to 3 other words (user_phone,
    # home phone, contact-phone).
    # pyparsing does not backtrack, so each number of words is an alternative.
    rule: >-
      ((Word(alphanums) + Optional(oneOf('_ -'))) * 1 + CaselessLiteral('phone'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 2 + CaselessLiteral('phone'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 3 + CaselessLiteral('phone'))
    type: field
    match: ppr
    priority: 2
  phoneknownprefix:
    key: phone
    is_pii: true
    name: Phone number by known pattern
    # phone, then digits or a word that names the phone (phone2, phone_mobile, phone-work,
    # phone_nr, phone_home_2). Other words do not match: phone_type, phone_verified,
    # phonetic.
    rule: >-
      CaselessLiteral('phone') + Optional(oneOf('_ -'))
      + (Word(nums) ^ (oneOf('number num no nr mobile cell home work office main primary secondary personal business contact other alt', caseless=True)
      + Optional(Optional(oneOf('_ -')) + Word(nums))))
    type: field
    match: ppr
    priority: 2
  faxknownpat:
    key: phone
    is_pii: true
    name: Phone number by known pattern (Fax)
    # The field name ends with the word fax after 1 to 3 other words (contact_fax,
    # office fax).
    # pyparsing does not backtrack, so each number of words is an alternative.
    rule: >-
      ((Word(alphanums) + Optional(oneOf('_ -'))) * 1 + CaselessLiteral('fax'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 2 + CaselessLiteral('fax'))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 3 + CaselessLiteral('fax'))
    type: field
    match: ppr
    priority: 2
  uniqueidbyknown:
    key: id
    name: Unique id by known names
    priority: 1
    match: text
    type: field
    rule: id,uniqueid,unique_id,uniqid,uniq_id,unique_key,uniquekey,uniqkey,record_id,objectid,object_id,id_unique,id_uniq,globalid,global_id
  booleanbooleanbyknown:
    key: boolean
    name: Boolean flag by field name
    match: text
    type: field
    rule: is_managed_internally,is_mandatory,is_public,is_long
    priority: 1
  activebooleanbyknown:
    key: boolean
    name: Active flag by field name
    match: text
    type: field
    rule: active,is_active,is_active_,isactive
    priority: 1
  enabledbooleanbyknown:
    key: boolean
    name: Enabled flag by field name
    match: text
    type: field
    rule: enabled,is_count_enabled_,is_enabled,service_enabled
    priority: 1
  emailbyknown:
    key: email
    name: Email address
    match: text
    type: field
    rule: email_cn,email_verified,user_email,unconfirmed_email
    priority: 1
  createdidbyknown:
    key: userid
    name: Creator user ID by field name
    match: text
    type: field
    rule: created_by_id,createdby_id,created_by_user_id,hr_created_by_id,createdByUuid,created_by,createdby
    priority: 1
  widthmeasurementbyknown:
    key: width_measurement
    name: Width by field name
    match: text
    type: field
    rule: width
    priority: 1
  deletedbooleanbyknown:
    key: boolean
    name: Deleted flag by field name
    match: text
    type: field
    rule: is_deleted
    priority: 1
  confirmedbooleanbyknown:
    key: boolean
    name: Confirmed flag by field name
    match: text
    type: field
    rule: is_confirmed
    priority: 1
  percentagemeasurementbyknown:
    key: percentage
    name: Percentage by field name
    match: text
    type: field
    rule: percentage,i_upper_limit_percentage,i_lower_limit_percentage,ic_upper_limit_percentage
    priority: 1
  pathfilebyknown:
    key: path_file
    name: Image file path by field name
    match: text
    type: field
    rule: image_path,imagepath,relate_image_path
    priority: 1
  modifiedidbyknown:
    key: userid
    name: Last editor user ID by field name
    match: text
    type: field
    rule: lastmodifiedby_id,lastmodifiedby,modified_by,updated_by
    priority: 1
  disabledbooleanbyknown:
    key: boolean
    name: Disabled flag by field name
    match: text
    type: field
    rule: disabled_m,is_disabled
    priority: 1
  sizemeasurementbyknown:
    key: datasize
    name: Volume size by field name
    match: text
    type: field
    rule: volume_size
    priority: 1
  lengthfilebyknown:
    key: datasize
    name: Data length by field name
    match: text
    type: field
    rule: msg_length,bin_length,ahrc_resource_length
    priority: 1
  heightmeasurementbyknown:
    key: height_measurement
    name: Height by field name
    match: text
    type: field
    rule: height
    # A height is a number (175, 3.2 m); a height column of tall and short is a class of the
    # sward height in grazing records (RDA-UNR dairy cow jaw movements).
    validator: metacrafterext.rules.common.fieldwork.validate_length_value
    priority: 1
  sizefilebyknown:
    key: datasize
    name: Data size by field name
    match: text
    type: field
    rule: byte_size,content_size_
    priority: 1
  mimetypebyknown1:
    key: mime_type
    name: Mime Type
    match: text
    type: field
    rule: mime
    priority: 1
  colourbyfield:
    key: color
    name: Colour by field name (colour, color, vehicle_colour) and colour names (Transparent, light blue)
    # Map layers write the fill and stroke colours as hex triplets in shortened shapefile names
    # (fill_colou, stroke_col: #f6b2ff).
    rule: (?i)(?:[a-z]+[ _])?colou?rs?(?:[ _](?:name|code))?|(?:fill|stroke|line|outline|text|font|route|background|bg)[ _]?(?:colou?r?|col)
    type: field
    match: regex
    validator: metacrafterext.rules.common.generic.validate_colour_name
    needs_values: true
    priority: 1
  # Found in the tables of the Plotly community feed (the VizNet corpus of Plotly charts, 2015 to 2018:
  # 1 090 629 charts, 1 013 540 distinct tables), whose columns are named after the traces of a chart
  # (x, y, labels), so the color of a trace or marker is found by its values; metacrafter-testdata.
  rgbacolorvalue:
    key: rgbacolor
    name: RGBA color by value (rgba(179,226,205,1), rgba(222, 45, 38, 0.8))
    rule: metacrafterext.rules.common.plotly.validate_rgba_color
    type: data
    match: func
    minlen: 13
    maxlen: 40
    priority: 1
  rgbcolorvalue:
    key: rgbcolor
    name: RGB color in the rgb() notation by value (rgb(31,120,180), rgb(255, 99, 71))
    rule: metacrafterext.rules.common.plotly.validate_rgb_color
    type: data
    match: func
    minlen: 10
    maxlen: 30
    priority: 1
  hslcolorvalue:
    key: hslcolor
    name: HSL color in the hsl() notation by value (hsl(0.0,50%,50%), hsl(120, 100%, 25%))
    rule: metacrafterext.rules.common.plotly.validate_hsl_color
    type: data
    match: func
    minlen: 13
    maxlen: 50
    priority: 1
  hexcolorvalue:
    key: hexcolor
    name: 'Hex color with a hash by value (#2ca02c, #1F77B4, #FFF)'
    rule: metacrafterext.rules.common.plotly.validate_hex_color
    type: data
    match: func
    minlen: 4
    maxlen: 7
    priority: 1
  # Found in the WDC Web Tables Corpus 2015 (tables of HTML pages that Web Data Commons extracted from the
  # Common Crawl of July 2015; 4 963 794 relational tables of 2 571 606 pages on 98 249 hosts in six
  # segments): priorities of the tickets of issue trackers (Trac, Drupal, Bugzilla, CurseForge) and of task lists; metacrafter-testdata.
  prioritylevelbyname:
    key: priority_level
    name: 'Priority by field name (priority, prio, importance, urgency, Priorität, priorité) with High, Normal, Critical, P1'
    rule: '(?i)(?:task|ticket|issue|bug|case|request|order|project|work|item)?[ _.]*(?:priorit(?:y|ies|ät|at|é|e|ad|à|a|eit)|prio\.?|importance|urgency|urgence|urgencia|dringlichkeit|wichtigkeit)(?:[ _.]*(?:level|class|rank))?'
    type: field
    match: regex
    validator: metacrafterext.rules.common.webtables.validate_priority_level
    needs_values: true
    priority: 1
  # Found in six more segments of the WDC Web Tables Corpus 2015 (tables of HTML pages of the Common Crawl of
  # July 2015; 4 978 140 relational tables of 2 555 031 pages on 98 133 hosts): heights of players on rosters in feet and inches;
  # metacrafter-testdata.
  heightfeetinchesbyname:
    key: height_feet_inches
    name: 'Height in feet and inches by field name (Ht., Ht, Hgt, Height (ft-in)) with 6-2, 5-11, 6''2"'
    rule: '(?i)ht\.?|hgt\.?|(?:player[ _])?(?:height|ht)[ _]?\((?:ft\.?(?:[ _/-]?in\.?)?|feet)\)'
    type: field
    match: regex
    validator: metacrafterext.rules.common.webtables.validate_height_feet_inches
    needs_values: true
    priority: 1
  heightfeetinchesmarkedbyname:
    key: height_feet_inches
    # 6-10 under Height alone is also a class of tree heights in metres (3-6, 6-10, 10-15 of a tree register)
    name: 'Height in feet and inches by field name (Height, Player Height) with 6''2", 5'' 10", 6 ft 2 in'
    rule: '(?i)(?:player[ _])?height'
    type: field
    match: regex
    validator: metacrafterext.rules.common.webtables.validate_height_feet_inches_value
    needs_values: true
    priority: 1
  heightfeetinchesvalue:
    key: height_feet_inches
    name: 'Height in feet and inches by value (6''2", 5'' 10", 6''1, 6 ft 2 in)'
    rule: metacrafterext.rules.common.webtables.validate_height_feet_inches_value
    type: data
    match: func
    minlen: 2
    maxlen: 12
    priority: 1
