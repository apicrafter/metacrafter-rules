name: common
description: Common data types (email, urls and etc)
context: common
lang: common
country_code: xx
rules:
  filenamebyknown:
    key: filename
    name: Name of the file by known name
    maxlen: 512
    minlen: 5
    priority: 1
    match: text
    type: field
    rule: filename,file_name
  fileextensionbyknown:
    key: file_extension
    name: File name extension by known name
    priority: 1
    match: text
    type: field
    rule: file_extension,fileextension,file_ext,fileext
  fileextensionbyvalue:
    key: file_extension
    name: File name extension by value in an extension field
    minlen: 1
    maxlen: 11
    priority: 1
    match: ppr
    type: data
    rule: Optional(Literal('.')) + Word(alphas, alphanums, max=10)
    fieldrule: extension,extensions,ext
    fieldrulematch: text
  mimetypebyknown:
    key: mimetype
    name: Mimetype / content type by known names
    priority: 1
    match: text
    type: field
    rule: mimetype,mime_type,content_type
  mimetypebyvalue:
    key: mimetype
    name: Mimetype / content type by value
    priority: 2
    maxlen: 100
    minlen: 10
    match: text
    type: data
    rule: application/pdf,application/json,application/octet-stream,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.wordprocessingml.document,image/jpeg,image/tiff,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/zip,text/csv,text/plain,application/vnd.google-earth.kml+xml,application/x-zip-compressed,application/vnd.geo+json,application/vnd.ms-excel.sheet.macroenabled.12,application/vnd.openxmlformats-officedocument.presentationml.presentation,text/xml,application/csv,text/html,application/rdf+xml,image/png,text/tab-separated-values,application/geo+json,application/vnd.geo+json,application/gzip,application/vnd.google-earth.kmz,application/x-tar
  phoneknown:
    key: phone
    is_pii: true
    name: Phone number by known name
    rule: phone,fax,contact_phone,telephone,phone number,phone_number,business_phone,phonenumber,phone_no,contactphone,phone_1,phone1,phone2,fax_number,contact_fax,cellphon,mobile_phone_number,other_mobile,telephone_number,telephonenumber
    type: field
    match: text
    priority: 1
  phoneknownpat:
    key: phone
    is_pii: true
    name: Phone number by known pattern
    rule: Word(printables) + "phone" +  lineEnd
    type: field
    match: ppr
    priority: 2
  phoneknownprefix:
    key: phone
    is_pii: true
    name: Phone number by known pattern
    rule: Literal('phone') + Word(printables) + lineEnd
    type: field
    match: ppr
    priority: 2
  faxknownpat:
    key: phone
    is_pii: true
    name: Phone number by known pattern (Fax)
    rule: Word(printables) + "fax" +  lineEnd
    type: field
    match: ppr
    priority: 2
  uniqueidbyknown:
    key: id
    name: Unique id by known names
    priority: 1
    match: text
    type: field
    rule: id,uniqueid,unique_id,uniqid,uniq_id,unique_key,uniquekey,uniqkey,record_id,objectid,object_id,id_unique,id_uniq,globalid,global_id
  booleanbooleanbyknown:
    key: boolean
    name: Boolean flag by field name
    match: text
    type: field
    rule: is_managed_internally,is_mandatory,is_public,is_long
    priority: 1
  activebooleanbyknown:
    key: boolean
    name: Active flag by field name
    match: text
    type: field
    rule: active,is_active,is_active_,isactive
    priority: 1
  enabledbooleanbyknown:
    key: boolean
    name: Enabled flag by field name
    match: text
    type: field
    rule: enabled,is_count_enabled_,is_enabled,service_enabled
    priority: 1
  emailbyknown:
    key: email
    name: Email address
    match: text
    type: field
    rule: email_cn,email_verified,user_email,unconfirmed_email
    priority: 1
  createdidbyknown:
    key: userid
    name: Creator user ID by field name
    match: text
    type: field
    rule: created_by_id,createdby_id,created_by_user_id,hr_created_by_id,createdByUuid,created_by,createdby
    priority: 1
  widthmeasurementbyknown:
    key: width_measurement
    name: Width by field name
    match: text
    type: field
    rule: width
    priority: 1
  deletedbooleanbyknown:
    key: boolean
    name: Deleted flag by field name
    match: text
    type: field
    rule: is_deleted
    priority: 1
  confirmedbooleanbyknown:
    key: boolean
    name: Confirmed flag by field name
    match: text
    type: field
    rule: is_confirmed
    priority: 1
  percentagemeasurementbyknown:
    key: percentage
    name: Percentage by field name
    match: text
    type: field
    rule: percentage,i_upper_limit_percentage,i_lower_limit_percentage,ic_upper_limit_percentage
    priority: 1
  pathfilebyknown:
    key: path_file
    name: Image file path by field name
    match: text
    type: field
    rule: image_path,imagepath,relate_image_path
    priority: 1
  modifiedidbyknown:
    key: userid
    name: Last editor user ID by field name
    match: text
    type: field
    rule: lastmodifiedby_id,lastmodifiedby,modified_by,updated_by
    priority: 1
  disabledbooleanbyknown:
    key: boolean
    name: Disabled flag by field name
    match: text
    type: field
    rule: disabled_m,is_disabled
    priority: 1
  sizemeasurementbyknown:
    key: datasize
    name: Volume size by field name
    match: text
    type: field
    rule: volume_size
    priority: 1
  lengthfilebyknown:
    key: datasize
    name: Data length by field name
    match: text
    type: field
    rule: msg_length,bin_length,ahrc_resource_length
    priority: 1
  heightmeasurementbyknown:
    key: height_measurement
    name: Height by field name
    match: text
    type: field
    rule: height
    priority: 1
  sizefilebyknown:
    key: datasize
    name: Data size by field name
    match: text
    type: field
    rule: byte_size,content_size_
    priority: 1
  mimetypebyknown1:
    key: mime_type
    name: Mime Type
    match: text
    type: field
    rule: mime
    priority: 1
