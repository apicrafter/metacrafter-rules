name: values
description: Numerical/float values
context: values
lang: common
country_code: xx
rules:
  percentagebyfield:
    key: percentage
    name: Percentage field
    # The field name ends with the word percent or percentage after 1 to 3 other
    # words (tax_percent, discount percentage).
    # pyparsing does not backtrack, so each number of words is an alternative.
    rule: >-
      ((Word(alphanums) + Optional(oneOf('_ -'))) * 1 + oneOf('percent percentage', caseless=True))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 2 + oneOf('percent percentage', caseless=True))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 3 + oneOf('percent percentage', caseless=True))
    type: field
    priority: 1
    match: ppr
  moneyamountbyfield:
    key: money
    name: Money amount by field name (several languages)
    # Amount, total_amount, contract_amount; importe / monto / montant / betrag / bedrag /
    # importo with any suffix (IMPORTE ADJUDICACION IVA INC., MONTO_DEFINITIVO, Bedrag (x1000)); presupuesto
    # (Presupuesto Oficial o adjudicado, PRESUPUESTO TOTAL IVA INC.).
    rule: (?i)(?:(?:total|contract|grant|award|awarded|payment|paid|invoice|net|gross|budget|budgeted|estimated|transaction)[ _.-]?)?amount(?:[ _.-]?(?:eur|usd|gbp|\(\w+\)))?|(?:importe|monto|montant|betrag|bedrag|importo|presupuesto)(?:[ _.(-].*)?
    type: field
    match: regex
    priority: 1
  areabyfield:
    key: area
    name: Area (surface measure) by field name
    # Fläche, FLAECHE, Fläche km², ALAND, AWATER, Shape__Area, superficie_ha, oppervlakteTotaalInHa,
    # Terület, площадь, basin_area. A bare "area" often names a region, so it needs a unit or a qualifier.
    rule: (?i)(?:[\w-]+:)?(?:fl(?:ä|ae)che|terület|terulet|площадь|площа|powierzchnia|superficie|m?superf|oppervlakte|aland|awater|shape_{1,2}area|st_area(?:\(shape\))?|(?:total|land|water|surface|floor|site|plot|gross_floor|basin|catchment|drainage)[ _]?area|area[ _]?(?:km2|km²|sqkm|sq_km|ha|m2|m²))(?:[ _]?(?:totaal(?:inha)?(?:_\d+)?|\d+|in_?ha|\(?(?:km2|km²|m2|m²|ha)\)?))?(?:\s*[¹²³⁴⁵⁶⁷⁸⁹⁰⁾)*]+)?
    type: field
    match: regex
    priority: 1
  moneyrangebyname:
    key: money_range
    name: Money range by field name (Taxable income range, Total Income 2019/20, Total assets, turnover, grant value) with band values
    # ATO taxation statistics, the ORIC register and grant lists give income, assets, turnover,
    # tax or grant value as bands ($100K - $5m, b. $18,201 to $37,000, Loss/nil); amounts of the
    # same names are money, which the band validator refuses.
    rule: (?i)(?:[a-z]+[ _])*(?:income|assets?|turnover|tax(?:able)?|revenue|debts?|grant[ _]value|value[ _]of[ _]assets|funding|assessment|loss|salary|wages?)(?:[ _](?:or[ _]loss|or[ _]net[ _]income|income|assessment))?(?:[ _](?:range|ranges|band|bands|bracket|brackets|group))?(?:[ _-]+tax[ _]brackets)?(?:[ _](?:19|20)\d{2}(?:[/_-]\d{2,4})?)?\d*
    type: field
    match: regex
    validator: metacrafterext.rules.common.periods.validate_money_range
    needs_values: true
    priority: 1
  temperaturebyname:
    key: temperature
    name: Temperature by field name (temperature, Temperatur, air_temperature, temperature_c) with numbers
    # Temperatur is the German and Nordic word and the dBase-truncated Temperature (isotherms of
    # ArmSIS). A bare temp is a temporary value as often.
    # The columns of a Davis WeatherLink export (hi_temp, low_temp, in_temp, dew_point, wind_chill,
    # heat_index, thw_index; temo_out of the Mendoza air quality network) and the Spanish
    # temperatura with its qualifiers (temperatura_grados_centigrados_momento_medicion).
    rule: (?i)(?:(?:air|water|soil|sea|surface|mean|avg|average|max|min|maximum|minimum|daily|annual|monthly)[ _-]?)?temperat(?:ure|ur)(?:[ _-]?(?:c|°c|degc|deg_c|celsius|mean|avg|max|min|\(°c\)|\(c\)))?|(?:hi|high|low|lo|out|in)_?temp|temp_?(?:out|in|hi|low)|temo_out|dew_?point|in_dew|wind_?chill|heat_?index|in_heat|thw_?index|temperatura(?:[ _]+[a-záéíóú]+)*
    type: field
    match: regex
    validator: metacrafterext.rules.common.fieldwork.validate_temperature_value
    needs_values: true
    priority: 1
  temperaturebysensorname:
    key: temperature
    name: Temperature by the field name of a sensor payload (payload_fields_optod_temperature, uplink_message_decoded_payload_temp, object_temperature)
    # The probes of the Camden Council stormwater sensors (pheht, optod, ntu, c4e) each report the
    # water temperature next to their reading.
    rule: (?i)(?:(?:uplink_message_)?(?:decoded_)?payload(?:_fields)?|object)[._](?:[a-z0-9]{2,8}[._])?(?:temperature|temp)(?:[._]?(?:c|degc|celsius))?
    type: field
    match: regex
    validator: metacrafterext.rules.common.fieldwork.validate_temperature_value
    needs_values: true
    priority: 1
  energyamountbyname:
    key: energy_amount
    name: Amount of energy by field name (energy_generated, energy_kwh, kwh_consumed, electricity_consumption_kwh) with numbers
    # energy_generated of the Camden Council solar systems is in kWh; energy_rating, energy_class and
    # energy_source are no amounts (the names stop at the unit or a verb).
    rule: (?i)(?:(?:total|net|daily|monthly|annual|hourly|solar|pv|grid|site|electrical|electric|electricity)[ _])?(?:energy(?:[ _](?:generated|generation|produced|production|consumed|consumption|used|usage|exported|imported|export|import|output|yield|delivered|total))?(?:[ _]?(?:kwh|wh|mwh|gwh|gj|mj|kj|\(kwh\)|\(mwh\)|\(kj\)|\(gj\)))?|(?:kwh|mwh|gwh)(?:[ _](?:generated|produced|consumed|used|exported|imported|total))?|(?:electricity|power)[ _](?:generated|generation|consumption|consumed|used|usage|exported|imported)(?:[ _]?(?:kwh|mwh|gwh|\(kwh\)))?)
    type: field
    match: regex
    validator: metacrafterext.rules.common.waterquality.validate_energy_amount
    needs_values: true
    priority: 1
