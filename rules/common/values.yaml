name: values
description: Numerical/float values
context: values
lang: common
country_code: xx
rules:
  percentagebyfield:
    key: percentage
    name: Percentage field
    # The field name ends with the word percent or percentage after 1 to 3 other
    # words (tax_percent, discount percentage).
    # pyparsing does not backtrack, so each number of words is an alternative.
    rule: >-
      ((Word(alphanums) + Optional(oneOf('_ -'))) * 1 + oneOf('percent percentage', caseless=True))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 2 + oneOf('percent percentage', caseless=True))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 3 + oneOf('percent percentage', caseless=True))
    type: field
    priority: 1
    match: ppr
  moneyamountbyfield:
    key: money
    name: Money amount by field name (several languages)
    # Amount, total_amount, contract_amount; importe / monto / montant / betrag / bedrag /
    # importo with any suffix (IMPORTE ADJUDICACION IVA INC., MONTO_DEFINITIVO, Bedrag (x1000)).
    rule: (?i)(?:(?:total|contract|grant|award|awarded|payment|paid|invoice|net|gross|budget|budgeted|estimated|transaction)[ _.-]?)?amount(?:[ _.-]?(?:eur|usd|gbp|\(\w+\)))?|(?:importe|monto|montant|betrag|bedrag|importo)(?:[ _.(-].*)?
    type: field
    match: regex
    priority: 1
