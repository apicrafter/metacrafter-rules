name: commonperiods
description: Financial years, months with a year and quarters with a year (found in the data.gov.au files of metacrafter-testdata)
context: datetime
lang: common
country_code: xx
rules:
  fiscalyearbyname:
    key: fiscal_year
    name: Financial or fiscal year by field name (Financial Year, Income year, Water Year, financial_year_start, FY)
    # Australian, New Zealand, British and Indian tables name the year a financial, fiscal, income,
    # tax, water or budget year; the values must be two consecutive years (2014-15, 2014-2015).
    rule: (?i)(?:(?:financial|fiscal|income|tax|taxation|water|budget|reporting|report|first[ _]reporting|latest[ _]report|earliest[ _]report)[ _]?year\d*(?:[ _](?:start|end|ending))?|fy|f[ _]y|fin[ _]?yr)
    type: field
    match: regex
    validator: metacrafterext.rules.common.periods.validate_fiscal_year
    needs_values: true
    priority: 1
  fiscalyearvalue:
    key: fiscal_year
    name: Financial year with a two-digit second year or an FY prefix by value (2014-15, 2010–11, 1999-00, FY201213)
    # Two four-digit years (2019-2020) are year_range by value; a field name tells a financial year.
    rule: metacrafterext.rules.common.periods.validate_fiscal_year_short
    type: data
    match: func
    minlen: 7
    maxlen: 10
    priority: 1
  yearmonthenglishvalue:
    key: yearmonth_english
    name: Month and year with an English month name by value (Sep-17, Aug-2011, June 2014)
    rule: metacrafterext.rules.common.periods.validate_yearmonth_english
    type: data
    match: func
    minlen: 6
    maxlen: 14
    priority: 1
  yearquartervalue:
    key: year_quarter
    name: Quarter with its year by value (2021Q04, 2022Q03, 2021 Q4, Q4 2021)
    rule: metacrafterext.rules.common.periods.validate_year_quarter
    type: data
    match: func
    minlen: 6
    maxlen: 8
    priority: 1
  # Found in the open data of the City of Buenos Aires (data.buenosaires.gob.ar, a 2024 snapshot;
  # metacrafter-testdata).
  yearmonthbyname:
    key: yearmonth
    name: Year and month by field name (periodo, PERIODO, anio_mes, year_month, yyyymm) with 201909, 2019-09 or 09/2019
    # A periodo of years (2016) or of quarters is not one.
    rule: (?i)per[ií]odos?(?:[ _](?:liquidaci[oó]n|fiscal|informado|mensual))?|a[ñn]i?o[ _]?mes|mes[ _]?a[ñn]i?o|yyyy[ _-]?mm|year[ _-]?month|month[ _-]?year|anomes|(?:id[ _])?ejercicio[ _/-]?mes
    type: field
    match: regex
    validator: metacrafterext.rules.common.urban.validate_yearmonth
    needs_values: true
    priority: 1
  yearbyperiodoname:
    key: year
    name: Year in a periodo field (periodo, PERIODO, período) with calendar years
    rule: (?i)per[ií]odos?
    type: field
    match: regex
    validator: metacrafterext.rules.common.urban.validate_calendar_year
    needs_values: true
    priority: 1
  # Monthly tables of data.gov.cy name the column Month and fill it with 01/2020 (22 fields of the April
  # 2024 snapshot; metacrafter-testdata): the month rule refuses a year with a month.
  yearmonthbymonthname:
    key: yearmonth
    name: Year and month in a field named month (Month, MONTH, Μήνας, mes, mois, Monat) with 01/2020 or 2020-01
    rule: (?i)months?|μ[ηή]νας|mes|mois|monat|maand
    type: field
    match: regex
    validator: metacrafterext.rules.common.urban.validate_yearmonth
    needs_values: true
    priority: 1
  # The weekly COVID-19 tables of the Ministry of Health of Cyprus: 2021-W32, 2021-1, 2022 - 16.
  isoweekbyname:
    key: iso_week
    name: ISO week by field name (YearWeekISO, ISO Week, iso_week, year_week, yearweek) with 2021-W32, 2021-1 or 2022 - 16
    rule: (?i)year[ _-]?week(?:[ _-]?iso)?|iso[ _-]?(?:year[ _-]?)?week|week[ _-]?iso|epi[ _-]?week[ _-]?iso
    type: field
    match: regex
    validator: metacrafterext.rules.common.eucodes.validate_iso_week_loose
    needs_values: true
    priority: 1
  # season of field surveys of DataverseNO (Summer, Winter); the season of a cyclone or of a sport is a year
  # (1897, 1986/87).
  seasonbyname:
    key: season
    name: Season of the year by field name (season, Season, season_name, sampling_season) with Summer, Winter
    rule: (?i)(?:[a-z]+[ _])?seasons?(?:[ _]name)?
    type: field
    match: regex
    validator: metacrafterext.rules.common.periods.validate_season_name
    needs_values: true
    priority: 1
