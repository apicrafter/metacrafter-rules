# This rule generates a lot of False positives so it marked as imprecise rule and could be filtered if it's set
# Short language codes (2-5 chars) match many common words and abbreviations, so the value
# rule applies only to fields named as language codes or locales.
  languagetagfield:
    key: languagetag
    name: IETF language tag by field name
    rule: lang,lang_code,langcode,language_code,languagecode,language_tag,languagetag,locale,locales
    type: field
    match: text
    # Language tags have letters (fi, sv-FI); the YTJ languageCode holds numbers (1, 2, 3) (#69).
    validator: metacrafterext.rules.common.identifiers.validate_language_tag
    priority: 1
  languagetag:
    key: languagetag
    name: IETF language tags (RFC 5646)
    rule: en-gb,af,am,ar,arn,as,az,ba,be,bg,bn,bo,br,bs,ca,co,cs,cy,da,de,dsb,dv,el,en,es,et,eu,fa,fi,fil,fo,fr,fy,ga,gd,gl,gsw,gu,ha,he,hi,hr,hsb,hu,hy,id,ig,ii,is,it,iu,ja,ka,kk,kl,km,kn,ko,kok,ky,lb,lo,lt,lv,mi,mk,ml,mn,moh,mr,ms,mt,my,nb,ne,nl,nn,no,nso,oc,or,pa,pl,prs,ps,pt,quc,quz,rm,ro,ru,rw,sa,sah,se,si,sk,sl,sma,smj,smn,sms,sq,sr,sv,sw,syr,ta,te,tg,th,tk,tn,tr,tt,tzm,ug,uk,ur,uz,vi,wo,xh,yo,zh,zu
    maxlen: 5
    minlen: 2
    type: data
    match: text
    validator: metacrafterext.rules.common.identifiers.validate_language_tag
    fieldrule: lang,lang_code,langcode,language_code,languagecode,language_tag,languagetag,languages,locale,locales,inlanguage,in_language
    fieldrulematch: text
  oecdcrspurposecodefield:
    key: oecd_crs_purpose_code
    name: OECD DAC CRS purpose code by field name (Sector code)
    # IATI and ODA spending data name the CRS purpose code a sector code; the code must start
    # with a DAC sector (41030 starts with 410).
    rule: (?i)(?:dac[ _]?|crs[ _]?|oecd[ _]?|iati[ _]?)?(?:sector|purpose)[ _]?code|crs[ _]?purpose|dac[ _]?5[ _]?code|sector[ _]?\(dac\)
    type: field
    match: regex
    validator: metacrafterext.rules.common.identifiers.validate_crs_purpose_code
    priority: 1
  iatiorganisationreffield:
    key: iati_organisation_ref
    name: IATI organisation identifier by field name (IATI Identifier, reporting-org ref)
    rule: (?i)iati[ _]?(?:identifi?er|org(?:anisation)?[ _]?(?:id|ref|identifier))|reporting[ _-]?org(?:anisation)?[ _.-]?ref
    type: field
    match: regex
    validator: metacrafterext.rules.common.identifiers.validate_iati_org_ref
    priority: 1
