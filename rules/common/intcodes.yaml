    type: data
    # Same field guard as iso3166-alpha2.
    fieldrule: >-
      (CaselessLiteral('country') + ZeroOrMore(Word(printables)))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 1 + CaselessLiteral('country') + ZeroOrMore(Word(printables)))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 2 + CaselessLiteral('country') + ZeroOrMore(Word(printables)))
