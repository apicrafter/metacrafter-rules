    maxlen: 2
    minlen: 2
    priority: 1
    match: text
    type: data
    fieldrule: landkode,landskode,landskod,landkod,landcode,landecode,ländercode,laendercode,länderkennung,code_pays,codepays,code pays,code_du_pays,pays_code,codigo_pais,código país,código de país,cod_pais,codice_paese,codice paese,kod_kraju,kod kraju,kód země,kod_zeme,maakood,maatunnus,valsts_kods,valsts kods,šalies kodas,salies_kodas,országkód,код страны,код_страны,код країни,ülke kodu,ulke_kodu,国家代码,국가코드
