    minlen: 2
    priority: 1
    match: text
    type: data
    # The field name has a word that starts with country: country, country_code, countrycode,
    # birth_country, place of birth country. pyparsing does not backtrack, so each
    # alternative fixes the number of words before it (0 to 3); words are separated by _, - or
    # spaces.
    fieldrule: >-
      (CaselessLiteral('country') + ZeroOrMore(Word(printables)))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 1 + CaselessLiteral('country') + ZeroOrMore(Word(printables)))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 2 + CaselessLiteral('country') + ZeroOrMore(Word(printables)))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 3 + CaselessLiteral('country') + ZeroOrMore(Word(printables)))
    fieldrulematch: ppr
  iso3166-alpha3:
