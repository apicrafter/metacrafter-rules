name: educationcommon
description: Education classifications and registers (ISCED 2011 programme codes, ISCED-F 2013 fields, ETER identifiers)
context: education
lang: common
country_code: xx
rules:
  # ARES (Fédération Wallonie-Bruxelles) classifies studies by ISCED-F 2013, in French CITE 2013:
  # code_grand_domaine (broad field 04), code_domaine_specialise (narrow 041), code_domaine_detaille
  # and code_domaine_cite (detailed 0413).
  iscedf2013byname:
    key: isced_f_2013
    name: ISCED-F 2013 field of education by field name (code_grand_domaine, code_domaine_cite, isced_f, field_of_education_code)
    rule: (?i)(?:code[ _])?(?:grand[ _]domaine|domaine[ _](?:specialise|sp[ée]cialis[ée]|detaille|d[ée]taill[ée]|cite|isced)|domaine[ _]d[ _]etudes[ _]cite)|isced[ _-]?f(?:[ _-]?2013)?(?:[ _-]?(?:code|broad|narrow|detailed)(?:[ _-]field)?)?|(?:cite|isced)[ _-]?2013(?:[ _-]?code)?|field[ _]of[ _]education(?:[ _]and[ _]training)?[ _]code
    type: field
    match: regex
    validator: metacrafterext.rules.common.education.validate_isced_f_2013
    needs_values: true
    priority: 1
  isced2011programmecodebyname:
    key: isced2011_programme_code
    name: ISCED 2011 three-digit programme or attainment code by field name (code_grade_generique_cite, isced_2011, isced_p, isced_a)
    rule: (?i)(?:code[ _])?(?:grade|niveau|level|programme|program)(?:[ _][a-z]+)?[ _](?:cite|isced)(?:[ _]?2011)?|(?:cite|isced)[ _-]?(?:2011|p|a)(?:[ _-]?(?:code|level|niveau))?|isced[ _-]?(?:2011[ _-]?)?(?:programme|attainment)[ _-]?code
    type: field
    match: regex
    validator: metacrafterext.rules.common.education.validate_isced2011_programme_code
    needs_values: true
    priority: 1
  eteridbyname:
    key: eter_id
    name: ETER identifier by field name (eter_id, identifiant_eter, eter)
    rule: (?i)(?:identifiant|code|id|num(?:ero)?)?[ _]?eter(?:[ _]?(?:id|code|identifier))?
    type: field
    match: regex
    validator: metacrafterext.rules.common.education.validate_eter_id
    needs_values: true
    priority: 1

  # ------------------------------------------------------------ school names
  # Found in 2024 snapshots of UK open data portals (Calderdale Data Works, Cambridgeshire Insight, data.gov.uk;
  # Dateno sources cdi00000764, cdi00000786 and cdi00000793; metacrafter-testdata): 125 distinct tables name
  # the school in a School or School name column. A number or a flag under the name fails the validator.
  schoolnamebyname:
    key: school_name
    name: School name by field name (School, School name, Name of school) with Abbey Park Academy
    rule: (?i)school(?:[ _]?name)?|name[ _]of[ _](?:the[ _])?school
    type: field
    match: regex
    validator: metacrafterext.rules.gb.portals.validate_school_name
    needs_values: true
    priority: 1
  # Gradebooks, grade distributions and timetables of the Many Eyes archive (IBM Many Eyes, 2007 to 2012).
  lettergradebyname:
    key: letter_grade
    name: Letter grade by field name (grade, letter grade, final grade, course grade) with A, A-, B+, F
    rule: (?i)(?:(?:letter|final|course|overall|mid[ _]?term|exam|class|semester|term)[ _]?)?grades?(?:[ _](?:letter|awarded|earned|received|achieved))?|letter[ _]?grade|grade[ _]?letter
    type: field
    match: regex
    validator: metacrafterext.rules.common.manyeyes.validate_letter_grade
    needs_values: true
    priority: 1
  coursecodebyname:
    key: course_code
    name: Course code by field name (course, course code, unit code, module code, courses offered) with CSI 101, ACTG3000
    rule: (?i)\(?(?:courses?|class|unit|module|subject|paper)(?:[ _]?(?:code|id|no\.?|num(?:ber)?|key|offered|taken|\d))?\)?|course[ _]?(?:taken|offered)|c[oó]d(?:igo)?[ _](?:do[ _]|del[ _])?(?:curso|disciplina|asignatura|materia)
    type: field
    match: regex
    validator: metacrafterext.rules.common.manyeyes.validate_course_code
    needs_values: true
    priority: 1
  # Found in the WDC Web Tables Corpus 2015 (tables of HTML pages that Web Data Commons extracted from the
  # Common Crawl of July 2015; 4 963 794 relational tables of 2 571 606 pages on 98 249 hosts in six
  # segments): class standings of the rosters and statistics of college teams (Yr, Cl., Class) and academic terms of course lists and schedules; metacrafter-testdata.
  classstandingbyname:
    key: class_standing
    name: 'Class standing by field name (Yr, Cl., Class, Year, Eligibility) with Fr., So., Jr., Sr., R-Fr.'
    rule: '(?i)(?:class|cl|yr|year|academic)(?:[ _.]*(?:year|standing|level|in[ _]school|/?class|/?exp\.?|/?elig\.?))?\.?|class(?:ification)?|elig(?:ibility)?\.?(?:[ _]year)?|(?:student|academic)[ _](?:classification|standing|level)|yr\.?[ _/]?cl\.?|grade[ _]level'
    type: field
    match: regex
    validator: metacrafterext.rules.common.webtables.validate_class_standing
    needs_values: true
    priority: 1
  classstandingvalue:
    key: class_standing
    name: 'Class standing by value (Freshman, Sophomore, Fr., So., R-Fr., Redshirt Junior)'
    rule: metacrafterext.rules.common.webtables.validate_class_standing_value
    type: data
    match: func
    minlen: 2
    maxlen: 30
    priority: 1
  academictermbyname:
    key: academic_term
    name: 'Academic term by field name (term, semester, academic term, session, year & term) with Fall 2015, Sp 2011'
    rule: '(?i)(?:academic|school|course|class|start|entry|admit|enrol?led|effective|catalog|next)?[ _.]*(?:terms?|semesters?|trimesters?|sessions?)(?:[ _.]*(?:name|code|desc(?:ription)?|offered|taken|year))?|year[ _]*(?:&|and)[ _]*(?:term|semester)|(?:term|semester)[ _]*(?:&|and|/)[ _]*year|semestre|cuatrimestre|periodo(?:[ _]acad[eé]mico)?|eff\.?[ _]date'
    type: field
    match: regex
    validator: metacrafterext.rules.common.webtables.validate_academic_term
    needs_values: true
    priority: 1
  academictermvalue:
    key: academic_term
    name: 'Academic term by value (Fall 2015, Spring Semester 2016, Summer Term 2015, 2013 Fall)'
    rule: metacrafterext.rules.common.webtables.validate_academic_term_value
    type: data
    match: func
    minlen: 6
    maxlen: 40
    priority: 1
  # Found in six more segments of the WDC Web Tables Corpus 2015 (tables of HTML pages of the Common Crawl of
  # July 2015; 4 978 140 relational tables of 2 555 031 pages on 98 133 hosts): grade spans of schools in real estate listings and school
  # directories, and meeting days of course schedules; metacrafter-testdata.
  gradespanbyname:
    key: grade_span
    name: 'Grade span by field name (Grades, Grade Span, Grade Levels, Grades Served) with K-5, 6-8, 9-12, PK-8'
    rule: '(?i)(?:school[ _])?grades?(?:[ _](?:span|range|levels?|served|offered|taught|band))?|grade[ _]?(?:span|range)|gr\.?[ _]?(?:span|range)|grades?[ _]?\(?k-12\)?'
    type: field
    match: regex
    validator: metacrafterext.rules.common.webtables.validate_grade_span
    needs_values: true
    priority: 1
  gradespanvalue:
    key: grade_span
    name: 'Grade span by value (K-5, PK-8, KG - 12, Pre-K - 5)'
    rule: metacrafterext.rules.common.webtables.validate_grade_span_value
    type: data
    match: func
    minlen: 3
    maxlen: 20
    priority: 1
  classmeetingdaysbyname:
    key: class_meeting_days
    name: 'Meeting days of a class by field name (Days, Day(s), Meeting Days, Class Days, Days Met) with MWF, TR, TTh'
    rule: '(?i)days?(?:[ _]?\(s\))?|meeting[ _]days?|class[ _]?days?|days?[ _](?:met|of[ _](?:class(?:es)?|week))|mtg\.?[ _]days?|days?[ _]?/[ _]?times?|day[ _]?/[ _]?time|meets|meeting[ _]pattern'
    type: field
    match: regex
    validator: metacrafterext.rules.common.webtables.validate_class_meeting_days
    needs_values: true
    priority: 1
