name: common-geo-text
description: Geometries and subdivision codes written as text in table cells
context: geo
lang: common
country_code: xx
rules:
  geojsongeometrytext:
    key: geojson
    name: GeoJSON geometry written as text in a table cell ({"type":"Point","coordinates":[-58.66,-34.48]})
    # Energy data of datos.gob.ar (Argentina) keep a geojson column next to the WKB geometry (geom).
    rule: metacrafterext.rules.common.generic.validate_geojson_geometry_text
    type: data
    match: func
    minlen: 30
    maxlen: 100000
    priority: 1
  geojsongeometrylongtext:
    key: geojson
    name: GeoJSON geometry of more than 100 000 characters written as text in a table cell
    # The boundary of a whole council area: the geo_shape of the Camden LGA boundary (Opendatasoft)
    # is one polygon of 200 202 characters. The validator reads only the first characters and the
    # last 200. metacrafter before apicrafter/metacrafter#128 refuses a maxlen above 100 000 and
    # skips this rule with a diagnostic; the rule above still covers the shorter geometries.
    rule: metacrafterext.rules.common.generic.validate_geojson_geometry_text
    type: data
    match: func
    minlen: 100001
    maxlen: 10000000
    priority: 1
  kmlcoordinatestext:
    key: kml_coordinates
    name: KML coordinates written as text in a table cell (-68.968,-81.147,0.0 -72.557,-79.672,0.0)
    # The Ku and C band footprints of the ARSAT satellites (Argentina) are KML polygons exported to
    # CSV with the coordinates element of each ring in one cell.
    rule: metacrafterext.rules.common.generic.validate_kml_coordinates
    type: data
    match: func
    minlen: 7
    maxlen: 100000
    priority: 1
  iso3166subdivisionbyname:
    key: iso3166code
    name: ISO 3166-2 subdivision code by field name (iso_id, iso_3166_2) with the country code (AR-C, DE-BY)
    # iso_region of OurAirports (SL-N, US-CA).
    rule: (?i)iso[ _-]?(?:3166[ _-]?2|id|region|subdivision(?:[ _-]?code)?)(?:[ _-]?code)?|subdivision[ _-]?code
    type: field
    match: regex
    validator: metacrafterext.rules.common.generic.validate_iso3166_2_code
    needs_values: true
    priority: 1
