name: crossborder-finance
description: Cross-border banking and payment identifiers
context: finances
lang: common
country_code: xx
rules:
  ibanfield:
    key: iban
    name: International Bank Account Number by field name
    rule: iban,iban_account,iban_number,international_bank_account
    type: field
    priority: 3
    match: text
  ibanvalue:
    key: iban
    name: International Bank Account Number by value pattern
    match: ppr
    type: data
    rule: Word('ABCDEFGHIJKLMNOPQRSTUVWXYZ', exact=2) + Word(nums, exact=2) + Word('ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789', min=1, max=4) + ZeroOrMore(Word('ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789', min=1, max=4))
    maxlen: 42
    minlen: 15
    validator: metacrafterext.rules.common.identifiers.validate_iban
  bicfield:
    key: bic
    name: SWIFT/BIC code by field name
    # BIC code, BIC kód (SWIFT), SWBICS/@SWBIC (Bank of Russia ED807): names with bic or swift,
    # whose values are BICs.
    rule: (?i)(?:.*[ _.@(-])?(?:bic|swift|swift_code|swiftbic|swbic|swbics)(?:[ _.)-].*)?
    type: field
    priority: 1
    match: regex
    validator: metacrafterext.rules.common.generic.validate_bic_country
  bicvalue:
    key: bic
    name: SWIFT/BIC code by value pattern
    match: ppr
    type: data
    rule: Word('ABCDEFGHIJKLMNOPQRSTUVWXYZ', exact=4) + Word('ABCDEFGHIJKLMNOPQRSTUVWXYZ',
      exact=2) + Word('ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789', exact=2) + Optional(Word('ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',
      exact=3))
    maxlen: 11
    minlen: 8
    # Positions 5-6 are an ISO 3166 country code: STIMMBEZIRK is not a BIC. By value alone
    # a BIC needs a digit in its location or branch code (or branch XXX): ACCEPTED, DECISION
    # and REORGANIZED have the shape of a BIC of letters (#61); bicfield finds those.
    validator: metacrafterext.rules.common.generic.validate_bic_value
  leifield:
    key: lei
    name: Legal Entity Identifier by field name
    rule: lei,legal_entity_identifier,lei_code,lei_number,legal_entity_id
    type: field
    match: text
    priority: 1
  leivalue:
    key: lei
    name: Legal Entity Identifier by value pattern
    match: ppr
    type: data
    rule: Word('0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ', exact=18) + Word(nums, exact=2)
    maxlen: 20
    minlen: 20
    priority: 1
    validator: metacrafterext.rules.common.identifiers.validate_lei
  figifield:
    key: figi
    name: Financial Instrument Global Identifier by field name
    rule: figi,financial_instrument_identifier,bbgid,bloomberg_id,figi_code
    type: field
    match: text
    priority: 1
  figivalue:
    key: figi
    name: Financial Instrument Global Identifier by value pattern
    match: ppr
    type: data
    rule: Word('0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ', exact=12)
    maxlen: 12
    minlen: 12
    priority: 1
    validator: metacrafterext.rules.common.identifiers.validate_figi
  isinfield:
    key: isin
    name: International Securities Identification Number by field name
    rule: isin,isin_code,isin_number,security_id,security_identifier
    type: field
    match: text
    priority: 1
  isinvalue:
    key: isin
    name: International Securities Identification Number by value pattern
    match: ppr
    type: data
    rule: Word('ABCDEFGHIJKLMNOPQRSTUVWXYZ', exact=2) + Word('0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ',
      exact=10)
    maxlen: 12
    minlen: 12
    priority: 1
    validator: metacrafterext.rules.common.identifiers.validate_isin
  balanceamountbyknown:
    key: money
    name: Account balance by field name
    match: text
    type: field
    rule: account_balance,total_balance,master_account_balance
    priority: 1
  mccfield:
    key: merchant_category_code
    name: Merchant category code (MCC, ISO 18245) by field name
    # MCC is also the three-digit mobile country code: the values must have four digits.
    rule: (?i)mcc|mcc[ _]?code|merchant[ _]?category[ _]?code|merchant[ _]?cat[ _]?code|mcc[ _]?no
    type: field
    match: regex
    validator: metacrafterext.rules.common.identifiers.validate_mcc
    priority: 1
  # Quotes and portfolios of the Many Eyes archive (IBM Many Eyes, 2007 to 2012): symbol, ticker with AAPL, SPY.
  tickersymbolbyname:
    key: tickersymbol
    name: Stock ticker by field name (symbol, ticker, stock symbol, ticker symbol) with AAPL, SPY, BRK.B
    rule: (?i)(?:(?:stock|ticker|trading|share|equity|security)[ _]?)?symbols?|tickers?(?:[ _]?(?:symbols?|code))?|stock[ _]?(?:code|ticker)
    type: field
    match: regex
    validator: metacrafterext.rules.common.manyeyes.validate_tickersymbol
    needs_values: true
    priority: 1
  # Found in the tables of the Plotly community feed (the VizNet corpus of Plotly charts, 2015 to 2018:
  # 1 090 629 charts, 1 013 540 distinct tables), whose columns are named after the traces of a chart
  # (x, y, labels), so the sector or rating of a holding is found by its values; metacrafter-testdata.
  gicssectorvalue:
    key: gics_sector
    name: GICS sector by value (Consumer Discretionary, Information Technology, Financials, Health Care)
    rule: metacrafterext.rules.common.plotly.validate_gics_sector_value
    type: data
    match: func
    minlen: 6
    maxlen: 40
    priority: 1
  gicssectorbyname:
    key: gics_sector
    name: GICS sector by field name (sector, GICS sector, sector name) with Energy, Utilities, Technology
    rule: (?i)(?:gics[ _]|industry[ _]|market[ _])?sectors?(?:[ _](?:name|gics))?
    type: field
    match: regex
    validator: metacrafterext.rules.common.plotly.validate_gics_sector
    needs_values: true
    priority: 1
  creditratingvalue:
    key: credit_rating
    name: 'Credit rating by value (AAA, AA+, BBB-, Baa2, Caa1)'
    rule: metacrafterext.rules.common.plotly.validate_credit_rating_value
    type: data
    match: func
    minlen: 2
    maxlen: 8
    priority: 1
  creditratingbyname:
    key: credit_rating
    name: 'Credit rating by field name (credit rating, bond rating, S&P, Moody''s, Fitch, Moody''s_(long_term)) with A, BBB+, Baa2'
    rule: (?i)(?:credit|bond|issuer|sovereign|long[ _]term|lt|debt|agency)[ _]?ratings?|(?:s&p|moody'?s|fitch)(?:[ _](?:ratings?|\(?long[ _]term\)?))*|bond[ _]quality|riesgo
    type: field
    match: regex
    validator: metacrafterext.rules.common.plotly.validate_credit_rating
    needs_values: true
    priority: 1
  # Found in seven more segments of the WDC Web Tables Corpus 2015 (tables of HTML pages of the Common Crawl of July
  # 2015; 5 778 000 relational tables of 2 963 718 pages on 109 005 hosts): quotes, market summaries and listings of
  # financial sites; metacrafter-testdata.
  stockmarketindexbyname:
    key: stock_market_index
    name: 'Stock market index by field name (Index, Indices, Index Name, Benchmark, Market, Indizes, Indeks) with S&P 500, Dow, DAX'
    rule: '(?i)(?:stock[ _](?:market[ _])?|market[ _]|equity[ _]|benchmark[ _])?ind(?:ex|ices|exes)(?:[ _](?:names?|tickers?))?|benchmarks?|ticker[ _]name|markets?|indizes|indeks[iy]?|[ií]ndices?|indice|indici|aktienindex'
    type: field
    match: regex
    validator: metacrafterext.rules.common.webtables.validate_stock_market_index
    needs_values: true
    priority: 1
  stockmarketindexvalue:
    key: stock_market_index
    name: 'Stock market index by value (S&P 500, Dow Jones Industrials, Nasdaq Composite, FTSE 100, CAC 40, Nikkei 225, Hang Seng)'
    rule: metacrafterext.rules.common.webtables.validate_stock_market_index_value
    type: data
    match: func
    minlen: 3
    maxlen: 50
    priority: 1
  stockexchangebyname:
    key: stock_exchange
    name: 'Stock exchange by field name (Exchange, Stock Exchange, Exch, Listed On, Listing, Market, Börse, Handelsplatz) with NYSE, NASDAQ, OTC'
    rule: '(?i)(?:stock[ _]|securities[ _]|primary[ _]|listing[ _])?exchanges?(?:[ _](?:names?|codes?|listed|listing))?|exch\.?|listed[ _](?:on|at|in)|listings?(?:[ _](?:exchange|venue|market|place))?|primary[ _](?:listing|market)|trading[ _](?:venue|place|market)|markets?|b[oö]rsen?(?:platz)?|boerse|handelsplatz|bourse|bolsa|borsa|mercado'
    type: field
    match: regex
    validator: metacrafterext.rules.common.webtables.validate_stock_exchange
    needs_values: true
    priority: 1
  stockexchangevalue:
    key: stock_exchange
    name: 'Stock exchange by value (NYSE, NASDAQ, NYSE MKT, NYSE Arca, OTCBB, OTCQB, London Stock Exchange, TSX)'
    rule: metacrafterext.rules.common.webtables.validate_stock_exchange_value
    type: data
    match: func
    minlen: 3
    maxlen: 50
    priority: 1
