name: br-geo
description: Brazilian geographic identifiers
context: geo
lang: pt
country_code: br
rules:
  brcepknown:
    key: postcode
    name: Brazilian CEP (Código de Endereçamento Postal) by known name
    rule: cep,codigo_postal,cep_number,numero_cep
    type: field
    match: text
    priority: 1
  brcityknown:
    key: city
    name: Brazilian city by known name
    rule: cidade,municipio
    type: field
    match: text
    priority: 1
  brstateknown:
    key: state
    name: Brazilian state by known name
    rule: estado,uf,estado_uf
    type: field
    match: text
    validator: metacrafterext.rules.common.generic.validate_state_not_status
    needs_values: true
    priority: 1
  braddressknown:
    key: address
    name: Brazilian address by known name
    rule: endereco,endereco_completo,logradouro
    type: field
    match: text
    priority: 1
  brsiafimunicipalityvalue:
    key: br_siafi_municipality_code
    name: Brazilian SIAFI municipality code (4 digits) by field name and value
    rule: '\d{4}'
    type: data
    match: regex
    minlen: 4
    maxlen: 4
    fieldrule: cod_mun,codigo_siafi,cod_siafi,siafi,cod_municipio_siafi,codigo_municipio_siafi,cd_municipio_siafi,id_municipio_siafi
    fieldrulematch: text
    priority: 1
  # The 27 federative units by abbreviation: uf, sg_uf_programa, UNIDADE_FEDERACAO, uf_sede_agente, estado
  # (the CNCFlora occurrences: ES, BA). The BNDES pads them with a space ( SP).
  brstatecodebyname:
    key: br_state_code
    name: Brazilian federative unit abbreviation (UF) by field name and value (uf, sg_uf, unidade_federacao, estado)
    rule: (?i)(?:(?:sg|sigla|cod|cd|nm)[ _])?uf(?:[ _][a-z_]+)?|(?:[a-z_]+[ _])uf|unidade[ _]federa(?:cao|ção|tiva)|(?:sg[ _]|sigla[ _])?estado(?:[ _][a-z_]+)?
    type: field
    match: regex
    validator: metacrafterext.rules.br.codes.validate_br_state_code
    needs_values: true
    priority: 1
  brstatebyname:
    key: br_state
    name: Brazilian federative unit by name in a field named for it (estado, stateProvince, nm_uf, nome_estado)
    rule: (?i)(?:nm[ _]|nome[ _](?:da[ _]|do[ _])?)?(?:uf|estado)(?:[ _][a-z_]+)?|state[ _]?province|unidade[ _]federa(?:cao|ção|tiva)
    type: field
    match: regex
    validator: metacrafterext.rules.br.codes.validate_br_state
    needs_values: true
    priority: 1
  # A headerless table of the Banco Central do Brasil (counterfeit notes by state: AMAZONAS) has no field name.
  # São Paulo and Rio de Janeiro are cities too, and most of the cities of an airline or company list: fields
  # named for a city, municipality, address or seat are not read.
  brstatevalue:
    key: br_state
    name: Brazilian federative unit by name (São Paulo, MINAS GERAIS, Ceara)
    rule: metacrafterext.rules.br.codes.validate_br_state
    type: data
    match: func
    minlen: 4
    maxlen: 19
    fieldregex: (?i)^(?!.*(?:cidade|munic|city|town|locali|endere|logradouro|bairro|sede|capital|naturalidade|origem|destino|aeroporto|airport))
    priority: 2
  brregionbyname:
    key: br_region
    name: Region of Brazil (Norte, Nordeste, Sudeste, Sul, Centro-Oeste) by field name (regiao, nm_regiao, NMREGIAO, nm_regiao_ies_estudo)
    rule: (?i)(?:(?:nm|nome|ds|sg)[ _]?)?regi[aã]o(?:[ _][a-z_]+)?|(?:[a-z_]+[ _])regi[aã]o
    type: field
    match: regex
    validator: metacrafterext.rules.br.codes.validate_br_region
    needs_values: true
    priority: 1
  # IBGE municipality codes (municipio_codigo of the BNDES operations: 3550308) have a check digit. The names
  # of the DATASUS microdata and the research tables saved through a spreadsheet also: codmunres,
  # CODMUNI_A, CODIGOMUNICIPIODOOBITO, CODCIDADE, municipio_cod, Cód.IBGE (3550308.0).
  brmunicipalitycodebyname:
    key: br_municipality_code
    name: IBGE municipality code by field name and check digit (municipio_codigo, cod_municipio, codigo_ibge, cd_mun)
    rule: (?i)(?:[a-z_]+[ _])?(?:c[oó]d(?:igo)?|cd|co|id)[ _]?(?:do[ _])?(?:munic[ií]pio|mun|ibge)(?:[ _][a-z_]+)?|(?:c[oó]d(?:igo)?|cd)[ _]?(?:do[ _])?mun(?:ic(?:[ií]pio)?)?[a-z0-9_]*|munic[ií]pio[ _]?(?:c[oó]d(?:igo)?|ibge)|(?:c[oó]d(?:igo)?[ _.]?)?ibge(?:[ _]code)?|geoc[oó]digo|c[oó]d(?:igo)?[ _]?(?:da[ _])?cidade
    type: field
    match: regex
    validator: metacrafterext.rules.br.codes.validate_br_municipality_code
    needs_values: true
    priority: 1
  # CEP postal codes in fields named for them (cep_sede_agente: 89041002; CEP do Arquivo Público: 13469-070),
  # and by value with the hyphen.
  brcepbyname:
    key: br_postcode
    name: Brazilian CEP by field name (cep, cep_sede_agente, CEP do Arquivo Público, nr_cep)
    rule: (?i)(?:.*[ _])?cep(?:[ _].*)?
    type: field
    match: regex
    validator: metacrafterext.rules.br.codes.validate_br_postcode
    needs_values: true
    priority: 1
  brcepvalue:
    key: br_postcode
    name: Brazilian CEP by value (13469-070)
    rule: metacrafterext.rules.br.codes.validate_br_postcode_formatted
    type: data
    match: func
    minlen: 9
    maxlen: 9
    priority: 2
  # Phone numbers with the area code (DDD): (19) 3472-9700 in the directory of the public archives of São Paulo.
  brphonebyname:
    key: br_phone
    name: Brazilian phone number in the national format by field name (telefone, Telefone do Arquivo Público, fone)
    rule: (?i)(?:.*[ _])?(?:telefones?|fone|tel|celular|whatsapp)(?:[ _].*)?
    type: field
    match: regex
    validator: metacrafterext.rules.br.codes.validate_br_phone_national
    needs_values: true
    priority: 1
  brphonevalue:
    key: br_phone
    name: Brazilian phone number by value ((19) 3472-9700, (11) 98765-4321)
    rule: metacrafterext.rules.br.codes.validate_br_phone_formatted
    type: data
    match: func
    minlen: 13
    maxlen: 16
    priority: 2
  # The six-digit form without the check digit, as DATASUS writes it (SIM, SINASC, SINAN: codmunres,
  # codmunocor: 354990.0) and the crime statistics of Minas Gerais (municipio_cod, cod_municipio: 310620);
  # also codmun6 of CIDACS, Cod6d and the IBGE column of the PMAQ surveys (120001.0). The validators tell
  # it from the seven-digit code in fields of the same names.
  brmunicipalitycode6byname:
    key: br_municipality_code_6
    name: IBGE municipality code without the check digit by field name (municipio_cod, codmunres, codmun6, Cod6d, IBGE)
    rule: (?i)(?:[a-z_]+[ _])?(?:c[oó]d(?:igo)?|cd|co|id)[ _]?(?:do[ _])?(?:munic[ií]pio|mun|ibge)(?:[ _][a-z_]+)?|(?:c[oó]d(?:igo)?|cd)[ _]?(?:do[ _])?mun(?:ic(?:[ií]pio)?)?[a-z0-9_]*|munic[ií]pio[ _]?(?:c[oó]d(?:igo)?|ibge)|(?:c[oó]d(?:igo)?[ _.]?)?ibge(?:[ _]code)?|geoc[oó]digo|c[oó]d(?:igo)?[ _]?(?:da[ _])?cidade|c[oó]d[ _]?6d?
    type: field
    match: regex
    validator: metacrafterext.rules.br.codes.validate_br_municipality_code_6
    needs_values: true
    priority: 1
  # The two-digit IBGE code of a state (uf, UF_Cod, coduf, CDUF, CODUF, UF(cod): 11 to 53, also 35.0); the
  # letters (SP) are br_state_code.
  brstateibgecodebyname:
    key: br_state_ibge_code
    name: IBGE code of a federative unit by field name (uf, cod_uf, coduf, CDUF, UF_Cod, UF(cod))
    rule: (?i)(?:(?:c[oó]d(?:igo)?|cd|co|id)[ _]?(?:da[ _])?)?uf(?:[ _]?\(?(?:c[oó]d(?:igo)?|ibge)\)?)?|c[oó]d(?:igo)?[ _]?(?:do[ _])?estado
    type: field
    match: regex
    validator: metacrafterext.rules.br.codes.validate_br_state_ibge_code
    needs_values: true
    priority: 1
  # Census tract codes of IBGE (Codsetor of the day-care study in SciELO Data: 3.55030801000001E14, the
  # 15 digits saved as a float), CD_SETOR and CD_GEOCODI of the census tables.
  brcensustractcodebyname:
    key: br_census_tract_code
    name: IBGE census tract code by field name (Codsetor, cd_setor, CD_GEOCODI, setor_censitario)
    rule: (?i)(?:c[oó]d(?:igo)?|cd|co|id)[ _]?(?:do[ _])?setor(?:[ _]?censit[aá]rio)?|setor[ _]censit[aá]rio|cd[ _]?geocodi|geoc[oó]digo[ _]setor
    type: field
    match: regex
    validator: metacrafterext.rules.br.codes.validate_br_census_tract_code
    needs_values: true
    priority: 1
  # The float of a spreadsheet export has 15 digits and fits the IMSI pattern; a value rule guarded by the
  # field name keeps imsi off the census tract columns.
  brcensustractcodevalue:
    key: br_census_tract_code
    name: IBGE census tract code by value in a field named for it (Codsetor, cd_setor)
    rule: metacrafterext.rules.br.codes.validate_br_census_tract_code
    type: data
    match: func
    minlen: 15
    maxlen: 20
    fieldregex: (?i)(?:c[oó]d(?:igo)?|cd|co|id)[ _]?(?:do[ _])?setor(?:[ _]?censit[aá]rio)?|setor[ _]censit[aá]rio|cd[ _]?geocodi|geoc[oó]digo[ _]setor
    priority: 1
