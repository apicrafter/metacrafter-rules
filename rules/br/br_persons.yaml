name: br-persons
description: Brazilian person identifiers
context: persons
lang: pt
country_code: br
rules:
  brpersonnameknown:
    key: person_fullname
    is_pii: True
    name: Brazilian person name by known name
    rule: nome_completo,nome_pessoa,nome_do_cliente
    type: field
    match: text
    priority: 1
  brfirstnameknown:
    key: person_firstname
    is_pii: True
    name: Brazilian first name by known name
    rule: primeiro_nome,nome_primeiro,primeiro_nome_pessoa
    type: field
    match: text
    priority: 1
  brlastnameknown:
    key: person_surname
    is_pii: True
    name: Brazilian last name by known name
    rule: sobrenome,ultimo_nome,nome_familia,apelido
    type: field
    match: text
    priority: 1
  br_persons_brcpfknown:
    key: cpf
    is_pii: True
    name: Brazilian CPF by known name
    rule: cpf,cpf_number,cpf_numero,numero_cpf
    type: field
    match: text
    priority: 1
  brrgknown:
    key: rg
    is_pii: True
    name: Brazilian RG (Registro Geral) by known name
    rule: rg,numero_rg,rg_number,rg_numero
    type: field
    match: text
    priority: 1
  # Race or colour (raça/cor) in the categories of IBGE: tp_raca_cor and CS_RACA of the health records of
  # Minas Gerais, CORRAÇA of the political violence cases (SciELO Data): Branca, Preta, Parda, Amarela,
  # Indígena, Ignorado. Numeric codes (racacor: 1 to 5) and breeds of animals (raça: Nelore) fail.
  brracecolourbyname:
    key: race_ethnicity
    is_pii: True
    name: Race or colour (raça/cor) by field name with the IBGE categories (raca_cor, tp_raca_cor, CS_RACA, cor_raca)
    rule: (?i)(?:[a-z_]+[ _])?ra[cç]a(?:[ _/]?(?:cor|co))?(?:[ _][a-z_]+)?|(?:[a-z_]+[ _])?cor[ _/]?(?:ra[cç]a|da[ _]pele)|racacor
    type: field
    match: regex
    validator: metacrafterext.rules.br.codes.validate_br_race_colour
    needs_values: true
    priority: 1
