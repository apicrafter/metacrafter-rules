name: za-geo
description: South African provinces
context: geo
lang: en
country_code: za
rules:
  # Province codes of ISO 3166-2:ZA without the ZA- prefix (EC, FS, GP, KZN, LP, MP, NC, NW, WC) and
  # GT for Gauteng (Wazimap, NICD), in fields named after a province or a geography: EC, NC and MP
  # are country codes too.
  zaprovincecodevalue:
    key: za_province_code
    name: South African province code (EC, GP, KZN, WC) by value and field name
    rule: ec,fs,gp,gt,kzn,lp,mp,nc,nw,wc
    type: data
    match: text
    minlen: 2
    maxlen: 3
    fieldregex: prov|geography|^geo|region
    priority: 1
