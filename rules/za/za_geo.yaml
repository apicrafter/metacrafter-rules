name: za-geo
description: South African provinces
context: geo
lang: en
country_code: za
# Found in the openAFRICA snapshot of metacrafter-testdata: the 2022 census tables of Statistics
# South Africa (Province) and the provincial budgets of vulekamali (Province, Government).
rules:
  zaprovincebyname:
    key: za_province
    name: South African province by field name (Province, province_name, Government of a provincial budget)
    rule: (?i)(?:[a-z]+[ _])?province(?:[ _]?name)?|provincename|government|prov
    type: field
    match: regex
    validator: metacrafterext.rules.za.geo.validate_za_province
    needs_values: true
    priority: 1
  zaprovincevalue:
    key: za_province
    name: South African province by value (KwaZulu-Natal, MPUMALANGA, North West)
    rule: metacrafterext.rules.za.geo.validate_za_province
    type: data
    match: func
    minlen: 7
    maxlen: 30
    priority: 1
