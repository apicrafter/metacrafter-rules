name: id-persons
description: Indonesian person identifiers
context: persons
lang: id
country_code: id
rules:
  idnikfield:
    key: idnik
    is_pii: True
    name: Indonesian NIK by field name
    rule: nomor_induk_kependudukan,nik_number,indonesian_id,national_id,ktp_number
    type: field
    priority: 3
    match: text
  idnikvalue:
    key: idnik
    is_pii: True
    name: Indonesian NIK by pattern
    match: ppr
    type: data
    rule: Word(nums, exact=16)
    validator: metacrafterext.rules.common.identifiers.validate_id_nik
    maxlen: 16
    minlen: 16
  idpassportfield:
    key: idpassport
    is_pii: True
    name: Indonesian passport by field name
    rule: paspor,passport_number,nomor_paspor,paspor_no
    type: field
    priority: 3
    match: text
  idpassportvalue:
    # Letter + 7-8 digits is also a GSS code, a product or a file id: names only.
    fieldrule: passport,passport_number,passport_no,passportnumber,passport_id,passport number,paspor,nomor_paspor,paspor_no,swiss_passport,passport_ch,passport_switzerland,schweizer_pass,reisepass,pass_nr,passnummer,여권,여권번호,ho_chieu,so_ho_chieu,ho_chieu_no,passeport,numero_passeport,pasaporte,numero_pasaporte
    fieldrulematch: text
    key: idpassport
    is_pii: True
    name: Indonesian passport by pattern
    match: ppr
    type: data
    rule: Word(alphas, exact=1) + Word(nums, min=7, max=8)
    maxlen: 9
    minlen: 8
  iddriverlicfield:
    key: iddriverlic
    is_pii: True
    name: Indonesian driver license by field name
    rule: driver_license,sim,sim_number,sim_no,driving_license,license_number
    type: field
    priority: 3
    match: text
  iddriverlicvalue:
    key: iddriverlic
    is_pii: True
    name: Indonesian driver license by pattern
    match: ppr
    type: data
    rule: Word(alphas, exact=1) + Word(nums, min=11, max=12)
    maxlen: 13
    minlen: 12
    imprecise: 1

  # jenis_kelamin of the tables of Tangerang Regency (opendata.tangerangkab.go.id, Dateno source
  # cdi00000904): LAKI-LAKI, PEREMPUAN, Laki-Laki, LAKI_LAKI.
  idgenderbyname:
    key: gender
    is_pii: true
    name: Sex by Indonesian field name (jenis_kelamin, jenis kelamin, jk, kelamin) with Laki-laki, Perempuan
    rule: (?i)jenis[ _]?kelamin|kelamin|jk|jns[ _]kelamin
    type: field
    match: regex
    validator: metacrafterext.rules.id.codes.validate_id_sex
    needs_values: true
    priority: 1
  # agama: ISLAM, KRISTEN, KHATOLIK, HINDU, BUDHA, KONGHUCU, KEPERCAYAAN.
  idreligionbyname:
    key: religion
    is_pii: true
    name: Religion by Indonesian field name (agama) with Islam, Kristen, Katolik, Hindu, Buddha, Konghucu
    rule: (?i)agama(?:[ _](?:dan[ _])?kepercayaan)?
    type: field
    match: regex
    validator: metacrafterext.rules.id.codes.validate_id_religion
    needs_values: true
    priority: 1
  # tingkat_pendidikan: SD, SLTP, SLTA, DIII, DIV/S1, S2, TIDAK/BELUM SEKOLAH.
  ideducationlevelbyname:
    key: education_level
    name: Level of education by Indonesian field name (tingkat_pendidikan, pendidikan, jenjang_pendidikan) with SD, SLTA, S1
    rule: (?i)(?:tingkat|jenjang)[ _]pendidikan(?:[ _]terakhir)?|pendidikan(?:[ _]terakhir)?|pendidikan[ _]tertinggi
    type: field
    match: regex
    validator: metacrafterext.rules.id.codes.validate_id_education_level
    needs_values: true
    priority: 1
  # golongan of the staff tables: I/a to IV/e.
  idpnsgolonganbyname:
    key: id_pns_golongan
    name: Indonesian civil servant grade by field name (golongan, golongan_ruang, gol) with III/a, IV/e
    rule: (?i)gol(?:ongan)?(?:[ _/](?:ruang|pns|kepangkatan|pangkat))?|pangkat[ _/]gol(?:ongan)?(?:[ _/]ruang)?
    type: field
    match: regex
    validator: metacrafterext.rules.id.codes.validate_id_pns_golongan
    needs_values: true
    priority: 1
