name: ar-geo
description: Arabic geographic identifiers
context: geo
lang: ar
country_code: xx
rules:
  arcityknown:
    key: city
    name: Arabic city by known name
    rule: مدينة,المدينة,المدن
    type: field
    match: text
    priority: 1
  arcountryknown:
    key: country
    name: Arabic country by known name
    rule: دولة,الدولة,البلد,الوطن
    type: field
    match: text
    priority: 1
  arpostcodeknown:
    key: postcode
    name: Arabic postal code by known name
    rule: الرمز_البريدي,الرمز_البريد,الرمز_البريدي
    type: field
    match: text
    priority: 1

  arcountrynamebyname:
    key: arcountryname
    name: Country name in Arabic by field name (Country(Arabic), Country_AR, country_name_ar, اسم_الدولة)
    rule: '(?i)countr(?:y|ies)[ _]*(?:name)?[ _]*(?:\(\s*arabic\s*\)|[_ -]+(?:ar|ara|arabic))|(?:country|nation)_?name_?ar|اسم[ _]الدول[ةه]|الدول[ةه]|البلد|الدول'
    type: field
    match: regex
    validator: metacrafterext.rules.ar.countries.validate_ar_country_name
    needs_values: true
    priority: 1
  arcountrynamevalue:
    key: arcountryname
    name: Country name in Arabic by value (المملكة العربية السعودية, جمهورية إيران الإسلامية, بنجلاديش)
    # CLDR and ISO 3166 names in Arabic and common spellings, compared without hamza, vowel
    # marks, tatweel and spaces (metacrafterext.rules.ar.countries).
    rule: metacrafterext.rules.ar.countries.validate_ar_country_name
    type: data
    match: func
    minlen: 3
    maxlen: 80
    priority: 1
