name: ar-datetime
description: Arabic date and time common patterns
context: datetime
lang: ar
country_code: xx
rules:
  ardateknown:
    key: date
    name: Arabic date name
    rule: تاريخ,التاريخ,تاريخ_الإنشاء,تاريخ_التحديث
    type: field
    match: text
    priority: 1
  aryearknown:
    key: year
    name: Arabic year name
    rule: سنة,السنة,عام
    type: field
    match: text
    priority: 1
  armonthknown:
    key: month
    name: Arabic month name
    rule: شهر,الشهر,شهر_ميلادي
    type: field
    match: text
    priority: 1
  artimeknown:
    key: time
    name: Arabic time name
    rule: وقت,الوقت,الساعة,الزمن
    type: field
    match: text
    priority: 1

  armonthvalue:
    key: ar_month
    name: Arabic month name (مارس, يوليوز, كانون الثاني)
    rule: يناير,فبراير,مارس,أبريل,ابريل,إبريل,ماي,مايو,يونيو,يونيه,يوليو,يوليوز,يوليه,أغسطس,اغسطس,غشت,سبتمبر,شتنبر,أكتوبر,اكتوبر,نوفمبر,نونبر,ديسمبر,ديسيمبر,دجنبر,جانفي,فيفري,أفريل,جوان,جويلية,أوت,كانون الثاني,شباط,آذار,نيسان,أيار,حزيران,تموز,آب,أيلول,تشرين الأول,تشرين الثاني,كانون الأول
    type: data
    match: text
    priority: 1
  # Found in the Bahrain Open Data Portal (data.gov.bh, a 2024 snapshot; metacrafter-testdata):
  # the Opendatasoft field names of the Arabic columns are the transliterated labels, الشهر ->
  # lshhr, الربع -> lrb, and the trade tables write the month after its number (03 مارس).
  armonthbytransliteratedname:
    key: ar_month
    name: Arabic month name by transliterated field name (lshhr, shhr) with month names, also numbered (03 مارس)
    rule: '(?i)(?:l|al)?shhr'
    type: field
    match: regex
    validator: metacrafterext.rules.ar.dates.validate_ar_month
    needs_values: true
    priority: 1
  armonthnumberedvalue:
    key: ar_month
    name: Arabic month name after the month number (01 يناير, 03 مارس)
    rule: '(?:0?[1-9]|1[0-2])\s*[-.:)]?\s*[؀-ۿ ]{3,14}'
    type: data
    match: regex
    validator: metacrafterext.rules.ar.dates.validate_ar_month
    minlen: 5
    maxlen: 20
    priority: 1
  arquarterbytransliteratedname:
    key: quarter
    name: Quarter by transliterated Arabic field name (lrb for الربع) with quarters (الربع الأول, Q1)
    rule: '(?i)(?:l|al)rb'
    type: field
    match: regex
    validator: metacrafterext.rules.common.generic.validate_quarter_value
    needs_values: true
    priority: 1
