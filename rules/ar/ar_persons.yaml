name: ar-persons
description: Arabic person identifiers
context: persons
lang: ar
country_code: xx
rules:
  arpersonnameknown:
    key: person_fullname
    is_pii: True
    name: Arabic person name by known name
    rule: اسم_الشخص,الاسم_الكامل,الاسم
    type: field
    match: text
    priority: 1
  arfirstnameknown:
    key: person_firstname
    is_pii: True
    name: Arabic first name by known name
    rule: الاسم_الأول,الاسم_الشخصي
    type: field
    match: text
    priority: 1
  arlastnameknown:
    key: person_surname
    is_pii: True
    name: Arabic last name by known name
    rule: اسم_العائلة,اللقب,اسم_الأسرة
    type: field
    match: text
    priority: 1

