name: de-datetime
description: German date and time common patterns
context: datetime
lang: de
country_code: de
rules:
  deyearname:
    key: year
    name: German year name
    match: text
    type: field
    priority: 1
    rule: jahr
  dedatetimename:
    key: datetime
    name: Date name in German
    match: text
    type: field
    priority: 3
    rule: datum,ereignisdatum
  delongdatevalue:
    key: date_german
    name: Date with a German month name (18. November 1827, 7. März 1833)
    # Day, a dot, the month name and the year, as German texts write dates (#70).
    rule: '(?:[1-9]|[012]\d|3[01])\.\s?(?:Januar|Jänner|Februar|Feber|März|April|Mai|Juni|Juli|August|September|Oktober|November|Dezember)\s\d{4}'
    match: regex
    type: data
    minlen: 10
    maxlen: 20
    validator: metacrafterext.rules.common.generic.validate_german_long_date
    priority: 1
