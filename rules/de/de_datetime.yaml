name: de-datetime
description: German date and time common patterns
context: datetime
lang: de
country_code: de
rules:
  deyearname:
    key: year
    name: German year name
    match: text
    type: field
    priority: 1
    rule: jahr
  dedatetimename:
    key: datetime
    name: Date name in German
    match: text
    type: field
    priority: 3
    rule: datum,ereignisdatum
  delongdatevalue:
    key: date_german
    name: Date with a German month name (18. November 1827, 7. März 1833)
    # Day, a dot, the month name and the year, as German texts write dates (#70).
    rule: '(?:[1-9]|[012]\d|3[01])\.\s?(?:Januar|Jänner|Februar|Feber|März|April|Mai|Juni|Juli|August|September|Oktober|November|Dezember)\s\d{4}'
    match: regex
    type: data
    minlen: 10
    maxlen: 20
    validator: metacrafterext.rules.common.generic.validate_german_long_date
    priority: 1
  # Monat of the monthly tables of Düsseldorf, Wuppertal and Cologne: Januar, März, Mrz, 03 Mrz (April 2024
  # snapshots of German open data portals, Dateno sources cdi00000446 to cdi00000467).
  demonthnamevalue:
    key: de_month
    name: German month name by value (Januar, März, Dezember)
    rule: Januar,Jänner,Februar,März,April,Mai,Juni,Juli,August,September,Oktober,November,Dezember
    type: data
    match: text
    minlen: 3
    maxlen: 9
    priority: 1
  demonthbyname:
    key: de_month
    name: German month name or abbreviation by field name (Monat, Monatsname) with Januar, Mrz, Okt., 03 Mrz
    rule: (?i)(?:\w+_)?monat(?:s?name)?
    type: field
    match: regex
    validator: metacrafterext.rules.de.codes.validate_de_month
    needs_values: true
    priority: 1
