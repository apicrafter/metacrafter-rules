name: en-ukcompanies
description: English (UK) companies identifiers
context: companies
lang: en
country_code: us
rules:
  us_orgs_encompanynamebypostfix:
    key: encompanyname
    name: US name of the company
    maxlen: 120
    minlen: 10
    priority: 1
    match: func
    type: data
    rule: metacrafterext.rules.en.orgs.is_us_orgname

  
  usnteecodevalue:
    key: us_ntee_code
    name: NTEE code of a US nonprofit (B71Z, D200) by field name and value
    rule: '[A-Z]\d{2}[A-Z0-9]?'
    type: data
    match: regex
    minlen: 3
    maxlen: 4
    fieldrule: ntee_cd,ntee_code,ntee,nteecode,ntee code,ntee_classification
    fieldrulematch: text
    priority: 1
