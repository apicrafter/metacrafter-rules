name: us-geo
description: US geographic identifiers
context: geo
lang: en
country_code: us
rules:
  uszipcodebyname:
    key: uszipcode
    is_pii: False
    name: US ZIP code by value and field name
    # 5 digits or ZIP+4 (12345, 12345-6789).
    rule: Word(nums, exact=5) + Optional(Literal('-') + Word(nums, exact=4))
    minlen: 5
    maxlen: 10
    type: data
    match: ppr
    # The field name ends with zip, zipcode or zip_code (optionally with digits) after 0
    # to 3 other words: zip, ZIP Code, zip5, billing_zip, mailing-zipcode. unzip, zipper
    # and zip_file do not match.
    fieldrule: >-
      (CaselessLiteral('zip') + Optional(Optional(oneOf('_ -')) + CaselessLiteral('code')) + Optional(Word(nums)))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 1 + CaselessLiteral('zip') + Optional(Optional(oneOf('_ -')) + CaselessLiteral('code')) + Optional(Word(nums)))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 2 + CaselessLiteral('zip') + Optional(Optional(oneOf('_ -')) + CaselessLiteral('code')) + Optional(Word(nums)))
      ^ ((Word(alphanums) + Optional(oneOf('_ -'))) * 3 + CaselessLiteral('zip') + Optional(Optional(oneOf('_ -')) + CaselessLiteral('code')) + Optional(Word(nums)))
    fieldrulematch: ppr
    priority: 2
  usfips52known:
    key: fips52
    is_pii: False
    name: US State FIPS 5-2 code
    rule: state_fips_code,state_fips,statefips,fips_state,cntyfips,stfips,fips_state_code,fips_state,st_fips
    match: text
    type: field
    priority: 1
  usfips64known:
    key: fips64
    is_pii: False
    name: US State FIPS 6-4 code
    rule: county_fips_code,fips_county_code,countyfips,fips_county,cnty_fips,fips_count,county_fips,local_fips,city_fips
    match: text
    type: field
    priority: 1
  usfips64byname:
    key: fips64
    is_pii: False
    name: US county FIPS code (36001) by field name and value
    # Five digits, a state code from 01 to 78 and the county code: County FIPS, fips, fips_code.
    # A bare fips of two digits is a state code (#70).
    rule: county fips,county fips code,fips,fips_code,fipscode,fips code,stcofips,geoid_county,county_geoid
    match: text
    type: field
    validator: metacrafterext.rules.us.validators.validate_us_county_fips
    priority: 1
  uscountynamevalue:
    key: uscounty
    name: US county name in a county field (KENT, Orleans Parish, Doña Ana County)
    # Many county names are city names too (Kent, Providence, Washington): in a field named
    # for counties this guarded rule outweighs the US city list (#69). Kenyan and Liberian
    # county names are not in the list; of the English counties only those that US counties
    # are named after are (Kent, Essex), not the -shire names or Sussex.
    match: func
    type: data
    rule: metacrafterext.rules.us.validators.validate_us_county_name
    minlen: 3
    maxlen: 60
    fieldrule: county,county name,county_name,countyname,county/parish,county_parish,ctyname,cnty_name,cntyname,county_nm,countynm
    fieldrulematch: text
    priority: 1
  uscitybyvalue:
    key: uscity
    name: US city name by value
    rule: New York,Los Angeles,Chicago,Houston,Phoenix,Philadelphia,San Antonio,San Diego,Dallas,San Jose,Austin,Jacksonville,Fort Worth,Columbus,Indianapolis,Charlotte,San Francisco,Seattle,Denver,Washington,Nashville,Oklahoma City,El Paso,Boston,Portland,Las Vegas,Detroit,Memphis,Louisville,Baltimore,Milwaukee,Albuquerque,Tucson,Fresno,Sacramento,Kansas City,Mesa,Atlanta,Omaha,Colorado Springs,Raleigh,Long Beach,Virginia Beach,Miami,Oakland,Minneapolis,Tulsa,Bakersfield,Wichita,Arlington,Aurora,Tampa,New Orleans,Cleveland,Honolulu,Anaheim,Lexington,Stockton,Corpus Christi,Henderson,Riverside,Newark,Saint Paul,Santa Ana,Cincinnati,Irvine,Orlando,Pittsburgh,St. Louis,Greensboro,Jersey City,Anchorage,Lincoln,Plano,Durham,Buffalo,Chandler,Chula Vista,Toledo,Madison,Gilbert,Reno,Fort Wayne,North Las Vegas,St. Petersburg,Lubbock,Irving,Laredo,Winston–Salem,Chesapeake,Glendale,Garland,Scottsdale,Norfolk,Boise,Fremont,Spokane,Santa Clarita,Baton Rouge,Richmond,Hialeah,San Bernardino,Tacoma,Modesto,Huntsville,Des Moines,Yonkers,Rochester,Moreno Valley,Fayetteville,Fontana,Columbus,Worcester,Port St. Lucie,Little Rock,Augusta,Oxnard,Birmingham,Montgomery,Frisco,Amarillo,Salt Lake City,Grand Rapids,Huntington Beach,Overland Park,Tallahassee,Grand Prairie,McKinney,Cape Coral,Sioux Falls,Peoria,Providence,Vancouver,Knoxville,Akron,Shreveport,Mobile,Brownsville,Newport News,Fort Lauderdale,Chattanooga,Tempe,Santa Rosa,Eugene,Elk Grove,Salem,Ontario,Cary,Rancho Cucamonga,Oceanside,Lancaster,Garden Grove,Pembroke Pines,Fort Collins,Palmdale,Springfield,Clarksville,Salinas,Hayward,Paterson,Alexandria,Macon,Corona,Kansas City,Lakewood,Sunnyvale,Jackson,Killeen,Hollywood,Murfreesboro,Pasadena,Bellevue,Pomona,Escondido,Joliet,Charleston,Mesquite,Naperville,Rockford,Bridgeport,Syracuse,Savannah,Roseville,Torrance,Fullerton,Surprise,McAllen,Thornton,Visalia,Olathe,Gainesville,West Valley City,Orange,Denton,Warren,Waco,Cedar Rapids,Dayton,Elizabeth,Hampton,Columbia,Kent,Stamford,Victorville,Miramar,Coral Springs,Sterling Heights,New Haven,Carrollton,Midland,Norman,Santa Clara,Athens,Thousand Oaks,Topeka,Simi Valley,Vallejo,Fargo,Allentown,Pearland,Concord,Abilene,Arvada,Berkeley,Ann Arbor,Independence,Lafayette,Hartford,College Station,Clovis,Fairfield,Palm Bay,Richardson,Round Rock,Cambridge,Meridian,West Palm Beach,Evansville,Clearwater,Billings,West Jordan,Richmond,Westminster,Manchester,Lowell,Wilmington,Antioch,Beaumont,Provo,North Charleston,Elgin,Carlsbad,Odessa,Waterbury,League City,Downey,Gresham,High Point,Broken Arrow,Lansing,Lakeland,Pompano Beach,Costa Mesa,Pueblo,Lewisville,Miami Gardens,Las Cruces,Sugar Land,Murrieta,Ventura,Everett,Temecula,Dearborn,Santa Maria,West Covina,El Monte,Greeley,Sparks,Centennial,Boulder,Sandy Springs,Inglewood,Edison,South Fulton,Green Bay,Burbank,Renton,Hillsboro,El Cajon,Tyler,Davie,San Mateo,Brockton,Jurupa Valley,Daly City,Allen,Rio Rancho,Rialto,Woodbridge,South Bend,Spokane Valley,Norwalk,Menifee,Vacaville,Wichita Falls,Davenport,Quincy,Chico,Lynn,Lee's Summit,New Bedford,Federal Way,Clinton,Edinburg,Nampa,Roanoke
    maxlen: 16
    minlen: 4
    type: data
    match: text
  usstatebyvalue:
    key: usstate
    name: US State name by value
    # New York and Washington are also city names (uscitybyvalue): a city column of New York,
    # Brooklyn and Queens is not a state column (#69).
    rule: Alabama,Alaska,Arizona,Arkansas,California,Colorado,Connecticut,Delaware,District of Columbia,Florida,Georgia,Hawaii,Idaho,Illinois,Indiana,Iowa,Kansas,Kentucky,Louisiana,Maine,Maryland,Massachusetts,Michigan,Minnesota,Mississippi,Missouri,Montana,Nebraska,Nevada,New Hampshire,New Jersey,New Mexico,North Carolina,North Dakota,Ohio,Oklahoma,Oregon,Pennsylvania,Rhode Island,South Carolina,South Dakota,Tennessee,Texas,Utah,Vermont,Virginia,West Virginia,Wisconsin,Wyoming,Puerto Rico
    maxlen: 20
    minlen: 4
    type: data
    match: text
  uscensussumlevvalue:
    key: us_census_sumlev
    name: US Census summary level by field name and value
    rule: '\d{3}'
    type: data
    match: regex
    minlen: 3
    maxlen: 3
    fieldrule: sumlev,summary_level,sumlevel,summary level
    fieldrulematch: text
    priority: 1
  uscensusregionvalue:
    key: us_census_region
    name: US Census region code (1-4) by field name and value
    # The Census Bureau files name the column REGION, in capitals. A lowercase region of 1 to 4
    # is a region number of another country: Armenian marz numbers run from 1 to 11, and a
    # sample of the first rows holds only 1 and 2 (#69).
    rule: '[1-4]'
    type: data
    match: regex
    minlen: 1
    maxlen: 1
    fieldrule: Literal('REGION') ^ CaselessLiteral('census_region') ^ CaselessLiteral('censusregion') ^ CaselessLiteral('census region') ^ CaselessLiteral('census_region_code')
    fieldrulematch: ppr
    priority: 1
  uscensusdivisionvalue:
    key: us_census_division
    name: US Census division code (1-9) by field name and value
    # DIVISION in capitals, as the Census Bureau files name it: a lowercase division of one
    # digit is any other division number (see uscensusregionvalue).
    rule: '[0-9]'
    type: data
    match: regex
    minlen: 1
    maxlen: 1
    fieldrule: Literal('DIVISION') ^ CaselessLiteral('census_division') ^ CaselessLiteral('censusdivision') ^ CaselessLiteral('census division') ^ CaselessLiteral('census_division_code')
    fieldrulematch: ppr
    priority: 1
  uscensuslsadvalue:
    key: us_census_lsad
    name: US Census legal/statistical area description code by field name and value
    rule: '[0-9A-Z]{2}'
    type: data
    match: regex
    minlen: 2
    maxlen: 2
    fieldrule: lsad,lsad_code,lsad10,lsad20
    fieldrulematch: text
    priority: 1
  usnycbblvalue:
    key: us_nyc_bbl
    name: New York City borough, block and lot (BBL) by field name and value
    rule: '[1-5]\d{9}(?:\.0+)?'
    type: data
    match: regex
    minlen: 10
    maxlen: 25
    fieldrule: bbl,borough_block_lot,bbl_code,boro_block_lot
    fieldrulematch: text
    priority: 1
  usnycbinvalue:
    key: us_nyc_bin
    name: New York City building identification number (BIN) by field name and value
    rule: '[1-5]\d{6}(?:\.0+)?'
    type: data
    match: regex
    minlen: 7
    maxlen: 22
    fieldrule: bin,bin_number,building_id_number,building identification number,bldg_bin
    fieldrulematch: text
    priority: 1
  usnycntavalue:
    key: us_nyc_nta
    name: New York City neighborhood tabulation area code by field name and value
    rule: '(?:BK|BX|MN|QN|SI)\d{2}(?:\d{2})?'
    type: data
    match: regex
    minlen: 4
    maxlen: 6
    fieldrule: ntacode,nta,nta_code,nta2020,ntacode2020,nta_2020,ntacode_2010
    fieldrulematch: text
    priority: 1
