name: in-geo
description: Indian geographic identifiers
context: geo
lang: en
country_code: in
rules:
  inpinknown:
    key: postcode
    name: Indian PIN code (Postal Index Number) by known name
    rule: pin,pin_code,postal_code,postcode,postal_index_number
    type: field
    match: text
    priority: 1
  incityknown:
    key: city
    name: Indian city by known name
    rule: city,city_name,town
    type: field
    match: text
    priority: 1
  instateknown:
    key: state
    name: Indian state by known name
    rule: state,state_name
    type: field
    match: text
    # A state field of 0 and 1 is a flag (state or non-state actor in AUSSDA INFO-POW); FIPS
    # state codes (01, 06) and names stay.
    validator: metacrafterext.rules.common.survey.validate_not_flag
    priority: 1
  indistrictknown:
    key: district
    name: Indian district by known name
    rule: district,district_name
    type: field
    match: text
    priority: 1

