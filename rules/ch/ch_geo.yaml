name: ch-geo
description: Swiss geographic identifiers
context: geo
lang: de
country_code: ch
rules:
  chbfsgemeindeknown:
    key: ch_bfs_gemeinde
    name: Swiss municipality number (BFS-Nr.) by known name
    rule: bfsnr,bfs_nr,bfs-nr,bfs-nr.,bfs_nummer,bfs_gemeindenummer,gemeinde_bfs,gdenr,gde_nr
    type: field
    match: text
    priority: 1
  chbfsbezirkvalue:
    key: ch_bfs_bezirk
    name: Swiss BFS district number by field name and value
    rule: '\d{3,4}'
    type: data
    match: regex
    minlen: 3
    maxlen: 4
    fieldrule: bezkid,bezirksnummer,bezirk_nr,bezirknr,bfs_bezirk,bezirks_nr,bezirk_id,bezirk_bfs
    fieldrulematch: text
    priority: 1
