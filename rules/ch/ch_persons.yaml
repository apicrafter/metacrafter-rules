name: ch-persons
description: Swiss person identifiers
context: persons
lang: de
country_code: ch
rules:
  chahvfield:
    key: chahv
    is_pii: True
    name: Swiss AHV number by field name
    rule: swiss_ahv,ahv_number,ahv_nummer,ahv_se,swiss_social_security
    type: field
    priority: 1
    match: text
  chahvvalue:
    key: chahv
    is_pii: True
    name: Swiss AHV number by pattern
    match: ppr
    type: data
    rule: Word(nums, exact=3) + Literal('.') + Word(nums, exact=3) + Literal('.') + Word(nums, exact=3) + Literal('.') + Word(nums, exact=3)
    maxlen: 15
    minlen: 15
  chpassportfield:
    key: chpassport
    is_pii: True
    name: Swiss passport by field name
    rule: swiss_passport,passport_ch,passport_switzerland,schweizer_pass
    type: field
    priority: 1
    match: text
  chpassportvalue:
    # Letter + 7-8 digits is also a GSS code, a product or a file id: names only.
    fieldrule: passport,passport_number,passport_no,passportnumber,passport_id,passport number,paspor,nomor_paspor,paspor_no,swiss_passport,passport_ch,passport_switzerland,schweizer_pass,reisepass,pass_nr,passnummer,여권,여권번호,ho_chieu,so_ho_chieu,ho_chieu_no,passeport,numero_passeport,pasaporte,numero_pasaporte
    fieldrulematch: text
    key: chpassport
    is_pii: True
    name: Swiss passport by pattern
    match: ppr
    type: data
    rule: Word(alphas, exact=1) + Word(nums, exact=8)
    maxlen: 9
    minlen: 9

