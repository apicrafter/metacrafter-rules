name: objects-ext
description: Objects unique identifiers (extended ruleset)
context: objectids
lang: common
country_code: xx
rules:
  isbn13:
    key: isbn13
    name: International Standard Book Number (ISBN)
    rule: Word(nums) + Literal('-') + Word(nums) + ZeroOrMore(Literal('-') + Word(nums))
    validator: metacrafterext.rules.common.identifiers.validate_isbn13
    maxlen: 17
    minlen: 14
    priority: 1
    match: ppr
    type: data
  isbn10:
    key: isbn10
    name: International Standard Book Number (ISBN)
    rule: Word(nums) + Literal('-') + Word(nums + 'Xx') + ZeroOrMore(Literal('-') + Word(nums + 'Xx'))
    validator: metacrafterext.rules.common.identifiers.validate_isbn10
    maxlen: 13
    minlen: 11
    priority: 1
    match: ppr
    type: data
