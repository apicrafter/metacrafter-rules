name: eu-geo
description: Eurostat geographic codes
context: geo
lang: en
country_code: eu
rules:
  eulaucodevalue:
    key: eu_lau_code
    name: Eurostat LAU code with a country prefix (RO_1017) by field name and value
    rule: '[A-Z]{2}_[0-9A-Z]{1,12}'
    type: data
    match: regex
    minlen: 4
    maxlen: 15
    fieldrule: lau,lau_code,lau_id,lau code,gisco_id,lau_cod
    fieldrulematch: text
    priority: 1
  eueicvalue:
    key: eu_eic
    name: ENTSO-E Energy Identification Code (EIC) by value with its check character (17W000000038874F, 10YFR-RTE------C)
    rule: '\d{2}[A-Z][0-9A-Z-]{12}[0-9A-Z]'
    type: data
    match: regex
    minlen: 16
    maxlen: 16
    validator: metacrafterext.rules.common.identifiers.validate_eu_eic
    priority: 1
  eueicbyname:
    key: eu_eic
    name: Energy Identification Code by field name (eic, codeEICResourceObject, grd_elec_eic)
    rule: (?i)(?:code_?)?eic(?:_?code)?|.*_eic|eic_.*|codeeic\w*|code_eic_\w+
    type: field
    match: regex
    validator: metacrafterext.rules.common.identifiers.validate_eu_eic
    needs_values: true
    priority: 1
  eudegurbabyname:
    key: eu_degurba
    name: Eurostat degree of urbanisation (DEGURBA) by field name (degurba, urbanisation, xurb, Grad der Urbanisierung)
    # Eurostat LAU lists (DEGURBA), the Austrian Mikrozensus (xurb, xurb12) and AUSSDA surveys
    # (urban, urbanisierung_ec): 1 cities, 2 towns and suburbs, 3 rural areas. An urban flag of
    # 0 and 1 or a text class fails the check.
    rule: '(?i)(?:[a-z0-9]+[ _.-])?(?:deg_?urba|dgurba|degurb|urbani[sz]ation(?:[ _.-]?(?:degree|level|grade|ec|class))?|degree[ _]of[ _]urbani[sz]ation|urbanisierung(?:sgrad)?(?:[ _.-]?ec)?|grad[ _]der[ _]urbanisierung|xurb|urban)(?:[ _.-]?(?:\d{2,4}|code|cd|class|lau))?'
    type: field
    match: regex
    validator: metacrafterext.rules.common.survey.validate_degurba
    needs_values: true
    priority: 1
  inspireidvalue:
    key: inspire_id
    name: INSPIRE identifier (namespace and local id, AT.BEV.DOP.MD.20220128.49921) by field name and value
    # The namespace starts with the country code; a dotted string alone is also a package name or
    # a version, so only in fields named for INSPIRE.
    rule: '[A-Z]{2}\.[A-Za-z0-9_-]+(?:\.[A-Za-z0-9_-]+)+'
    type: data
    match: regex
    minlen: 5
    maxlen: 200
    fieldrule: inspireid,inspire_id,inspire id,inspire-id,id_inspire,inspire_identifier,inspireidentifier
    fieldrulematch: text
    priority: 1
  # Found in the Natura 2000 habitat maps of the Open Data Corse portal (2024 snapshot, Dateno source
  # cdi00000716; metacrafter-testdata): cod_site FR9400570, cod_eur27 1170, cod_eunis A5.535.
  eunishabitatcodebyname:
    key: eunis_habitat_code
    name: EUNIS habitat code by field name (cod_eunis, code_eunis, eunis) with A5.535
    rule: (?i)(?:cod(?:e)?[ _])?eunis(?:[ _]?code)?\d?
    type: field
    match: regex
    validator: metacrafterext.rules.fr.portals.validate_eunis_habitat_code
    needs_values: true
    priority: 1
  euhabitattypecodebyname:
    key: eu_habitat_type_code
    name: Habitats Directive habitat type code by field name (cod_eur27, code_eur28, code_natura2000) with 1170, 91E0
    rule: (?i)cod(?:e)?[ _]eur(?:15|25|27|28)?|eur(?:15|25|27|28)|cod(?:e)?[ _](?:hab[ _])?n(?:atura[ _]?)?2000|cd_hab_dhff
    type: field
    match: regex
    validator: metacrafterext.rules.fr.portals.validate_eu_habitat_type_code
    needs_values: true
    priority: 1
  eunatura2000sitebyname:
    key: eu_natura2000_site
    name: Natura 2000 site code by field name (cod_site, sitecode, site_code) with FR9400570
    rule: (?i)cod(?:e)?[ _]?site|site[ _]?code|(?:code|id)[ _]n(?:atura[ _]?)?2000(?:[ _]site)?
    type: field
    match: regex
    validator: metacrafterext.rules.fr.portals.validate_eu_natura2000_site
    needs_values: true
    priority: 1
