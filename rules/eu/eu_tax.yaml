name: eu-tax
description: EU-wide VAT and taxpayer identifiers
context: finances
lang: en
country_code: eu
rules:
  vatfield:
    key: euvat
    is_pii: True
    name: VAT number by field name
    rule: vat,vatnumber,vat_number,eu_vat,vatid
    type: field
    priority: 3
    match: text
  vatvalue:
    key: euvat
    is_pii: True
    name: VAT number by value pattern
    match: ppr
    type: data
    rule: Word('ABCDEFGHIJKLMNOPQRSTUVWXYZ', exact=2) + Word(alphanums, min=6, max=12)
    maxlen: 14
    minlen: 8
    validator: metacrafterext.rules.common.identifiers.validate_eu_vat
    priority: 1
    imprecise: 1
  euidfield:
    key: euid
    name: European Unique Identifier (EUID) by field name
    rule: euid,eu_id,european_unique_id
    type: field
    priority: 1
    match: text
  euidvalue:
    key: euid
    name: European Unique Identifier (EUID) by pattern
    # BRIS form of the registry record: country and register code, a dot and the number in
    # that register (CYDRCOR.HE139104, DEX1517R.HRB395KI, BEKBOBCE.1014.559.919).
    match: regex
    type: data
    rule: '(?:ATBRA\.\d{6}-[01]{3}|BEKBOBCE\.[01]\d{3}\.\d{3}\.\d{3}|BGCOMREG\.\d{9}|CYDRCOR\.(?:AE|HE)\d{1,10}|CZVROR\.\d{8}|DE[A-Z][1-9]\d{3}[RV]?(?:_[A-Z][1-9]\d{3}[RV]?)?\.(?:G[ns]R|HR[AB]|[PV]R)\d+[A-Z]*|DKCVR\.\d{8}|EEARIREG\.\d{8}|ELGEMI\.\d{12}|ES[0-5]\d{4}\.\d{9}|FIFPRO\.\d{7}-\d|FR\d{4}\.\d{9}|HRSR\.\d{9}|HUOCCSZ\.\d{2}-\d{2}-\d{6}|IECRO\.\d{6,7}|ISREI\.[4-7]\d[01]\d{3}-\d{3}[09]|ITRI\.\d{11}|LIFL\.FL-\d{4}\.\d{3}\.\d{3}-\d|LTJAR\.\d{9}|LURCSL\.B\d{1,6}|LVUR\.(?:\d{9}|\d{11})|MTROC\.C\d{1,6}|NLNHR\.\d{8}|NOFOR\.\d{9}|PLKRS\.\d{10}|PTIRNMJ\.\d{9}|ROONRC\.[CFJ](?:\d{1,2}/\d{1,6}/\d{4}|\d{13})|SEBOLREG\.\d{10}|SIPRS\.\d{7}0{3}|SKORSR\.\d{1,18})'
    maxlen: 40
    minlen: 9
    priority: 1
    imprecise: 1
  eu_tax_ibanfield:
    key: iban
    name: IBAN by field name
    rule: iban,iban_account,iban_number
    type: field
    priority: 3
    match: text
  eu_tax_ibanvalue:
    key: iban
    name: IBAN by value pattern
    match: ppr
    type: data
    rule: Word('ABCDEFGHIJKLMNOPQRSTUVWXYZ', exact=2) + Word(nums, exact=2) + Word('ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789', min=1, max=4) + ZeroOrMore(Word('ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789', min=1, max=4))
    maxlen: 42
    minlen: 15
    validator: metacrafterext.rules.common.identifiers.validate_iban
