name: nl-datetime
description: Dutch date and time common patterns
context: datetime
lang: nl
country_code: nl
rules:
  nlyearknown:
    key: year
    name: Year by known name common in Dutch
    rule: jaar
    type: field
    priority: 1
    match: text
  nldatefield:
    key: date
    name: Date field by Dutch names
    rule: datum,startdatum,einddatum,aanmaakdatum,laatst_bijgewerkt
    type: field
    priority: 3
    match: text
  nltimefield:
    key: time
    name: Time field by Dutch names
    rule: tijd,starttijd,eindtijd
    type: field
    priority: 1
    match: text
  nldatetimepattern:
    key: datetime
    name: DateTime pattern in Dutch format (DD-MM-YYYY hh:mm)
    match: ppr
    type: data
    # A time of day is required: DD-MM-YYYY alone is a date (nldatepattern).
    rule: Word(nums, exact=2) + Literal('-').suppress() + Word(nums, exact=2) + Literal('-').suppress() + Word(nums, exact=4) + Literal(' ').suppress() + Word(nums, exact=2) + Literal(':').suppress() + Word(nums, exact=2)
    maxlen: 16
    minlen: 16
  nldatepattern:
    key: date
    name: Date pattern in Dutch format (DD-MM-YYYY)
    match: ppr
    type: data
    rule: Word(nums, exact=2) + Literal('-').suppress() + Word(nums, exact=2) + Literal('-').suppress() + Word(nums, exact=4)
    validator: metacrafterext.rules.common.generic.validate_dmy_date
    maxlen: 10
    minlen: 10
