name: nl-geo
description: Dutch geographic identifiers
context: geo
lang: nl
country_code: nl
rules:
  nlpostcodeknown:
    key: postcode
    name: Dutch postal code by known name
    rule: postcode,postal_code,postcode_nl
    type: field
    match: text
    priority: 1
  nlcityknown:
    key: city
    name: Dutch city by known name
    rule: stad,gemeente,plaats
    type: field
    match: text
    priority: 1
  nlprovinceknown:
    key: province
    name: Dutch province by known name
    rule: provincie
    type: field
    match: text
    priority: 1
  nlcoropvalue:
    key: nl_corop
    name: Dutch COROP region code by field name and value
    rule: '(?:CR)?(?:0[1-9]|[1-3]\d|40)'
    type: data
    match: regex
    minlen: 2
    maxlen: 4
    fieldrule: coropgebied code,coropgebied,corop,corop_code,coropcode,corop gebied code,coropgebiedcode
    fieldrulematch: text
    priority: 1
  nlcbsregionyearvalue:
    key: nl_cbs_region_code_year
    name: CBS region code with a year (2024GM0034)
    rule: '\d{4}(?:GM\d{4}|WK\d{6}|BU\d{8})'
    type: data
    match: regex
    minlen: 10
    maxlen: 14
    priority: 1
  # amco and acode of the historical municipality tables of the IISH Dataverse (datasets.iisg.amsterdam, a
  # 2024 snapshot): 10002, 11434, beside the CBS number (cbsnr).
  nlamcobyname:
    key: nl_amco
    name: Amsterdamse code of a Dutch municipality by field name (amco, AMCO, acode, amsterdamse_code, amsterdam_code)
    rule: (?i)amco|acode|amsterdam(?:se)?[ _]?code
    type: field
    match: regex
    validator: metacrafterext.rules.nl.validators.validate_nl_amco
    needs_values: true
    priority: 1
