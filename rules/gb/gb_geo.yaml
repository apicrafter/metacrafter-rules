name: gb_geo
description: English (UK) geographic locations and codes
context: geo
lang: en
country_code: gb
rules:
  ukwardcodebyknown:
    key: ukwardcode
    name: UK ward code by known name
    match: text
    type: field
    priority: 1
    rule: ward code,ward_code
    # GSS codes only (E05000026): the ward codes of Nigerian settlement data (KD0101) are ng_ward_code.
    validator: metacrafterext.rules.common.generic.validate_gss_code
    needs_values: true
  ukwardnamebyknown:
    key: ukwardname
    name: UK ward name by known name
    # A bare ward holds a ward number in Toronto (3, 8): the values must be names.
    match: func
    type: data
    priority: 1
    # Australian council wards named Ward (North Ward, Ward 2 of the Camden Council ward_name) are
    # au_council_ward: ONS names have no Ward after them.
    rule: metacrafterext.rules.au.planning.validate_not_au_council_ward
    minlen: 1
    maxlen: 200
    # A bare Ward is any country's ward (Kenyan wards, #61); ONS names it WDyyNM.
    fieldrule: ward name,ward_name,wardname,wd21nm,wd22nm,wd23nm,wd24nm,wd25nm
    fieldrulematch: text
    # ONS ward and electoral division names of any year (WD20NM, WD23NMW, CMWD11NM, CED19NM)
    # and Ward Description; a bare Ward stays out.
    fieldregex: '(?i)^(?:wd|cmwd|ced)\d{2}nmw?$|^ward[ _]?(?:description|desc)$'
  ukpostcodefield:
    key: ukpostalcode
    name: UK postal code by field name
    rule: postcode,postal_code,zip_code,uk_postcode
    type: field
    priority: 3
    match: text
  ukpostcodevalue:
    key: ukpostalcode
    name: UK postal code by pattern
    match: ppr
    type: data
    rule: Word(alphas, min=1, max=2) + Word(nums, min=1, max=2) + Optional(Word(nums, exact=1)) + Optional(Literal(' ')) + Word(nums, exact=1) + Word(alphas, exact=2)
    maxlen: 8
    minlen: 5
  uprnfield:
    key: uprn
    name: UK UPRN by field name
    rule: uprn,unique_property_reference_number,property_reference
    type: field
    priority: 3
    match: text
  uprnvalue:
    key: uprn
    name: UK UPRN by pattern
    match: ppr
    type: data
    rule: Word(nums, exact=12)
    imprecise: 1
    maxlen: 12
    minlen: 12
  uksloafield:
    key: uksloa
    name: UK Lower Super Output Area (LSOA) code by field name
    match: text
    type: field
    priority: 1
    rule: lsoa,lsoa code,lsoa_code,lsoa11cd,lsoa11_cd,lsoa code 2011,lsoa 2011 code
    # GSS codes only (E01000001): an LSOA column also holds names (Cambridge 001A is gb_lsoa_name) and the
    # data zone names of Scotland (Lenzie North - 07).
    validator: metacrafterext.rules.common.generic.validate_gss_code
    needs_values: true
  ukmsoafield:
    key: ukmsoa
    name: UK Middle Super Output Area (MSOA) code by field name
    match: text
    type: field
    priority: 1
    rule: msoa,msoa code,msoa_code,msoa11cd,msoa11_cd,msoa04cd,msoa04_cd
    # GSS codes only (E02000001): MSOA name holds names (Leicester 003 is gb_msoa_name).
    validator: metacrafterext.rules.common.generic.validate_gss_code
    needs_values: true
  ukonscodefield:
    key: ukonscode
    name: UK ONS (Office for National Statistics) code by field name
    match: text
    type: field
    priority: 1
    rule: ons code,ons_code,ons ref,ons_ref,ons body code,ons_body_code,ons_administrative_area,ons codes
  ukgsscodefield:
    key: ukgsscode
    name: UK GSS (Geographic Statistical Standard) code by field name
    match: text
    type: field
    priority: 1
    rule: gss code,gss_code,gssla code,gssla_code
  ukboroughcodefield:
    key: ukboroughcode
    name: UK borough code by field name
    match: text
    type: field
    priority: 1
    rule: borough code,borough_code,borough ref,borough_ref,boroughcd
  uklacodefield:
    key: uklacode
    name: UK Local Authority (LA) code by field name
    match: text
    type: field
    priority: 1
    rule: la code,la_code,local authority code,previous local authority code,pre 2009 la code,post 2009 la code,old la code
  ukparishcodefield:
    key: ukparishcode
    name: UK parish code by field name
    match: text
    type: field
    priority: 1
    rule: parish code,parish_code,parish_ward,parish
    # GSS codes only (E04000001): a bare parish holds parish names in Uganda (Kasese wildlife
    # conflict records: Busunga, Kyondo, Railway ward).
    validator: metacrafterext.rules.common.generic.validate_gss_code
    needs_values: true
  ukdistrictcodefield:
    key: ukdistrictcode
    name: UK district code by field name
    match: text
    type: field
    priority: 1
    rule: ons_district_code,ogss_district_code,polling district code,local authority district code

  
  ukgsscodebyfield:
    key: ukgsscode
    name: GSS code (ONS statistical geography) by field name
    # ONS column names (LSOA21CD, LAD23CD, PCON24CD) and GIAS ones (LSOA (code)).
    rule: (?i)(?:lsoa|msoa|oa|lad|lau1|wd|ward|pcon|cty|rgn|ctry|ccg|icb|utla|ltla)\d{0,2}cd|(?:lsoa|msoa|gss|gssla|districtadministrative|administrativeward|parliamentaryconstituency|gor|lad|ward)[ _.-]?(?:\(code\)|code|cd)
    type: field
    match: regex
    # GSS codes are a letter and eight digits (E09000001); the GIAS GOR (code) holds the letters
    # of the former Government Office Regions (H, J) (#69).
    validator: metacrafterext.rules.common.generic.validate_gss_code
    priority: 1
  ukdistrictcodegenericfield:
    key: ukdistrictcode
    name: District code (United Kingdom) by generic field name
    # A district code in any country: name evidence only (score 36), a GB value rule decides.
    rule: district code,district_code
    type: field
    match: text
    priority: 3

  ukgsscodebyonsfield:
    key: ukgsscode
    name: GSS code in an ONS code column (CAUTH19CD, EER18CD, CMWD11CD)
    # ONS names a code column by the geography, the year and CD (CAUTH19CD, CTYUA16CD); the
    # values must be GSS codes. CDH columns hold ODS codes, CDO older ONS codes.
    rule: (?i)[a-z]{2,8}\d{2}cd
    type: field
    match: regex
    validator: metacrafterext.rules.common.generic.validate_gss_code
    priority: 1
  ukoutputareacodevalue:
    key: uk_output_area_code
    name: Census output area GSS code by value ([EWSN]00)
    rule: '[EWSN]00\d{6}'
    type: data
    match: regex
    minlen: 9
    maxlen: 9
    priority: 1
  gbregioncodevalue:
    key: gb_region_code
    name: Region of England GSS code by value (E12)
    rule: 'E12\d{6}'
    type: data
    match: regex
    minlen: 9
    maxlen: 9
    priority: 1
  ukcountrygsscodevalue:
    key: uk_country_gss_code
    name: UK country GSS code by value ([EWSN]92, K0[2-4])
    rule: '(?:[EWSN]92|K0[2-4])\d{6}'
    type: data
    match: regex
    minlen: 9
    maxlen: 9
    priority: 1
  gbcountycodevalue:
    key: gb_county_code
    name: County of England GSS code by value (E1[01])
    rule: 'E1[01]\d{6}'
    type: data
    match: regex
    minlen: 9
    maxlen: 9
    priority: 1
  gbcombinedauthoritycodevalue:
    key: gb_combined_authority_code
    name: Combined authority GSS code by value (E47)
    rule: 'E47\d{6}'
    type: data
    match: regex
    minlen: 9
    maxlen: 9
    priority: 1
  ukeuropeanelectoralregioncodevalue:
    key: uk_european_electoral_region_code
    name: European electoral region GSS code by value (E15, W08, S15, N07)
    rule: '(?:E15|W08|S15|N07)\d{6}'
    type: data
    match: regex
    minlen: 9
    maxlen: 9
    priority: 1
  gbcensusmergedwardcodevalue:
    key: gb_census_merged_ward_code
    name: Census merged ward GSS code by value (E36, W39)
    rule: '(?:E36|W39)\d{6}'
    type: data
    match: regex
    minlen: 9
    maxlen: 9
    priority: 1
  gbcensusmergedladcodevalue:
    key: gb_census_merged_lad_code
    name: Census merged local authority district GSS code by value (E41, W40)
    rule: '(?:E41|W40)\d{6}'
    type: data
    match: regex
    minlen: 9
    maxlen: 9
    priority: 1
  gbbuacodevalue:
    key: gb_bua_code
    name: Built-up area GSS code by value (E34, W37, K05)
    rule: '(?:E34|W37|K05)\d{6}'
    type: data
    match: regex
    minlen: 9
    maxlen: 9
    priority: 1
  gbbuasdcodevalue:
    key: gb_buasd_code
    name: Built-up area sub-division GSS code by value (E35, W38, K06)
    rule: '(?:E35|W38|K06)\d{6}'
    type: data
    match: regex
    minlen: 9
    maxlen: 9
    priority: 1
  gbcountyelectoraldivisioncodevalue:
    key: gb_county_electoral_division_code
    name: County electoral division GSS code by value (E58)
    rule: 'E58\d{6}'
    type: data
    match: regex
    minlen: 9
    maxlen: 9
    priority: 1
  gbcommunitysafetypartnershipcodevalue:
    key: gb_community_safety_partnership_code
    name: Community safety partnership GSS code by value (E22, W14)
    rule: '(?:E22|W14)\d{6}'
    type: data
    match: regex
    minlen: 9
    maxlen: 9
    priority: 1
  gbnideacodevalue:
    key: gb_ni_dea_code
    name: Northern Ireland district electoral area GSS code by value (N10)
    rule: 'N10\d{6}'
    type: data
    match: regex
    minlen: 9
    maxlen: 9
    priority: 1
  gbscotlanddatazonecodevalue:
    key: gb_scotland_data_zone_code
    name: Scottish data zone GSS code by value (S01)
    rule: 'S01\d{6}'
    type: data
    match: regex
    minlen: 9
    maxlen: 9
    priority: 1
  gbosgridreferencevalue:
    key: gb_os_grid_reference
    name: Ordnance Survey National Grid reference with spaces (SD 97624 17311)
    # Written with spaces the reference is not taken for a Scottish company number or an
    # Ofsted URN (SC086146, SC068179); without spaces it needs a grid field name.
    rule: '[A-Z]{2} \d{1,5}(?: \d{1,5})?'
    type: data
    match: regex
    minlen: 5
    maxlen: 14
    validator: metacrafterext.rules.gb.codes.validate_os_grid_reference_spaced
    priority: 1
  gbosgridreferencefieldvalue:
    key: gb_os_grid_reference
    name: Ordnance Survey National Grid reference in a grid reference field (TL97441340)
    rule: '[A-Z]{2} ?\d{2,10}(?: \d{1,5})?'
    type: data
    match: regex
    minlen: 4
    maxlen: 14
    validator: metacrafterext.rules.gb.codes.validate_os_grid_reference
    fieldregex: '(?i)^(?:.*[ _.-])?(?:grid[ _]?ref(?:erence)?|ngr|os[ _]?grid[ _]?ref(?:erence)?|osgr|gridref|national[ _]?grid[ _]?reference|os[ _]?ref)(?:[ _.-].*)?$'
    fieldrule: gridreference,grid reference,grid_reference,grid ref,grid_ref,gridref,ngr,os grid reference,os_grid_reference,osgr,os grid ref
    fieldrulematch: text
    priority: 1
  gbpostcodedistrictfield:
    key: gb_postcode_district
    name: UK postcode district (outward code) by field name
    rule: (?i)post ?code[ _]?district|postcode[ _]?(?:area|outward)|outward[ _]?code|pcd[ _]?district|postal[ _]?district
    type: field
    match: regex
    validator: metacrafterext.rules.gb.codes.validate_gb_postcode_district
    priority: 1
  gbpostcodesectorfield:
    key: gb_postcode_sector
    name: UK postcode sector by field name
    rule: (?i)post ?code[ _]?sector|postal[ _]?sector|pcd[ _]?sector
    type: field
    match: regex
    validator: metacrafterext.rules.gb.codes.validate_gb_postcode_sector
    priority: 1
  gbgeoxlongitudefield:
    key: longitude
    name: Longitude in a GeoX field (brownfield land register)
    # The brownfield land register standard gives GeoX / GeoY in ETRS89 or WGS84 degrees;
    # registers in OSGB36 metres are eastings and northings, which the validator rejects.
    rule: (?i)geo[ _]?x
    type: field
    match: regex
    validator: metacrafterext.rules.common.generic.validate_lonlat_number
    priority: 1
  gbgeoylatitudefield:
    key: latitude
    name: Latitude in a GeoY field (brownfield land register)
    rule: (?i)geo[ _]?y
    type: field
    match: regex
    validator: metacrafterext.rules.common.generic.validate_lonlat_number
    priority: 1
  gbcountynamebyonsfield:
    key: gb_county
    name: County of England by ONS name column (CTY19NM)
    rule: (?i)cty\d{2}nmw?
    type: field
    match: regex
    validator: metacrafterext.rules.common.generic.has_letters
    priority: 1
  # Found in 2024 snapshots of UK open data portals (data.gov.uk, Cambridgeshire Insight, Calderdale Data
  # Works, Open Leicester, London Datastore, Open Data Glasgow; Dateno sources cdi00000763 to cdi00000799;
  # metacrafter-testdata).
  gblsoanamebyname:
    key: gb_lsoa_name
    name: LSOA name by field name (LSOA name, LSOA11NM, LSOA name (2011), lsoa) with Cambridge 001A
    rule: (?i)(?:[a-z]+[ _])?(?:(?:19|20)\d\d[ _])?lsoa(?:[ _]?(?:19|20)?\d\d)?[ _]?(?:name|nm)w?(?:[ _]?\(?(?:19|20)\d\d\)?)?|lsoa
    type: field
    match: regex
    validator: metacrafterext.rules.gb.portals.validate_gb_lsoa_name
    needs_values: true
    priority: 1
  gblsoanamevalue:
    key: gb_lsoa_name
    name: LSOA name by value (Cambridge 001A, Barking and Dagenham 001B)
    # The name of a district, three digits and a capital letter; a house number has no fixed length.
    rule: "[A-Z][A-Za-z'’.,-]*(?: [A-Za-z'’.,&-]+){0,6} \\d{3}[A-Z]"
    type: data
    match: regex
    minlen: 8
    maxlen: 60
    validator: metacrafterext.rules.gb.portals.validate_gb_lsoa_name
    priority: 1
  gbmsoanamebyname:
    key: gb_msoa_name
    name: MSOA name by field name (MSOA name, MSOA11NM, msoa) with Leicester 003
    # MSOA11HCLNM holds the names of the House of Commons Library (Belgrave South), which fail the validator.
    rule: (?i)(?:[a-z]+[ _])?(?:(?:19|20)\d\d[ _])?msoa(?:[ _]?(?:19|20)?\d\d)?[ _]?(?:name|nm)w?(?:[ _]?\(?(?:19|20)\d\d\)?)?|msoa
    type: field
    match: regex
    validator: metacrafterext.rules.gb.portals.validate_gb_msoa_name
    needs_values: true
    priority: 1
  gblocalauthoritynamebyname:
    key: gb_local_authority_name
    name: Local authority name by field name (Local authority, LA name, LAD11NM) with Calderdale, Barnet
    # A code under the same name (E06000001, 302) fails the validator.
    rule: (?i)local[ _]?authority(?:[ _]?(?:name|district|district[ _]name))?|la[ _]?name|(?:lad|ltla|utla|ctyua)\d\dnmw?
    type: field
    match: regex
    validator: metacrafterext.rules.gb.portals.validate_gb_area_name
    needs_values: true
    priority: 1
  gbparliamentaryconstituencybyname:
    key: gb_parliamentary_constituency
    name: UK parliamentary constituency by field name (Parliamentary constituency, UK constituency, PCON17NM) with Calder Valley
    # A bare constituency is any country's constituency (Kenya): the name must say Parliament or the UK,
    # or be the ONS column name. A GSS code under the name (E14000614) fails the validator.
    rule: (?i)(?:uk|westminster|parliamentary)[ _]constituency(?:[ _]name)?|pcon\d\dnmw?|parliamentary[ _]constituencies
    type: field
    match: regex
    validator: metacrafterext.rules.gb.portals.validate_gb_area_name
    needs_values: true
    priority: 1
  gbusrnbyname:
    key: gb_usrn
    name: Unique Street Reference Number by field name (USRN, street_usrn) with 44100754
    rule: (?i)(?:[a-z]+[ _])?usrn
    type: field
    match: regex
    validator: metacrafterext.rules.gb.portals.validate_gb_usrn
    needs_values: true
    priority: 1
  ukgsscodeundercode:
    key: ukgsscode
    name: GSS code in a code column of a statistical table (Code, area_code, ONS code, geography_code) with E06000001
    # The name tells nothing; the values must be GSS codes (a country letter and eight digits).
    # Weaker than the rules of one geography (ONS code, LA code, a region or a country by value): a
    # column of this name mixes regions, districts and wards.
    rule: (?i)code|(?:area|geo|geography|gss)[ _]?codes?|(?:lsoa|msoa|oa|ward)[ _]code[ _]?\(?(?:19|20)\d\d\)?|(?:19|20)\d\d[ _](?:lsoa|msoa|oa)(?:[ _]code)?
    type: field
    match: regex
    validator: metacrafterext.rules.common.generic.validate_gss_code
    needs_values: true
    priority: 3
