name: gb-finance 
description: United Kingdom banking and payment identifiers
context: finances
lang: en
country_code: gb
rules:
  sortcodefield:
    key: uksortcode
    name: UK sort code by field name
    rule: sortcode,sort_code,uk_sortcode
    type: field
    priority: 1
    match: text
  sortcodevalue:
    key: uksortcode
    name: UK sort code by value pattern
    match: ppr
    type: data
    rule: Word(nums, exact=2) + Optional(Literal('-').suppress()) + Word(nums, exact=2) + Optional(Literal('-').suppress()) + Word(nums, exact=2)
    maxlen: 8
    minlen: 6
    # A bare 6-digit number has no check digit, so an undashed value-only match
    # is highly ambiguous. Marked imprecise so it is ignored unless
    # --include-imprecise.
    imprecise: 1
  gbvatfield:
    key: gb_vat
    name: UK VAT registration number by field name
    rule: (?i)(?:supplier[ _]?)?vat[ _]?(?:registration[ _]?|reg[ _]?)?(?:number|num|no\.?|nr)|vat[ _]?reg(?:istration)?|vat[ _]?id
    type: field
    match: regex
    validator: metacrafterext.rules.gb.codes.validate_gb_vat
    priority: 1
