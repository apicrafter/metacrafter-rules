name: gb-orgs
description: English (UK) companies identifiers
context: companies
lang: en
country_code: gb
rules:
  encompanynamebypostfix:
    key: encompanyname
    name: UK name of the company
    maxlen: 120
    minlen: 10
    priority: 1
    match: func
    type: data
    rule: metacrafterext.rules.en.orgs.is_uk_orgname

  
  gbcivilservicegradevalue:
    key: gb_civil_service_grade
    name: UK civil service grade in a grade field (G7, HEO, SCS2)
    match: func
    type: data
    rule: metacrafterext.rules.gb.codes.validate_civil_service_grade
    minlen: 2
    maxlen: 30
    fieldregex: '(?i)^(?:civil[ _]?service[ _]?)?grade(?:[ _]?\(or equivalent\)|[ _]?code|[ _]?level)?$|^pay[ _]?(?:grade|band)$|^scs[ _]?(?:level|pay[ _]?band)$'
    fieldrule: grade,grade (or equivalent),civil service grade,pay grade,pay band,grade code,scs level
    fieldrulematch: text
    priority: 1
  gbcompanieshousenumberfield:
    key: companyhouseid
    name: Companies House company number by field name
    # Spreadsheets drop the leading zeros of numeric company numbers (4832101 for 04832101).
    rule: (?i)(?:supplier[ _]?)?(?:registered[ _]?)?compan(?:y|ies)[ _]?(?:house[ _]?)?(?:registration[ _]?|reg[ _]?)?(?:number|no\.?|num|id)|companies[ _]?house[ _]?(?:number|no|id)|crn|supplierregisteredcompanynumber|company_registration_number
    type: field
    match: regex
    validator: metacrafterext.rules.gb.codes.validate_companies_house_number
    priority: 1
  # Found in 2024 snapshots of UK open data portals (data.gov.uk, Cambridgeshire Insight, Calderdale Data
  # Works, Open Leicester, London Datastore, Open Data Glasgow; Dateno sources cdi00000763 to cdi00000799;
  # metacrafter-testdata).
  gbsiccodebyname:
    key: gb_sic_code
    name: UK SIC 2007 code by field name (SIC code, SICCode.SicText_1, 2007 SIC code(s)) with 62020, 25.62, 74990 - Non-trading company
    rule: (?i)(?:(?:uk|2007|2003)[ _])?sic(?:[ _]?(?:2007|2003|07|03))?(?:[ _]?codes?(?:\(s\))?)?|sic[ _]?code\.sic[ _]?text[ _]?\d
    type: field
    match: regex
    validator: metacrafterext.rules.gb.portals.validate_gb_sic_code
    needs_values: true
    priority: 1
  gbesdserviceurivalue:
    key: gb_esd_service_uri
    name: Service URI of the Local Government Service List by value (http://id.esd.org.uk/service/646)
    rule: 'https?://id\.esd\.org\.uk/service/\d{1,5}'
    type: data
    match: regex
    minlen: 30
    maxlen: 40
    priority: 1
