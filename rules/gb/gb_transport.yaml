name: gb-transport
description: UK transport identifiers
context: transport
lang: en
country_code: gb
rules:
  gbvehicleplatefield:
    key: gb_vehicle_plate
    name: UK vehicle registration plate by field name
    rule: license_plate,registration_plate,number_plate,vehicle_plate,reg_plate,plate_number,gb_plate,uk_plate
    type: field
    match: text
    priority: 1
  gbvehicleplatevalue:
    key: gb_vehicle_plate
    name: UK vehicle registration plate by pattern
    match: ppr
    type: data
    rule: Word(alphas, exact=2) + Word(nums, exact=2) + Optional(Literal(' ').suppress()) + Word(alphas, exact=3)
    minlen: 7
    maxlen: 8
    priority: 1
    validator: metacrafterext.rules.gb.transport.validate_gb_vehicle_plate
  gbnaptanatcovalue:
    key: gb_naptan_atco
    name: NaPTAN ATCO code in a stop code field
    # Three-digit ATCO area code, then the stop part (2580AUD0009, 069000010180).
    rule: '\d{3}0[0-9A-Z]{1,8}'
    type: data
    match: regex
    minlen: 5
    maxlen: 12
    fieldrule: atcocode,atco_code,atco code,naptan_code,naptancode,stop_code,stoppointref
    fieldrulematch: text
    priority: 1
  gbnptglocalitycodevalue:
    key: gb_nptg_locality_code
    name: NPTG locality code in a locality code field (E0029368)
    rule: '[EN][0S]\d{6}'
    type: data
    match: regex
    minlen: 8
    maxlen: 8
    fieldregex: '(?i)^(?:nptg)?[ _]?locality[ _]?code$|^nptg[ _]?(?:locality[ _]?)?(?:code|ref)$|^nptglocalityref$'
    fieldrule: nptglocalitycode,nptg_locality_code,nptg locality code,localitycode,locality_code,nptglocalityref
    fieldrulematch: text
    priority: 1
  gbnaptancodefield:
    key: gb_naptan_code
    name: NaPTAN SMS code by field name (NaptanCode)
    rule: naptancode,naptan_code,naptan code,sms_code,smscode,sms code,naptan sms code
    type: field
    match: text
    validator: metacrafterext.rules.gb.codes.validate_naptan_code
    priority: 1
