name: ae-finances
description: UAE financial identifiers
context: finances
lang: ar
country_code: ae
rules:
  aetaxnumberfield:
    key: aetaxnumber
    name: UAE tax number by field name
    rule: tax_number,tax_id,vat_number,uae_tax,uae_vat,trn,trade_license_number,الرقم_الضريبي
    type: field
    priority: 3
    match: text
  aetaxnumbervalue:
    key: aetaxnumber
    name: UAE tax number by pattern
    match: ppr
    type: data
    rule: Word(nums, min=9, max=15)
    maxlen: 15
    minlen: 9
    imprecise: 1
  aebankaccountfield:
    key: aebankaccount
    name: UAE bank account by field name
    rule: bank_account,account_number,iban,uae_iban,رقم_الحساب
    type: field
    priority: 3
    match: text
  aebankaccountvalue:
    key: aebankaccount
    name: UAE bank account by pattern
    match: ppr
    type: data
    rule: Literal('AE') + Word(nums, exact=2) + Word(alphanums, exact=4) + Word(nums, min=16, max=24)
    maxlen: 30
    minlen: 28
    imprecise: 1
  aeibanfield:
    key: aeiban
    name: UAE IBAN by field name
    rule: iban,iban_number,uae_iban
    type: field
    priority: 3
    match: text
  aeibanvalue:
    key: aeiban
    name: UAE IBAN by pattern
    match: ppr
    type: data
    rule: Literal('AE') + Word(nums, exact=2) + Word(alphanums, exact=4) + Word(nums, min=16, max=24)
    maxlen: 30
    minlen: 28

  aedewacontractaccountbyname:
    key: ae_dewa_contract_account
    name: DEWA contract account by field name (contract_account, contract_account_number)
    rule: '(?i)contract[ _]?(?:account|acc|acct)(?:[ _]?(?:no|number|num|nr))?|dewa[ _]?(?:account|acc|ca)(?:[ _]?(?:no|number))?|رقم_الحساب_التعاقدي|الحساب_التعاقدي'
    type: field
    match: regex
    validator: metacrafterext.rules.ae.geo.validate_ae_dewa_contract_account
    needs_values: true
    priority: 1
  aedewacontractaccountvalue:
    key: ae_dewa_contract_account
    name: DEWA contract account in a contract account field (2002323313)
    # Accounts of the 20 series have the weighted modulo 11 check digit of the NHS number and
    # ISBN-10: in a contract account column this guarded rule outweighs those value rules.
    rule: metacrafterext.rules.ae.geo.validate_ae_dewa_contract_account
    type: data
    match: func
    minlen: 10
    maxlen: 12
    fieldregex: '(?i)contract[ _]?(?:account|acc|acct)|dewa[ _]?(?:account|acc|ca)|الحساب_التعاقدي'
    priority: 1
