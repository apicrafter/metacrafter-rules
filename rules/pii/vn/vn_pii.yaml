name: vn-pii
description: Vietnamese person identifiable information (PII)
context: pii
lang: vi
country_code: vn
rules:
  vncccdfield:
    key: vncccd
    is_pii: True
    name: Vietnamese CCCD by field name
    rule: cccd,can_cuoc_cong_dan,so_cccd,cccd_number,vietnamese_id,national_id
    type: field
    priority: 3
    match: text
  vncccdvalue:
    key: vncccd
    is_pii: True
    name: Vietnamese CCCD by pattern
    match: ppr
    type: data
    rule: Word(nums, exact=12)
    maxlen: 12
    minlen: 12
    # A bare 12-digit number has no check digit, so a value-only match is highly
    # ambiguous. Marked imprecise so it is ignored unless --include-imprecise.
    imprecise: 1
  vnpassportfield:
    key: vnpassport
    is_pii: True
    name: Vietnamese passport by field name
    rule: ho_chieu,so_ho_chieu,ho_chieu_no
    type: field
    priority: 1
    match: text
  vnpassportvalue:
    # Letter + 7-8 digits is also a GSS code, a product or a file id: names only.
    fieldrule: passport,passport_number,passport_no,passportnumber,passport_id,passport number,paspor,nomor_paspor,paspor_no,swiss_passport,passport_ch,passport_switzerland,schweizer_pass,reisepass,pass_nr,passnummer,여권,여권번호,ho_chieu,so_ho_chieu,ho_chieu_no,passeport,numero_passeport,pasaporte,numero_pasaporte
    fieldrulematch: text
    key: vnpassport
    is_pii: True
    name: Vietnamese passport by pattern
    match: ppr
    type: data
    rule: Word(alphas, exact=1) + Word(nums, min=7, max=8)
    maxlen: 9
    minlen: 8
  vndriverlicfield:
    key: vndriverlic
    is_pii: True
    name: Vietnamese driver license by field name
    rule: bang_lai,so_bang_lai,bang_lai_xe
    type: field
    priority: 1
    match: text
  vndriverlicvalue:
    key: vndriverlic
    is_pii: True
    name: Vietnamese driver license by pattern
    match: ppr
    type: data
    rule: Word(alphas, exact=2) + Word(nums, min=10, max=12)
    maxlen: 14
    minlen: 12
    imprecise: 1

