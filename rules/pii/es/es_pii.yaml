name: es-pii
description: Person identifiable information (PII) for Spanish language
context: pii
lang: es
country_code: es
rules:
  esgenderknown:
    key: gender
    is_pii: True
    name: Spanish gender by value (Masculino, Femenino, Mujeres, Hombres, Varón)
    # The staff tables of ARSAT (Argentina) count Mujeres and Hombres and close with a Total row.
    rule: metacrafterext.rules.common.generic.validate_es_gender_word
    match: func
    type: data
    minlen: 5
    maxlen: 11
  esgenderbyname:
    key: gender
    is_pii: True
    name: Spanish gender by field name (género, genero, sexo_genero) with gender values
    # Género is also the genre of a film, a book or a song (Drama, Novela): the values decide.
    rule: (?i)(?:[a-z]+[ _])?g[eé]nero(?:[ _](?:declarado|autopercibido|persona|id|cod))?
    type: field
    match: regex
    validator: metacrafterext.rules.common.generic.validate_es_gender_value
    needs_values: true
    priority: 1
  esbirthdayknown:
    key: birthday
    is_pii: True
    name: Spanish birthday by known field names
    rule: anio_nacimiento
    match: text
    type: data
  es_pii_espassportfield:
    key: espassport
    is_pii: True
    name: Spanish passport by field name
    rule: passport,pasaporte,numero_pasaporte
    type: field
    priority: 3
    match: text
# This rule generates a lot of False positives because the pattern Word(alphanums, min=2, max=3) matches many common 2-3 character codes
# It is marked as imprecise and could be filtered if it's set
  es_pii_espassportvalue:
    key: espassport
    is_pii: True
    name: Spanish passport by pattern
    match: ppr
    type: data
    rule: Word(alphanums, min=2, max=3) + Word(nums, exact=6)
    maxlen: 9
    minlen: 8
    validator: metacrafterext.rules.es.validators.validate_es_passport
    imprecise: 1
  es_pii_esniefield:
    key: esnie
    is_pii: True
    name: Spanish NIE by field name
    rule: nie,numero_identidad_extranjero,foreigner_id
    type: field
    priority: 1
    match: text
  es_pii_esnievalue:
    validator: metacrafterext.rules.es.validators.validate_es_nie
    key: esnie
    is_pii: True
    name: Spanish NIE by pattern
    match: ppr
    type: data
    rule: (Literal('X') + Optional(Literal('-') | Literal('.')) + Optional(Literal('0')) + Word(nums, exact=7) + Optional(Literal('-') | Literal('.')) + Word(alphas, exact=1)) | (Word(alphas, exact=1) + Optional(Literal('-') | Literal('.')) + Word(nums, exact=7) + Optional(Literal('-') | Literal('.')) + Word(alphanums, exact=1)) | (Word(nums, exact=8) + Optional(Literal('-') | Literal('.')) + Word(alphas, exact=1))
    maxlen: 12
    minlen: 9
  es_pii_esniffield:
    key: esnif
    is_pii: True
    name: Spanish NIF by field name
    rule: nif,dni,numero_identificacion_fiscal
    type: field
    priority: 3
    match: text
  es_pii_esnifvalue:
    key: esnif
    is_pii: True
    name: Spanish NIF by pattern
    match: ppr
    type: data
    rule: Optional(Word(nums, exact=1)) + Word(nums, exact=7) + Optional(Literal('-')) + Word(alphas, exact=1)
    maxlen: 9
    minlen: 8




