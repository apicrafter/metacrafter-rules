name: de-pii
description: German person identifiable information (PII)
context: pii
lang: de
country_code: de
rules:
  de_pii_steueridfield:
    key: de_steuerid
    is_pii: True
    name: German tax identification number by field name
    rule: steueridentifikationsnummer,steuer_id,steuerid,idnr,steuernummer,tax_id,tin
    type: field
    match: text
    priority: 1
  de_pii_steueridvalue:
    key: de_steuerid
    is_pii: True
    name: German tax identification number by pattern
    match: ppr
    type: data
    rule: Word(nums, exact=11)
    validator: metacrafterext.rules.de.validators.validate_de_steuer_id
    maxlen: 11
    minlen: 11
    priority: 1
  de_pii_birthdayfield:
    key: birthday
    is_pii: True
    name: Date of birth by German field name
    # Geburtsdatum of persons, also with a German long date (7. März 1833) (#70).
    rule: geburtsdatum,geburtstag,geb_datum,geb.datum,geb. datum,geburts_datum
    type: field
    priority: 1
    match: text
  de_pii_deathdayfield:
    key: deathday
    is_pii: True
    name: Date of death by German field name
    rule: sterbedatum,todestag,todesdatum,sterbetag,sterbe_datum
    type: field
    priority: 1
    match: text
  de_pii_ibanfield:
    key: de_iban
    is_pii: True
    name: German IBAN by field name
    rule: iban,bank_account,kontonummer,konto
    type: field
    priority: 3
    match: text
  de_pii_ibanvalue:
    key: de_iban
    is_pii: True
    name: German IBAN by pattern
    # DE, two check digits and 18 digits, in groups of four separated by spaces or by the
    # no-break spaces of word processors and spreadsheets (DE18 7500 0000 0075 0010 21). With
    # one such value fewer than the universal IBAN rules, de_iban was dropped (#70).
    match: regex
    type: data
    rule: 'DE\d{2}(?:[ \u00a0\u202f]?\d{4}){4}[ \u00a0\u202f]?\d{2}'
    maxlen: 27
    minlen: 22
    validator: metacrafterext.rules.common.identifiers.validate_iban
  de_pii_versicherungsnummerfield:
    key: de_socialinsurance
    is_pii: True
    name: German social insurance number by field name
    rule: versicherungsnummer,sozialversicherungsnummer,rentenversicherungsnummer,social_insurance_number
    type: field
    priority: 3
    match: text
