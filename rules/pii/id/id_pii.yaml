name: id-pii
description: Indonesian person identifiable information (PII)
context: pii
lang: id
country_code: id
rules:
  id_pii_idnikfield:
    key: idnik
    is_pii: True
    name: Indonesian NIK by field name
    rule: nik,nomor_induk_kependudukan,nik_number,indonesian_id,national_id,ktp_number
    type: field
    priority: 3
    match: text
  id_pii_idnikvalue:
    key: idnik
    is_pii: True
    name: Indonesian NIK by pattern
    match: ppr
    type: data
    rule: Word(nums, exact=16)
    validator: metacrafterext.rules.common.identifiers.validate_id_nik
    maxlen: 16
    minlen: 16
  id_pii_idpassportfield:
    key: idpassport
    is_pii: True
    name: Indonesian passport by field name
    rule: passport,paspor,passport_number,nomor_paspor,paspor_no
    type: field
    priority: 3
    match: text
  id_pii_idpassportvalue:
    # Letter + 7-8 digits is also a GSS code, a product or a file id: names only.
    fieldrule: passport,passport_number,passport_no,passportnumber,passport_id,passport number,paspor,nomor_paspor,paspor_no,swiss_passport,passport_ch,passport_switzerland,schweizer_pass,reisepass,pass_nr,passnummer,여권,여권번호,ho_chieu,so_ho_chieu,ho_chieu_no,passeport,numero_passeport,pasaporte,numero_pasaporte
    fieldrulematch: text
    key: idpassport
    is_pii: True
    name: Indonesian passport by pattern
    match: ppr
    type: data
    rule: Word(alphas, exact=1) + Word(nums, min=7, max=8)
    maxlen: 9
    minlen: 8
  id_pii_iddriverlicfield:
    key: iddriverlic
    is_pii: True
    name: Indonesian driver license by field name
    rule: driver_license,sim,sim_number,sim_no,driving_license,license_number
    type: field
    priority: 3
    match: text
  id_pii_iddriverlicvalue:
    key: iddriverlic
    is_pii: True
    name: Indonesian driver license by pattern
    match: ppr
    type: data
    rule: Word(alphas, exact=1) + Word(nums, min=11, max=12)
    maxlen: 13
    minlen: 12
    imprecise: 1

