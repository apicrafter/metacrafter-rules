name: ch-pii
description: Swiss person identifiable information (PII)
context: pii
lang: de
country_code: ch
rules:
  ch_pii_chahvfield:
    key: chahv
    is_pii: True
    name: Swiss AHV number by field name
    rule: swiss_ahv,ahv_number,ahv_nummer,ahv_se,swiss_social_security
    type: field
    priority: 1
    match: text
  ch_pii_chahvvalue:
    key: chahv
    is_pii: True
    name: Swiss AHV number by pattern (756.9217.0769.85) with its EAN-13 check digit
    # Not any four groups of three digits: numbers with thousands separators
    # (486.105.253.092) have that shape.
    match: regex
    type: data
    rule: 756\.\d{4}\.\d{4}\.\d{2}
    maxlen: 16
    minlen: 16
    validator: metacrafterext.rules.ch.persons.validate_ch_ahv
  ch_pii_chpassportfield:
    key: chpassport
    is_pii: True
    name: Swiss passport by field name
    rule: swiss_passport,passport_ch,passport_switzerland,schweizer_pass
    type: field
    priority: 1
    match: text
  ch_pii_chpassportvalue:
    # Letter + 7-8 digits is also a GSS code, a product or a file id: names only.
    fieldrule: passport,passport_number,passport_no,passportnumber,passport_id,passport number,paspor,nomor_paspor,paspor_no,swiss_passport,passport_ch,passport_switzerland,schweizer_pass,reisepass,pass_nr,passnummer,여권,여권번호,ho_chieu,so_ho_chieu,ho_chieu_no,passeport,numero_passeport,pasaporte,numero_pasaporte
    fieldrulematch: text
    key: chpassport
    is_pii: True
    name: Swiss passport by pattern
    match: ppr
    type: data
    rule: Word(alphas, exact=1) + Word(nums, exact=8)
    maxlen: 9
    minlen: 9

