name: pii
description: Person identifiable information (PII)
context: pii
lang: common
country_code: xx
rules:
  birthdayknown:
    key: birthday
    is_pii: True
    name: Birthday by known field names
    rule: birthday,dayofbirth,date_of_birth,birth_day,birth_date,birthdate,dateofbirth
    type: field
    match: text
    priority: 1
  deathdayknown:
    key: deathday
    is_pii: True
    name: Deathday by known field names
    rule: deathday,day_of_death,date_of_death,death_date,deathdate
    type: field
    match: text
    priority: 1
  genderbyknown:
    key: gender
    is_pii: True
    name: Gender by known field name
    rule: gender
    type: field
    match: text
    priority: 1
  genderbyname:
    key: gender
    is_pii: True
    name: Gender or sex by field name (sex, author_sex, patient_gender, пол)
    # One or two words before sex or gender, optionally followed by code or id.
    rule: '(?i)(?:[a-z0-9]+[ _.-]){0,2}(?:sex|gender)(?:[ _.-](?:code|id))?|пол'
    type: field
    match: regex
    priority: 1
  genderbyvalue:
    key: gender
    is_pii: True
    name: Gender or sex values in a gender field
    rule: м,ж,муж,жен,муж.,жен.,мужской,женский,мужчина,женщина,m,f,male,female,man,woman
    type: data
    match: text
    priority: 1
    fieldrule: sex,gender,пол,author_sex,person_sex,patient_sex,patient_gender,client_sex,client_gender,employee_sex,employee_gender,user_gender,applicant_sex,sex_code,gender_code,sex_id,gender_id
    fieldrulematch: text
  nationalitybyknown:
    key: nationality
    is_pii: True
    name: Nationality by known field name
    rule: nationality
    type: field
    match: text
    priority: 1
  passwordbyknown:
    key: password
    is_pii: True
    name: Password by known field name
    rule: password,passwd,user_password,encrypted_password,user_password,password_digest,password_salt,password_hash,encryptedpassword,passwordfieldZ
    type: field
    match: text
    priority: 1
  passportbyknown:
    key: passport
    is_pii: True
    name: Passport code by known name
    rule: passport
    type: field
    match: text
    priority: 1
  creditcardbyknown:
    key: bankcard
    is_pii: True
    name: Credit card by known name
    rule: creditcard,credit_card
    type: field
    match: text
    priority: 1
  usernamebyknown:
    key: username
    is_pii: True
    name: User name by known name
    # A user_id or userid holds an id (userid), not the login name (#69).
    rule: username,login,user_name,user_nm,login_username,usernamefield
    type: field
    match: text
    priority: 1
  enbirthdayknown:
    key: birthday
    is_pii: True
    name: Birthday by English field name
    rule: dob,dateofbirth,date_of_birth
    type: field
    match: text
    priority: 1
