name: at-geo
description: Austrian geographic identifiers
context: geo
lang: de
country_code: at
rules:
  atgkzknown:
    key: at_gkz
    name: Austrian municipality code (Gemeindekennziffer) by known name
    rule: gkz,gemeindekennziffer,gemeindekennzahl,stataustria_gem_code
    type: field
    match: text
    priority: 1
  atbezirkvalue:
    key: at_bezirkskennziffer
    name: Austrian political district code (Bezirkskennziffer) by field name and value
    rule: '[1-9]\d{2}'
    type: data
    match: regex
    minlen: 3
    maxlen: 3
    fieldrule: stataustria_bez_code,bezirkskennziffer,bkz,bez_code,bezirk_code,bezirkscode,bezirk_kz
    fieldrulematch: text
    priority: 1
