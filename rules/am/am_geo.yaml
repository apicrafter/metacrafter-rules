name: am-geo
description: Armenian geographic identifiers
context: geo
lang: hy
country_code: am
rules:
  ampostalcodefield:
    key: am_postal_code
    is_pii: True
    name: Armenian postal code by field name
    rule: arm_postal_code,am_postal_code,armenian_postal_code,postal_code_am,postcode_am,zip_am,փոստային_ինդեքս,փոստային_կոդ
    type: field
    priority: 1
    match: text
# Disabled: matches any 4-digit number, colliding with years and generic numeric
# ids/counts. Cannot be distinguished from an arbitrary 4-digit value; rely on
# ampostalcodefield instead.
#  ampostalcodevalue:
#    key: am_postal_code
#    is_pii: True
#    name: Armenian postal code by pattern
#    match: ppr
#    type: data
#    rule: Word(nums, exact=4)
#    maxlen: 4
#    minlen: 4
#    priority: 1
#    imprecise: 1
  ammarzbyname:
    key: am_marz
    name: Armenian province (marz) by field name (marz, region, province, մարզ)
    rule: (?i)(?:[a-z]+_)*(?:marz|marzer|region|province|oblast)(?:[ _](?:name|nm|en|eng|arm|hy|ru))?|name_?marz|մարզ(?:ը|ի)?|մարզի[ _]անվանում|марз|область
    type: field
    match: regex
    validator: metacrafterext.rules.am.geo.validate_am_marz
    needs_values: true
    priority: 1
  ammarzvalue:
    key: am_marz
    name: Armenian province (marz) by value (Gegharkunik, Վայոց Ձոր, Aragatsotn Province, Сюник)
    # Ararat, Armavir, Lori and Yerevan alone also name cities and people: they count only in a
    # field named for provinces.
    rule: metacrafterext.rules.am.geo.validate_am_marz_by_value
    type: data
    match: func
    minlen: 4
    maxlen: 40
    priority: 1
