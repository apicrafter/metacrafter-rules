name: fr-persons
description: French person identifiers
context: persons
lang: fr
country_code: fr
rules:
  frnirfield:
    key: frnir
    is_pii: True
    name: French NIR by field name
    rule: nir,numéro_inscription_répertoire,numero_inscription_repertoire,social_security_number
    type: field
    priority: 3
    match: text
  frnirvalue:
    key: frnir
    is_pii: True
    name: French NIR by pattern
    match: ppr
    type: data
    rule: Word(nums, exact=15)
    validator: metacrafterext.rules.common.identifiers.validate_fr_nir
    maxlen: 15
    minlen: 15
  
  frcnifield:
    key: frcni
    is_pii: True
    name: French CNI by field name
    rule: cni,carte_nationale_identité,carte_nationale_identite,identity_card
    type: field
    priority: 1
    match: text
  frcnivalue:
    key: frcni
    is_pii: True
    name: French CNI by pattern in an identity card field
    match: ppr
    type: data
    rule: Word(nums, exact=12)
    validator: metacrafterext.rules.fr.validators.validate_fr_cni
    maxlen: 12
    minlen: 12
    # Twelve digits are a common shape (Japanese municipal ids): the field must name the card.
    fieldrule: cni,numero_cni,num_cni,no_cni,carte_identite,carte_d_identite,numero_carte_identite,numero_piece_identite,piece_identite,carte nationale d'identité,numéro de carte d'identité
    fieldrulematch: text
  
  frpassportfield:
    key: frpassport
    is_pii: True
    name: French passport by field name
    rule: passport,passeport,passport_number,numero_passeport
    type: field
    priority: 3
    match: text
  frpassportvalue:
    key: frpassport
    is_pii: True
    name: French passport by pattern
    match: ppr
    type: data
    rule: Word(nums, exact=2) + Word(alphas, exact=2) + Word(nums, exact=5)
    maxlen: 9
    minlen: 9

