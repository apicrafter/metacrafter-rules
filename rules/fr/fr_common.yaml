name: fr-common
description: French common data types detection
context: common
lang: fr
country_code: fr
rules:
  frtitleknown:
    key: name
    name: French name/title by name
    rule: title_fr,nom,intitule,titre
    type: field
    priority: 1
    match: text
    # A nom of streets and crossings (Bd Raspail / Varenne) holds streets, not names (#69).
    validator: metacrafterext.rules.common.generic.validate_name_not_street
  frcommentknown:
    key: comment
    name: French comment/note by known
    rule: commentaire,commentair,commentaires,remarque,remarques
    type: field
    priority: 1
    match: text
  frdescriptionknown:
    key: description
    name: French description by known
    rule: description_fr,descriptif,description_longue,descriptionlongue
    type: field
    priority: 1
    match: text
  frcategoryknown:
    key: category
    name: French category by known
    rule: categorie
    type: field
    priority: 1
    match: text
  frphoneknown:
    key: phone
    is_pii: True
    name: French phone number by known name
    rule: telephone_du_lieu,numero de telephone,numero_de_telephone
    type: field
    priority: 1
    match: text
  frmuseofilevalue:
    key: fr_museofile
    name: Muséofile museum identifier (M1128) by field name and value
    rule: 'M\d{4}(?:-\d{1,2})?'
    type: data
    match: regex
    minlen: 5
    maxlen: 8
    fieldrule: identifiant,museofile,id_museofile,ref_museofile,identifiant museofile,code_museofile,ref_musee,id_musee
    fieldrulematch: text
    priority: 1
  frmerimeevalue:
    key: fr_merimee
    name: Mérimée heritage identifier, one or a semicolon list (PA00084643;SPR4400040)
    rule: '(?:[PEI]A\d[0-9AB]\d{6}|ACR\d{7}|MDI\d{3}B?|JAR\d{7}|SPR\d{7}|PJR\d{8})(?:\s*;\s*(?:[PEI]A\d[0-9AB]\d{6}|ACR\d{7}|MDI\d{3}B?|JAR\d{7}|SPR\d{7}|PJR\d{8}))*'
    type: data
    match: regex
    minlen: 6
    maxlen: 400
    priority: 1
  frpdlvalue:
    key: fr_pdl
    is_pii: true
    name: Electricity delivery point number (PDL / PRM) by field name and value
    rule: '\d{14}'
    type: data
    match: regex
    minlen: 14
    maxlen: 14
    fieldrule: num_pdl,pdl,prm,numero_pdl,num_prm,numero_prm,point_de_livraison,n_pdl,pdl_prm,id_pdl,ref_pdl
    fieldrulematch: text
    priority: 1
  frresinstallationvalue:
    key: fr_res_installation_id
    name: Installation number of the sports facilities census (RES), I and 9 characters (I050960036)
    rule: 'I(?:\d{2}|2[AB])\d{7}'
    type: data
    match: regex
    minlen: 10
    maxlen: 10
    fieldregex: (?i)(?:install|equip|ins_?num|insnum)
    priority: 1
  frresinstallationbyname:
    key: fr_res_installation_id
    name: Installation number of the sports facilities census by field name (insnumeroinstall, numinstallation)
    rule: (?i)insnumeroinstall(?:ation)?|numinstallation|num(?:ero)?_?installation|ins_?numero_?install|id_?installation|installation_?(?:numero|id|num)|inst_?numero
    type: field
    match: regex
    validator: metacrafterext.rules.fr.codes.validate_fr_res_installation_id
    priority: 1
  frresequipementvalue:
    key: fr_res_equipement_id
    name: Equipment number of the sports facilities census (RES), E, 3 digits and the installation number (E001I050960036)
    rule: 'E\d{3}I(?:\d{2}|2[AB])\d{7}'
    type: data
    match: regex
    minlen: 14
    maxlen: 14
    priority: 1
  frresequipementbyname:
    key: fr_res_equipement_id
    name: Equipment number of the sports facilities census by field name (equipementid, numequipement)
    rule: (?i)equipementid|equipement_?id|numequipement|num(?:ero)?_?equipement|id_?equipement|equ_?numero|equnumero
    type: field
    match: regex
    validator: metacrafterext.rules.fr.codes.validate_fr_res_equipement_id
    priority: 1
