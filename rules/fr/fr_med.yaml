name: fr-medical
description: Codes médicaux (CIM-10, ATC, CCAM)
context: medical
lang: fr
country_code: fr
rules:
  fricd10field:
    key: icd10code
    name: Code CIM-10 selon le nom du champ
    rule: cim10,code_cim10,diagnostic_cim10,code_diagnostic
    type: field
    priority: 1
    match: text
  fricd10value:
    key: icd10code
    name: Code CIM-10 selon la valeur
    match: ppr
    type: data
    rule: Word('ABCDEFGHIJKLMNOPQRSTUVWXYZ', exact=1) + Word(nums, exact=2) + Optional(Literal('.').suppress() + Word(nums, min=1, max=2))
    maxlen: 7
    minlen: 3
    # A letter and two digits is also a DAC aid type (C01), a notice type (E12) or a camera
    # id (W2): the field must name a diagnosis or a disease classification.
    fieldregex: '(?i)(?:^|[ _.-])(?:icd|cim|cie|mkb)(?:$|[ _.-]|\d)|мкб|diag|disease|krankheit|maladie|enfermedad|cause|morbid|patholog'
  fratcfield:
    key: atccode
    name: Code ATC selon le nom du champ
    rule: code_atc,atc,code_medicament_atc
    type: field
    priority: 1
    match: text
  frccamfield:
    key: ccamcode
    name: Code CCAM selon le nom du champ
    rule: ccam,code_ccam,acte_ccam
    type: field
    priority: 1
    match: text
  frccamvalue:
    key: ccamcode
    name: Code CCAM selon la valeur
    match: ppr
    type: data
    rule: Word('ABCDEFGHIJKLMNOPQRSTUVWXYZ', exact=1) + Word(nums, exact=2) + Word('ABCDEFGHIJKLMNOPQRSTUVWXYZ', exact=1)
    maxlen: 4
    minlen: 4
  frfinessbyname:
    key: fr_finess
    name: FINESS number by field name (finess, finess_et, numero_finess)
    # Nine digits with a Luhn digit are also a SIREN: only fields named for FINESS.
    rule: (?i)(?:num(?:ero)?_|n_|code_|no_|id_)?finess(?:_?(?:et|ej|geographique|juridique|etablissement|site|number|code))?|nofinesset|nofinessej|finessgeo|finessjur
    type: field
    match: regex
    validator: metacrafterext.rules.fr.codes.validate_fr_finess
    needs_values: true
    priority: 1
