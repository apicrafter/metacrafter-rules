name: fr-realestate
description: French real estate and property identifiers
context: realestate
lang: fr
country_code: fr
rules:
  frcadastralfield:
    key: frcadastral
    name: French cadastral reference by field name
    rule: cadastral,cadastre,reference_cadastrale,numero_cadastral,parcelle_cadastrale
    type: field
    priority: 1
    match: text
  frcadastralvalue:
    key: frcadastral
    name: French cadastral reference by pattern
    match: ppr
    type: data
    rule: Word(alphanums, min=10, max=20)
    maxlen: 20
    minlen: 10
    imprecise: 1
  frpropertynumberfield:
    key: frpropertynumber
    name: French property number by field name
    rule: property_number,numero_propriete,identifiant_propriete,reference_propriete
    type: field
    priority: 3
    match: text
  frpropertynumbervalue:
    key: frpropertynumber
    name: French property number by pattern
    match: ppr
    type: data
    rule: Word(alphanums, min=8, max=18)
    maxlen: 18
    minlen: 8
    imprecise: 1

  frdpenumbervalue:
    key: fr_dpe_number
    name: DPE number of the ADEME observatory (1682V1000961S, 2169E0123456A) by value and field name
    rule: '\d{4}[A-Z]\d{7}[A-Z@]'
    type: data
    match: regex
    minlen: 13
    maxlen: 13
    fieldregex: (?i)(?:dpe|diagnostic|ademe|numero)
    priority: 1
  frdpenumberbyname:
    key: fr_dpe_number
    name: DPE number by field name (numero_dpe, n_dpe)
    rule: (?i)(?:numero|num|n|no|id|ref|reference)_?dpe|dpe_?(?:numero|num|id|ref)?|numero_dpe_remplace|numero_dpe_immeuble_associe
    type: field
    match: regex
    validator: metacrafterext.rules.fr.codes.validate_fr_dpe_number
    needs_values: true
    priority: 1
