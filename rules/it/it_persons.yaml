name: it-persons
description: Italian person identifiers
context: persons
lang: it
country_code: it
rules:
  itpersonnameknown:
    key: person_fullname
    is_pii: True
    name: Italian person name by known name
    rule: nome_completo,nome_persona
    type: field
    match: text
    priority: 1
  itfirstnameknown:
    key: person_firstname
    is_pii: True
    name: Italian first name by known name
    # nome alone is the name of anything (a school, a street): it is name evidence in it_geo.
    rule: primo_nome,nome_proprio,nome_persona
    type: field
    match: text
    priority: 1
  itlastnameknown:
    key: person_surname
    is_pii: True
    name: Italian last name by known name
    rule: cognome,ultimo_nome
    type: field
    match: text
    priority: 1

