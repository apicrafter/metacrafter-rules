name: it-geo
description: Italian geographic identifiers
context: geo
lang: it
country_code: it
rules:
  itpostcodeknown:
    key: postcode
    name: Italian postal code (CAP) by known name and five-digit value
    # cap is also a capacity (0.36).
    rule: '\d{5}'
    type: data
    match: regex
    minlen: 5
    maxlen: 5
    fieldrule: cap,codice_postale,postal_code
    fieldrulematch: text
    priority: 1
  itnomeknown:
    key: name
    name: Italian name by field name (nome, denominazione)
    rule: nome,denominazione
    type: field
    match: text
    priority: 1
  itcityknown:
    key: city
    name: Italian city by known name
    rule: citta,comune,municipio
    type: field
    match: text
    priority: 1
  itprovinceknown:
    key: province
    name: Italian province by known name
    rule: provincia,provincia_italiana
    type: field
    match: text
    priority: 1

  itlatitudeknown:
    key: latitude
    name: Latitude (latitudine) by known name
    rule: latitudine,lat_wgs84_it,coordinata_latitudine
    type: field
    match: text
    priority: 1
  itlongitudeknown:
    key: longitude
    name: Longitude (longitudine) by known name
    rule: longitudine,lon_wgs84_it,coordinata_longitudine
    type: field
    match: text
    priority: 1
  itistatprovincebyfield:
    key: it_istat_province_code
    name: Italian ISTAT province code (001, 015) by field name
    # Codice Provincia (Storico)(1) of the ISTAT municipality list; a sigla (TO) in a field of
    # the same name is rejected by the validator (it_province_code).
    rule: (?i)(?:codice|cod)[ _.]?prov(?:incia)?(?:[ _.]?istat)?(?:[ _]?\(?storico\)?)?(?:\(\d+\))?
    type: field
    match: regex
    validator: metacrafterext.rules.common.identifiers.validate_it_istat_province
    priority: 1
  # comune_residenza, regione_residenza of the driving licence files of the transport ministry
  # (dati.mit.gov.it, Dateno source cdi00000955); denominazione_comune, descom of Regione Toscana.
  itcomunebyname:
    key: it_comune
    name: Italian municipality by field name (comune_residenza, denominazione_comune, nome_comune, descom)
    rule: (?i)comune[ _](?:di[ _])?(?:residenza|nascita|sede|ubicazione|domicilio|intervento|localizzazione)|(?:nome|denominazione|desc(?:rizione)?|den)[ _.]?comune|descom|comune[ _](?:nome|denominazione|descrizione)
    type: field
    match: regex
    validator: metacrafterext.rules.common.generic.validate_place_name
    needs_values: true
    priority: 1
  itregionbyname:
    key: it_region
    name: Italian region by field name (regione, regione_residenza, nome_regione) with Piemonte, Emilia Romagna
    rule: (?i)(?:nome|denominazione|desc(?:rizione)?|den)?[ _.]?region[ei](?:[ _]\w+)?
    type: field
    match: regex
    validator: metacrafterext.rules.it.codes.validate_it_region
    needs_values: true
    priority: 1
