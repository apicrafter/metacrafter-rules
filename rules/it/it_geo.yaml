name: it-geo
description: Italian geographic identifiers
context: geo
lang: it
country_code: it
rules:
  itpostcodeknown:
    key: postcode
    name: Italian postal code (CAP) by known name and five-digit value
    # cap is also a capacity (0.36).
    rule: '\d{5}'
    type: data
    match: regex
    minlen: 5
    maxlen: 5
    fieldrule: cap,codice_postale,postal_code
    fieldrulematch: text
    priority: 1
  itnomeknown:
    key: name
    name: Italian name by field name (nome, denominazione)
    rule: nome,denominazione
    type: field
    match: text
    priority: 1
  itcityknown:
    key: city
    name: Italian city by known name
    rule: citta,comune,municipio
    type: field
    match: text
    priority: 1
  itprovinceknown:
    key: province
    name: Italian province by known name
    rule: provincia,provincia_italiana
    type: field
    match: text
    priority: 1

  itlatitudeknown:
    key: latitude
    name: Latitude (latitudine) by known name
    rule: latitudine,lat_wgs84_it,coordinata_latitudine
    type: field
    match: text
    priority: 1
  itlongitudeknown:
    key: longitude
    name: Longitude (longitudine) by known name
    rule: longitudine,lon_wgs84_it,coordinata_longitudine
    type: field
    match: text
    priority: 1
  itistatprovincebyfield:
    key: it_istat_province_code
    name: Italian ISTAT province code (001, 015) by field name
    # Codice Provincia (Storico)(1) of the ISTAT municipality list; a sigla (TO) in a field of
    # the same name is rejected by the validator (it_province_code).
    rule: (?i)(?:codice|cod)[ _.]?prov(?:incia)?(?:[ _.]?istat)?(?:[ _]?\(?storico\)?)?(?:\(\d+\))?
    type: field
    match: regex
    validator: metacrafterext.rules.common.identifiers.validate_it_istat_province
    priority: 1
