name: ca-geo
description: Canadian geographic identifiers
context: geo
lang: fr
country_code: ca
rules:
  caqcmunicipalitycodevalue:
    key: ca_qc_municipality_code
    name: Québec municipal geographic code by field name and value
    rule: '\d{5}'
    type: data
    match: regex
    minlen: 5
    maxlen: 5
    fieldrule: mcode,code_mun,code_municipalite,code_municipalité,code géographique,code_geographique,code_geo_mun
    fieldrulematch: text
    priority: 1
  caprovincecodevalue:
    key: caprovincecode
    name: Canadian province or territory code (ON, BC) by field name and value
    # Canadian province codes in a province field, not Indian states (#60).
    rule: AB,BC,MB,NB,NL,NS,NT,NU,ON,PE,QC,SK,YT
    type: data
    match: text
    fieldrule: province,prov,province_code,province/territory,province_territory,province_or_territory,prov_terr,provterr,province / territoire,province_territoire
    fieldrulematch: text
    priority: 1
  cafsabyname:
    key: ca_fsa
    name: Canadian forward sortation area by field name (fsa, homefsa, postal_fsa)
    rule: (?i)(?:home|work|school|postal|mailing|res)?_?fsa(?:_?code)?|forward_?sortation_?area|code_rta|rta
    type: field
    match: regex
    validator: metacrafterext.rules.ca.validators.validate_ca_fsa
    needs_values: true
    priority: 1
