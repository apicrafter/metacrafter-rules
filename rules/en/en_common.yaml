name: en-common
description: English common data types detection
context: common
lang: en
country_code: xx
rules:
  enitemnameknown:
    key: name
    name: English name/title by name
    rule: title,name,shortname,fullname,short name,title_en
    type: field
    match: text
    priority: 1
  encommentknown:
    key: comment
    name: English comment/note by known
    rule: comment,note,notes,comments,remarks
    type: field
    match: text
    priority: 1
  endescriptionknown:
    key: description
    name: English description by known
    rule: description
    type: field
    match: text
    priority: 1
  endescriptiondetails:
    key: description
    name: Description in a details field (values with letters; 4585/8 is a lot number)
    rule: metacrafterext.rules.common.generic.has_letters
    type: data
    match: func
    minlen: 1
    maxlen: 100000
    fieldrule: details
    fieldrulematch: text
    priority: 1
  encategoryknown:
    key: category
    name: English category by known
    rule: category
    type: field
    match: text
    priority: 1



