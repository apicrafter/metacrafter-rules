name: en-environment
description: Environmental and energy dataset identifiers
context: environment
lang: en
country_code: xx
rules:
  enemisfield:
    key: emissioninventory
    name: Emission inventory field by name
    rule: emissions_inventory,emission_inventory,air_emissions,ghg_inventory
    type: field
    match: text
    priority: 1
  enemisvalue:
    key: emissioninventory
    name: Emission pollutant code by pattern
    match: ppr
    type: data
    rule: Word(nums, min=2, max=6) + Literal('-').suppress() + Word(alphanums, min=1, max=4)
    maxlen: 11
    minlen: 4
    priority: 2
    imprecise: 1
  enenergypointfield:
    key: powerplantid
    name: Power plant identifier by field name
    # plantId is the plant individual of vegetation surveys (TERN): not a power plant by name alone.
    rule: power_plant_id,plant_identifier,eia_plant_id
    type: field
    match: text
    priority: 1
  enenergypointvalue:
    key: powerplantid
    name: Power plant identifier by pattern
    match: ppr
    type: data
    rule: Word('ABCDEFGHIJKLMNOPQRSTUVWXYZ', exact=2) + Word(nums, min=3, max=6)
    maxlen: 8
    minlen: 5
    # Two letters and digits is also a NUTS 3 or CBS municipality code (AT124, GM0998).
    fieldrule: power_plant_id,powerplant_id,plant_id,plant_code,powerplant_code,gppd_idnr,energy_point_id,power_plant_code
    fieldrulematch: text
    priority: 2
  engridnodefield:
    key: gridnode
    name: Grid node identifier by field name
    rule: grid_node,gridnode,interconnect_node,balancing_authority
    type: field
    match: text
    priority: 1
  engridnodevalue:
    key: gridnode
    name: Grid node identifier by pattern
    match: ppr
    type: data
    rule: Word('ABCDEFGHIJKLMNOPQRSTUVWXYZ', exact=3) + Literal('-').suppress() + Word(nums, min=2, max=4)
    maxlen: 8
    minlen: 6
    # Three letters, a hyphen and digits is the shape of many codes (eForms ORG-0001, LOT-0001);
    # grid operators have no common format (#69).
    fieldrule: grid_node,gridnode,grid_node_id,gridnode_id,interconnect_node,balancing_authority,node_id,pnode,pnode_id,pricing_node,settlement_point
    fieldrulematch: text
    priority: 2

