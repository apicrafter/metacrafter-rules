name: ru-gov
description: Russian government related identifiers
context: government
lang: ru
country_code: ru
rules:
  runpabyfunc:
    key: runpa
    name: Russian legal act / law
    maxlen: 500
    minlen: 3
    priority: 1
    match: func
    type: data
    rule: metacrafterext.rules.ru.gov.is_ru_law
  runpakindbydata:
    key: runpakind
    name: Russian legal act / law type (order, act, law, bill and e.t.c)
    priority: 1
    match: text
    type: data
    rule: закон,постановление,распоряжение,федеральный закон,приказ,указ,кодекс,постановление
      правительства,постановление правительства рф,распоряжение правительства рф
  runpabyknown:
    key: runpa
    name: Russian legal act / law by known field name
    match: text
    type: field
    rule: нормативно-правовой акт,нормативный правовой акт,наименование нормативного
      правового акта,наименование нпа,нпа,реквизиты нпа,название нормативно-правового
      документа,наименование нормативно-правого акта,Вид нормативного правового акта,Наимнование
      поля,Номер нормативного правового акта,Реквизиты
  rugoskatalogregnumfield:
    key: ru_goskatalog_regnum
    name: Registration number of a museum object in the State Catalogue (Goskatalog) by field name
    match: text
    type: field
    rule: goskatalognumber,goskatalog_number,goskatalogid,goskatalog_id,goskatalogregnum,goskatalog_regnum,goskatalog_reg_number,номер в госкаталоге,номер госкаталога,регистрационный номер в госкаталоге
    priority: 1
  rugoskatalogregnumvalue:
    key: ru_goskatalog_regnum
    name: Goskatalog registration number by value in a Goskatalog field
    match: regex
    type: data
    rule: '[1-9]\d{6,7}'
    minlen: 7
    maxlen: 8
    priority: 1
    fieldrule: goskatalognumber,goskatalog_number,goskatalogid,goskatalog_id,goskatalogregnum,goskatalog_regnum,goskatalog_reg_number,номер в госкаталоге,номер госкаталога,регистрационный номер в госкаталоге
    fieldrulematch: text
