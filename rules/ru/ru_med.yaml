name: ru-medical
description: Russian objects
context: medical
lang: ru
country_code: ru
rules:
  rumnnknownfull:
    key: rumedmnn
    name: Russian international unpatented name of pharm
    match: text
    type: field
    priority: 1
    rule: международное непатентованное название (мнн),наименование мнн
  rumnnknownshort:
    key: rumedmnn
    name: Russian international unpatented name of pharm short name
    match: text
    type: field
    priority: 1
    rule: мнн,mnn
  # Field names with the word mnn: std_mnn_name, norm_mnn, mnn_name. After mnn only name,
  # names or list may follow, so identifier columns such as std_mnn_gid do not match, and
  # smnn_* is another word. pyparsing does not backtrack, so each alternative fixes the
  # number of words before mnn.
  rumnnbyname:
    key: rumedmnn
    name: Russian international unpatented name of pharm by a field name with the word mnn
    match: ppr
    type: field
    priority: 1
    rule: >-
      (CaselessLiteral('mnn') + oneOf('_ -') + oneOf('name names list', caseless=True))
      ^ ((Word(alphanums) + oneOf('_ -')) * 1 + CaselessLiteral('mnn') + Optional(oneOf('_ -') + oneOf('name names list', caseless=True)))
      ^ ((Word(alphanums) + oneOf('_ -')) * 2 + CaselessLiteral('mnn') + Optional(oneOf('_ -') + oneOf('name names list', caseless=True)))
  rumedicinetradenamebyknown:
    key: rumedicinetradename
    name: Russian name of medicines
    match: text
    type: field
    priority: 1
    rule: торговое наименование лекарственного препарата,название лекарственного препарата,торговое наименование,торговое_наименование
  # Trade names of ESKLP catalogue positions (КЛП, каталожная позиция лекарственного
  # препарата): klp_all_list, klp_active_list, klp_name. The name ends with name, names or
  # list after the word klp, so counts and identifiers (smnn_all_klp_count, klp_gid) do not
  # match.
  rumedicinetradenamebyklp:
    key: rumedicinetradename
    name: Russian name of medicines by a field name with the word klp (ESKLP catalogue position)
    match: ppr
    type: field
    priority: 1
    rule: >-
      (CaselessLiteral('klp') + oneOf('_ -') + oneOf('name names list', caseless=True))
      ^ (CaselessLiteral('klp') + oneOf('_ -') + Word(alphanums) + oneOf('_ -') + oneOf('name names list', caseless=True))
      ^ (Word(alphanums) + oneOf('_ -') + CaselessLiteral('klp') + oneOf('_ -') + oneOf('name names list', caseless=True))
  # Code of the ESKLP catalogue (Единый справочник-каталог лекарственных препаратов): an SMNN
  # node or a KLP position, 21.20.10.226-000001-1-00008-0000000000000. The format is distinctive,
  # so the value rule needs no field name.
  ruesklpcodeknown:
    key: ru_esklp_code
    name: Russian ESKLP medicine code by field name
    match: text
    type: field
    priority: 1
    rule: esklp,esklp_code,код есклп,код_есклп,smnn_code,klp_code,код смнн,код клп
  ruesklpcodevalue:
    key: ru_esklp_code
    name: Russian ESKLP medicine code by value
    match: ppr
    type: data
    rule: Word(nums, exact=2) + Literal('.') + Word(nums, exact=2) + Literal('.') + Word(nums, exact=2)
      + Literal('.') + Word(nums, exact=3) + Literal('-') + Word(nums, exact=6) + Literal('-') + Word(nums,
      exact=1) + Literal('-') + Word(nums, exact=5) + Literal('-') + Word(nums, exact=13)
    minlen: 41
    maxlen: 41
    priority: 1
  rumedicineregnumber:
    key: rumedicineregnum
    name: Russian registration code of the medicine
    match: ppr
    type: data
    rule: ((Literal("ЛС") | Literal("ЛП")) + Literal("-") + Word(nums, exact=6)) |
      (Literal("ЛСР") + Literal("-") + Word(nums, exact=6) + Literal("\\/") + Word(nums,
      exact=2))
    validator: metacrafterext.rules.ru.validators.validate_ru_medicine_reg
    priority: 1
  rumedicineatcbyknown:
    key: atccode
    name: Russian ATC code name by field name
    match: text
    type: field
    priority: 1
    rule: код атх,код_атх,атх,ath,atx
  rumedicationclassbyknown:
    key: medication_class
    name: Russian pharmacotherapeutic group by field name
    match: text
    type: field
    priority: 1
    rule: ftg,фтг,фармакотерапевтическая группа
