name: ru-common
description: Russian common identifiers
context: common
lang: ru
country_code: ru
rules:
  rusyesnobool:
    key: boolean
    name: Russian yes no boolean
    match: text
    type: data
    rule: да,нет
  ruphoneknown:
    key: phone
    is_pii: true
    name: Russian phone code
    rule: телефон,факс,publicphone,chiefphone,контактный телефон,telefon,номер телефона,рабочий телефон,номер факса,kontaktnyy_telefon,telefon_rukovoditelya,nomer_telefona,obshchiy_telefon,телефон/факс,факс (номер),контактные телефоны,контактные телефоны и факсы,контактные телефоны*,контактный тел.,контактный телефон/факс,контактый номер телефона,номера телефонов,справочный телефон,телефон 1,телефон 2,телефон администрации,телефон руководителя,телефон факс,телефоны,№ телефона
    type: field
    priority: 1
    match: text
  rutitleknown:
    key: name
    name: Russian name/title by name
    rule: наименование,naimenovanie,полное наименование,название,краткое наименование,polnoe_naimenovanie,sokrashchennoe_naimenovanie,naimenovanie_obekta,наименование
      объекта,короткое название,1-Наименование показателя,Название площадки,Название
      учреждения,Наименование  объекта,Наименование  показателей,Наименование МО,Наименование
      ОО,Наименование ОУ,Наименование ФОИВ,Наименование администрации,Наименование
      заказчика,Наименование застройщика,Наименование комиссии,Наименование конкурса,Наименование
      маршрута,Наименование мероприятия,Наименование органа,Наименование отдела,Наименование
      показателей,Наименование показателя,Наименование поселения,Наименование услуги,Наименование
      учреждения,Наименование фамилия имя отчество перевозчика обслуживающего
      маршрут,Наименование ярмарки,Наименование ОУ,Наменование,Полное наименование
      ОУ,Сокращенное наименование,Сокращенное наименовние,Сокращённое наименование,Наименование
      учреждения
    type: field
    priority: 1
    match: text
  rucommentknown:
    key: comment
    name: Russian comment/note by name
    rule: примечание,primechanie,комментарий,комментарии,примечания,Примечание⁵
    type: field
    priority: 1
    match: text
  rucategoryknown:
    key: category
    name: Russian category by known
    rule: kategoriya,категория,Категория земель
    type: field
    priority: 1
    match: text
