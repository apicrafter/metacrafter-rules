name: pe-geo
description: Peruvian UBIGEO codes
context: geo
lang: es
country_code: pe
# Found in survey files of a 2024 snapshot of Harvard Dataverse (Dateno source cdi00001690);
# metacrafter-testdata.
rules:
  peubigeobyname:
    key: pe_ubigeo
    name: 'Peruvian UBIGEO code by field name (ubigeo, cod_ubigeo, ubigeo_inei) with 150101, 10101'
    rule: '(?i)(?:cod(?:igo)?[ _]?)?ubigeo(?:[ _]?(?:inei|reniec|dist(?:rito)?|code|cod|\d{2,4}))?'
    type: field
    match: regex
    validator: metacrafterext.rules.pe.geo.validate_pe_ubigeo
    needs_values: true
    priority: 1
